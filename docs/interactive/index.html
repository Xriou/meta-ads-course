<style>

body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.75;font-size:15px}

  知识来源：ChatGPT《Meta广告学习路线》课程对话（510 条消息，第 1–8 章已学）+ veryfb 论坛 Facebook 板块实战知识库（fb_knowledge / fb_tricks_terms / fb_risk / fb_gap_review）· 2026-09-04 构建<br data-page-node-id="MN0oqztBocTrATrTMHdR00">

<script>
/* ===== 数据文件 1：Level 0 基础精讲 + Level 1 市场与客户洞察 ===== */
const MODULES=[];

/* ---------- Level 0 已掌握前置（速查卡，8 个） ---------- */
M0=[
{id:"L0-01",lv:0,t:"Meta 生态与账户资产体系",
g:"建立 Meta 广告的完整世界观：Meta 旗下有哪些广告位、账户资产怎么分层、一条广告从竞争到展示的全过程，以及为什么后台看不到出价。",
c:"<p><b>Meta ≠ Facebook。</b>Meta 旗下可投广告的产品包括 Facebook、Instagram、WhatsApp、Messenger，以及 2026 年已开放广告的 Threads。用户刷哪个 App，广告就有机会出现在哪个 App——四个产品共用同一套用户身份与广告系统，所以行业统一说「Meta 广告」，而不是「Facebook 广告」。你买的是「触达某类人的机会」，不是「某个 App 的广告位」。</p><p><b>账户资产五层结构</b>（每层一个职责，也是五个独立的风险点）：</p><ul><li><b>个人 Profile（个人号）</b>＝你的「身份证」。所有操作权限最终挂在真人身份上；个号受限，整个体系瘫痪——这也是为什么报错时第一件事是换个号试试。</li><li><b>BM（Business Portfolio，商务管理平台）</b>＝「公司总部」。统一管理主页、广告账户、像素与员工权限；资产绑在 BM 上而不是绑在个人上，才不会被单个员工或单个号的意外拖垮。</li><li><b>Page（主页）</b>＝「店面＋名片」。广告以主页身份发出，用户看到的是「XX 公司 赞助的内容」；主页的历史内容、评分、粉丝量都会影响广告的可信度与表现。</li><li><b>Ad Account（广告账户）</b>＝「财务部」。唯一花钱的地方，绑定支付方式、承担消耗与账单，也是最容易「突然死亡」的资产。</li><li><b>Pixel / CAPI（数据资产）</b>＝「摄像头＋记账本」。记录谁来了、做了什么，是模型学习的数据来源——它跟着 BM/网站走，不跟广告账户走，所以广告户死了像素还能活。</li></ul><p><b>出价去哪了？</b>你在后台只看到预算，看不到出价——因为 Meta 默认替你自动出价，以「在预算内拿到最多优化事件」为目标。你控制「目标＋预算」，系统控制「每一次拍卖出多少」。这不是没有出价，而是出价被系统接管了（想手动接管也有 Cost Cap / Bid Cap，见 L5）。</p>",
m:"<p><b>一条广告从提交到展示的完整链路：</b></p><ul><li>① 用户刷 Feed 的瞬间，系统在毫秒级发起一场<b>拍卖（Auction）</b>；</li><li>② 所有符合该用户定向条件的广告进入竞争；</li><li>③ 系统给每条广告算一个「总价值」（出价 × 预估行动率 ＋ 广告质量，公式详见 L0-06）；</li><li>④ 总价值最高的广告赢得这次展示。</li></ul><p><b>Meta 凭什么知道「谁更可能买你的产品」？</b>它给每个用户维护了一张极长的行为画像：点赞过什么、在某条帖子停留多久、买过什么、看过哪些广告没点。当你的 Pixel 回传「这个人完成了询盘」，Meta 就知道「这一类人真的会转化」，下次把广告推给「和他们长得像」的人。所以广告优化的本质是：<b>用数据教会 Meta 找人。</b>数据越好、越全，Meta 找人越准——这是后面所有数据章节的根。</p><p><b>为什么一条广告能跨 App 展示？</b>因为共用身份系统：同一个用户在 FB、IG、Messenger 里是同一个 ID。你选版位时选的是「我的人群在哪里」，而不是「投给某个 App」。</p>",
h:"<p><b>新项目冷启动标准动作</b>（顺序不能乱）：</p><ul><li>① <b>实名个人号</b>：信息真实、日常使用几天再操作商业资产（全新号直连 BM 是高危动作）；</li><li>② <b>建 BM</b>：填真实公司信息，立刻开启两步验证（2FA）；</li><li>③ <b>绑主页</b>：资料完整、头像封面正规，先发几条自然内容让主页有基本可信度；</li><li>④ <b>建广告账户＋绑支付</b>：货币与时区一次选对，后期改很麻烦；</li><li>⑤ <b>域名验证</b>：在 BM 内验证你的网站域名（不验证，部分转化事件会受限）；</li><li>⑥ <b>装 Pixel＋CAPI</b>，在 Events Manager 里配置事件，并用「测试事件」工具逐个验证能正常收到；</li><li>⑦ 以上全部就绪，才开第一支广告。</li></ul><p><b>风险隔离原则：</b>重要资产至少配两个管理员；条件允许准备备用 BM，且<b>主页要提前绑到老 BM 上</b>——不要等出事才想起隔离，所有资产挂在单一 BM/单一管理员上就叫「裸奔」。</p>",
cs:"某工业设备进入德国市场：先建欧洲区 BM（与主 BM 隔离，防止连坐）→ 英文主页发 8 条产品与案例内容养可信度 → 新广告账户绑欧元支付 → 验证 某外贸独立站 类域名 → Pixel＋CAPI 双通道装好、询盘事件测试通过 → 两周后才开第一支 Lead 广告。前期「慢」的这一周，换来的是后面投放不因资产问题中断。",
f:"论坛的手册帖系统讲解过这套账户体系；多篇实战帖验证了「资产迁移」路径：广告户死了但 BM、像素、主页还活着时，用「使用现有帖子」把原广告继承到新账户继续跑，像素的历史数据不丢、学习基础还在；新手帖反复强调的主页教训：主页务必提前绑在老 BM 上，切忌裸奔。",
e:"<ul><li>主页裸奔不绑 BM——账户一出事，主页跟着陪葬；</li><li>像素装在代理商的 BM 里而不在自己 BM——换代理商等于数据清零重来；</li><li>个号受限才发现整个体系挂在一个人身上（报错先查个号状态）；</li><li>货币/时区选错导致报表口径混乱；</li><li>以为「出价」不存在——它只是被系统接管了。</li></ul>",
q:{q:"广告户被封，但 BM、像素、主页都活着，如何最快恢复投放？为什么能恢复？",a:"三步：① 用「使用现有帖子」把原帖继承到新广告账户（社会证明与帖子数据都在）；② 把主页与像素分享/绑定到新户，延续数据通道；③ 直接开跑。能恢复的原理：像素是数据资产、跟 BM/网站走而不跟广告户走，历史转化数据仍在，模型的「学习基础」没有丢——这也是为什么账户体系要分层设计。"},
b:"能默画「个号→BM→主页→广告户→像素」五层关系图，说清每层职责与对应风险点，并解释为什么出价在后台看不到。"},
{id:"L0-02",lv:0,t:"Objective / Conversion Location / Optimization Event",
g:"掌握 Campaign 层的三个联动决策——广告目标、转化位置、优化事件。这三个选择决定了 Meta 的模型替你找什么人，是所有投放决策里杠杆最大的一层。",
c:"<p><b>想象你请了一个司机。</b>你说「去机场」，他就往机场开；你说「去车站」，他就往车站开。司机不会问你对不对，他只负责执行。Meta 的模型就是这个司机：<b>Objective（广告目标）是你给司机的指令</b>——选 Sales，模型去找「最可能下单的人」；选 Leads，模型去找「最可能留下联系方式的人」；选 Traffic，模型去找「最可能点击的人」。目标不同，找来的人完全不同。这是 Facebook Ads 最重要的一句话之一。</p><p><b>三个决策各自的含义：</b></p><ul><li><b>Objective（目标）</b>：决定 Meta 的优化方向（Sales / Leads / Traffic / Engagement…）；</li><li><b>Conversion Location（转化位置）</b>：决定转化发生在哪张「桌面上」——你的网站？即时表单？电话？Messenger/WhatsApp 对话？App？很多人第一次看到这个选项都愣住，其实它回答的是「成交动作发生在哪里」；</li><li><b>Optimization Event（优化事件）</b>：模型学习的靶心——在选定位置的所有事件里，挑出具体哪一个作为「学找谁」的依据（Lead？Purchase？CompleteRegistration？）。</li></ul><p><b>Sales 还是 Leads？（2026 新版逻辑）</b>新版 Meta 里两者都支持网站转化优化，争论了很多年的「选哪个」要看两个判断标准：① <b>转化发生在哪</b>——电商下单发生在网站内→Sales 顺理成章；B2B 询盘后还要销售跟进→Leads 更贴切。② <b>广告能影响什么</b>——广告只应该对「自己能影响的行为」负责。免费试用注册是广告带来的→归广告管；之后的年费合同靠销售谈判→广告管不了，也不该管。</p><p>行业里流传的「Leads 一定比 Sales 便宜所以选 Leads」「Sales 质量一定高」都是错误说法——便宜与否要看的是后续 Qualified 率与成交成本，不是前台 CPL。</p>",
m:"<p><b>三个决策如何联动：</b>目标决定模型的「大方向」，位置决定「在哪完成」，事件决定「具体学什么」。三者共同定义了模型的靶心，靶心一变，找来的人群就变。</p><p><b>为什么优化事件会「越来越不一样」？</b>模型上线后持续学习：它不断把广告推给「预测中最可能完成该事件的人」，完成事件的人又成为新的学习样本——于是模型对这类人越找越准，同时离「其他类型的人」越来越远。这就是为什么选错优化事件的账户，跑得越久偏得越远。</p><p><b>容易混淆的点：</b>转化位置 ≠ 优化事件。位置是「场地」，事件是「场地里你指定的那个动作」。在 Website 这个位置里，可以有 Lead、Purchase 等多个事件，你只能选一个作为优化靶心。</p>",
h:"<p><b>B2B 询盘场景的决策流程：</b></p><ul><li>① 写下业务终点：「客户提交询盘表单」还是「客户签约付款」？</li><li>② 倒推广告能影响的部分：广告能影响的通常到「询盘/试用注册」为止；</li><li>③ 据此选三连：Objective＝Leads（或 Sales，若 CRM 成熟可接 Qualified 回传，见 L5-01）、Location＝Website、Event＝Lead；</li><li>④ 配好对应转化事件并测试通过（见 L0-03），再开广告。</li></ul><p><b>自检口诀：</b>先定业务终点，再倒推事件；广告只对自己能影响的行为负责。</p>",
cs:"某工业设备：业务终点是「设备订单」，但订单由销售谈判决定，广告影响不到。所以广告负责的是「询盘」——Objective＝Leads、Location＝Website、Event＝Lead。等后端 CRM 成熟、能把「询盘→Qualified」状态回传给 Meta 时，再升级为优化 Qualified Lead（那会让模型直接学「找优质询盘的人」，见 L5-01）。",
f:"论坛实操印证：潜客目标下「进阶赋能型」开关被隐藏时，社区通行解法是先切到销量目标把开关关掉、再切回潜客目标；社区对 ABO/CBO/ASC 的长期争论都发生在「结构层」，而目标层（给模型什么指令）的逻辑各家是一致且无争议的——先把目标层选对，再谈结构。",
e:"<ul><li>业务要的是询盘质量，却选了 Traffic——买来一堆点击，模型学的是「找爱点击的人」，越跑越歪；</li><li>混淆转化位置和优化事件——在网站位置里选了个没人触发的事件，模型没东西可学；</li><li>让广告对签约负责——签约由销售决定，广告优化事件设在合同上只会带来模型混乱；</li><li>听信「Leads 一定更便宜/ Sales 一定质量高」的口号，不看自己的 Qualified 率数据。</li></ul>",
q:{q:"免费试用注册（广告负责）＋ 年费合同（销售谈判负责），优化事件应该设在哪？为什么？",a:"优化事件设在「免费试用注册」上，Objective 偏向 Leads。理由：广告只对自己能影响的行为负责——试用注册是广告直接带来的，可以优化；年费合同由销售谈判决定，广告管控不了，把优化事件设在合同上只会让模型去找「看起来像会签合同」但实际连试用都不注册的人。判断依据不是按钮叫什么名字，而是「这个行为是不是广告能影响的」（对应课程 MSG 49 的经典判断）。"},
b:"给定任意业务场景，能 30 秒内说出 Objective / Location / Event 三连，并用「司机隐喻」解释为什么这么选；能说出 Leads vs Sales 的两个判断标准。"},
{id:"L0-03",lv:0,t:"Pixel / Event / Signal / Parameters / EMQ / 去重",
g:"吃透 Meta 数据采集体系：Pixel 到底记录什么、事件的语义体系（Standard/Custom/Parameters/User Info）、EMQ 分数怎么来的，以及双通道去重的精确机制。",
c:"<p><b>Pixel 是什么？</b>一段装在你网站上的 JavaScript 代码，像一个「摄像头」：访客打开页面，它就把「谁来了、看了什么、做了什么」记录下来发回 Meta。<b>行业误区纠正：Pixel 只负责记录，不负责优化。</b>优化是模型的事，Pixel 只是给模型喂料。所以丢 Pixel 丢掉的不只是「能看到多少转化」，而是整个模型的学习原料。</p><p><b>Event（事件）＝「发生了什么」。</b>Meta 把事件分两大类：</p><ul><li><b>Standard Events（标准事件）</b>：官方定义的统一语义，如 PageView、Lead、Purchase、CompleteRegistration、AddToCart。为什么要统一？因为 Meta 要「听懂」全网几百万个网站发生的事——大家都用同一个词，模型才能跨网站积累认知（在 A 网站学到的「什么样的会提交 Lead」可以迁移到你的网站）。</li><li><b>Custom Events（自定义事件）</b>：标准事件覆盖不了的业务动作（如「下载了选型白皮书」）。能用 Standard 就用 Standard——语义越标准，模型越好懂。</li></ul><p><b>一个完整的 Event 由四部分组成：</b></p><ul><li><b>Event name</b>＝主语：发生了什么类型的事（Lead）；</li><li><b>Event Parameters（参数）</b>＝修饰信息：发生时的上下文（value、currency、content_name…）。参数让 Meta「有迹可循」——知道这是一笔 $3000 的询盘还是 $30 的；</li><li><b>Event ID</b>＝这一次事件的唯一身份证（去重用，见工作机制）；</li><li><b>User Information（用户信息）</b>＝是谁：邮箱、手机号（哈希后上传）。它回答「这个事件是谁干的」，供 Meta 把事件匹配回自己的用户画像。</li></ul><p><b>EMQ（Event Match Quality，事件匹配质量）</b>：衡量「你回传的事件，Meta 能不能匹配到具体的人」。0–10 分，8 分以上良好。匹配上了，这个事件才能变成「某个用户的行为」，才能进入模型的学习样本。<b>从 Event 到 Signal 的升级理解：</b>Event 只是「发生了一件事」，<b>Signal 是围绕这件事的一整套数据</b>——事件本身＋参数＋用户信息＋匹配质量。模型真正学习的是 Signal，不是孤零零的 Event。这就是「数据质量」章节的核心：数量够、质量高，模型才学得准。</p>",
m:"<p><b>双通道去重机制（最经典的考点）：</b>Pixel 走浏览器、CAPI 走服务器，同一个转化（如一次询盘）两边都会发。Meta 怎么知道这是一次而不是两次？靠 <b>event_name ＋ event_id 组合判断</b>：</p><ul><li>name 相同、ID 不同 → 判定为<b>两个事件</b>（去重失败，转化虚增）；</li><li>name 相同、ID 相同 → 判定为<b>同一事件</b>（去重成功，只算一次）。</li></ul><p><b>为什么不用时间戳判断？</b>因为两个通道的传输延迟不同（服务器到服务器可能比浏览器快也可能慢），用时间容差判断会误判——网络抖一下，同一事件就被算成两次。<b>event_id 就是为此存在的唯一身份证。</b></p><p><b>EMQ 的分数怎么来的？</b>你回传的用户信息（哈希后的邮箱/手机号）与 Meta 用户库匹配成功的比例、字段完整度共同决定。匹配得越全，分数越高，事件越容易归到「具体某个人」头上。行业误区：以为 EMQ 是「数据准确度」——它只管「匹配得上谁」，不管事件本身真不真实。</p>",
h:"<p><b>事件配置实操清单：</b></p><ul><li>① 按 funnel 选标准事件：B2B 询盘站至少配 PageView、Lead（表单提交）、Contact；电商配 ViewContent、AddToCart、InitiateCheckout、Purchase；</li><li>② Purchase 必传 value＋currency，Lead 建议传预计价值——有价值的转化，模型对「高价值人群」的判断更准；</li><li>③ CAPI 侧尽量传哈希后的 em / ph（邮箱/手机号），这是拉高 EMQ 最有效的动作；</li><li>④ 双发时确保同一个转化在 Pixel 与 CAPI 里 <b>event_name 一致、event_id 一致</b>（用 CRM 记录号/订单号做 event_id 最稳）；</li><li>⑤ 在 Events Manager 看 EMQ 面板与「去重结果」，确认没有虚增；</li><li>⑥ 用「测试事件」工具在上线前逐个事件验证。</li></ul>",
cs:"某工业设备询盘表单：访客提交表单 → 浏览器端 Pixel 发一个 Lead（event_id＝CRM 生成的询盘号），同时服务器端 CAPI 发同一个 Lead（相同 name、相同 event_id）→ Meta 去重后只记一次。三个月后 CRM 标记其中 20 条为 Qualified，服务器再回传 Qualified 事件（新事件名、新 ID，不与 Lead 冲突）——模型从此多了一个更高质量的信号源。",
f:"论坛对数据底层讨论较少（实操层集中在电商 Purchase），但错误代码帖里的高频事故「像素未设置转化事件」（报错 1487658 类）说明：大量新手账户是「事件没配好就开投」——事件没配好，模型没靶心，花多少钱都是白搭。数据层看似枯燥，是论坛老手与新手真正的分水岭。",
e:"<ul><li>以为「字段越多越好」，把没把握的用户信息乱传——低质数据污染匹配，反而拉低质量；</li><li>双发不做 event_id 去重——转化翻倍虚报，预算决策建立在假数据上；</li><li>用时间戳做去重——网络延迟导致同一事件被算两次；</li><li>CAPI 什么都不带（只有事件名）——EMQ 长期 2–3 分，事件匹配不到人，等于白传；</li><li>把 Custom Event 乱用在不必要的地方，放弃了标准语义的可迁移性。</li></ul>",
q:{q:"为什么 100 个不同用户的询盘，event name 都是 Lead 但 event_id 各不相同？如果这 100 次询盘同时被 Pixel 和 CAPI 各发一次，Meta 最终记录多少个转化？",a:"name 是标准化语义——让 Meta 知道「发生了什么类型的事」；ID 是唯一性标识——区分「是哪一次事件」。100 个不同用户的询盘是 100 次独立事件，所以 name 相同、ID 各不相同。双发场景：每次询盘在两个通道里 name 相同且 event_id 相同（同一个 CRM 询盘号）→ 判定为同一事件去重，最终记录 100 个转化，而不是 200。若 ID 没对齐，就会记成 200——这就是双发必做去重的原因（课程 MSG 105 逻辑）。"},
b:"能画出 Pixel＋CAPI 双通道去重示意图（标出 name/ID 判断分支），解释 EMQ 在「匹配什么」、Signal 与 Event 的区别，并说出 EMQ 的目标分数。"},
{id:"L0-04",lv:0,t:"浏览器丢数据、iOS ATT 与 CAPI 双通道",
g:"理解数据为什么会丢（浏览器限制、ATT）、CAPI 的第一性原理，以及为什么 2026 年「双通道＋去重」是标配而不是可选项。",
c:"<p><b>Pixel 的数据是怎么丢的？</b>Pixel 依赖浏览器环境执行，四种典型丢失场景：</p><ul><li><b>浏览器智能防追踪</b>：Safari ITP、Firefox ETP 会主动限制第三方 Cookie 与跨站追踪；</li><li><b>广告拦截插件</b>：大量用户装了 AdBlock 类插件，Meta 的域名直接被拦截；</li><li><b>JavaScript 根本没执行</b>：页面没加载完就关掉、企业网络的安全网关拦截脚本；</li><li><b>iOS ATT（App Tracking Transparency）</b>：2020 年 iOS 14 起苹果要求 App 征得用户同意才能跨 App 追踪（IDFA 授权），大部分用户选择拒绝——Meta 在苹果生态里瞬间「失明」了一大块。</li></ul><p><b>ATT 为什么是行业转折点？</b>它不是 Meta 一家的损失，而是整个「第三方追踪」模式的终结信号。Meta 的应对分两层：短期靠<b>统计建模补缺口</b>（用可观测部分推断全貌，所以后台数字会有「建模估算」成分）；长期靠<b>把数据通道从浏览器搬到服务器</b>——这就是 CAPI 诞生的原因。</p><p><b>CAPI（Conversions API）的第一性原理：</b>Pixel 是「访客的浏览器」告诉 Meta 发生了什么；CAPI 是「你的服务器」直接告诉 Meta 发生了什么。服务器到服务器，不经过用户浏览器——不依赖 JS 执行、不怕拦截插件、不受 ATT 限制，还能补上浏览器拿不到的数据（如 CRM 里的离线状态变化）。<b>关键认知：CAPI 和 Pixel 的算法能力完全一样，差异只在数据——CAPI 让数据更稳、更全。</b>数据多且质量高，模型预测的上限就高。</p><p><b>最大的误区：装了 CAPI 就把 Pixel 删了。</b>错。两者是互补关系：Pixel 补浏览器侧的即时行为（页面停留、滚动），CAPI 补服务器侧的完整与稳定（表单落库、订单系统、离线转化）。正确形态是双通道并行＋event_id 去重——既补全，又不多算。</p>",
m:"<p><b>双通道协同的完整图景：</b></p><ul><li>用户提交询盘 → 浏览器侧 Pixel 立即发 Lead（快，但可能被拦截丢包）；</li><li>服务器收到表单 → CAPI 发同一个 Lead（event_id 相同，稳，必达）；</li><li>Meta 按 name＋ID 去重，取并集——丢了一个通道，另一个还在；</li><li>后续 CRM 里的状态变化（Qualified→Opportunity→Deal）由服务器通过 CAPI 回传——这是 Pixel 永远做不到的。</li></ul><p><b>Cookie 的角色（背景知识）：</b>Cookie 是浏览器给网站存的「小纸条」，让网站跨页面记住这个人。Meta Pixel 原来靠第三方 Cookie 识别用户，ATT 后第三方 Cookie 大面积失效，第一方 Cookie（网站自己域名下存的）与服务器端标识成为新根基——这也是「第一方数据」成为 2026 行业关键词的原因。</p>",
h:"<p><b>接入与诊断路径：</b></p><ul><li>① Events Manager 里完成事件配置优先级排序（EMS）；</li><li>② 优先用<b>官方一键 CAPI</b>（2026-04 起免费且带智能增强）：Shopify 有原生集成，WordPress 用官方插件，自建站走网关或自写；</li><li>③ 自建场景：表单/订单落库时触发服务端发送，带上哈希用户信息与 event_id；</li><li>④ 诊断看两个数：EMQ（目标 ≥7）和去重率（Pixel/CAPI 重合是否正常）；</li><li>⑤ 定期用测试事件工具回归验证——网站改版最容易把事件改坏。</li></ul>",
cs:"某工业设备官网：改版后表单事件断了 9 天没人发现，期间 Meta 后台 Lead 归零、团队误判「广告不行了」差点砍预算。事后建立双保险：Pixel＋CAPI 双发（一个通道坏了另一个还在）＋ EMS 每周事件量巡检。这个案例说明：数据通道的可靠性，优先级高于任何投放技巧。",
f:"论坛实操层很少讲 CAPI（多为电商代投视角），但有新手复盘帖的「养像素」链路——$10/天先跑主页浏览→加购→购物，一步步攒事件——本质是在浏览器时代手动积累数据。CAPI 时代这套要整体升级为双通道：不是不养，而是「养」的同时把服务器通道补齐，否则数据天然残缺。",
e:"<ul><li>装了 CAPI 就删 Pixel——双通道互补关系被破坏，浏览器侧数据白白丢失；</li><li>CAPI 回传了但 EMQ 长期低于 4——事件匹配不到人，约等于白传；</li><li>以为后台数字 100% 精确——ATT 后部分数据是建模估算，口径要心里有数；</li><li>网站改版不回归测试事件——转化断了几天才发现，模型学习断档；</li><li>把「数据波动」全归因于广告——先查数据通道，再判效果。</li></ul>",
q:{q:"CAPI 和 Pixel 的算法能力一样吗？差异到底在哪？为什么说「装了 CAPI 还要保留 Pixel」？",a:"算法能力一样——两者最终都是把事件送进同一个模型，差异在数据：CAPI 从服务器直传，更稳定、更完整（不依赖浏览器、不受 ATT/拦截影响，还能传离线状态）。保留 Pixel 的原因：① 双通道互补——Pixel 抓浏览器侧即时行为，CAPI 抓服务器侧完整数据，丢一个通道就丢一类数据；② 双发＋event_id 去重保证「补全而不多算」；③ 只留 CAPI 会丢掉页面级微行为信号（课程 MSG 101 的核心结论：数据量与质量决定预测模型上限）。"},
b:"能按因果链复述「ATT→数据缺失→CAPI 诞生」的完整逻辑；说出四种 Pixel 丢数据的场景；解释双通道互补关系与 EMQ 目标值。"},
{id:"L0-05",lv:0,t:"Learning Phase / 预测模型 / 每周 50 事件",
g:"掌握学习期的本质与边界：什么操作会重置学习、50 事件/周的真实含义、为什么加预算也算「重大修改」——这是日常操作纪律的理论基础。",
c:"<p><b>学习期（Learning Phase）是什么？</b>新广告（或重大修改后的广告）上线，模型对「当前配置下的数据分布」一无所知，需要先<b>探索</b>：把广告推给各种人，观察谁转化，逐步收敛出「该找什么人」的判断。这个探索阶段就是学习期。<b>退出的标志</b>：约 7 天内获得 50 次优化事件（2026 年部分场景门槛已降至 25/周）。</p><p><b>50 不是硬门槛。</b>少于 50 也能投、也能出转化，只是模型收敛慢、成本波动大；Meta 给这个数字的用意是「统计意义上的稳定样本量」。为什么不是 10？样本太少，分布估计不稳，模型今天找 A 类人明天找 B 类人。为什么不是 500？那意味着探索期太长，你的预算大量消耗在「试错」而不是「收割」。50 是两个极端的折中。</p><p><b>「当前广告配置」是关键概念。</b>模型学习的对象不是「你的账户」，而是「素材 × 受众 × 出价 × 优化目标」这个组合的数据分布。<b>组合里任何一个大件变了，分布假设就变了，模型要重新探索——这就是「重大修改」重置学习期的原因。</b></p><p><b>哪些操作触发重大修改：</b>更换素材（素材决定吸引谁）、大幅改受众（改变候选人群）、改优化目标（换了靶心）、预算大幅调整（超过约 20%，见下）。<b>哪些不触发：</b>暂停后 7 天内重新开启、小步加减预算、组内小改（如微调文案）。</p>",
m:"<p><b>为什么加预算也可能影响学习？</b>预算决定「每小时能参与多少次拍卖」。预算 $50/天时，模型在某一小群人里找到了高效人群；你突然加到 $200/天，原有的高效人群池子填不满新预算，系统必须向更广的人群探索——<b>数据分布变了，模型要重新学。</b>这就是为什么有时候一加预算 CPL 立刻上升：不是广告变差了，是模型进入了新一轮探索。也解释了为什么不是每次加预算都出问题——如果人群池足够大（Broad 受众）、加幅小（≤20%），模型几乎不用重新探索。</p><p><b>机器学习视角（一个词记住）：分布漂移（Distribution Shift）。</b>模型的预测建立在「见过的数据分布」上；任何让「新数据分布 ≠ 旧分布」的操作，都会让预测暂时失准。素材、受众、目标、预算，都是分布的组成部件。</p>",
h:"<p><b>学习期操作纪律（日常执行清单）：</b></p><ul><li>① 新组上线后 24–48 小时<b>静默期</b>：什么都不改，让它探索；</li><li>② 调预算每次 ≤20%，间隔至少 24 小时（$50 最多加到 $60 这一档）；</li><li>③ 想换素材 → <b>复制新组测试</b>，别直接改原组（原组的模型是资产）；</li><li>④ 避免在午夜「转点」前后做大改（每日预算重置的节点最敏感）；</li><li>⑤ 必须做的多处修改，集中一次做完，别分五次、每两天一次；</li><li>⑥ 暂停的组 7 天内重开不重置学习——短期测试预算可以放心暂停。</li></ul>",
cs:"某工业设备德国组跑了两周、CPL 稳定 $38，老板想「马上换张更有冲击力的主图」。正确做法：复制一个新组上新素材，与原组并行跑一周——原组继续稳定产询盘，新组自己学自己的。若直接在原组换图：学习期重置，未来一周的询盘产出中断，而原素材的数据积累也回不来了。",
f:"论坛与理论高度一致的实战印证：「三大致命操作」之首就是每天频繁改动、不断重置学习期；实测帖验证暂停 7 天内重开不重置学习、停一个月后再开效果下滑属正常波动而非玄学；预算小步原则（$50 最多加到 $60）与 20% 纪律一致；多篇帖强调严禁在转点前后大幅加预算——论坛老手用真金白银换来的纪律，和第四章的理论完全对得上。",
e:"<ul><li>把「50 个转化」当硬门槛，天天焦虑为什么不退出学习期——先看优化事件是不是设得太深（如直接优化 Purchase 但一天只有 2 单）；</li><li>每天改预算/改受众/换素材「勤快优化」——每一次都是重置学习，纯送钱；</li><li>翻倍加预算想快速起量——模型被迫大范围重新探索，CPL 飙升；</li><li>在原组上直接换素材——原组数据积累作废；</li><li>凌晨改预算赶「新的一天」——正好撞上最敏感的转点窗口。</li></ul>",
q:{q:"为什么增加预算也可能影响学习期？为什么 +20% 通常没事而翻倍危险？",a:"预算显著改变后，模型每小时可参与的拍卖量变了：原有人群池填不满新预算时，系统必须向更广人群探索——模型面对的数据分布变了，相当于新配置重新学习。+20% 时人群池通常无需大幅扩展，分布近似不变，模型平滑过渡；翻倍则大概率突破原人群池容量，触发大范围重新探索，CPL 短期上升（课程 MSG 121 的分布漂移逻辑）。实操纪律：每次 ≤20%、间隔 24 小时、大改用复制新组解决。"},
b:"能列出哪些操作会/不会触发重大修改并解释原因（用「配置组合」与「分布漂移」的语言）；能解释 50/7 天为什么是折中值；能复述 6 条操作纪律。"},
{id:"L0-06",lv:0,t:"Auction / Total Value / Estimated Action Rate / Ad Quality",
g:"吃透竞价公式的每一项：Total Value = Bid × Estimated Action Rate + Ad Quality，理解信号如何进入预测、为什么高 CPM 可能反而便宜、为什么诱导点击会被系统惩罚。",
c:"<p><b>拍卖需要出价，但 Meta 把出价藏起来了。</b>原因是绝大多数广告主选「最低成本」目标：你给预算和目标，系统替你在每一场拍卖里出价。<b>但出价只是公式的一项，不能单独决定胜负。</b></p><p><b>Total Value（总价值）公式：</b></p><p style=\"text-align:center\"><b>总价值 = Bid（出价） × Estimated Action Rate（预估行动率） ＋ Ad Quality（广告质量）［＋ User Value］</b></p><ul><li><b>Estimated Action Rate（EAR）</b>：系统预测「这个用户看到这条广告后，完成优化事件的概率」。同一个用户，在不同 Campaign 下 EAR 完全不同——Sales 目标算的是「他会买吗」，Traffic 目标算的是「他会点吗」，两个概率天差地别。<b>EAR 是被你的数据和 Signal 喂出来的</b>：数据量越大、EMQ 越高，预测越准，公式里的乘积项越有竞争力。</li><li><b>Ad Quality ≠ 广告好不好看。</b>官方定义它由三部分构成：用户<b>负面反馈</b>（隐藏广告、举报）、<b>误导体验</b>（素材承诺与落地页不符）、<b>诱导点击</b>（标题党、骗点击）。质量分低会直接拖垮总价值——这就是「诱导点击拉 CTR 反被惩罚」的机制。</li><li><b>User Value</b>：部分场景下系统加入的用户长期价值调节项。</li></ul><p><b>信号多 ≠ 信号好。</b>EAR 由 Signal 驱动，但低质信号（乱传的用户信息、造假的事件）会污染预测——喂给模型的垃圾越多，预测越离谱。这与 L0-03 的 EMQ、L0-04 的双通道直接衔接：<b>数据质量章节的结论，最终在竞价公式里变现。</b></p>",
m:"<p><b>算一遍就懂了：</b>广告 A 出价 $1、预估行动率 10% → 总价值 1×0.10＝0.10；广告 B 出价 $0.2、预估行动率 70% → 0.2×0.7＝0.14。<b>B 赢。</b>出价低但行动率高可以反超——系统永远选总价值最高的，不是出价最高的。</p><p><b>CPM 高 ≠ 贵。</b>CPM 是千次展示成本，但你要的是转化不是展示。设想两条广告：A 的 CPM 便宜 $5 但落地页转化率 0.5%；B 的 CPM 贵 $15 但转化率 4%——算到 CPL，B 反而便宜一半。<b>真正的成本单位是「每个优化事件的价格」，不是 CPM。</b>论坛盯盘口诀里「高 CPM＋高点击＝高价值人群要保留」说的就是这个：贵的人群如果行动率高，最终更划算。</p><p><b>为什么转化差但「看起来好」的广告会恶性循环？</b>诱导性素材拉高点击 → 进入拍卖的是大量「爱点但不转化」的用户 → 负面反馈与误导判定拉低 Ad Quality → 系统降低其总价值 → 展示变少、且模型学到的人群越来越偏。CTR 好看只是过程指标。</p>",
h:"<p><b>把公式变成日常动作：</b></p><ul><li>提升 EAR → 补信号：数据量（双通道齐全）＋ 数据质量（EMQ ≥7）＋ 优化事件设对靶心；</li><li>提升 Ad Quality → 素材诚实（承诺与落地页一致）、不诱导点击、监控负面反馈率（在账户里看「质量排名」）；</li><li>盯盘时人工估计这两个量：高 CPM＋高点击＋高转化 → 高价值人群，保留；低 CPM＋低点击＋零转化 → 垃圾受众，砍；高 CPM＋高 CPC＋低 CTR → 人群跑歪，查素材与受众匹配。</li></ul>",
cs:"某工业设备两条素材同组竞赛：素材 A 用「巨型设备震撼画面」，CTR 3.2% 但进来的多是猎奇流量，询盘 2 条且有 1 条无效，负面反馈率偏高；素材 B 用「污水厂运维主管实测」画面，CTR 1.8% 但询盘率是 A 的三倍。按总价值逻辑，B 的 EAR×出价远高于 A，且 A 的质量分因负面反馈持续下滑——三周后系统自然把量都给了 B。这就是「让系统替你惩罚坏素材」，前提是你的转化信号回传是通的。",
f:"论坛盯盘逻辑与公式完全吻合：「高 CPM＋高点击＝高价值人群保留；低 CPM 低点击＝垃圾受众；高 CPM 高 CPC 低 CTR＝人群跑歪」——论坛老手没有学过公式，但用真金白银总结出的盘面判断，就是在人工估计 EAR 与 Ad Quality。理论与实战在第五章完全交汇。",
e:"<ul><li>只看 CPM 便宜就高兴——便宜的常是垃圾流量，CPL 反而高；</li><li>用诱导标题拉 CTR——短期点击涨，长期被 Ad Quality 惩罚、人群跑偏；</li><li>素材承诺与落地页不符——「误导体验」直接扣质量分；</li><li>抱怨「CPM 贵所以不投优质人群」——忘了比较的应该是 CPL 而非 CPM；</li><li>以为堆数据就能提升 EAR——低质信号是污染不是养分。</li></ul>",
q:{q:"广告 A 出价 $1、预估行动率 10%；广告 B 出价 $0.2、预估行动率 70%。谁赢得拍卖？这说明了什么？",a:"按同一优化目标计算总价值：A＝1×0.10＝0.10；B＝0.2×0.7＝0.14，B 赢。说明出价只是公式的一项，出价低＋行动率高可以反超——而行动率来自你的数据质量与数量（Signal），广告质量分是独立的第二引擎。推论：一个数据回传健全、素材诚实的账户，可以用更低出价赢得更好的人群；这就是为什么「补数据」比「调出价」更根本（课程 MSG 129-130 修正版逻辑）。"},
b:"能默写 Total Value 公式并解释每一项由什么决定；能用数字例子说明「低出价反超」与「CPM 高但 CPL 低」；能说出 Ad Quality 的三个构成与对应的踩坑动作。"},
{id:"L0-07",lv:0,t:"Attribution / 归因窗口 / View-through / 增量与控制组",
g:"分清「归因」与「增量」这两个最容易被混为一谈的概念：归因是统计口径，增量是因果事实。学会用这个视角读报表，避免被数字游戏欺骗。",
c:"<p><b>归因（Attribution）解决什么问题？</b>一个客户从看到广告到成交，往往经历多个触点：周一看到 FB 广告、周四点了搜索广告、周五直接访问网站下单——这笔转化算谁的功劳？<b>归因就是一套「把转化分给触点」的规则。</b>常见规则：</p><ul><li><b>First Click</b>：功劳给第一次触点——回答「是谁把他带进来的」；</li><li><b>Last Click</b>：功劳给最后一次触点——回答「是谁临门一脚」；</li><li><b>Data-driven</b>：算法按各触点的实际贡献分配。</li></ul><p>同一条转化路径，三种规则算出三个不同结论——<b>规则一变，报表立刻变，但真实世界什么都没变。</b></p><p><b>归因窗口（Attribution Window）：</b>转化发生后多久内算到广告头上（如 7 天点击：点击广告后 7 天内的转化算数）。窗口从 7 天调到 28 天，Lead 数立刻涨——不是效果变好，是口径变宽。</p><p><b>Click-through vs View-through：</b>点击归因要求用户点过广告；浏览归因（View-through）是「看了没点也算」——用户看了广告没点，3 天后自己搜品牌词下单，浏览归因把功劳分给那次曝光。<b>它有真实价值（广告确实有潜移默化作用），但也有很大水分（不看到广告他可能也会来）。</b>读报表时对 View-through 占比高的渠道要格外警惕。另注意 2026-03 起 Meta 归因重写（渐进至 4 月）：点击归因只算真实链接点击（点赞/评论/分享/收藏不再计入），这些互动归入新设的「互动归因（Engage-through，默认 1 天窗口）」，视频观看阈值从 10 秒降到 5 秒，新默认窗口为「7 天点击＋1 天互动＋1 天浏览」——1 天浏览归因仍然存在，28 天浏览归因早在 2021 年就已移除；互动后 2–7 天才转化的部分在新口径下彻底不计入。</p><p><b>增量（Incrementality）＝「有广告 vs 没广告」的真实差异。</b>这才是因果事实：如果停掉广告这 700 个 Lead 里本来也会来 200 个（基线），那广告的真实增量是 500。测量方法：<b>控制组实验</b>——随机把人群分成实验组（看广告）与控制组（不看），两组转化之差即增量提升（Incremental Lift）。为什么必须随机分组？因为只有随机才能保证两组「本来就会转化的人」比例相同，差值才归因于广告。现实中的简化版是 <b>Geo Experiment</b>（按地区分组开关广告）。理想很美，现实很难：跨设备、其他渠道干扰、B2B 转化周期长，都会让实验失真——所以增量实验要先明确「干预对象」再设计。</p>",
m:"<p><b>归因是统计口径，增量是因果事实——两者必须分开：</b></p><ul><li>Meta 报告 700 个 Lead → 归因口径下的数字；</li><li>其中一部分「本来也会来」（基线转化）；</li><li>真实增量 = 有广告 − 没广告 = 需要 700 − 基线，而基线只有控制组实验能估。</li></ul><p><b>B2B 长周期为什么让归因更失真？</b>决策周期越长，触点越多、跨设备越多、离线环节（销售电话、邮件）越多——Last Click 归因会把功劳全给最后的搜索或直接访问，严重低估种草广告。经典案例：Meta 广告停投后，品牌词搜索与直接访问量同步下跌——说明那部分「免费流量」本来就是广告喂出来的。</p><p><b>实战里最容易踩的口径陷阱：</b>2026-03 Meta 归因规则重写后，3 月数据「看似暴跌」的账户一片哀嚎——实际是口径变了（点击归因收紧到只算真实链接点击、点赞分享等互动移入 1 天窗口的 Engage-through、视频观看阈值 10 秒→5 秒），不是效果崩了。<b>口径变化 ≠ 效果变化，读趋势时必须先问「统计口径有没有变」。</b></p>",
h:"<p><b>看数习惯（写给管理者与操盘手）：</b></p><ul><li>① Attributed CPL（归因口径）与 Incremental CPL（增量口径）分开记录，决策优先看后者；</li><li>② 调整归因窗口＝改口径，调整当期的数据不与历史可比，报表要标注；</li><li>③ B2B 长周期用 Cohort（同期群）看：「3 月广告带来的询盘，在 3/4/5/6 月分别成交多少」；</li><li>④ 定期检查「停投测试」：小市场完全停 2 周，观察品牌词搜索与直接流量的变化——廉价版的增量体检；</li><li>⑤ 预算量大时申请官方 Conversion Lift 实验工具（详见 L6-11）。</li></ul>",
cs:"某工业设备美国组 7 天点击归因 CPL $45，看着比同行 Google 搜索贵；但停投两周的测试发现：直接访问与品牌词询盘掉了 40%——原来 Last Click 报表里「免费」的流量，一大半是 Meta 广告先种草的。把这部分算回来，Meta 的有效 CPL 远低于 $45。老板差点按报表砍掉的渠道，其实是全漏斗的发动机。",
f:"论坛实操层普遍没做正规增量实验（成本高、门槛高），但品牌站复盘帖用「弃单挽回＝邮件＋再营销」把流失订单捞回来，本质是在做自己的归因补救与增量挖掘；社区对「FB 报表吹牛」的普遍抱怨，本质上就是 Last Click 归因低估了种草、或 View-through 虚报了功劳——两种失真方向相反，都要警惕。",
e:"<ul><li>用 Meta 报表的 ROAS/ CPL 直接决定预算增减——那是口径游戏，不是因果；</li><li>为了「数据好看」随意调宽归因窗口——自欺欺人；</li><li>把口径变化当成效果变化——2026-03 归因重写时大批账户误判「崩盘」；</li><li>View-through 占比高的渠道直接加预算——水分最大的数字；</li><li>以为「报表归零＝广告无用」——先做停投测试再下结论。</li></ul>",
q:{q:"归因窗口从 7 天调到 28 天，Lead 数涨了 30%，效果变好了吗？老板问「这 700 个 Lead 都是真带来的吗」，你怎么回答？",a:"没变好。窗口调宽只是统计口径变化——把第 8–28 天才转化的部分也算进来了，真实转化没有变，只是报表变大。口径变化 ≠ 增量变化。对第二个问题：不是。700 是归因口径的数字，其中包含「本来也会来」的基线转化；要知道真实增量，需要控制组实验（实验组−控制组），没有控制组时可用停投测试近似估计。给老板的汇报应该是：『700 是规则下的统计数，真实增量待测量，建议做一次 2 周停投测试』（课程 MSG 383 逻辑）。"},
b:"能用一句话向不懂广告的老板讲清「归因 700 ≠ 真带来 700」；能区分 First/Last/Data-driven 的思考角度；能解释 View-through 的价值与水分；能说出控制组为什么要随机分组。"},
{id:"L0-08",lv:0,t:"Delivery / 数据碎片化 / 素材疲劳 / 漏斗与边际经济学",
g:"掌握交付系统与账户结构的底层逻辑：为什么拆得细反而学得差、为什么素材越多不一定越好、CTR 高的素材为什么可能不是赢家——并建立漏斗诊断与边际成本的思维框架。",
c:"<p><b>赢了拍卖 ≠ 预算花得出去。</b>拍卖决定「单次展示归谁」，交付系统（Delivery）决定「预算整体怎么流」：预算花不花得动，取决于有没有足够多的「总价值够高」的展示机会。这就把受众宽窄、账户结构、素材数量全部串进来了。</p><p><b>受众太窄：不只是花不出去，还学得更差。</b>窄受众下模型可探索的样本少——50 事件/周的收敛条件更难达到，模型长期停在「半懂不懂」状态。这就是 Meta 越来越推荐 Broad（宽泛定向）的底层原因：<b>不是 Broad 有魔法，是大样本让模型学得快。</b></p><p><b>拆组过细 = 数据碎片化。</b>同一个 $1500/月：拆成 5 个组，每组 $300——每组都远够不着 50 事件/周，5 个模型都在慢速探索；合并成 1–2 个组，模型吃满样本、快速收敛。<b>「拆得细更精准」是上个时代的直觉，在模型学习范式下，碎片化是学习的大敌。</b>素材同理：一个组塞 15 条素材，每条分到的展示都构不成统计显著——核心矛盾是<b>创意多样性 vs 样本集中度</b>。经验值：每组 3–6 条素材，覆盖不同 Angle（角度）而非同一 Angle 的 15 个变体。</p><p><b>CTR 最高的素材，不一定是该加预算的素材。</b>算一笔账：素材 A CTR 5%、点击后询盘率 1%（每万次展示＝500 点击→5 询盘）；素材 B CTR 2%、询盘率 4%（200 点击→8 询盘）。B 的 CTR 只有 A 的四成，产出却是 A 的 1.6 倍。<b>CTR 是过程指标，优化事件率才是结果指标。</b>判断素材要往下多看一层。</p><p><b>素材疲劳（Creative Fatigue）：</b>同一批人反复看到同一素材（Frequency 频次上升），点击率与转化率逐渐下滑。注意：<b>频次高 ≠ 一定疲劳</b>——要观察的是「频次上升的同时用户响应是否下降」，两个指标连起来看。</p><p><b>漏斗分层诊断（First Loss）：</b>把链路拆成 CTR→LPV（落地页到达）→Lead→Qualified→Opportunity→Deal，每层有转化率。效果异常时先找<b>第一处掉链子的层</b>，而不是笼统说「效果差了」。链式拆解：CPL = CPM/1000 ÷ CTR ÷ LPV率 ÷ Lead率——任何一层恶化都会推高 CPL，先定位层，再定位原因。</p><p><b>边际经济学：</b>当前平均 CPL 好 ≠ 下一块预算的边际 CPL 好。扩量后整体 CPL $25 看着还行，但新增部分的边际 CPL 可能是 $40——<b>决策要看边际，不看平均。</b>同理，Revenue ≠ Profit，Deal 数 ≠ Business Value。</p>",
m:"<p><b>为什么「扩受众后 CPM 降了、CPL 反而升了」（或反过来）？</b>扩受众引入了更便宜的展示机会（CPM 降），但新人群与产品的匹配度可能更低（点击率降、询盘率降），CPL＝CPM 链式除以下游各层——上游省的钱抵不过下游漏的。<b>任何单层指标的优化都可能被其他层吃掉，必须整条链路一起看。</b></p><p><b>优化 Qualified Lead 也不一定一步到位：</b>直接优化 Qualified Lead 模型学得准但事件太少（学习不动）；先优化 Lead 走量、再迁移优化事件到 Qualified（见 L5-01）是标准路径——一切又回到「50 事件/周」的样本量约束。<b>整个 Level 0 的知识到这里闭环：</b>目标与数据（L0-02~04）决定模型学什么、拿什么学；学习期（L0-05）决定操作纪律；竞价（L0-06）决定竞争逻辑；归因（L0-07）决定怎么读结果；交付与结构（本章）决定预算怎么流。</p>",
h:"<p><b>结构与诊断的操作原则：</b></p><ul><li>① 账户结构：受众宁宽勿碎，市场/语言是合理的分界（每组的样本量优先保证）；</li><li>② 素材：每组 3–6 条、覆盖不同 Angle；疲劳判断看「频次↑＋响应↓」同时出现；</li><li>③ 诊断顺序：先确认数据可信（口径/回传，L0-03/04/07）→ 找 First Loss → 列 3 个最可能原因 → 用最小实验验证；</li><li>④ 扩量决策：算边际 CPL/边际 Deal 成本，不看整体平均；</li><li>⑤ 每周复盘各层转化率的趋势，异常层定位到具体素材/受众/落地页。</li></ul>",
cs:"某工业设备账户体检：整体 CPL 从 $25 涨到 $32，团队准备砍预算。按 First Loss 拆层发现：CTR 没变、LPV 率没变，掉在 Lead 提交率（落地页表单层）——原来是改版把表单从首屏挪到了页尾。修复后 CPL 回到 $24，且 Qualified 率从 40% 升到 55%（表单里加了一个资格预选问题）——<b>有效询盘成本实际下降了</b>。单看 CPL 会误判，拆层才能定位；单看数量会误判，看质量才知道赚没赚。",
f:"论坛的三段盯盘法（消耗 $5 / $5–10 / $10–30 分阶段看点击、人群、转化层）就是原始版 First Loss 诊断；测品帖的两阶段法（先验证互动点击、再验证转化出单）同理是把漏斗分层验证；「拆组过细 vs 合并」的争论在社区长期存在，正方「结构清晰」反方「数据碎片化」——在模型学习范式下，后者的理论依据更硬。",
e:"<ul><li>按「每个受众一个组」拆 10 个组——每组样本都不够学习，10 个半死模型；</li><li>一个组塞 15 条素材——多样性变成碎片化，哪条都测不出来；</li><li>只看 CTR 选赢家素材——CTR 冠军可能是询盘倒数；</li><li>扩量后只看平均 CPL——边际成本已经爆表还在加预算；</li><li>效果异常就「大调账户」——不先查数据可信度与 First Loss，调了也是白调。</li></ul>",
q:{q:"扩量前有效询盘成本 $20，扩量后整体 $25、新增部分边际 $33。这次扩量算成功吗？另一个账户想把 1 个组拆成 5 个「更精准」的组，你劝阻的理由是什么？",a:"扩量判断看边际业务价值：若边际 $33 仍低于这些询盘的边际利润（设备毛利够厚）→ 可继续观察甚至再加；若已逼近盈亏线 → 收缩回原预算。整体平均 $25 会掩盖边际恶化，决策必须用边际数字（课程 MSG 245 逻辑）。拆组的劝阻理由：样本碎片化——$300/组的预算几乎不可能达到 50 事件/周，5 个模型全部长期滞留学习期，反而不如合并 1–2 个组让模型吃满样本快速收敛；「更精准」的收益远抵不上「学不动」的损失（课程 MSG 222 逻辑）。"},
b:"能用「数据碎片化」解释为什么拆组过细和素材过多都有害；能用数字例子说明 CTR 高不等于该加预算；能按链式公式定位 First Loss 并设计最小验证实验；能用边际视角判断扩量。"}
];

/* ---------- Level 1 市场与客户洞察（8 个） ---------- */
M1=[
{id:"L1-01",lv:1,t:"客户问题与 ICP（理想客户画像）",
g:"学会从「真实客户痛点」而非「产品参数」出发建立 ICP，理解 ICP 如何传导到受众、素材、Offer 与市场优先级——它是后续所有决策的源头。",
c:"<p><b>ICP（Ideal Customer Profile，理想客户画像）＝最可能购买且单客价值最高的那类客户的具体描述。</b>注意两个词：不是「所有可能买的人」，而是「最值得服务的人」——投放预算永远有限，把 100 分的预算花在 80 分的客户上，是最常见的亏损方式。</p><p><b>ICP 回答五个问题：</b></p><ul><li><b>行业与规模</b>：他属于什么行业？公司多大规模？</li><li><b>角色</b>：是谁拍板、是谁使用、是谁把关？（B2B 常常不是同一个人，见 L1-02）</li><li><b>触发事件</b>：什么时刻他会开始找供应商？（新项目投标？旧设备到寿命？扩产？政策变化？）触发事件是 ICP 里最值钱的字段——它决定你该在「什么时候」出现在他面前；</li><li><b>现有替代方案</b>：他现在用什么解决这个问题？（竞品？自建？凑合不用？）广告的真实对手是「现状」，不是竞品；</li><li><b>为什么选你</b>：他选你而不选别人的理由（衔接 L1-05 价值主张）。</li></ul><p><b>B2B 与 B2C 的 ICP 差异：</b>B2C 画像是「人」（年龄/兴趣/消费力）；B2B 画像是「组织＋组织里的角色」（行业/规模/职位/决策流程/采购周期）。B2B 广告常见的失败根源：把 B2C 式的兴趣兴趣定向套在采购决策人身上——采购负责人不会因为「对机械设备感兴趣」就被打动，他被「项目风险更小」打动。</p><p><b>核心误区纠正：</b>「所有需要污水处理的人」不是 ICP，等于没有 ICP。ICP 的价值恰恰在于<b>放弃</b>——明确说出「谁不是我的客户」，模型与素材才有靶心。</p>",
m:"<p><b>ICP 如何传导到投放的每个环节（传导链）：</b></p><ul><li>ICP 的角色 → 决定<b>受众约束</b>（Broad 的硬边界：国家/语言；再营销名单的来源）；</li><li>ICP 的触发事件 → 决定<b>素材 Angle</b>（投标期的 EPC 怕交期延期，就打交付承诺）；</li><li>ICP 的替代方案 → 决定<b>对比型 Proof</b>（对比自建/对比旧设备的土建成本）；</li><li>ICP 的购买力 → 决定<b>市场优先级与 Offer 档位</b>（高购买力市场打品牌证据，低购买力市场打性价比证据）；</li><li>ICP 的决策流程 → 决定<b>转化链路</b>（B2B 长周期用 Lead＋CRM 承接，不适合直接优化成交，见 L0-02）。</li></ul><p><b>错误 ICP 的恶果链：</b>ICP 太泛 → 素材想讨好所有人 → 每条素材都说服力稀薄 → 点击的人杂 → 模型学到错误人群 → CPL 高且 Qualified 率低 → 加预算放大错误。<b>上游错一寸，下游错一丈</b>——这就是为什么市场洞察排在 Level 1 而不是从建账户开始。</p><p><b>ICP 的数据从哪来：</b>① 过去 20 个真实成交/询盘客户的记录（最可靠）；② 销售访谈（客户原话比你的猜测值钱）；③ 询盘邮件里的高频提问；④ 竞品广告评论区（L1-04）。</p>",
h:"<p><b>建立 ICP 的实操流程：</b></p><ul><li>① 拉出过去 20 个真实询盘/成交客户，建一张表：行业/国家/职位/触发事件/成交额/是否成交；</li><li>② 找集中度：哪一类占 60% 以上？那一类就是你的 ICP 候选；</li><li>③ 区分「买家」与「使用者」：谁付钱、谁提需求、谁写标书；</li><li>④ 给 ICP 排序：按「单客价值 × 成交概率」找出 Top 1–2；</li><li>⑤ 写成 50 字以内的 ICP 陈述：<b>「谁（角色/行业），在什么触发事件下，遇到什么问题，为什么选我们」</b>；</li><li>⑥ 每季度用最新成交数据复核一次——ICP 是假设，不是宪法。</li></ul>",
cs:"某工业设备最初 ICP 写的是「污水处理厂」——投放两个月发现询盘多但成交少。拉成交记录分析：过去 10 个成交客户里 6 个是 EPC 总包方、只有 2 个是终端污水厂。ICP 修正为「EPC 采购/技术决策人」后，素材 Angle 从产品参数转向「EPC 项目风险」：交期承诺、安装指导、售后背书——下个月询盘量持平但 Qualified 率从 30% 升到 52%。同一个产品，ICP 换个写法，质量差近一倍。",
f:"论坛对应的是「选品逻辑」：社区选品帖教你去扒同行正在测的品、看帖子的点赞与评论判断真实需求，本质就是用社区信号反推「客户到底为什么买」；还有老手总结「老品不行是我思想出了问题」——翻译过来就是 ICP 没想清楚：不是产品不行，是你对「谁为什么买」的假设错了。",
e:"<ul><li>用「所有需要 XX 的人」当 ICP——等于没有靶心，素材与受众全靠猜；</li><li>把使用者当买家——对技术员投「老板关心价格」的素材，询盘转化必然差；</li><li>ICP 写完从不更新——市场变了、客户结构变了，假设还停在一年前；</li><li>只有画像没有触发事件——不知道客户「什么时候」需要你，投放时机永远错位；</li><li>忽视现有替代方案——素材在打竞品，客户真实在对比的是「什么都不买」。</li></ul>",
q:{q:"你的某工业设备过去 10 个成交客户里，有 6 个来自 EPC 总包方、询盘却大多来自终端污水厂。这个发现会怎么改变你的 ICP、素材 Angle 与受众设置？",a:"三点改变：① ICP 主画像修正为「EPC 采购/技术决策人」，终端污水厂降为次画像；② 素材 Angle 从「产品参数领先」转向「EPC 采购风险控制」——交期承诺（投标要写进标书）、安装与售后背书（EPC 怕项目烂尾连累验收）；③ 受众与落地页按角色分层：给 EPC 的落地页突出项目案例与质保条款。原理：ICP 由「谁真的在成交」决定，而不是「谁在询盘」——询盘多但质量低恰恰说明画像错了（对应本模块案例）。"},
b:"写出一段 50 字以内、含触发事件的 ICP 陈述；能画出「ICP→受众/Angle/Offer/市场」的传导链，并指出自己业务里最可能错的一环。"},
{id:"L1-02",lv:1,t:"购买委员会与决策角色",
g:"识别 B2B 采购中的多角色决策结构，理解广告的真实任务是「进入 consideration set 并给使用者转发理由」，学会按角色设计内容矩阵。",
c:"<p><b>B2B 很少是一个人拍板。</b>典型的购买委员会（Buying Committee）有四类角色：</p><ul><li><b>使用者（用户）</b>：技术员/运维/工程师——他天天和设备打交道，最懂技术细节，通常是<b>最先看到你广告的人</b>；</li><li><b>影响者</b>：设计院/顾问/集成商——写方案、写标书技术规格的人，他的一句话能把你写进标书也能把你排除；</li><li><b>决策者</b>：采购经理/老板——看风险、价格逻辑与供应商稳定性，几乎不看你的广告；</li><li><b>把关者</b>：财务/合规——审预算、审资质、审付款条款。</li></ul><p><b>广告的真实任务是什么？</b>决策者不刷你的广告，但使用者刷。所以广告的第一任务是让使用者觉得「这家专业」，然后<b>给他一个转发理由</b>——一条可引用的参数、一份可下载的选型 PDF、一个能说服领导的项目案例。广告不直接说服拍板人，而是<b>武装能接触拍板人的人</b>。</p><p><b>转发理由的设计原则：</b>使用者转发给你领导的东西必须「体面且有说服力」——白纸黑字的参数对比、可验证的认证清单、同行业案例视频。让使用者转发「一条广告链接」是不体面的；让他转发「一份行业选型指南」是加分的。<b>你的内容资产，本质是给使用者的「政治弹药」。</b></p>",
m:"<p><b>多角色结构如何改变投放逻辑：</b></p><ul><li>素材层：一条素材主打一个角色——给使用者的打技术细节（叶轮水力设计、堵塞率对比），给决策者的打风险与价格逻辑（47 国案例、质保条款）；一条素材想打动所有人，结果谁也没打动；</li><li>落地页层：按角色分内容区——技术参数区（给使用者）＋公司实力/案例区（给转发后的决策者），因为落地页的真实读者常常是「被转发过来的人」；</li><li>链路层：B2B 转化终点（询盘）发生在使用者身上，但成交发生在委员会讨论之后——这决定了优化事件设在 Lead、而 Qualified 判定要靠 CRM 后端（见 L0-02 与 L8 层）。</li></ul><p><b>老帖的社会证明（论坛视角）：</b>为什么「使用现有帖子」跑得好？因为帖子下面积累的评论与点赞在替你影响后来的买家——那是社区的「委员会讨论记录」。新广告没有这层信任资产，所以转化天然弱一截。</p>",
h:"<p><b>按角色设计内容矩阵：</b></p><ul><li>① 列出你业务的委员会角色（B2B 通常 3–4 个）；</li><li>② 每个角色回答：他怕什么？他要什么证据？他会在哪个环节出现？</li><li>③ 每个角色至少配一个内容资产：使用者→技术对比表/选型工具；影响者→可写进标书的规格书；决策者→同行业案例＋质保条款；把关者→认证清单/付款方式；</li><li>④ 落地页按角色分区，让「转发来的决策者」30 秒内找到他要的证据；</li><li>⑤ 广告素材按角色分组测试（衔接 L3 测试方法论），看哪类角色带来的询盘 Qualified 率最高。</li></ul>",
cs:"某工业设备：广告带来的询盘很多，销售反馈「对方说要把资料发领导」然后不了了之。诊断：内容全是给使用者的技术参数，使用者转发不出手。对策：做了一份《某工业设备选型与验收要点》PDF（含参数对比表＋3 个同规模项目案例＋质保条款）挂在落地页，素材 CTA 改为「下载选型指南」——两个月后销售反馈「客户直接把 PDF 转给领导，回来就问价格」。询盘量没变，成交周期缩短了三分之一。",
f:"论坛电商场景没有购买委员会，但社区关于「使用现有帖子/锅」的长篇讨论本质是同一个问题的社区版：老帖的社会证明（评论、点赞、真人返图）在替你影响新买家——这就是「多角色影响链」在 C 端的简化形态。做 B2B 的启示：主动制造「可被转发的社会证明」，而不是等评论自然积累。",
e:"<ul><li>一条素材想打动所有角色——信息过载，每个角色都看到「与我无关」；</li><li>只对使用者说话——询盘很多但成交少，丢单后才发现拍板的是老板；</li><li>没有可转发的内容资产——使用者只能转发广告链接，不体面、没说服力；</li><li>落地页只有一个版本——被转发过来的决策者找不到他要的风险证据，直接关掉；</li><li>把「询盘数」当成功指标——使用者询盘容易，委员会通过才是真转化。</li></ul>",
q:{q:"询盘很多但成交少，销售反馈「对方说要把资料发领导」。下一步的投放与内容动作是什么？",a:"两步：① 判断这是「转发断裂」：使用者有兴趣但缺少说服决策者的弹药。② 补转发资产与承接页：做一份给决策者看的内容（同行业案例＋质保/交期承诺＋价格逻辑），落地页加「公司实力/项目案例」区块；素材 CTA 从「立即咨询」改为「下载选型指南/案例集」，让转发动作体面自然。原理：B2B 广告的任务是武装使用者去影响委员会，而不是隔着广告直接说服拍板人（对应本模块案例）。"},
b:"能画出自己业务的购买委员会（角色×顾虑×证据），并说出每个角色对应的一个内容资产与它在链路中出现的位置。"},
{id:"L1-03",lv:1,t:"购买阻力与异议 → 创意假设",
g:"把「客户为什么不买」转成可测试的创意假设，让每条素材都有明确的靶子——这是素材生产从「拍脑袋」走向「工业化」的第一步。",
c:"<p><b>素材不是艺术品，是答案。</b>用户看到广告时心里都有一个未说出口的疑问（异议），素材的价值在于<b>点名这个疑问并给证据</b>。先分清五类购买阻力：</p><ul><li><b>信任阻力</b>：「没听过你们」——新供应商的默认状态，需要案例/认证/工厂实拍来破；</li><li><b>风险阻力</b>：「坏了怎么办/项目砸了谁负责」——需要质保条款/响应承诺/保险背书；</li><li><b>复杂度阻力</b>：「我不知道怎么选型」——需要选型工具/对比表/顾问服务；</li><li><b>价格阻力</b>：「超预算/审批难」——需要价格逻辑（总拥有成本）/分期/报价透明度；</li><li><b>时机阻力</b>：「现在不急着换」——需要触发事件提醒（旧设备寿命/新规/旺季前）。</li></ul><p><b>说服公式：点名阻力 → 给证据（Proof）→ 给出口（CTA）。</b>阻力判断错了，素材再精美也没人响应——一条对「信任阻力」的素材（案例展示）投给「价格阻力」主导的人群，就是对着错误的伤口贴创可贴。</p><p><b>从异议到假设的句式：</b>「如果我们强调 [X]，那么 [某角色] 的 [指标] 会提升，因为 [原因]」。例如：「如果我们强调 48h 备件响应，那么海外客户的询盘率会上升，因为售后风险是他们最大的顾虑」。<b>每条假设都是可证伪的</b>——测出来不成立，也是收获（排除一个错误方向）。</p>",
m:"<p><b>异议从哪里来（按可靠度排序）：</b></p><ul><li>① 销售记录与丢单复盘——真实战场上缴获的弹药（最值钱）；</li><li>② 询盘邮件/聊天记录里的高频提问——「你们售后怎么办」出现 20 次，就是 20 次提醒；</li><li>③ 竞品广告评论区——同行广告下面用户的抱怨，就是他没解决的阻力（L1-04）；</li><li>④ 自己的猜测——优先级最低，但可以进假设库排队验证。</li></ul><p><b>优先级怎么排：出现频率 × 影响大小。</b>10 个丢单里 7 个提到交期 → 「交期焦虑」是最高优先级阻力；提到一次「包装」的，先放着。<b>每条高优先级阻力对应至少一条素材假设，进入测试队列</b>（测试方法论见 L3-12）。</p><p><b>与 L0 的衔接：</b>素材是模型学习的「诱饵」——你用不同 Angle 的素材吸引不同阻力的用户，模型根据谁转化来学找谁。所以「测试不同阻力假设」不只是创意工作，它同时在<b>校准模型的靶心</b>（L0-05 学习期、L0-06 EAR）。</p>",
h:"<p><b>建立阻力→假设清单的流程：</b></p><ul><li>① 翻最近 3 个月的丢单记录与询盘记录，列出所有出现的异议；</li><li>② 按频率排序，归类到五种阻力；</li><li>③ Top 5 阻力各写成一句可证伪假设（用标准句式）；</li><li>④ 每条假设配一个 Proof 与一条素材，进测试队列（同受众下对比测试）；</li><li>⑤ 测完回填结论到假设库（见 L1-06），证伪的不再重测。</li></ul>",
cs:"某工业设备的高频异议盘点：①「中国设备售后怎么办」（丢单复盘出现 7 次）→ Proof＝海外备件库＋48h 响应案例视频；②「安装麻烦吗」（5 次）→ Angle＝快速安装对比视频；③「你们和 X 品牌比怎么样」（4 次）→ 对比型素材。先测「售后」假设：同受众下 A/B 两条素材，B 开头 3 秒讲「海外仓 48h 响应」——B 的询盘率高 40%。这条假设从「猜测」变成「已验证」，进假设库，素材迭代从此有了方向。",
f:"论坛的素材迭代帖（1499 条回复那篇）讲「素材为王」，但拆开看它的方法论内核就是本模块：先想清楚「这条素材在回应什么阻力」再动手剪辑；三大致命操作帖里批评的「盲目换素材」，本质是「没有阻力假设、为换而换」——测试变成了随机漫步，预算换不来认知。",
e:"<ul><li>凭审美做素材——不知道在回应什么异议，好看但无效；</li><li>十条素材回应对同一阻力——测试预算浪费在重复验证同一个假设；</li><li>异议清单一年不更新——市场变了，阻力结构也变了；</li><li>假设不可证伪（「提升品牌好感」）——测完不知道测出了什么；</li><li>只测不回填——同一个错误假设半年后被再次测试。</li></ul>",
q:{q:"销售说客户最常问「交期多久」。把它变成一个可证伪的创意假设，并设计测试方案与判断标准。",a:"假设句式：「如果素材开头 3 秒强调『30 天交付＋延期赔付』，那么 EPC 类客户的询盘率将上升，因为交期是他们写标书时最大的风险点」。测试方案：同受众、同版位下 A/B 两条素材——A 用常规产品角度，B 用交期承诺角度；各跑至积累足够转化（预算与时长参考 L3-12 的测试纪律）。判断标准：主指标＝询盘率（Lead/点击）；辅助＝CTR 与 Qualified 率（防止承诺吸引来低质量询盘）。若 B 显著胜出→假设验证，扩产出；若平手或更差→证伪，记录并测下一阻力。"},
b:"列出 5 条真实异议并归类到五种阻力；每条写出可证伪假设与对应 Proof；能说明「阻力假设测试」同时在校准模型靶心的原理。"},
{id:"L1-04",lv:1,t:"竞品研究与 Meta Ad Library 实操",
g:"用官方 Ad Library 与搜索引擎系统研究竞品投放，把「别人的广告费」变成你的免费 A/B 测试结果，并找到差异化空白 Angle。",
c:"<p><b>Ad Library（facebook.com/ads/library）是什么：</b>Meta 的官方广告透明库，任何人可查任意主页正在投放的广告——素材、文案、开始投放日期、投放的国家与平台。它是合法且免费的，且 99% 的新手从没打开过。</p><p><b>它能告诉你什么：</b></p><ul><li><b>投放时长</b>＝幸存者信号：平台会自然淘汰低效广告，一条跑了 200 天的广告大概率在赚钱——这是被市场与算法双重验证过的创意；</li><li><b>素材更新频率</b>＝对方的迭代节奏：每周上新素材的对手，说明他的测试体系在转；</li><li><b>Angle 与 Offer 结构</b>：他主推什么卖点、用什么钩子、给什么承诺；</li><li><b>版位与格式分布</b>：他的素材是 Reels 竖版还是 Feed 图文——反映他的人群习惯。</li></ul><p><b>它不能告诉你什么：</b>花费、受众、转化数据。<b>研究目的不是抄，是找两样东西：「已被市场验证的 Angle」和「还没人覆盖的空白 Angle」。</b>直接像素级抄袭是三输：无差异化、可能侵权、且你不知道那条素材配的是他的什么承接与后端。</p><p><b>搜索引擎作为补充：</b>Google 搜「产品词＋供应商/recommended/best」看谁在占领搜索结果；YouTube 搜行业词看长视频评测（B2B 买家做功课时真的会看）。这些是「搜索 Capture」 awareness 的地基（跨渠道详见 L9）。</p>",
m:"<p><b>为什么「投放时长」是最重要的信号？</b>广告的每一天都在接受双重惩罚：市场不响应→没有转化；算法判定低质→展示成本升高。能在这种淘汰机制下活 200 天的素材，必然同时通过了「人群响应」与「系统效率」两关。<b>这是免费的市场验证结果，比任何内部争论都有说服力。</b></p><p><b>空白 Angle 的推导逻辑：</b>收集 5–10 个活跃竞品的 Angle → 归类出 3–5 个主流方向（如行业里都在打「节能」）→ 问两个问题：① 主流 Angle 里哪个我有独占优势？② 有没有「客户在乎 × 没人主打」的交叉点？——那交叉点就是你的差异化切口（衔接 L1-05）。注意：空白 Angle 也可能意味着「市场验证过没人买」——所以空白点要小预算快测，别 all in。</p>",
h:"<p><b>竞品研究 SOP（每月 2 小时）：</b></p><ul><li>① 在 Ad Library 搜行业关键词与竞品品牌名，筛出活跃主页（近 30 天在投）；</li><li>② 每个主页记录一张行：主推 Angle / Hook 类型 / 格式 / Offer / 最早投放日期 / 更新频率；</li><li>③ 归纳主流 Angle 清单（3–5 个）与各自的使用密度；</li><li>④ 找空白：客户在乎（L1-01 触发事件）× 无人主打；</li><li>⑤ 论坛式补充搜索：搜索引擎搜「产品词＋促销词」切公开帖子按时间排序，看同行在社媒上测什么品、用户在评论里抱怨什么——抱怨就是阻力假设（L1-03）；</li><li>⑥ 输出差异化 Angle 1–2 个，进假设库排队；每月复查一次。</li></ul>",
cs:"搜 submersible mixer：欧洲竞品 5 家里 4 家主打「高效节能」，1 家主打「百年品牌」。交叉客户在乎点（L1-01 触发事件：EPC 怕项目出问题）× 无人主打 → 「48h 备件全球响应」的售后保障 Angle 是空白，且恰好是你真实拥有的优势。小预算测试：售后 Angle 素材询盘率超节能 Angle 组 35%，且 Qualified 率更高——差异化切口成立，成为主力 Angle 之一。",
f:"论坛把竞品研究玩到极致：选品帖里的 FB 搜索语法——关键词加「money off / for free」、切到帖子 Tab、筛公开帖、按最近排序、看点赞与评论数——本质是在用社媒搜索扒「同行正在测什么、市场正在响应什么」；社区还总结「亚马逊能跑的品，独立站通常也能跑」的跨平台信号迁移。这些手法的共同思想：别人的公开数据是免费的测试结果。",
e:"<ul><li>直接照抄竞品素材——无差异化＋侵权风险＋不知道他的后端承接；</li><li>只看素材不看投放时长——新测的失败广告和验证过的赢家在你眼里长得一样；</li><li>研究一次用一年——对手在迭代，你的情报半年就过期；</li><li>看到空白 Angle 就 all in——空白可能是「验证过没人买」，要小预算快测；</li><li>只研究广告不研究评论区——用户抱怨（阻力）比广告本身更有信息量。</li></ul>",
q:{q:"Ad Library 里竞品一条素材已投放 210 天。这传递什么信号？你该怎么正确使用它？",a:"信号：平台会自然淘汰低效广告，210 天＝通过了市场响应与系统效率的双重验证，是「已验证的赢家创意」。正确用法：① 拆解它的结构——Angle 是什么、Hook 前 3 秒怎么设计、Proof 用了什么、CTA 指向哪；② 理解它回应的客户阻力；③ 做你自己的差异化版本（换你的 Proof、你的案例）进入测试，而不是像素级抄袭——抄袭既无差异化又可能侵权，且你不知道原素材配套的落地页与后端。"},
b:"完成一份竞品研究表（≥5 个主页 × Angle/Hook/Offer/时长/频率），归纳出 3–5 个主流 Angle，并给出至少 1 个「客户在乎×无人主打」的空白 Angle 及其小预算验证计划。"},
{id:"L1-05",lv:1,t:"价值主张与差异化定位",
g:"提炼「客户选你而不是竞品/现状」的真实理由，写成一句 3 秒内可感知的主张，并让素材、落地页、销售话术全链路一致。",
c:"<p><b>价值主张（Value Proposition）＝对谁、解决什么问题、凭什么是我。</b>它不是 slogan，是「客户选你不选别人的那个真实理由」的商业表达。差异化的来源只有四类：</p><ul><li><b>产品</b>：能效/寿命/独有技术（别人做不到）；</li><li><b>服务</b>：响应速度/质保/安装支持（别人不愿做）；</li><li><b>模式</b>：工厂直供/定制化/交付速度（别人结构上做不到）；</li><li><b>证据</b>：案例数量/认证/客户名单（别人拿不出来）。</li></ul><p><b>为什么必须「一句话可感知」？</b>Meta 信息流里用户 3 秒决定去留。泛泛的「高质量、好服务、价格优」没有区分度——你的每个竞品都这么说，用户听到等于白听，甚至等于在替整个行业做广告。<b>可感知 = 具体、有数字、有对比</b>：「土建成本省 30%」可感知，「安装方便」不可感知。</p><p><b>三栏对比法找定位：</b>「你 vs 竞品 vs 客户现状」三栏列表，找<b>「你独有 × 客户在乎」</b>的交集。只有你有的（独有）但客户不在乎的，是自嗨；客户在乎但你没有的，是补课方向；交集才是定位。</p><p><b>与 ICP 的关系：</b>同一个产品面对不同 ICP，主张应该不同——对 EPC 强调交付与风险，对终端污水厂强调寿命与能效。<b>主张是 ICP 的函数</b>（L1-01），不是一个全局口号。</p>",
m:"<p><b>主张如何影响投放效果（机制）：</b>主张决定素材的第一屏信息 → 决定吸引来谁的点击 → 决定模型的早期学习人群（L0-05）→ 决定后续所有优化的地基。<b>主张模糊 → 点击者杂乱 → 模型学习方向摇摆 → CPL 高且不稳定。</b>这是「市场洞察层」影响「算法层」的传导路径之一。</p><p><b>一致性原则（最容易踩的坑）：</b>素材承诺 A、落地页讲 B、销售话术说 C——用户在每个环节都在经历「被骗感」，Ad Quality 的「误导体验」判定也会惩罚这种断裂（L0-06）。全链路一致：素材说什么，落地页首屏就证实什么，销售开口第一句就延续什么。<b>主张一致性同时影响转化率与广告质量分，一鱼两吃。</b></p>",
h:"<p><b>提炼价值主张的流程：</b></p><ul><li>① 做三栏对比表：我有什么 / 竞品有什么 / 客户现状是什么；</li><li>② 标出「独有」项，用 L1-01 的 ICP 与 L1-03 的异议清单过滤出「客户在乎」的；</li><li>③ 把交集写成候选主张，每个必须含具体数字或具体承诺（省 30%／48h／质保 3 年）；</li><li>④ 检验「可感知性」：给一个不懂业务的用户看 3 秒，他能不能复述出「你比别人好在哪」；</li><li>⑤ 全链路对齐：素材→落地页→销售话术，同一主张同一表达；</li><li>⑥ 2–3 个候选主张进素材测试（L3），用市场投票，不要老板拍板。</li></ul>",
cs:"某工业设备主张候选三个：①「土建成本省 30%」（安装角度——浅坑机型）；②「免堵叶轮」（技术角度）；③「47 国项目案例」（信任角度）。测试结果：①在东南亚响应最好——当地人工与开挖成本高，「省土建」直接命中钱包；欧洲市场反而③响应好——成熟市场客户先信人再信参数。<b>同一个产品、两张主张面孔，按 ICP 分配。</b>",
f:"论坛品牌站一年复盘的核心思维——「爆品靠不断测品起量，品牌站靠优化一个产品起量」——本质就是把价值主张打透一个点，而非广撒网；社区里那些「什么都卖」的店与「死磕一个品类」的店的长期差距，就是主张聚焦度的差距。这与本模块「主张是 ICP 的函数、一次只打透一个点」完全同构。",
e:"<ul><li>把「质量好价格优」当差异化——所有供应商都这么说，等于没有主张；</li><li>主张是老板的偏好而非客户的感知——工厂大≠客户在乎工厂大（对照 L1-01 案例）；</li><li>素材说 A 落地页讲 B——转化率与 Ad Quality 双输；</li><li>所有市场共用一个主张——不同 ICP 的「在乎点」不同，主张应分市场；</li><li>主张从不测试——三个候选全上，用数据选，别开会选。</li></ul>",
q:{q:"老板认为公司最大优势是「工厂大、产能高」，但客户询盘里反复问的是售后。价值主张应该怎么定？为什么？",a:"以客户感知为准：把「工厂大」翻译成客户利益的售后证据——工厂大→产能与备件储备充足→可以承诺「48h 备件响应/质保期内无忧换新」。定位公式：客户在乎（售后）× 你独有的支撑（产能与备件库）=「48h 响应」这类可感知承诺。原理：差异化=客户感知到的差异，不是自己认为的差异；「工厂大」是事实但不是可感知利益，必须翻译成客户语言（对应本模块案例的翻译手法）。"},
b:"写出一句含具体数字的可投放价值主张，能说明它与 ICP、竞品、客户现状的对应关系，并画出「素材→落地页→话术」的全链路一致性检查清单。"},
{id:"L1-06",lv:1,t:"创意假设库（Hypothesis Bank）建设",
g:"把市场研究沉淀成结构化假设库，让素材生产从「拍脑袋」变成「按需提取」，让每次测试都累积认知而不是消耗预算。",
c:"<p><b>假设库是什么：</b>一张结构化表格，每行＝一条可测试的素材配方。字段：市场 × 角色 × 阻力 × Angle × Proof × 格式，外加管理字段（来源/优先级/状态/对应素材编号/测试结论）。</p><p><b>为什么需要它？</b>没有假设库的团队：素材灵感靠老板拍脑袋、测试重复、结果记不住、认知不积累——每个月测 10 条素材，「越测越迷茫」。有假设库的团队：每条素材绑定一个假设，测完回填结论，<b>好素材＝被市场验证的假设</b>，半年下来你拥有一张「客户认知地图」——这是竞品抄不走的资产。</p><p><b>六个维度的含义：</b></p><ul><li><b>市场</b>：同一条假设在不同市场可能一个成立一个证伪（东南亚在乎土建成本、欧洲在乎信任）；</li><li><b>角色</b>：给 EPC 的和给终端运维的素材配方完全不同（L1-02）；</li><li><b>阻力</b>：这条素材在回应什么异议（L1-03）；</li><li><b>Angle</b>：切入角度（售后/成本/技术/案例）；</li><li><b>Proof</b>：证据形式（案例视频/参数对比/认证/客户证言）；</li><li><b>格式</b>：图/视频/轮播，竖版/横版（格式本身也是信号，见 L0-06）。</li></ul><p><b>状态的纪律：</b>待测 / 测试中 / 已验证 / 已证伪 / 已过时。<b>已证伪的假设永久标记，不再重测</b>——重复测试证伪假设是最隐蔽的预算浪费；已过时（如政策/市场变化导致假设失效）的定期清理。</p>",
m:"<p><b>假设库如何改变团队运作（机制）：</b></p><ul><li>新人可上手：不用等老板灵感，从库里按优先级取假设执行；</li><li>测试不重复：查库发现某阻力×Angle 组合已证伪，直接跳过；</li><li>结果可解释：素材跑赢了，你知道赢在哪个维度（Angle？Proof？格式？），下次定向强化；</li><li>认知可复利：每条结论都在更新你对客户的理解——半年后这张表就是你的「市场研究部」。</li></ul><p><b>与测试方法论的分工：</b>假设库管「测什么」（内容层），L3-12 的测试方法论管「怎么测」（结构/预算/判断层）。两者合起来才是完整的创意测试体系。</p>",
h:"<p><b>建库与运营节奏：</b></p><ul><li>① 用表格建库：核心六列（市场/角色/阻力/Angle/Proof/格式）＋管理五列（来源/优先级/状态/素材编号/结论）；</li><li>② 首批填充：从 L1-03 的 Top 5 阻力假设＋L1-04 的竞品 Angle 分析＋老板的直觉（标记来源=猜测）凑 15–20 条；</li><li>③ 排优先级：频率×影响（L1-03 公式）；</li><li>④ 每周固定节奏：销售例会同步新异议入库 → 取 Top 假设配素材 → 测试结果回填状态与结论；</li><li>⑤ 每季度清库：证伪的归档，过时的清理，空白维度（如「还没有测过视频 Proof」）标记补测。</li></ul>",
cs:"某工业设备假设库节选：①「EPC＋交期焦虑＋延期赔付承诺＋视频」＝已验证（询盘率+40%，主推）；②「市政＋价格敏感＋分期付款＋图片」＝证伪（监管行业对促销话术反感，永久归档）；③「欧洲＋信任阻力＋47 国案例＋轮播」＝测试中。新人剪辑师入职第一周就能按①的配方批量产出变体素材，不用等任何人给灵感——这就是库的杠杆。",
f:"论坛素材迭代帖 1499 条回复的核心就是「假设→测试→复盘」的工业化循环；「抖音随便搜素材丢上去看哪个有用」的野路子是假设库的粗糙版——至少也在「多方向并行测试」，只是不记录、不复用，认知随时间蒸发。论坛大卖家的共同点：测试结论都留痕，失败的方向不二过。",
e:"<ul><li>假设只存在老板脑子里——离了他团队就没法生产素材，测试变玄学；</li><li>证伪的假设反复重测——最隐蔽的预算浪费；</li><li>测完不回填——库慢慢变成死表，认知不积累；</li><li>假设没有来源标记——无法评估可信度，猜测和销售实战证据混在一起；</li><li>维度乱组合一次测——一次改三个变量，赢了不知道赢在哪。</li></ul>",
q:{q:"团队每月测 10 条素材但「越测越迷茫」。最可能的病因是什么？给出完整的解法。",a:"病因：测试没有假设库支撑——素材之间 Angle 重复或随机，结果无法积累认知（每条素材在验证什么没人说得清）。解法：① 建库：市场×角色×阻力×Angle×Proof×格式六维度＋管理字段；② 存量清理：把过去测过的素材反推回假设，标记已验证/已证伪；③ 绑定机制：今后每条素材入库登记对应假设，测完 48 小时内回填结论；④ 纪律：证伪不重测、一次测一个变量、每周例会同步新异议。原理：素材测试的本质是验证假设——没有假设库，测试是随机漫步；有库，每条结果都更新认知。"},
b:"建一张不少于 15 行的假设库表格（含来源/优先级/状态/结论字段），能演示「取假设→配素材→回填结论」的完整闭环，并说出证伪不重测的理由。"},
{id:"L1-07",lv:1,t:"市场选择与优先级分层",
g:"用六维度给国家/区域市场打分排序，决定「主攻/观察/放弃」三档预算分配——市场选择错误会在投放开始前就锁定亏损。",
c:"<p><b>市场选择是杠杆最大的决策之一。</b>同一个产品、同样的素材、同样的预算，在不同市场的表现可以差 5–10 倍——因为「受众密度、购买力、竞争烈度」完全不同。<b>再强的投放优化也救不回一个错误的市场选择</b>：优化是在给定市场内把效率推到极限，而市场选择决定的是极限本身有多高。</p><p><b>六维度评分框架：</b></p><ul><li><b>需求规模</b>：搜索量、进口数据、行业展会密度——有没有足够多的「触发事件」在发生；</li><li><b>竞争烈度</b>：CPM 水平、竞品广告密度（Ad Library 查）、本土供应商数量；</li><li><b>获客成本基准</b>：该市场的行业 CPL 参考（找不到就小预算实测）；</li><li><b>客单与毛利承载</b>：市场成交价能否覆盖该市场的获客成本＋物流＋售后；</li><li><b>服务可达性</b>：语言、时差、售后响应半径——B2B 的售后承诺是主张的一部分，服务不到的市场慎打；</li><li><b>风险</b>：汇率、账期、合规认证门槛、政治经济稳定性。</li></ul><p><b>常见误区：哪里便宜投哪里。</b>CPM 便宜通常意味着购买力低或用户价值低——便宜点击×低转化×低客单，算总账反而最贵。<b>决策单位是「有效获客成本与边际利润」，不是 CPM。</b></p>",
m:"<p><b>三档分层与预算机制：</b></p><ul><li><b>主攻档（约 60% 预算）</b>：评分 Top 1–2 市场，全漏斗投入——品牌证据、本地化素材、完整售后主张；</li><li><b>观察档（约 30%）</b>：有潜力但未验证的市场，小预算跑测试——只测核心 Angle，验证 CPL 与 Qualified 率达标再升档；</li><li><b>放弃档</b>：评分低的市场坚决不投——省下的预算就是利润。</li></ul><p><b>升档/降档的触发条件要预先写死</b>（例如：观察档市场连续 4 周 CPL 低于主攻档均价且 Qualified 率达标 → 升主攻），避免「凭感觉调仓」。<b>每季度复查评分</b>：市场格局会变（竞品进入、汇率波动、政策变化），去年的排序不是今年的。</p>",
h:"<p><b>市场评分与分档的实操流程：</b></p><ul><li>① 建六维评分表（每维 1–5 分）：需求规模 / 竞争烈度 / 获客成本基准 / 客单与毛利承载 / 服务可达性 / 风险，权重按业务调整（B2B 服务可达性权重高，电商需求规模权重高）；</li><li>② 数据来源：Google Trends＋海关进口数据（需求）、Ad Library 竞品密度（竞争）、小预算实测 CPL（成本，每市场 $300–500 快测两三周）、历史成交记录（客单承载）；</li><li>③ 按总分分三档并定预算比例：主攻约 60% / 观察约 30% / 放弃 0%，<b>预先写死升档触发条件</b>（如观察档市场连续 4 周 CPL ≤ 主攻档均价且 Qualified 率达标 → 升主攻）；</li><li>④ 主攻市场内再按城市/行业细分；</li><li>⑤ 每季度重新打分复盘：竞品进入、汇率变化、政策调整都会改变排序，去年的分不是今年的分。</li></ul>",
cs:"某工业设备六维评分结果：东南亚——需求大、CPM 低，但价格敏感＋中文背景竞争者密集内卷（竞争烈度差）＋客单承载弱；欧洲——CPM 高 3 倍，但竞争少、毛利高、客户在乎质量与服务（与你的售后主张契合）。决策：欧洲主攻打「认证＋案例＋售后响应」，东南亚降为观察档只跑再营销＋一个细分切口（土建成本敏感的分散式污水项目）。三个月后欧洲贡献 75% 毛利——如果当初按 CPM 便宜选东南亚，同样的预算产出估计要腰斩。",
f:"论坛入境游帖的原话直接适用：「东南亚很卷了，因为有一些可以中文沟通，对于国内基本没什么门槛，大家都冲进去了。24 年我做的欧洲，很舒服。」——低门槛市场必然内卷，门槛（语言/认证/服务能力）本身就是护城河；COD 社区集体押注西班牙的案例同理：支付习惯（货到付款文化）决定了一个市场对特定模式是否成立。市场选择先于一切优化技巧。",
e:"<ul><li>哪里 CPM 便宜投哪里——便宜点击×低购买力＝最贵的获客；</li><li>所有市场共用一条素材一套话术——忽视市场的在乎点差异（东南亚在乎成本、欧洲在乎信任）；</li><li>观察档市场按主攻档火力投入——没验证就重仓，错了伤筋动骨；</li><li>升档降档凭感觉——没有预先写死的触发条件，调仓变成情绪化操作；</li><li>评分一年不复查——竞品进入、汇率变化后，旧排序还在指挥新预算。</li></ul>",
q:{q:"东南亚 CPM 是欧洲的 1/3，但你们 80% 的成交客户在欧洲。预算该怎么倾斜？说明决策逻辑。",a:"按「有效获客成本与边际利润」分配，不按 CPM 分配。逻辑链：CPM 便宜只是上游指标——东南亚的价格敏感与内卷会吃掉转化率与客单价，算到「每单位毛利的获客成本」，欧洲大概率更优。分配：欧洲主攻档 ~60%（全漏斗：认证+案例+售后主张）；东南亚观察档 ~30%（再营销＋一个细分切口小预算测）；其余留机动。同时定好升档触发条件（东南亚细分市场 CPL 达标且 Qualified 率可观→加仓）。原理：市场选择用六维评分与边际利润说话，CPM 只是六个维度之一（对应本模块案例）。"},
b:"完成一份 ≥5 市场的六维评分表，给出三档预算分配与预先写死的升/降档触发条件；能用「有效获客成本」解释为什么不选 CPM 最低的市场。"},
{id:"L1-08",lv:1,t:"从市场研究到投放计划的映射",
g:"把 ICP、阻力假设、市场分层翻译成账户结构、受众与首批素材清单——投放计划是研究的「编译输出」，结构先行让后续数据天然可归因。",
c:"<p><b>本模块是 Level 1 的总装车间。</b>前面所有研究（ICP/委员会/阻力/竞品/主张/假设库/市场分层）最终都要回答一个问题：<b>周一早上打开 Ads Manager，具体建什么？</b>映射关系如下：</p><ul><li><b>市场分层 → Campaign 分区</b>：主攻/观察档各一个 Campaign（或按语言分），让每档预算独立核算、数据不互相污染；</li><li><b>角色×阻力 → 素材矩阵</b>：首批素材从假设库按优先级提取，每条绑定一个假设编号；</li><li><b>ICP → 受众约束</b>：Broad 的硬边界（国家/语言/年龄），其余交给模型（L0-05 的 Broad 逻辑）；</li><li><b>预算 → 测试容量</b>：预算决定能同时验证几个假设（下详）。</li></ul><p><b>「结构先行」为什么重要：</b>结构是数据的容器——Campaign 按市场分，数据就能按市场归因；Ad 按假设编号命名，测试结果就能回填到库。<b>结构混乱的账户，跑三个月后数据变成一团浆糊，谁也说不清哪个结论可信。</b>诊断成本（L6）会成倍增加。</p><p><b>测试容量倒推（关键算术）：</b>首月预算 $3000、目标 CPL $30 → 约 100 个询盘。若每个测试组需要跑出统计上可判断的量（约 15–20 个询盘/组），最多同时养 4–5 个测试组。每组 3–4 条素材（L0-08 的样本量纪律）→ 首批可测 3–4 个高优先级假设 × 每组内 3–4 条素材变体。<b>预算不是「能花多少」，是「能验证多少」。</b></p>",
m:"<p><b>映射的自查清单（开投前逐条过）：</b></p><ul><li>每个 Campaign 都能对应到一个市场档位与业务目标吗？（对不上=结构冗余）</li><li>每个 Ad Set 的受众假设是什么？写进命名了吗？（命名即文档）</li><li>每条 Ad 能追溯到假设库编号吗？（Ad 名＝L1-06 假设编号＋变体号）</li><li>优化事件三连（Objective/Location/Event）各 Campaign 检查过吗？（L0-02）</li><li>像素/CAPI 事件测试通过了吗？（L0-03/04）</li><li>每个高优先级假设都有测试位吗？排不下的进下月队列了吗？</li></ul><p><b>与论坛 0-1 复盘的对照：</b>论坛新手帖的完整起步链路——新户先小预算验证像素与技术链路（对应本模块自查后两项）→ 小额组测品（结构）→ 出单组翻倍（节奏，衔接 L7）——每一步都对应一个明确的验证目标。研究的严谨程度，决定账户的上限。</p>",
h:"<p><b>输出物与执行顺序：</b></p><ul><li>① 一张映射表：市场档位→Campaign→Ad Set（受众假设+命名）→Ad（假设编号+素材）；</li><li>② 预算分配表：按 L1-07 三档 + 各 Campaign 日预算（含测试容量算术）；</li><li>③ 首批素材清单：从假设库 Top 假设提取，每组 3–4 条、覆盖不同 Angle；</li><li>④ 技术自查：事件三连、像素/CAPI 测试、域名验证（L0-01）；</li><li>⑤ 开投后第一周只观察不干预（L0-05 静默期纪律），第二周起按数据回填假设库。</li></ul>",
cs:"某工业设备开投计划：Campaign-EU（Lead 优化，Broad＋英语，日预算 $100）下 3 个测试组分别测「认证/案例/土建成本」三个 Angle（各绑 3 条素材）；Campaign-SEA（再营销为主，日预算 $30）。Ad 命名「L2-01-售后Angle-视频v1」直接可追溯假设库。第一个月结束：EU 的售后 Angle 组 Qualified 率最高 → 第二月预算向其倾斜，土建 Angle 组素材换血重测——每一步决策都有数据出处。",
f:"论坛 0-1 实战复盘帖（$1800 花 36 单）的起步链路与本模块完全同构：先小预算验证技术链路、再小额测品、出单才加码——每一步对应一个验证目标；跑法帖里的 ASC 1-1-N 结构（1 系列组内 8 条以上素材）则是「素材假设优先」的结构表达——结构服务于测试，而不是测试迁就结构。",
e:"<ul><li>先建账户再想策略——结构与研究脱节，数据无法归因；</li><li>首批素材全测同一 Angle——表面测了 10 条，实际只验证了 1 个假设；</li><li>无视测试容量硬塞假设——每组样本不足，谁都测不出来（L0-08）；</li><li>Ad 命名随意——三个月后没人知道哪条素材对应哪个假设；</li><li>映射表做完从不回改——研究文档与实际账户渐行渐远，等于白做。</li></ul>",
q:{q:"假设库里有 8 条高优先级假设，首月预算 $3000、预期 CPL $30。怎么映射成首批测试结构？写出算术。",a:"算术：$3000÷$30≈100 个询盘；每个测试组需约 15–20 个询盘才能做判断 → 最多同时养 4–5 个测试组。结构：选优先级 Top 3–4 假设，各建一个 Ad Set（同受众下不同 Angle，或按假设分受众），每组 3–4 条素材变体（1-1-3/1-1-4 结构，样本量纪律见 L0-08）；剩余假设排下月队列。命名与追溯：Ad 名绑定假设编号，测试结果 48 小时内回填假设库。原则：每条素材可追溯到一个假设，预算容量决定测试广度，宁可少测几个但每个都测透。"},
b:"交出一张完整映射表（市场档位→Campaign→Ad Set→Ad→假设编号），附测试容量算术与技术自查清单；能说出「结构是数据的容器」的理由。"}
];
MODULES.push(...M0,...M1);

MODULES.push(
{id:"L2-01",lv:2,t:"Campaign / Ad Set / Ad 职责边界",
g:"明确三层各自管什么、不能管什么，杜绝「在错误的层做决策」。",
c:"<p><b>把 Meta 广告想象成一家餐厅。</b>Campaign（广告系列）是这家餐厅的定位与钱袋子——它决定「我们做哪类生意、总共准备花多少钱」；Ad Set（广告组）是后厨的一个个灶台分区——每个灶台管「服务哪类客人（受众）、用什么灶（版位）、按什么标准出菜（优化事件）、每天备多少料（预算）」；Ad（广告）是端上桌的一道道具体菜品（素材＋文案），它们在同一灶台里争夺被端出去的机会。</p><p><b>三层各自的「权力清单」（官方术语）：</b></p><ul><li><b>Campaign 层</b>：管商业目标（Objective，见 L0-02 目标三连）、预算池模式（ABO 组预算 or CBO/Advantage+ 系列预算）、以及转化位置。它不负责「找谁」，只负责「我要什么结果、钱放哪一层管」。</li><li><b>Ad Set 层</b>：管受众（Audience）、版位（Placements）、优化事件（Optimization Event，见 L0-02）与出价、以及组级预算。最关键——<b>Ad Set 是 Meta 模型的「学习单元」</b>：模型是以「这一组」为单位去积累转化样本、学出「该找什么人」的（见 L0-05 学习期）。</li><li><b>Ad 层</b>：管素材与文案，是同一组内部争夺展示机会的「参赛者」。</li></ul><p><b>行业最大误区：</b>很多新手以为「想改什么就点开改」，结果在 Ad 层调预算、在 Campaign 层调素材。每一层改动的「冲击波」完全不同——在错误层做决策，要么根本不生效，要么触发模型重学习、白烧钱。记住一句话：<b>层选错，努力全废。</b></p>",
m:"<p><b>为什么「在哪层改」会决定模型死活？机制链：</b></p><ul><li>① 模型学习的对象是「素材 × 受众 × 出价 × 优化目标」这个组合的数据分布，而组合落在 Ad Set 层（见 L0-05 分布漂移）。</li><li>② 改 Ad Set 层（受众/事件/预算）＝直接动了模型正在学的「数据分布」→ 分布一变，模型要重新探索 → <b>触发重学习（学习期重置）</b>。</li><li>③ 改/新增 Ad 层＝「给同一个灶台补一道新菜去参赛」，不重置组级学习；系统只是多了个展示候选，原有组的学习基础保留。</li></ul><p><b>数字演算：</b>一个 Ad Set 周内拿到 50 个 Lead 刚退出学习期（见 L0-05 每周 50 事件）。此时你去改这一组的受众（从 Broad 缩到兴趣），分布变了，模型回到「第 0 天」——接下来 7 天它要重新凑 50 个事件，其间 CPL 波动、产出中断。若你只是换掉一条素材，则组级 50 事件样本不动，新素材在原有学习基础上慢慢竞争展示。这就是「同样的改动，落错层代价差几倍」。</p>",
h:"<p><b>决策落层口诀（贴墙版）：</b></p><ul><li>① 改「想要什么结果/目标」→ <b>Campaign 层</b>：Objective、Conversion Location、系列预算模式。</li><li>② 改「找谁/花多少/在哪投」→ <b>Ad Set 层</b>：受众、版位、优化事件、出价、组预算。</li><li>③ 改「说什么话/什么画面」→ <b>Ad 层</b>：素材、文案、视频。</li></ul><p><b>结构纪律清单：</b></p><ul><li>每组保持 <b>1–5 条广告</b>，避免碎片化和素材互相分流（详见 L2-04）；</li><li>新素材想测，用「复制新组」而不是直接在原组大面积换，保留原组模型资产（见 L0-05）；</li><li>命名强制带上层信息，如 EU-SCALE-W12-DE-Broad，让任何人都看得懂「这个东西在第几层、干嘛的」（见 L2-02）。</li></ul>",
cs:"某工业设备（B2B 工业设备，客单 $3000+）欧洲账户结构：Campaign＝EU-Leads（目标 Leads、系列预算 CBO）；Ad Set＝EU-Broad-EN（受众 Broad 英文区、优化事件 Lead、组预算 $120/天）；Ad 层挂三条素材同台竞技——A 打「行业认证资质」、B 打「污水处理厂土建成本对比」、C 打「已交付项目案例」。三道菜在同一灶台比武，两周内系统自然把 70% 展示给了 C（案例类转化最稳），A/B 作为补充保留。结构清晰，任何一次「想改素材」都落在 Ad 层，从不动到 Ad Set 层，模型始终稳定。",
f:"<p>论坛黑话体系与三层结构完全对应，记法就是「系列-组-广告」三个数字，如 111 / 11N / 121 / 1NN：</p><ul><li><b>111</b>＝1 系列 1 组 1 广告，测出 winner 后的猛攻结构；</li><li><b>11N（1-1-N）</b>＝1 系列 1 组 N 广告，塞素材测素材，社区共识 ASC 下 N 至少大于 8（「仙女座算法极度吃素材」）；</li><li><b>1N1（1-N-1）</b>＝1 系列 N 组 1 广告，同素材多组测受众；</li><li><b>121 / 131</b>＝1 系列 2/3 组 1 广告，社区反馈 131 比 111 更稳（多组对冲单组翻车）。</li></ul><p>这些数字本质就是「在正确的层放正确的变量」：测素材动 Ad 层（1-1-N），测受众动 Ad Set 层（1-N-1），猛攻动预算（1-1-1 加预算）。社区老手用数字把层职责说透了。</p>",
e:"<ul><li>在 Ad 层试图「控预算」——预算是 Ad Set/Campaign 层的权力，Ad 层改预算要么不生效要么被系统忽略，根因是混淆了三层职责边界；</li><li>一组塞 20 条相似素材——信号碎片化，每条都凑不齐学习样本，根因是误以为「素材越多越安全」（见 L2-04）；</li><li>为「好看」把命名搞成 ABC001/测试2，复盘时无法归因哪组对应哪个市场，根因是结构服务于人而非服务于系统；</li><li>改素材时直接在原组替换，原组学习积累作废，根因是不知道 Ad Set 才是学习单元；</li><li>把 Campaign 目标从 Leads 切到 Traffic 想「先拉量」，模型找人逻辑全变，根因是不懂目标三连的杠杆（见 L0-02）。</li></ul>",
q:{q:"想测试「同一素材在德/法两国的表现差异」，应该动哪一层？为什么？",a:"动 Ad Set 层，用 1-N-1 结构（1 系列、N 组、同素材），每组一个国家：建 DE 组与 FR 组，里面放同一条素材。理由：国家/地域属于受众维度，是 Ad Set 层的职责（组层管受众与地域）；这样两国各自积累独立的学习样本，互不污染，且模型对每组都能学出「该国谁会转化」。若错误地放在 Campaign 层（只能一个受众）或 Ad 层（素材层管不了地域），要么测不出来要么污染数据。社区 1-N-1 测受众共识即是此逻辑——素材不变、只换组，干净的国别对比。"},
b:"能对任意一个「我想改 X」的念头（预算/受众/素材/目标/版位/出价），30 秒内说出应该动哪一层及原因；能默画三层职责图；能解释「为什么改素材不重置学习、改受众会重置学习」。"},
{id:"L2-02",lv:2,t:"账户分区设计：Testing / Scaling / Evergreen / Retargeting",
g:"设计「测、放、守、收」四分区账户，让每个区预算职责单一、数据互不污染。",
c:"<p><b>账户分区的本质，是给预算定「岗位职责」。</b>一个账户如果所有广告混在一起，测试新想法的噪音会污染放量模型的判断，再营销的高转化会虚抬整体数据，最终你不知道「哪笔钱花出了什么结果」。分区就是把账户切成几个职责单一、数据互不串味的「格子」。</p><p><b>四分区标准职能（官方对应）：</b></p><ul><li><b>Testing（测试区）</b>：专跑未验证假设/新素材，小额、敢死。多用 Ad Set Budget（ABO）把预算锁死在组层，避免被 CBO 抽走（见 L2-07/09）。</li><li><b>Scaling（放量区）</b>：已验证组合的放大区，多用 CBO / Advantage+ Sales（ASC）让系统集中分配预算（见 L2-09）。</li><li><b>Evergreen（常青区）</b>：稳定长跑的主力组合，半永久保留、只做微调。</li><li><b>Retargeting（再营销区）</b>：收割网站访客、互动人群、询盘未成交名单，天然高转化。</li></ul><p><b>误区纠正：</b>新手常以为「分区是为了好看」。错。分区是为了<b>隔离学习环境</b>——让每个区的模型只学自己该学的信号，不让测试区的废数据拖垮放量区，也不让再营销区的低成本幻觉误导你对拉新效率的判断。</p>",
m:"<p><b>机制链：</b></p><ul><li>① 模型以 Ad Set 为学习单元（见 L0-05），分区＝把不同「学习目的」的组放进不同 Campaign，互不抢样本；</li><li>② Testing 区噪音大（新素材/新受众常被系统判为低效），若和 Scaling 区混在同一 CBO，预算会被系统抽去喂老组合，新方法永远没机会学出来；</li><li>③ Retargeting 区转化率高（访客已认识你），若和拉新区混投，整体 CPL 被拉低「看起来很美」，但那是收割存量、不是拉新效率——会让你误判 Prospect 的真实成本（见 L0-08 边际）。</li></ul><p><b>数字例子：</b>账户周预算 $2000。Retargeting 区用 $200 撬出 30 个 Lead（CPL $6.7），拉新区用 $1800 出 40 个 Lead（CPL $45）。若混在一起报表显示 CPL $26——既掩盖了拉新的真实成本，也让放量决策建立在假象上。分区后你能清楚看到：拉新 CPL $45、收割 CPL $6.7，分别优化。</p>",
h:"<p><b>四分区落地清单：</b></p><ul><li>① 命名规范：[市场]-[分区]-[假设编号]，如 EU-TEST-A03、EU-SCALE-W12、EU-EVER-G01、EU-RT-30D；</li><li>② 每区<b>独立 Campaign</b>，绝不混投；</li><li>③ 预算占比参考 <b>测:放:收 = 3:5:2</b>（B2B 可 3:5:2 或 4:4:2，视你储备的新假设多少）；</li><li>④ Testing 区用 ABO 锁组预算，单组 $30–80/天（见 L2-05 最低门槛）；</li><li>⑤ Scaling 区准入标准：测试区组合连续 2 周 Qualified CPL 达标才移入；</li><li>⑥ Retargeting 区人群：网站 30 天内访客＋互动人群＋询盘未成交名单（CRM 导出）。</li></ul>",
cs:"某工业设备账户四分区实例：TEST 区每周进 3–4 条新素材（单组 $50/天，1-1-3 结构）；SCALE 区只收「测试区连续 2 周 Qualified CPL 达标」的组合，当前承载 60% 预算；EVER 区保留 2 条长跑赢家（案例类素材，已稳定 4 个月）；RT 区只跑 30 天内网站访客＋询盘未成交名单，用即时表单收尾。半年复盘：拉新区真实 CPL $42 与收割区 $9 分离清楚，团队不再被混合 CPL 误导。",
f:"<p>论坛品牌站复盘即此结构的雏形：流量广告（链接点击 $10–20 起步）与转化广告（ASC/兴趣/再营销）分区，再加合创广告；也有老手把账户拆成「兴趣/Lookalike/再营销/通投」四组、同版位运行——这是「受众维度」的分区版，思路和你按「职能」分区一致。社区共识是「分区让数据不打架」，无论是按职能还是按受众，核心都是隔离学习环境。</p>",
e:"<ul><li>测试与放量混在同一个 Campaign（用 CBO）——预算被系统抽去喂老组合，新假设永远学不出来，根因是不懂 CBO 的预算再分配逻辑（见 L2-09）；</li><li>再营销和拉新混投——整体 CPL 虚低，误判拉新效率，根因是把收割存量当成了拉新成绩；</li><li>分区名随意（TEST1/新2）——复盘对不上号，根因是结构不服务于人；</li><li>测试区预算占比过高（>50%）——没东西可放时还在烧测试钱，根因是没按「储备假设数」定比例；</li><li>Evergreen 区长期不更新素材——素材疲劳后悄悄掉量（见 L0-08 频次），根因是忘了常青也要换血。</li></ul>",
q:{q:"你的 CBO Scaling 区里新加入一条测试素材，一周后老组合预算全被它抢走且都是差量。哪里设计错了？怎么改？",a:"错在分区：未验证的素材不该进 Scaling 区的 CBO 池。CBO 的逻辑是把系列预算动态分配给「系统当下认为最便宜的流量」，新素材带着低历史成本会被优先喂预算，但它实际转化差——于是预算被吸进坑里（见 L2-09 CBO 机制）。正确做法：测试素材放回 Testing 区用 ABO 隔离验证（组预算锁死、不污染放量池），达标后再按准入标准移入 Scaling 区。分区原则就是「没验证的不进放量池」。"},
b:"画出你的四分区结构图，标注每区的预算占比、优化目标与准入标准；能说出「为什么测试和放量不能混在同一 CBO」。"},
{id:"L2-03",lv:2,t:"什么时候拆、什么时候合并",
g:"掌握账户结构的「碎片化 vs 集中」决策框架，避免为控制感过度拆分。",
c:"<p><b>拆与合，是账户架构里最容易被「控制感」带偏的决策。</b>很多投手喜欢把账户拆得细碎，觉得「每个国家一个组、每类人群一个组」才叫「精准控制」。但在模型学习范式下，拆得越细＝每个组的学习样本越少＝模型越学不动（直接承接 L0-08 数据碎片化）。合并则相反：样本集中、模型更强，但失去了对细分市场的独立观察与预算隔离。</p><p><b>官方术语：</b>这叫「Fragmentation（碎片化）vs Consolidation（集中）」的权衡。Meta 2026 年官方明确推荐 Broad（宽泛定向）＋集中结构，正是因为这套权衡。</p><p><b>拆分的正当理由（才该拆）：</b></p><ul><li>市场/语言不同——模型需要分开学（如德语区 vs 法语区，语义与转化行为不同）；</li><li>预算需要物理隔离——测试 vs 放量、代理户 vs 企业户；</li><li>优化事件不同——Lead vs Purchase 不能在同一组；</li><li>受众互斥且商业逻辑不同——B2B 大客户 vs 小批发。</li></ul><p><b>合并的正当理由（该合）：</b></p><ul><li>样本不足——小市场各自凑不到 50 事件/周（见 L0-05）；</li><li>受众高度重叠——拆开只是自己抢自己；</li><li>管理成本爆炸——20 个组人盯不过来。</li></ul>",
m:"<p><b>机制链：</b></p><ul><li>① 每多一个 Ad Set＝多一份「每周 50 事件」的学习任务（见 L0-05）；</li><li>② 5 个组＝5 份学习任务，预算被稀释后每个组都远够不着 50 事件/周，5 个模型全部长期滞留学习期；</li><li>③ 合并后信号集中到一个组，模型吃满样本、快速收敛，找人更准（见 L0-08 大样本让模型学得快）。</li></ul><p><b>数字演算：</b>总预算 $750/周。拆成 5 个组每组 $150，按 CPL $50 算每组每周只 3 个 Lead——离 50 事件差 16 倍，永远学不出。合并成 1 个组 $750，每周 15 个 Lead，虽仍不够 50 但比拆开强 5 倍、且样本集中模型能收敛一部分。若进一步合并预算到 $1500/组、2 组，则每组 30 事件/周，逼近学习门槛。</p>",
h:"<p><b>拆/合决策清单（每次想拆前先问）：</b></p><ul><li>① 这个组的数据分布真的和别的组不同吗？（语言/行为/事件不同才拆）；</li><li>② 拆出来后，它的预算够独立学习吗？（至少能凑到接近 50 事件/周，见 L2-05 最低门槛）；</li><li>③ 答不上来这两条——别拆，先合并跑出数据；</li><li>④ 多国市场：先合并 Broad（仅按语言分组），跑出数据后再按边际表现拆（哪个国家 Deal Cost 最优就给谁独立组）；</li><li>⑤ 合并前确认受众不高度重叠，否则只是内耗。</li></ul>",
cs:"某工业设备欧洲 6 国：第一阶段不拆，合并为「EU-EN Broad」一组（模型集中学习，组预算 $600/天），跑一个月积累样本；第二个月看 Breakdown，德国边际 Deal Cost 最优、法国次之，才拆出 DE 独立组加预算到 $300/天、FR 组 $200/天，其余 4 国仍合并在区域组用 Breakdown 看国别数据。拆合都基于数据分布，而非「每个国家必须独立」的执念。",
f:"<p>论坛血泪版：「111 感觉不如 131 稳定」——同结构多组对冲单组翻车，说明适度保留多组有稳的作用，但不是无限拆。社区反复提醒「一刀流 1-100-1」的极端碎片化（100 个组）正是 2026 年 6 月风控后大面积崩盘的结构原因之一——组太多样本太碎，模型学崩。课程原文也强调：强行合并各国家数据差异大也会增加学习难度。结论：拆合都要看数据分布，没有「越细越好」这回事。</p>",
e:"<ul><li>「细分越多越精准」的老派执念——2026 Andromeda（仙女座）时代这是方向性错误，根因是还停留在「人工找人」思维，不懂模型吃样本（见 L0-08）；</li><li>一个市场一个组的机械均分——小市场组永远学不出，根因是忽略 50 事件/周门槛；</li><li>把测试组和放量组塞进同一 CBO——预算互抽，根因是不懂分区（见 L2-02）；</li><li>只看结构「干净」不看学习成本——为好看拆 20 组，根因是控制感战胜了有效性；</li><li>合并时不看受众重叠——合并后才发现两组合计自己抢自己，根因是没先查重叠率。</li></ul>",
q:{q:"老板要求「每个国家单独一个组，方便看数据」。请给这个要求的专业反驳与折中方案。",a:"反驳两点：① 组数 × 50 事件/周的学习需求会稀释每组的样本——小市场（如荷兰日预算 $30）永远凑不到学习门槛，模型学不出来反而更不准；② Broad 时代定向收益变小，拆分换来的「可控感」远抵不上「学不动」的损失（见 L0-08 碎片化）。折中方案：主市场（数据已验证、预算够）独立组；小市场合并进区域组（如 EU-Other），用 Breakdown 按国家看数据——既能定位国别表现，又不牺牲学习样本。要数据 ≠ 要独立组，Breakdown 就是为此存在的。"},
b:"对你的真实账户做一次「拆/合审计」，列出应合并的组与理由、应保留独立的组与理由；能引用 50 事件/周门槛论证。"},
{id:"L2-04",lv:2,t:"广告碎片化与信号碎片化",
g:"理解「广告太多」如何在组内稀释信号，学会控制组内广告数量与差异度。",
c:"<p><b>碎片化有两个层面：广告碎片化（Ad Fragmentation）和信号碎片化（Signal Fragmentation）。</b>很多人只盯「组太多」，却忽略了「组内的广告太多」同样致命。</p><p><b>广告碎片化：</b>同一目标下广告/组数量过多，每条分到的展示与转化样本过少，模型对每条的判断都建立在噪声上——你以为在测 15 条，其实 15 条都没测明白。</p><p><b>信号碎片化：</b>更隐蔽。相似的素材在同一组里互相分流（系统把展示在它们之间均摊），谁也凑不齐学习样本，结果「每条都半死」。这和数据碎片化（L0-08）是同一类病，只是发生在组内。</p><p><b>误区纠正：</b>「素材越多越安全」是错的。10 条相似素材 ≠ 10 次独立测试，而是 10 份随机波动互相干扰。真正有用的是<b>差异化假设</b>（不同 Angle/角度），不是同一角度的 15 个变体。</p>",
m:"<p><b>机制链：</b></p><ul><li>① 组内广告是「同台竞价」关系：系统在同一组里把展示份额分给它认为会转化的素材；</li><li>② 10 条相似素材＝10 份随机波动，没有任何一条能快速积累到「统计显著」的样本；</li><li>③ 3 条差异化素材＝3 份可比较的假设检验，系统能较快判断谁优；</li><li>④ 系统最终会偏向个别素材，但「偏向」需要足够样本才可信——样本不足时的偏向是噪声（见 L0-05 学习期）。</li></ul><p><b>数字演算：</b>组预算 $90/天、CPL $30，每周约 21 个 Lead。塞 10 条素材→每条均分约 2 个 Lead/周，永远测不出胜负；塞 3 条差异化素材→每条约 7 个 Lead/周，4 周累计 28 个，足以判断 Angle 优劣。关键的不是「数量」是「每条能分到多少样本」。</p>",
h:"<p><b>组内广告管控清单：</b></p><ul><li>① 测试组 <b>3–4 条</b>广告（用 1-1-3 / 1-1-4 结构）；论坛经验 1-1-5 会让个别素材第一天不花钱被误杀，所以别超过 5；</li><li>② ASC/放量组可放 <b>8–10 条差异化素材</b>（大预算下有效，社区称「素材格拉满」）；</li><li>③ 素材间必须 <b>Angle 不同</b>（打动人的理由不同），不是「图片换背景」的同质变体；</li><li>④ 冷启动 48 小时内不关「零消耗」素材（见 L0-05 静默期），先确认是否 Angle 重复导致分流；</li><li>⑤ 每周用疲劳指标（Frequency>2.5、CTR 从 3% 掉到 <1%）判断换血（见 L0-08）。</li></ul>",
cs:"某工业设备测试组对比：A 方案塞 5 张「产品图换背景」——信息同质，三周没分出胜负，每条都半死；B 方案 3 条素材分别打「土建成本节省 / 售后 24h 响应 / 已交付项目案例」三个 Angle，跑一周系统就把 65% 展示给了「案例」那条，且 Qualified 率最高。B 方案信息量大得多、学得也快——证明差异化 Angle 才是有效测试。",
f:"<p>论坛「养蛊」框架就是组内碎片化的正面解法：1-1-3 / 1-1-4 同台竞价→优中选优→拉出赢家单开新系列集中冲量。社区另强调 ASC 素材要格拉满（视频 10 个＋1 文案）且大预算下有效——但两组经验都强调「量大但必须差异化」。反面教训：1-1-5 时个别素材第一天不花钱会被误忽略、误杀。核心共识——碎片化的敌人不是「多」，是「多且同质」。</p>",
e:"<ul><li>把 1-1-1 当万能结构——测素材阶段反而饿死信号（一条素材没有同台竞争，学不出优劣），根因是不懂同台竞价的价值；</li><li>素材数量堆上去但 Angle 全同——10 张图一个卖点，信号碎片化，根因是混淆「数量」与「差异化假设」；</li><li>看到某条广告「没花钱」第一天就关——样本不足的误杀，根因是没过静默期（见 L0-05）；</li><li>一组塞 15 条素材——每条都构不成统计显著，根因是忽视「每条能分到的样本量」；</li><li>用 CTR 选赢家——CTR 高的素材可能询盘率最低（见 L0-08），根因是只看过程指标不看结果指标。</li></ul>",
q:{q:"测试组 1-1-5 里两条素材 48 小时零消耗。直接关掉吗？为什么？",a:"先别关。组内同台竞价下冷启动分配不均是常态——系统刚开始不知道每条素材该给多少量，会出现「有的先花钱有的后花钱」。先确认这两者与另外三条 Angle 是否重复：若重复，零消耗是预期内的分流（流量被差异化的素材吸走）；若 Angle 独特，再给 24 小时观察。仍零量且组预算充足、其他三条已学得差不多时，才处理这条。论坛教训明确：1-1-5 个别素材第一天不花钱是常被误忽略/误杀的信号，样本不足时关掉会丢掉潜在赢家（见 L0-05 静默期）。"},
b:"审计你组内广告数与 Angle 差异度，给出调整清单（哪些合并/哪些删/哪些补 Angle）；能解释「为什么 5 张同图不如 3 个不同 Angle」。"},
{id:"L2-05",lv:2,t:"预算碎片化与 Budget Pacing",
g:"诊断「预算撒胡椒面」问题，建立预算节奏（Pacing）管理意识。",
c:"<p><b>预算碎片化（Budget Fragmentation）是「拆组过细」在钱上的表现：</b>预算摊到过多组，每组都低于「能产生学习事件」的阈值，于是全面空耗、全面学不动。它和广告碎片化（L2-04）、数据碎片化（L0-08）是同一家族——本质都是「样本被稀释」。</p><p><b>Pacing（预算节奏）是另一回事：</b>预算在一天内/一个月内的消耗节奏。花太快（早停、错过高峰）与花不动（learning limited 系统找不到够量的展示）都是病。Pacing 管的是「钱怎么均匀地、在对的时间花出去」。</p><p><b>误区纠正：</b>「每个国家都给一点试试」看似公平，实则是把每个组都推到学习门槛以下。预算只有「集中到能学习」才产生价值，撒胡椒面不产生价值。</p>",
m:"<p><b>机制链：</b></p><ul><li>① 组级预算有隐形门槛：要支撑「每周 50 事件」的样本需求，预算 × CPL × Qualified 率可以倒算出来（见 L0-05）；</li><li>② 低于门槛的组＝纯学费，模型永远停留学习期，转化不稳定；</li><li>③ 预算集中到少数组＝每组都能吃满样本、快速收敛（见 L0-08）；</li><li>④ Pacing 失控：日内花太快→转点前花光空耗；月度花太猛→测试预算被放量区挤占、断供。</li></ul><p><b>数字演算：</b>目标周事件 50、CPL $50、Qualified 率 40%。最低周预算＝50×50÷0.4＝$6250/周÷7≈$893/天，再留 20% 波动余量≈$1116/天。低于这数的组学不动——这就是门槛。</p>",
h:"<p><b>预算纪律清单：</b></p><ul><li>① 算最低组预算：目标周事件数 × 目标 CPL ÷ Qualified 率（余量系数 0.8，即 ÷0.8）；</li><li>② 砍掉低于门槛的组，预算集中到少数组；</li><li>③ 日内 Pacing：避免转点（午夜凌晨）前花完——那段时间高峰人群不在，花光＝空耗（见 L0-05 转点纪律）；</li><li>④ 月度 Pacing：测试预算固定比例（如总预算 30%），用规则锁定不被放量区挤占；</li><li>⑤ 加预算每次 ≤20%、间隔 ≥24 小时（见 L0-05）。</li></ul>",
cs:"某工业设备曾把 $150/天分到 6 个组（每组 $25）。CPL $60 的市场下每组每周只 2–3 个 Lead，永远学不出学习期。审计后砍到 2 个组、每组 $75/天，三周后双双过学习期，CPL 从 $68 降到 $41。省下的不是钱是「学习时间」——集中预算＝买到了学习速度。",
f:"<p>论坛量化经验与课程逻辑吻合：客单 $50–70 起手 $30–50/组；新手 $20/天起步；游戏类单系列 $200 起跑否则「低预算极易暴毙」。不同客单的「最低预算门槛」不同，但底层逻辑相同——预算必须够到学习门槛。社区也强调严禁在转点前后大幅加预算，否则机器空耗、学崩，与课程 Pacing 纪律一致。</p>",
e:"<ul><li>「每个国家都给 $10 试试」——低于一切门槛，纯学费，根因是不懂组级预算隐形门槛；</li><li>预算到半夜才花完却不管——错过高峰时段、空耗，根因是不看日内 Pacing；</li><li>放量区吃掉全部预算导致测试断供——没锁测试比例，根因是月度 Pacing 缺失；</li><li>翻倍加预算想快速起量——触发分布漂移、CPL 飙升（见 L0-05），根因是不懂加预算也是重大修改；</li><li>用「系列预算 CBO」却每组塞极小预算——CBO 会抽预算喂老组，新组更学不动，根因是不懂 CBO 再分配。</li></ul>",
q:{q:"市场 CPL≈$80，每周想要 ≥40 个 Lead 学习。单个 Ad Set 最低日预算多少？（假设 Qualified 率 50%）",a:"倒算：周事件 40 × CPL $80 ＝ $3200/周（按 Lead 口径，Qualified 率用于验收不参与学习门槛，学习事件按 Lead 计）；÷7≈$457/天；÷余量系数 0.8≈$571/天。所以单个 Ad Set 最低日预算约 $571。若预算不够：要么减少组数集中预算、要么接受更慢的学习、要么降低优化事件深度（先优化更浅的事件凑样本，见 L5 章）。关键——低于门槛的组是纯学费，花再多也学不动。"},
b:"算出你每个在投组的最低预算门槛（套用 ÷0.8 公式），并标出低于门槛的组；能解释「为什么撒胡椒面学不动」。"},
{id:"L2-06",lv:2,t:"投放前技术检查清单",
g:"建立开投前的硬性检查清单，把「技术性白花钱」拦在点火之前。",
c:"<p><b>开投前检查清单，是「把技术性白花钱拦在点火之前」的防火墙。</b>很多账户「数据从第一天就错了」——像素配错、CAPI 漏发、落地页手机端打不开——而模型已经基于错误数据学了两周，想纠都纠不回来。检查清单的本质：<b>在花钱之前确认「数据链路是通的」。</b></p><p><b>四大检查域（官方对应）：</b></p><ul><li><b>资产域</b>：个人号健康、BM 权限、主页状态、支付方式——任何一项挂了，广告根本发不出去或随时被限（见 L0-01 资产体系、L2-12）；</li><li><b>数据域</b>：Pixel 触发、CAPI 事件、event_id 去重、EMQ 匹配质量、域名验证、EMS 事件配置优先级（见 L0-03/04）；</li><li><b>政策域</b>：落地页合规、素材版权、年龄/地区红线（全球 18、泰国 20、印尼 21）；</li><li><b>追踪闭环</b>：真实转化一次全链路（提交表单→Pixel＋CAPI 双收→CRM 收到）。</li></ul><p><b>误区纠正：</b>「先投起来再说」是最贵的四个字。数据坏了不是「少赚」，是「模型学歪且找不到原因」——因为错误数据看起来也像数据。</p>",
m:"<p><b>机制链：</b></p><ul><li>① 模型学的是你回传的 Signal（见 L0-03），信号错了→模型学错人；</li><li>② 落地页被举报时 FB 可能不弹窗、直接隐性扣费（论坛高频事故 1346003），你看报表正常但其实在烧；</li><li>③ 像素配了但 CAPI 漏发＝数据半聋，模型只收到一半信号，学得慢且偏；</li><li>④ 大多数报错与隐性消耗，源头都在开投前没检查——检查清单就是把这些前置可防的事故挡在点火前。</li></ul><p><b>数字例子：</b>落地页手机端加载 5 秒（超标），100 次点击只有 40 次到达（LPV 率 40%），而电脑端 90%。你以为 CTR 正常、CPL 贵，实际是落地页在漏人——First Loss 在 LPV 层（见 L0-08），但如果不检查根本发现不了。</p>",
h:"<p><b>开投前 15 分钟清单（逐条打勾）：</b></p><ul><li>① 个人号能登录、无受限提示；</li><li>② 主页发布状态正常、未被取消发布（报错 1815014）；</li><li>③ 像素测试事件收到（Events Manager 实时看）；</li><li>④ CAPI 收到且 event_id 与 Pixel 一致（去重成功，见 L0-03）；</li><li>⑤ 域名验证通过（BM 内）；</li><li>⑥ 落地页手机端加载 <3 秒（PageSpeed Insights 测）；</li><li>⑦ 年龄/地区合规（18/泰国 20/印尼 21 红线，报错 1870165）；</li><li>⑧ 用测试转化跑一次全链路闭环。</li></ul>",
cs:"某工业设备新市场（波兰）开投前用清单拦下事故：Pixel 的 Lead 事件配置了，但 CAPI 漏发（服务器回传代码没接）。若无检查，第一周数据会「半聋」——模型只收到浏览器侧一半信号，学歪还找不到原因，等发现时已浪费 $800 学费。清单第④步当场抓出，补上 CAPI 后重跑，模型正常收敛。",
f:"<p>论坛「错误代码大全」（143 回复）就是社区版检查清单，高频事故全部前置可防：预算过低（1885272/1885650）、主页被取消发布（1815014）、像素无转化事件（1487658）、年龄红线（1870165）、落地页被举报隐性消耗（1346003）。社区反复强调「新户先养像素、转化事件不配好别开投」——与课程「数据链路通了才点火」完全一致。另一个频繁坑：落地页被举报时不弹窗只扣费，必须每天排查。</p>",
e:"<ul><li>「先投起来再说」——数据从第一天就错，根因是不懂模型基于 Signal 学习（见 L0-03）；</li><li>只测 Pixel 不测 CAPI——数据半聋，根因是忘了双通道互补（见 L0-04）；</li><li>落地页只在电脑上检查过——手机端崩了漏人，根因是不看移动端 LPV（见 L0-08 First Loss）；</li><li>不验证 event_id 去重——转化虚增，根因是不懂双发去重（见 L0-03）；</li><li>忽略年龄红线直接投——报错 1870165 整组建不出，根因是政策域漏检。</li></ul>",
q:{q:"新户开投第一天 CPM 异常低、CTR 正常、零转化。最值得先查什么？",a:"先查追踪链路（不是加预算也不是换素材）：① Pixel/CAPI 事件是否真的在发——用测试事件工具看实时事件，确认模型有靶心；② 落地页手机端是否打不开/超慢——点击有（CTR 正常）但 LPV 无，就是落地页崩，First Loss 在 LPV 层（见 L0-08）；③ 转化位置与事件配置是否对得上（网站 vs 即时表单）。低 CPM＋高点击＋零转化＝典型「数据半聋或落地页崩」信号——社区列为第三个致命操作（忽略落地页加载速度）。先确认数据可信，再判效果（见 L0-07 口径）。"},
b:"把清单落成可勾选的文档，并真实跑一遍新市场开投；能说出「为什么零转化先查链路不是换素材」。"},
{id:"L2-07",lv:2,t:"Advantage+ Audience 原理与控制",
g:"理解进阶赋能型受众的建议机制，掌握「开/关/半开」的决策方法。",
c:"<p><b>Advantage+ Audience（进阶赋能型受众）不是「开关」，是「约束程度选择器」。</b>你给系统「建议受众」（年龄、地区、兴趣等），系统可以选择在你的建议内找人，也可以向外扩展（兴趣→更宽人群、年龄性别突破你的下限、版位全开）。你拨的其实是「模型探索空间的大小」。</p><p><b>官方术语：</b>它属于 Advantage+ 自动化家族（受众/版位/创意三处，见 L2-08）。2026 年主流形态就是「建议＋扩展」。</p><p><b>误区纠正：</b>「进阶赋能＝高级＝必开」是新手最大坑。它改变的不是「能不能投」，而是「模型的探索空间」——数据好时扩展加速放量，数据差时扩展＝放大错误。新像素＋新市场＝建议≈没有，开了等于裸奔。</p>",
m:"<p><b>机制链：</b></p><ul><li>① 系统优化的是你设定的优化事件（见 L0-02/06），Advantage+ Audience 只决定「去哪找符合条件的人」；</li><li>② 数据好（信号足）→扩展能找到更多相似优质人群→加速放量；</li><li>③ 数据差（信号少）→扩展把广告撒向「系统猜的」人群→放大错误、CPL 飙升；</li><li>④ 新像素＋新市场＝没有可信转化信号，建议≈空，扩展≈随机投放（见 L0-05 学前期）。</li></ul><p><b>数字例子：</b>成熟组周 60 个 Lead、Qualified 率 50%，开 Advantage+ Audience 扩展后触达更宽相似人群，周 Lead 涨到 90、CPL 降 12%——这是「数据好时扩展有效」。新像素组周 3 个 Lead 就开扩展，系统把预算撒给「看起来会点」的人，结果 CPL 翻倍、零 Qualified——扩展放大了噪声。</p>",
h:"<p><b>三档用法（按账户阶段选）：</b></p><ul><li>① <b>全开</b>：成熟账户＋稳定转化信号，放 Broad 思路，让系统最大化探索；</li><li>② <b>半开</b>：只锁国家/语言/年龄下限，其余交给系统（新市场但已有一些信号的过渡档）；</li><li>③ <b>全关</b>：新像素冷启动/强监管行业，用原始定向积累首批信号（论坛实操：受众页拉到底→「进一步限定」→取消「用作建议」）。</li></ul><p><b>关闭技巧：</b>潜客目标下开关可能被隐藏，先切到销量目标关掉再切回；部分代理户系统强控无法关→换户。</p>",
cs:"某工业设备分区用法：EU 成熟组（已跑 4 个月、Qualified 稳定）全开，信号足、扩展有效；新开的南美组半开（锁语言西语＋国家），其余交给系统；测试组全关，要干净的假设检验、不让系统扩展污染对比。三档对应三个学习阶段，而非一刀切。",
f:"<p>论坛实操帖：受众页拉到底→「进一步限定」→取消「用作建议」即可关闭赋能；潜客目标下开关隐藏时「先切销量目标关了再切回来」；部分代理户系统强控无法关→换户。社区共识：新户建议关掉所有进阶赋能只用组预算——与新像素冷启动逻辑一致。社区还流传「开/关 × 通投/圈选」四种组合投票，结论无标准答案＝自己测。这正印证课程观点：Advantage+ Audience 是约束程度选择器，没有「必开」。</p>",
e:"<ul><li>把 Advantage+ Audience 当「高级＝必开」——新像素开它＝裸奔，根因是不懂扩展在数据差时放大错误；</li><li>以为关掉开关就回到完全手动——版位等仍可扩展，根因是不懂 Advantage+ 三处自动化是独立的；</li><li>从未做过开/关对比测试——永远不知道自己账户吃哪档，根因是不把自动化当假设来验证；</li><li>新市场直接全开扩到全球——预算撒向无信号人群，根因是忽略「建议需要有数据可用」；</li><li>强监管行业（如金融）也全开——撞年龄/资质红线，根因是不懂半开/全关的合规价值。</li></ul>",
q:{q:"新像素第 1 周、$50/天、优化 Lead。Advantage+ Audience 开还是关？为什么？",a:"关（至少半关）。理由：模型还没有可信的转化信号——第 1 周能攒的 Lead 屈指可数，开放的扩展≈随机投放，系统会把预算撒向「看起来会点」但根本不会询盘的人（见 L0-05 学前期）。正确路径：先用手动定向＋兴趣积累 30–50 个 Lead，让「建议」有真实数据可用，再逐步放开扩展。社区也明确「新户关掉所有进阶赋能只用组预算」——与新像素冷启动逻辑完全一致。等信号足了再开，扩展才加速而非放大错误。"},
b:"写出你各分区组的 Advantage+ 受众档位（全开/半开/全关）与理由；能解释「为什么新像素不宜开扩展」。"},
{id:"L2-08",lv:2,t:"Advantage+ Placements / Creative",
g:"掌握版位与创意两处自动化的行为逻辑、收益与失控点。",
c:"<p><b>Advantage+ 自动化有两处容易被混为一谈：版位（Placements）与创意（Creative）。</b>两处都是「把一部分决策交给系统」，但管的维度完全不同。</p><p><b>Adv+ Placements（进阶赋能型版位）：</b>系统自动跨 FB / IG / Reels / Stories / Audience Network 找便宜展示。本质是「跨版位套利」——哪个版位当下便宜且有效，系统把钱挪过去。</p><p><b>Adv+ Creative（进阶赋能型创意）：</b>系统自动做素材变体（裁剪比例、调色、文案组合、模板音乐），2026 年加入生成式 AI 扩展背景/变体。本质是「低成本多样性」。</p><p><b>误区纠正：</b>「CPL 便宜的版位全留着」是陷阱——低质版位（如 Audience Network）可能拉低后端 Qualified 率；「创意全交给 AI 增强」会品牌走样＋触发 AI 标注合规问题。自动化收益要用后端质量验收，不是看前台 CPL。</p>",
m:"<p><b>版位自动化经济学：</b></p><ul><li>① 给系统「跨版位套利」空间→整体 CPM 更低、花得动；</li><li>② 但低质版位流量可能拉低后端质量——需用 Breakdown 盯各版位 Qualified 表现，而非只看 CPL（见 L0-08 后端）；</li></ul><p><b>创意自动化风险：</b></p><ul><li>③ 收益＝低成本多样性（系统帮你生成变体测角度）；</li><li>④ 风险＝品牌走样＋AI 标注合规（自动生成的素材可能不符合你的调性或被标「AI 生成」）；</li></ul><p><b>数字例子：</b>某版位 CPL $30 但 Qualified 率 20%，有效 Qualified CPL＝$150；另一版位 CPL $60、Qualified 率 55%，有效 CPL＝$109。便宜的版位其实更贵——这就是必须用后端验收自动化的原因（见 L0-06 总价值）。</p>",
h:"<p><b>两处自动化操作清单：</b></p><ul><li>① 版位：默认自动＋每两周 Breakdown 审计一次；发现某版位 Qualified Rate 显著差→手动排除（B2B 常排除 Audience Network）；</li><li>② 创意：上传规格齐全的原始素材（1:1 / 4:5 / 9:16）让它有料可用，别只传一张图；</li><li>③ 关闭与品牌不符的自动增强项（如过度调色、模板音乐）；</li><li>④ 生成式 AI 变体：先小比例开，看品牌一致性再放大；</li><li>⑤ 永远用「有效 CPL / 边际价值」评估，不只用前台 CPL（见 L0-08 边际）。</li></ul>",
cs:"某工业设备：Adv+ 版位把量带进 Audience Network，前台 CPL 好看（$28）但 Qualified Rate 掉 15%。手动排除该版位后，前台 CPL 升到 $41，但 Qualified Rate 回到 52%，有效询盘成本反而从 $140 降到 $79——后端验收让决策反转。创意侧：上传 1:1/4:5/9:16 三规格原始视频，系统自动裁出 Reels 竖版，省去人工剪辑，但关掉「自动调色」避免工业设备偏色。",
f:"<p>论坛做法：先通投 4 版位跑一周看数据，再把表现好的版位拉出来单投；经验「FB Feed 与 IG 版位转化最好，可高预算＋高净值版位＋1-1-1 单投」；「AI 统管下大部分预算只花在 Ins 和 FB 动态，手动拆太细反而拿更贵的流量」——与课程「Placement Economics」结论一致。社区强调看后端而非只看 CPL，正是版位自动化的验收逻辑。</p>",
e:"<ul><li>因为「CPL 便宜」保留所有版位——不看后端质量，根因是忽略 Qualified Rate（见 L0-08）；</li><li>把品牌素材交给全自动增强不管——AI 调色/音乐毁调性，根因是不懂创意自动化的品牌风险；</li><li>从未做过版位 Breakdown——不知道哪个版位在后端正偷钱，根因是不建立审计习惯；</li><li>只传一张图给 Adv+ Creative——系统没料可用，变体质量差，根因是不懂「原始素材齐全才有好变体」；</li><li>用前台 CPL 决定版位预算——被低质版位骗，根因是不算有效 CPL（见 L0-06）。</li></ul>",
q:{q:"Reels 版位 CPL $35 vs Feed $60，要不要把预算全转 Reels？",a:"先看后端。若 Reels 的 Qualified Rate / Opportunity 显著差（论坛案例 Reels 有效 CPL $70 vs Feed/Stories 正常），那 $35 的 CPL 是假象——便宜流量不转化。即使后端差不多，也不能假设预算集中到一个版位后花得完：样本太少＋各版位消耗能力不同，强塞可能花不动或推高成本。结论：按「有效 CPL 与边际价值」分配预算（见 L0-08 边际），保留多版位、用 Breakdown 调比例，而非全转。社区经验也提醒手动拆太细反而拿更贵流量，但全压单一版位同样危险。"},
b:"跑一次版位 Breakdown 审计，产出「保留/排除」清单与依据（必须带 Qualified Rate 数据）；能解释「为什么 CPL 便宜的版位可能更贵」。"},
{id:"L2-09",lv:2,t:"Advantage+ Sales Campaign（2026 现状）",
g:"掌握 ASC 的最新形态（Advantage+ Sales，2025-02 更名）、适用场景与组合打法。",
c:"<p><b>Advantage+ Sales Campaign（ASC）是 Meta 把「受众＋版位＋创意＋预算」全部自动化的单 Campaign 方案。</b>它原名 Advantage+ Shopping Campaign（进阶赋能型商品系列），2025 年 2 月更名 Advantage+ Sales Campaign；2026 年 2 月起并入统一创建流，旧创建路径 2026 年 5 月 19 日停用（存量旧 ASC/AAC 未迁移的，约 2026 年 9 月随 Marketing API v26 被 Meta 自动暂停）。另一条对学习期的关键更新：Advantage+ Sales 的学习期门槛已从 50 降至约 25 个优化事件/周（以账户后台提示为准，标准广告组仍是 50，见 L0-05）——这让中小预算账户也能用自动化结构。一句话：ASC 是一个 Campaign 承接全部自动化。</p><p><b>官方术语：</b>它属于 Advantage+ 家族的「销售」分支，面向 Purchase/ Sales 优化；B2B 询盘场景对应的是 Advantage+ Leads（见 L2-10），别跑错位置。</p><p><b>误区纠正：</b>「ASC＝躺平」是错觉。ASC 更需要素材供给与盯盘——它把全部历史信号喂给一个强模型（见 L0-04 数据积累），但预算集中、受众黑盒，失控时你反应要快。</p>",
m:"<p><b>机制链：</b></p><ul><li>① ASC 优势＝把全部历史信号（像素/CAPI）喂给一个强模型，找人效率最高（见 L0-04）；</li><li>② ASC 风险＝不可控性：预算集中、受众黑盒，你看不到系统在找谁；</li><li>③ 2026 Q1 官方数据：ASC 占比从 38% 回撤至 20%——行业共识转为「组合打法」而非全压 ASC；</li><li>④ 新户没数据可学，直接 ASC＝空盒运转，必崩（见 L0-05）。</li></ul><p><b>数字例子：</b>电商客户周 Purchase 200 单、ASC 占比 100%。行业回撤后改为 ASC 60%＋手动 CBO 30%（保明星产品）＋RT 区 10%——整体 ROAS 从 2.1 升到 2.8，因为黑盒风险被分散。单一结构把所有信号押进一个黑盒，波动被放大。</p>",
h:"<p><b>ASC 适用与组合清单：</b></p><ul><li>① 适用：电商/有稳定 Purchase 信号的账户，用 1-1-N（N≥8）喂差异化素材（社区「仙女座极度吃素材」）；</li><li>② B2B 询盘场景：ASC 默认面向 Sales，用 Leads 应看 Advantage+ Leads（L2-10），不要硬凑；</li><li>③ 组合打法：ASC 承接放量＋手动 CBO 保重点市场/产品＋RT 区收割；</li><li>④ 新户第一周不上 ASC——先积累像素/CAPI 信号（见 L0-05）；</li><li>⑤ 持续 1-1-N 喂差异化素材，素材断供 ASC 就退化。</li></ul>",
cs:"某工业设备不直接用 ASC（无电商 Purchase 信号，优化事件是 Lead 不是 Purchase）。但「1-1-N 喂 8+ 条差异化素材让模型优选」的机制，通过普通 CBO 在 Scaling 区复刻：组里放 10 条不同 Angle 素材，系统优中选优。等于用 ASC 的「素材竞争」思路，但跑在更适合 B2B 的 Leads 结构上——位置对了、机制借了。",
f:"<p>论坛把 ASC 叫「仙女座」：「起手直接上 ASC 1-1-N，N 至少大于 8」「仙女座算法极度吃素材」；「大预算直接仙女座 CBO 跑出好素材 1-1-1 猛攻」。但 2026 年一刀流崩盘后，ASC/标准结构回归为主流建议——社区共识从「全压 ASC」转向「组合打法」。这与课程引用的 2026 行业回撤数据（38%→20%）完全吻合：自动化越强，越要留手动后手。</p>",
e:"<ul><li>拿 ASC 跑 Leads 目标硬凑——位置错配（ASC 面向 Sales），根因是不懂 Advantage+ Sales vs Leads 分工（见 L2-10）；</li><li>新户第一周就全仓 ASC——没数据可学，空盒运转，根因是忽略学习期前提（见 L0-05）；</li><li>以为 ASC＝躺平——更需要素材供给与盯盘，根因是不懂黑盒风险；</li><li>ASC 素材只放 2–3 条——算法吃不饱，根因是不懂 N≥8 的素材需求；</li><li>全店只跑一个 ASC——所有信号押进一个黑盒，波动放大，根因是不懂组合打法。</li></ul>",
q:{q:"电商客户想「全店只跑一个 ASC」。给出现状下的专业建议。",a:"可以以 ASC 为主，但按 2026 行业回撤数据（38%→20%）建议组合而非全压：① ASC 主力（60–70%）承接放量，持续 1-1-N 喂差异化素材；② 手动 CBO（20–30%）保明星产品/重点市场，保留人工可控性；③ RT 区（10%）收割存量。全压单点＝把所有信号押进一个黑盒，一旦模型跑偏你没有任何对冲。社区 2026 年也已从「全压 ASC」回归「ASC＋标准结构组合」——自动化越强越要留手动后手（见 L2-13 自动化边界）。"},
b:"能说出 ASC 的更名时间线（2025-02 / 2026-02 / 2026-05-19）、适用条件，并设计一个 ASC＋CBO＋RT 的组合方案。"},
{id:"L2-10",lv:2,t:"Advantage+ Leads Campaign",
g:"掌握面向潜客的官方自动化方案，理解它与标准 Leads Campaign 的取舍。",
c:"<p><b>Advantage+ Leads Campaign 是 Meta 面向「高质量潜客」的端到端自动化方案（2025–2026 官方独立产品线）。</b>它自动做受众扩展、多转化位置（表单/Messaging/电话）、动态素材组合——相当于把 L2-07/08 的受众与创意自动化，专门套在 Leads 目标上。</p><p><b>官方术语：</b>与标准 Leads Campaign 的区别在于「系统接管程度」：标准结构你手动定受众/版位/素材，Advantage+ Leads 让系统扩量。它与 ASC（见 L2-09）平行，只是优化目标不同（Leads vs Sales）。</p><p><b>误区纠正：</b>它不是「Leads 版 ASC」可照搬。B2B 高客单的核心矛盾（量 vs 质量）依然存在——自动化放大的是「系统判断的优质 Lead」，但你的 Qualified 标准必须先清晰，否则放大的是混乱。</p>",
m:"<p><b>机制链：</b></p><ul><li>① 它适合「信号已有一定积累、想要系统自动扩量」的 Leads 场景（见 L0-05 学后期）；</li><li>② 与手动结构相比：控制粒度下降（受众/版位被系统管），但探索效率上升（系统找人更快）；</li><li>③ B2B 矛盾不变：自动化放大的是系统判断，你的 Qualified 标准必须先固化在 CRM，否则垃圾 Lead 被自动放大（见 L0-03 信号质量）；</li><li>④ 迁移要小比例＋Cohort 观察，避免一次性把账户交给黑盒（见 L0-07 增量）。</li></ul><p><b>数字例子：</b>周 Lead 200 的账户，抽 30% 预算切 Advantage+ Leads 测试 4 周：Lead 量＋35%、Qualified Rate −8%、有效 CPL 持平——说明自动化带来了量但轻微稀释质量，净效果可接受，遂保留为放量补充而非主力。</p>",
h:"<p><b>迁移适用检查清单：</b></p><ul><li>① 每周 Lead 量 ≥50（自动化的燃料，见 L0-05）；</li><li>② Qualified 标准已在 CRM 固化（否则放大混乱）；</li><li>③ 接受一定比例的量波动（自动化扩量本就带波动）；</li><li>④ 配置：转化位置首选网站＋可选即时表单；受众给「建议」而非全开（见 L2-07）；</li><li>⑤ 素材 ≥6 条差异化（见 L2-04）；</li><li>⑥ 迁移比例 20–30%＋Cohort 观察 3–4 周再下结论。</li></ul>",
cs:"某工业设备月 Lead 稳定 200+ 后，抽 30% 预算切 Advantage+ Leads 测试 4 周：Lead 量 +35%、Qualified Rate -8%、有效 CPL 持平→保留为放量补充渠道（不替代手动主力）。关键：迁移前 Qualified 标准已在 CRM 固化（「含预算≥$5万且决策人职位匹配」才算 Qualified），所以自动化的量波动可被质量闸口接住。",
f:"<p>论坛对 Advantage+ Leads 直接讨论较少（新功能），但「潜客这一块儿还是能打」与受众开关投票反映了社区对「自动化 vs 手动定向」的持续争论——结论都是「测了才知道」，与官方「小比例测试」建议一致。社区没有标准答案，但共识是：自动化不是免死金牌，Qualified 标准不清就上＝放大混乱。</p>",
e:"<ul><li>把 Advantage+ Leads 当「Leads 版 ASC」直接照搬配置——忽略 Leads vs Sales 目标差异（见 L2-09），根因是不懂两条产品线分工；</li><li>Qualified 标准还没固化就上自动化——放大的是混乱而非效率，根因是不懂信号质量前提（见 L0-03）；</li><li>测试期不到 2 周就下结论——学习期都没过（见 L0-05），根因是没给模型学的时间；</li><li>全预算迁移——无手动对冲，黑盒跑偏时无缓冲，根因是不懂自动化边界（见 L2-13）；</li><li>用前台 CPL 判自动化成败——不看 Qualified Rate/有效 CPL，根因是不看后端（见 L0-08）。</li></ul>",
q:{q:"什么信号出现时，值得从手动 Leads Campaign 迁移部分预算到 Advantage+ Leads？",a:"三个信号同时出现才值得：① 手动态稳定——周 Lead ≥50、Qualified Rate 已知且稳定（自动化的燃料与验收基准齐了，见 L0-05）；② 手动态扩不动——加预算边际成本明显上升（说明手动找人接近天花板，见 L0-08 边际）；③ 想释放管理带宽（自动化接管机械扩量）。迁移方式：小比例 20–30%＋Cohort 观察 3–4 周（见 L0-07 增量），绝不一次性全切。若 Qualified 标准还没固化，先别迁——否则系统放大的就是你的混乱。"},
b:"对照 3 个适用条件（周 Lead≥50 / Qualified 固化 / 扩不动）评估你的账户，写出去留结论与迁移比例。"},
{id:"L2-11",lv:2,t:"Opportunity Score 与账户监控",
g:"用 Meta 官方建议评分与例行监控体系，把「账户健康」变成日常机制。",
c:"<p><b>Opportunity Score（机会评分）是 Meta 给你的账户/广告的「建议打分」，但它不是命令，是「系统视角的机会清单」。</b>配合三层监控（账户/组/素材），把「账户健康」从「月底看报表惊讶」变成「日常机制」。</p><p><b>官方术语：</b>Opportunity Score 属于 Meta 的自动化建议体系，与自动规则（Automation Rules）不同——前者是建议、后者是你可以设定的机械执行（见 L2-13）。</p><p><b>误区纠正：</b>「一键应用全部建议」是经典大坑——它可能同时改受众＋预算＋素材＝集体重置学习期（见 L0-05），且你无法归因哪条建议有效。评分是机会清单，不是待办指令。</p>",
m:"<p><b>机制链：</b></p><ul><li>① 评分基于系统视角的优化机会（如受众偏窄、预算花不动）；</li><li>② 「一键应用全部」＝多项重大修改同时落地→集体触发重学习（见 L0-05 分布漂移）；</li><li>③ 监控的意义：在异常发酵前发现（如 CPM 连涨、频次过高），而非月底看报表惊讶；</li><li>④ 机械监控（如「CPM 连 3 天涨 30%→通知」）交给自动规则，判断决策留给人（见 L2-13 分工）。</li></ul><p><b>数字例子：</b>一次「一键应用」同时扩大受众＋换优化事件＋提预算 30%——三项全改，学习期重置，接下来 7 天 CPL 从 $40 飙到 $75，且你不知道是哪条建议的锅。逐条评估、每次只动一项，才能归因（见 L0-07）。</p>",
h:"<p><b>监控与评分操作清单：</b></p><ul><li>① 每日 10 分钟：花费 Pacing、拒审/受限通知、异常组（成本超阈值 30%）；</li><li>② 每周：Breakdown 审计、素材疲劳检查（Frequency>2.5）、Opportunity Score 逐条人工评估；</li><li>③ 每月：分区预算比例、市场排序复查；</li><li>④ 用自动规则承接机械监控，例如「CPM 连 3 天涨 30%→通知」「ROAS<2 连续 2 天→暂停」；</li><li>⑤ Opportunity Score 建议逐条标记「采纳/忽略＋理由」，绝不一键全应用。</li></ul>",
cs:"某工业设备每周五「账户体检例会」30 分钟：过一遍监控三层（账户花费/Pacing、组学习状态与频次、素材消耗分布）＋Opportunity Score 逐条标记「采纳/忽略＋理由」。半年后团队对异常的响应速度提升一倍——一次 CPM 异常波动在例会被发现，溯源到竞品大促抢量，提前把预算从 Reels 转到 Feed，避免了一周空耗。",
f:"<p>论坛自动规则的正面样板：小强打法的分层加预算规则（ROAS>3.5→每 1 小时检查每次 +10%、上限 $50…）——把「机械决策交给规则、判断决策留给人」的完整示范。反面教训社区共识：「千万不要一键应用 Meta 建议，易搞废原广告组」——用原帖拉出来重跑比一键应用安全。这正是课程自动化边界的实战注脚。</p>",
e:"<ul><li>每天手动盯盘 3 小时——该用规则的机械活自己扛，根因是不懂自动规则（见 L2-13）；</li><li>Opportunity Score 全盘照单全收——学习期集体重置、无法归因，根因是不懂「同时改多项＝重学习」（见 L0-05）；</li><li>监控只在数据崩了才做——异常发酵成事故，根因是不建立日常机制；</li><li>评分低就慌、高就飘——评分是系统视角不是利润视角，根因是混淆机会清单与业绩；</li><li>自动规则设了不复查——规则跑偏（如阈值错）悄悄吞钱，根因是不审计自动化（见 L2-13）。</li></ul>",
q:{q:"Opportunity Score 建议「扩大受众 + 换优化事件 + 提预算」三连。怎么处理？",a:"逐条拆开评估，绝不一键应用。理由：三项同时改＝无法归因效果（见 L0-07）＋集体触发重学习（见 L0-05），等于用 7 天学习期换一个不知道有没有用的建议。正确做法：按当前业务瓶颈选最多一项执行——例如只扩大受众（若瓶颈是受众偏窄），其余记录观察。人保留决策权：系统给机会清单，但「改不改、改哪项」由你定（见 L2-13 自动化边界＋社区「勿一键应用」教训）。"},
b:"搭好你的三层监控清单＋至少 3 条自动规则，并真实跑一周；能解释「为什么不一键应用 Meta 建议」。"},
{id:"L2-12",lv:2,t:"Account Health & Policy（账户健康）",
g:"建立账户健康与合规的实战能力：拒审、受限、资产保全与投放连续性。",
c:"<p><b>账户健康（Account Health）是「投放连续性」的地基——广告再会投，账户受限 30 天全白搭。</b>它由四个相互独立的资产健康组成，任何一个出问题都可能中断投放。</p><p><b>健康四要素（官方对应，见 L0-01 资产体系）：</b></p><ul><li><b>个人号</b>：登录与操作身份，受限则整个体系瘫痪；</li><li><b>主页</b>：广告身份，被取消发布（报错 1815014）则广告无法编辑；</li><li><b>BM</b>：资产统筹，绑错/被踢权限则资产失控；</li><li><b>广告账户</b>：消耗主体，受限则直接停投。</li></ul><p><b>风险源：</b>素材/落地页违规、异常登录/支付行为、投诉与负面反馈、关联账户连坐（2025-10 起 WhatsApp 限额按 Portfolio 级共享——一个号出事拖累全部）。</p><p><b>误区纠正：</b>「一个 BM 绑全部资产」不是省事是裸奔。平台风控看「行为模式」——新号猛投、频繁换支付、落地页与广告承诺不符都会累积风险分。健康管理的核心＝可预测性：让平台看到稳定合规的经营行为。</p>",
m:"<p><b>机制链：</b></p><ul><li>① 平台风控累积「风险分」——基于行为模式（登录地突变、支付频繁换、投诉率）；</li><li>② 风险分高→个号受限/主页取消发布/广告账户受限，任一中断即停投；</li><li>③ 关联连坐：同一 BM/Portfolio 下资产互相牵连（WhatsApp 限额 2025-10 起共享），一个号出事全 portfolio 受限；</li><li>④ 健康管理＝降低风险分：双因子＋固定设备＋承诺一致＋备用资产对冲单点。</li></ul><p><b>数字例子：</b>一个 BM 绑 5 个广告账户，其中 1 个因落地页违规被限——若限额按 Portfolio 共享，其余 4 个的 WhatsApp 触达也受牵连。双 BM 结构下，受限账户在 BM-A，正常账户在 BM-B，互不影响——隔离价值立现。</p>",
h:"<p><b>健康 SOP 清单：</b></p><ul><li>① 双因子验证（2FA）＋常用设备固定登录，不异地新设备频繁操作；</li><li>② 落地页与广告承诺一致性自查（Message Match，见 L4-14）；</li><li>③ 准备备用资产：第二个 BM、备用主页、第二支付方式（同主体）；</li><li>④ 拒审应对流程：看拒审原因→改后申诉→不重复撞审（避免升级处罚）；</li><li>⑤ 重大活动前两周检查账户状态（黑五死户潮高发）；</li><li>⑥ 定期剔除 BM 无关管理员，防盗刷（论坛半夜盗刷提醒）。</li></ul>",
cs:"某工业设备 Black Friday 前例行动作：提前两周检查账户状态、备好备用主页与 BM、暂停边缘素材（易踩红线的「限时暴利」类文案）。连续两年投放零中断，而同行因黑五死户潮大面积停投。关键：健康是「提前买保险」不是「出事再救」。",
f:"<p>论坛大量血泪：买来的速推主页极易掉功能或被盗，务必提前绑老 BM，切忌裸奔；个号受限导致无法操作广告、主页被取消发布（1815014）有标准处理路径；欧美收单黑五死户潮是周期高发。灰产对比（仿牌/买户/养号）的本质是把健康寄托在运气上——社区风控观也劝退灰产，因其拉高广告费、连累风控。合规路线＝双 BM＋双户常态化，成本远低于停投损失。</p>",
e:"<ul><li>一个 BM 绑全部资产单点裸奔——一处出事全瘫，根因是不懂风险隔离（见 L0-01）；</li><li>异地新设备频繁登录投放——累积风险分触发受限，根因是不懂风控看行为模式；</li><li>拒审了不改内容反复重提——升级处罚，根因是不懂申诉要先改再提；</li><li>轻信「解封服务」——多是骗局/盗刷，根因是把健康外包给陌生人；</li><li>不备备用资产——主力受限即停投，根因是没算「停投损失＞备用成本」。</li></ul>",
q:{q:"主力广告账户突然受限 30 天。你的「投放连续性预案」是什么？",a:"① 立即启用备用广告账户（同 BM/同主体）＋「使用现有帖子」继承素材——社会证明与帖子数据都在，不中断；② 像素/BM 数据未受损，学习基础保留（见 L0-01 资产分层，像素跟 BM 走不跟广告户走）；③ 复盘受限原因（最近素材/支付/登录变更）再申诉，不重复撞审；④ 长期：双 BM＋双户常态化，成本远低于一次停投损失。预案核心是「资产隔离」——单点裸奔才会被一锅端。"},
b:"写出你的账户健康 SOP（检查项＋频率＋应急预案）；能解释「为什么像素在广告户死后还能活」（见 L0-01）。"},
{id:"L2-13",lv:2,t:"自动化边界：Manual vs Automation",
g:"确立「哪些交给系统、哪些必须人来控」的分工原则——AI 时代投手的核心定位。",
c:"<p><b>自动化边界，是 AI 时代投手的核心定位问题：哪些交给系统、哪些必须人来控。</b>Meta 的 Advantage+ 家族（受众/版位/创意，见 L2-07/08）和自动规则（见 L2-11）能接管大量执行层，但有些决策只有人能负得起责任。</p><p><b>两类决策（官方对应）：</b></p><ul><li><b>适合交给系统（执行层）</b>：出价微调、预算分配、版位套利、素材变体、扩量探索——这些有明确规则、错了损失可控；</li><li><b>必须人控（判断层）</b>：目标与口径（优化什么事件，见 L0-02）、假设与 Angle（说什么话，见 L2-04）、质量标准（Qualified 定义，见 L0-03）、预算纪律（总盘子与止损线）、合规（账户健康，见 L2-12）。</li></ul><p><b>误区纠正：</b>「全自动躺平」和「全自动反对」都错。系统优化的靶心是「你设定的转化事件」，不是「你的商业利润」——它会把任何你允许的路径走到局部最优，包括把你引向低质量但便宜的流量（见 L0-06 总价值、L0-08 边际）。人的价值＝不断校准靶心与边界。</p>",
m:"<p><b>机制链：</b></p><ul><li>① 系统优化的靶心＝你设定的优化事件（见 L0-02/06）；</li><li>② 靶心错了/边界没设→系统走到局部最优但偏离商业利润（如低质量便宜流量，见 L0-08）；</li><li>③ 人的价值＝持续校准靶心（优化事件对不对）与边界（预算/止损/合规）；</li><li>④ 分工三问：有明确规则吗？错了损失可控吗？涉及商业判断吗？——据此决定交不交。</li></ul><p><b>数字例子：</b>优化事件设在 Lead（而非 Qualified），系统拼命找「爱留资但不成交」的人，前台 CPL 漂亮但后端 Deal 成本暴高——人没校准靶心，系统完美执行了错误的目标（见 L0-02 司机隐喻）。反之，预算微调 ±10% 交给规则，ROAS 不达标自动停，机器踩油门、人定刹车（论坛小强打法）。</p>",
h:"<p><b>分工三问清单（每个决策过一遍）：</b></p><ul><li>① 这个决策有明确规则吗？（有→交给规则/自动化）；</li><li>② 错了损失可控吗？（可控→系统试错）；</li><li>③ 涉及商业判断吗？（是→人做）；</li><li>④ 每月审计一次：哪些自动化在帮你、哪些在悄悄偏航（看有效 CPL/边际，见 L0-08）；</li><li>⑤ 成文《自动化边界清单》：交出去的 5 项、必须人控的 5 项，团队共享。</li></ul>",
cs:"某工业设备分工实例：预算微调（±10%）＝自动规则执行（错了损失小）；「要不要把优化事件从 Lead 切到 Qualified」＝人来决策（涉及 CRM 数据质量与商业判断，见 L5-01）。另一例：换季重做素材＝人定 Angle 方向（商业假设），变体生产交 AI/系统（执行）。边界写进团队文档，新人照单操作不拍脑袋。",
f:"<p>论坛小强打法是分工典范：加预算的机械执行全自动规则（每次 +10%、ROAS 不达标自动停），但「ROAS 门槛定多少」是业务判断（利润率高可放低）——机器踩油门，人定刹车。社区共识「相信算法但别迷信，你是操盘手」正是自动化边界的精髓：系统负责执行效率，人负责目标与纪律。</p>",
e:"<ul><li>全自动躺平——系统把你带到便宜但错误的流量里（见 L0-08 边际），根因是放弃靶心校准；</li><li>全自动反对——错过系统探索红利（如 ASC 扩量，见 L2-09），根因是不懂执行层该交给系统；</li><li>分工从未成文——团队每次拍脑袋，根因是不把边界写进文档；</li><li>优化事件设错还怪系统——系统完美执行错误目标（见 L0-02），根因是不懂靶心是人定的；</li><li>自动规则设了不审计——规则悄悄偏航吞钱，根因是不做月度边界复查（见 L2-11）。</li></ul>",
q:{q:"用「分工三问」判断：换季要不要重做全部素材？要不要开自动扩量？",a:"重做素材：涉及 Angle 与商业假设（说什么话、打什么痛点）→ 商业判断，人做方向；但变体生产（不同尺寸/配色/剪版）是可规则化的执行→交系统/AI。开自动扩量：有明确规则（预算上限/止损线）、损失可控（先小比例）→ 交给系统，但人定边界与验收标准（有效 CPL 阈值）。结论：方向人控、执行系统、边界人定——三问把每项决策归位（见 L2-13 分工三问＋L0-08 边际验收）。"},
b:"写出你账户的《自动化边界清单》：交出去的 5 项、必须人控的 5 项；能向团队解释「为什么优化事件必须人定」。"}
);

</script>
<script>
/* ===== 数据文件 3：Level 3 创意智能系统（15 个） ===== */
MODULES.push(
{id:"L3-01",lv:3,t:"Creative Angle Architecture（角度架构）",
g:"掌握「Angle=销售逻辑」的定义体系，彻底区分 Angle / Concept / Hook / Format / Execution。",
c:"<p><b>Angle（角度）是「说服逻辑」，不是「画面」。</b>官方课程把一条完整广告拆成 Angle→Hook→Message→Proof→CTA→Format 六个环节，Angle 排在第一位，因为它是整条素材的「为什么这个人该买」的核心判断。一句话定义：<b>Angle＝你用一个什么理由去说服目标客户</b>。它回答的不是「广告长什么样」，而是「我凭什么让你停下、凭什么让你相信、凭什么让你行动」。</p><p><b>五个层级必须分清（这是新手最大的混淆点）：</b></p><ul><li><b>Angle（角度/销售逻辑）</b>：说服理由，例如「用我们的某工业设备能省 30% 土建成本」。换一个 Angle＝换一套说服逻辑。</li><li><b>Concept（创意概念）</b>：把 Angle 翻成创意点子，例如「把混凝土基座换成钢平台」的视觉化表达。</li><li><b>Hook（钩子）</b>：前 3 秒抓取注意力的点（见 L3-03），是 Angle 的「开口」。</li><li><b>Format（格式）</b>：载体，视频/单图/轮播/直播（见 L3-07）。</li><li><b>Execution（执行）</b>：具体制作——换模特、换背景、换字体、换 BGM、换剪辑节奏。</li></ul><p><b>类比帮你记住：</b>同一出戏，Angle 是「剧本内核（讲什么道理）」，Execution 是「演员的妆发与服装」。换妆发＝同一出戏的同一角色（变体）；换剧本内核＝新戏（新 Angle）。社区里常说的「换蓝色背景、换模特」全是妆发级别的改动，不是新戏。</p><p><b>误区纠正：</b>新手最爱把「换个工程师照片、换个产品图、换个字体颜色」当成「我又测了一个新创意」——这只是在 Execution 层内卷，模型学到的还是同一个销售逻辑。ChatGPT 课程里那个经典例子：「把同一张图的背景从白色换成蓝色，不是五个 Angle，只是一个 Execution 变体」。真正的增量永远在 Angle 层：换决策理由、换阻力、换人群。</p><p><b>为什么 Angle 存在？</b>因为同一个产品对不同人意味着不同的价值：采购总监关心交期与账期，技术总工关心寿命与堵塞，老板关心总成本与风险。一条素材只能承载一个说服逻辑，所以必须用多个 Angle 去覆盖不同角色的「为什么买」——这正是「素材即定向」（Andromeda 时代，见 L0-08 碎片化与素材即定向）的起点。</p>",
m:"<p><b>机制链：</b></p><ul><li>① <b>Angle 是市场研究与投放的接口</b>：在 L1-03 里你做过的「阻力假设」清单，到这里要变成具体的 Angle（每条阻力 × 你的证据＝一个候选 Angle）。</li><li>② <b>Angle 决定「对谁说话、回应什么阻力」</b>：它本质上是素材侧的「定向」——不同 Angle 会自然筛选出不同人群（这就是 L4-09 的 Audience×Creative Fit 在创意侧的根源）。</li><li>③ <b>同一产品可长出 5–8 个互不重叠的 Angle</b>，每个 Angle 下再长出 Concept 与变体，形成一棵创意树。</li></ul><p><b>数字例子：</b>某工业设备一台设备，潜在决策角色至少有 5 类（土建工程师、运维主管、采购、技术总工、老板）。如果每个角色配 1 个 Angle，就有 5 个互相不重叠的说服逻辑；每个 Angle 下做 3 个 Execution 变体，总共 15 条素材却只覆盖 5 个逻辑。<b>对比「15 条全是同一 Angle 的图」：后者在 L0-08 的语境里叫「伪多样化」，模型只学到一种人，一旦这类人看吐，整个账户断崖</b>。</p><p><b>与 L0 的钩稽：</b>Angle 是你给素材定的「找谁」逻辑，和 L0-02 目标三连里「Objective 决定模型找什么人」是同一件事的两侧——目标层用 Campaign 设置告诉 Meta 找谁，创意层用 Angle 用内容把对的人「喊出来」。两者对齐，素材即定向才成立；两者错位，预算就花在错的人身上。</p>",
h:"<p><b>Angle 生成公式：ICP 角色 × 购买阻力 × 你的独有优势。</b>按下面 checklist 产出：</p><ul><li>① 列出 ICP 角色清单，至少 5 类（如决策者/技术把关/采购/使用者/影响者），每类一句话写清「他最怕什么」；</li><li>② 从 L1-03 的阻力清单里，给每个角色挑 1–2 条最痛的阻力；</li><li>③ 对每条阻力，匹配一个「只有你拿得出证据」的独有优势（没有证据的先打回公司补能力）；</li><li>④ 三者相乘＝候选 Angle，写一句承诺式种子文案（可验证、不夸张，例如「免堵叶轮，连续运行 3 年不停车」）；</li><li>⑤ 用检验句过滤：「这个 Angle 和已有的，是不同销售逻辑吗？」答否→降级为 Execution 变体，不占独立测试位（见 L3-08）；</li><li>⑥ 验收标准：自有产品 ≥5 个互不重叠 Angle，每个都标注回应的阻力与角色。</li></ul><p><b>节奏数字：</b>每新产品上线前一次性产出 5–8 个 Angle；每个主力 Angle 配 ≥2 个 Hook（L3-03）、≥3 个 Execution 变体；每月新增 Angle 占比 ≥30%（见 L3-10 多样化标准）。</p>",
cs:"<p><b>某工业设备 · 5 Angle 实战（B2B）：</b>同一台设备，团队产出 5 个互不重叠的销售逻辑，每个回应不同角色的阻力——</p><ul><li>① <b>土建成本省 30%</b>（安装逻辑）：用钢平台替代混凝土基座，回应土建工程师「工期与预算」阻力；</li><li>② <b>免堵叶轮不停车</b>（技术逻辑）：独有叶轮设计，回应运维「清淤停机」阻力；</li><li>③ <b>47 国项目案例</b>（信任逻辑）：规模与存续证明，回应老板「供应商风险」阻力；</li><li>④ <b>工厂直供交期 30 天</b>（采购逻辑）：回应采购「交期与账期」阻力；</li><li>⑤ <b>48h 备件响应</b>（售后逻辑）：回应技术总工「买了没人管」阻力。</li></ul><p>五个 Angle 对应五个不同的决策理由、五类不同人群。<b>投放结果：</b>这 5 个 Angle 各自独立起组测试，3 个月内「47 国案例」Angle 在德国市场跑出全账户最高 Qualified Rate（58%），因为它精准喊出了老板这类决策者的顾虑——印证「Angle＝素材侧定向」的判断。</p>",
f:"<p>论坛社区长期存在一种「换头不换身」的素材翻新术：把爆款素材前 3 秒切掉、换一个冲突感更强的画面或热门 BGM，FB 会当成新素材重新分配流量。这套操作在 Execution 层（Hook/剪辑）有效，<b>但它恰好证明社区在 Execution 层内卷——真正的增量在 Angle 层</b>。ChatGPT 课程里反复强调的「换蓝色背景不是五个 Angle」，和论坛这个现象互为印证：大多数人把精力花在「妆发」上，少数赢家把精力花在「剧本」（Angle）上。另一个可印证的点：论坛选品思维里「老品不行往往是思想问题，换素材/受众思路即可」——这里的「思路」就是 Angle 级创新，而非 Execution 换皮。结论是：素材内卷的破局点不在妆发，在剧本。</p>",
e:"<ul><li>把「换张图、换个模特」当「一个新素材测试」提交——浪费珍贵的测试位，本质是 Execution 变体（见 L3-08）；</li><li>5 条素材全是 1 个 Angle——假设检验样本维度单一，模型只学到一种人，一旦饱和即断崖（L0-08 碎片化）；</li><li>Angle 直接抄竞品——没有自己的独有优势支撑，承诺无法兑现，Ad Quality 反噬（L0-06）；</li><li>从格式（Format）倒推内容——先想「做个视频」再硬塞卖点，逻辑倒置，Angle 必然空泛；</li><li>一个 Angle 包打天下——不做角色拆分，错失其他决策角色的转化机会。</li></ul>",
q:{q:"「同一个『节省土建成本』，换工程师照片、换产品图、换字体」是几个 Angle？请写出判断逻辑。",a:"一个。这些都是 Execution 变体——销售逻辑（省土建成本）一点没变，只是演员妆发换了。判断标准（见 L3-01 五级分层）：只有「说服逻辑」变了才算新 Angle。真正的新 Angle 是换决策理由，例如从「省钱」换成「降低项目交付风险」，或从「省成本」换成「免停机保交期」。步骤：① 提取当前 Angle 的说服逻辑；② 看改动是否改变了这个逻辑；③ 没改变→Execution 变体，改变→新 Angle。这样你才不会把测试位浪费在妆发级别的改动上。"},
b:"列出自有产品 ≥5 个互不重叠的 Angle，每个标注：① 回应的角色；② 回应的阻力；③ 你的独有优势证据。能用一句话向同事讲清「为什么这 5 个 Angle 逻辑互不相同」。"},
{id:"L3-02",lv:3,t:"从购买阻力建立 Angle（工业设备方法）",
g:"把 L1-03 的阻力清单系统转化为 Angle，形成工业设备/B2B 可复用的生成流程。",
c:"<p><b>Angle 不是拍脑袋想 slogan，而是从「客户为什么不敢买」反推出来的。</b>在 L1-03 你已经建立过「购买阻力清单」，那是市场研究的产品；本模块把它变成可投放的创意资产。先把 B2B 高频阻力归成库，作为 Angle 的「矿脉」：</p><ul><li><b>技术风险</b>：会堵、会坏、寿命短、能耗高；</li><li><b>安装复杂度</b>：要土建、要停机、要专业人员；</li><li><b>售后可达性</b>：跨国响应慢、备件难买、没人管；</li><li><b>合规资质</b>：认证缺失、标书要求不满足；</li><li><b>价格审批</b>：预算不足、账期不接受、TCO 算不过；</li><li><b>供应商风险</b>：交期不稳、企业存续存疑、产能不足。</li></ul><p><b>误区纠正：</b>最常见的错误是「从产品参数倒推 Angle」——工程师把「304 不锈钢、7.5kW、IP68」列出来就以为有了卖点，这叫自嗨。参数本身不是 Angle，<b>「参数能化解客户的哪条阻力」才是 Angle</b>。不锈钢不是卖点，「不锈钢＝在腐蚀性污水里多用 5 年不换」才是 Angle。</p><p><b>B2B 与电商的根本差异：</b>电商的阻力多在「欲望与信任」（我想要但怕假货/怕不好用）；B2B 的阻力几乎全在「风险与流程」（怕坏了停产、怕没人管、怕合规过不了）。所以 B2B 的 Angle 几乎总是「降低某类风险」——把阻力翻译成承诺，就是 Angle 的雏形。</p>",
m:"<p><b>机制链（阻力→Angle 的生成逻辑）：</b></p><ul><li>① 每条阻力 × 你拿得出的证据 ＝ 一个候选 Angle（证据是 Angle 能否兑现的命门，无证据＝空承诺）；</li><li>② 候选 Angle × ICP 角色 ＝ 优先级（决策者怕风险、使用者怕难用、采购怕交期，同一证据对不同角色分量不同）；</li><li>③ 排好优先级后，写出一句「可验证、不夸张」的承诺式 Angle 种子。</li></ul><p><b>数字例子：</b>假设你有 6 类阻力、每类平均 2 条痛点，就是 12 个候选 Angle 矿点；你的证据库能覆盖其中 7 条→这 7 条进假设库成为可测 Angle，剩下 5 条反馈给公司补能力（补认证、补案例、补备件仓）。这比「拍脑袋想 5 句 slogan」可靠得多，因为每条都根植于真实客户顾虑。</p><p><b>与 L0 的钩稽：</b>Angle 承诺若无法兑现，落地页/素材就会「说一套做一套」，触发 L0-06 里的「误导体验」扣 Ad Quality 分——所以 Angle 必须「可验证」，既是诚信要求，也是竞价公式的硬约束。</p>",
h:"<p><b>从阻力建 Angle 的标准流程（checklist）：</b></p><ul><li>① 拉销售月度异议 Top10，每条原话记录（禁止概括成「客户嫌贵」这种废话，要记「预算卡在 30 万、要三层审批」）；</li><li>② 按角色归类（决策者/技术/采购/使用者），每类贴回对应阻力库；</li><li>③ 每条阻力配「你能拿出的证据」（证书扫描件、项目实拍、响应时效记录、客户评价）；</li><li>④ 有证据的→进假设库写成 Angle 承诺句；无证据的→开需求单给公司补能力；</li><li>⑤ Angle 写成「阻力化解承诺」格式，例如「怕堵？免堵叶轮，连续运行 3 年不停车」；</li><li>⑥ 验收：每个主力 Angle 都能指到一条真实证据，且承诺措辞经得起技术审核。</li></ul><p><b>节奏数字：</b>新产品上线前完成 1 轮异议访谈（≥8 个真实客户原话）；产出 5–8 个 Angle；每月用新访谈更新 1 次阻力库。</p>",
