/* ===== 数据文件 9：Level 11 综合案例训练（5 个） + 附录（7 个） ===== */
MODULES.push(
{id:"L11-01",lv:11,t:"综合案例 1：陌生账户接管全流程",
g:"演练接管一个完全陌生账户的标准流程：从审计到第一周动作清单，全程以「先校尺子、再动手」为纪律，把接管当作审计而非改革。",
c:"<p><b>背景数据（接管前快照）。</b>某工业设备品牌，6 人团队维护一个 Meta 账户：月预算 $8,000，12 个广告组无命名规范，结构含 Broad 组 4 个、兴趣组 2 个、Retargeting（RT）组 6 个。后台显示整体 CPL $42、Qualified 率 22%。交接文档只有「上个月花了 $8,000、来了 1,200 个 Lead」一句话。这笔账先按下不表——因为后面会发现尺子本身是歪的。</p><p><b>诊断推演（七步走，顺序不可乱）。</b></p><ul><li><b>① 资产与权限审计（L0-01 五层）。</b>BM 1 个（管理员 2 人、无备用）、主页 2 个（1 个已绑老 BM、1 个裸奔）、像素 1 个、CAPI 已接但只发 Lead 与 Purchase 两类事件、支付账户健康无欠款。结论：资产结构健康，无需走「资产迁移」前菜，但裸奔主页必须立即绑 BM（防连坐）。</li><li><b>② 数据可信度审计（先校尺子）。</b>抽 4 周数据比对：后台 Lead 1,200 个 vs CRM 录入 1,180 个，去重差异 1.7%（可接受，L0-03 双通道去重正常）。但 Qualified 出现重大缺口——后台记录 Qualified 264 个（占 Lead 22%），CRM 实际 Qualified 449 个（占 1,180 的 38%）。差距 185 个 Qualified 从未回传给 Meta。结合事件日志，根因是 CAPI 漏发 Qualified 事件长达 3 个月（L0-03 的「信号」只发了一半，模型处于「半聋」状态）。</li><li><b>③ 历史结构复盘。</b>过去 90 天做过 3 次「受众＋素材＋出价」三连大改，每次 CPL 短暂下降 8%–12% 后回升并恶化。这是 L0-05 学习期被反复重置的典型后果——模型每次刚学完就被打断。</li><li><b>④ 在投结构诊断（L0-08 First Loss 视角）。</b>12 组里 6 组 RT 吃掉 35% 预算（$2,800/月），但 RT 的增量 Qualified 率仅 15%（老客复购少、几乎无新信号）；4 个 Broad 组互相重叠（受众差集 <10%），预算被摊薄成碎片化。</li><li><b>⑤ 业务上下文。</b>客单 $3,200、毛利 45%、销售承接容量 40 个 Qualified/月。用 CRM 真实值 449 个 Qualified/月已远超销售承接余量——按 L7-08 的 80% 原则最多接 50 个，线索其实在积压反噬转化信号。</li></ul><p><b>决策选项。</b></p><ul><li>选项 A：立刻大改结构冲效果（老板最爱）。风险：尺子没校，改了也无法归因，且会再重置学习期。</li><li>选项 B：第一周只做可逆＋低风险项，输出 30 天路线图。风险：短期「没动静」需向上管理。</li><li>选项 C：直接砍掉 RT 6 组。风险：retargeting 信号中断，且不可简单回退到原学习状态。</li></ul><p><b>决策与理由（选 B，并对 RT 取「冻结加码」而非硬砍）。</b>数据半聋 3 个月意味着模型看到的「好 Lead」样本只有真实值的 59%（264/449），它一直在为「便宜但不合格的 Lead」优化。真实 Qualified CPL 被后台虚高成 $30.3（8,000/264），而 CRM 真实值仅 $17.8（8,000/449）——差了 70%。在尺子修好前做任何「优化」都是用坏数据做决策（L0-08 的 First Loss 定位先要确认数据可信）。RT 不硬砍、只冻结加码：保留信号通道，先把预算占比从 35% 压回 15% 观察，避免切断后无法对照。用 L10-01 决策环表述：当前「问题」=数据不可信，单变量动作=修 CAPI，验证窗=3 天看 Qualified 率是否向 38% 收敛。</p>",
m:"<p>接管期最大的美德是「克制」。两个不可乱的顺序：① 在数据可信度确认前（L6-13 口径检查、L0-03 的 EMQ/去重）做的任何优化，都建立在坏尺子上——你优化的是一个被低估了 41% 的 Qualified 率的账户；② 在业务上下文（ICP/客群/销售承接/毛利）搞清前改结构，等于赌博。把「接管」当作一次审计而非一次改革，30 天后再谈大改。这里用 L0-08 的 First Loss 漏斗定位时，第一处掉链子的不是投放层而是数据层——先修尺子，漏斗诊断才有意义。</p>",
h:"<p><b>第一周动作清单（只做可逆＋低风险项）。</b></p><ul><li>冻结重大变更：不碰受众/素材/出价三连；只「救火」（报错、封户）。</li><li>修数据：补 CAPI 的 Qualified 回传逻辑＋双通道 event_id 去重（L0-03），目标 EMQ ≥7；上线后 3 天观察后台 Qualified 率是否向 38% 收敛。</li><li>建口径台账：Lead 定义、Qualified 定义、去重规则、归因窗口（7 天点击），写成一页文档共享销售。</li><li>跑 L2/L4 全套审计清单（资产/像素/CAPI/落地页），清单化打勾。</li><li>与销售开一次对齐会：确认 Qualified 判定口径＋承接容量（当前 40/月，真实 449 严重超载）。</li><li>建命名规范（市场-语言-受众-素材 四段式），先在新组试用，旧组暂不改名以免打断学习。</li></ul><p><b>30 天审计报告与路线图（里程碑）。</b></p><ul><li>W1：数据修复＋口径对齐（上述）。</li><li>W2–3：结构瘦身——合并重叠 Broad 组、RT 占比压到 15%、A/B 测试新命名。</li><li>W4：用 L10-01 决策环评估是否迁移优化事件到 Qualified（若 EMQ 稳定）。</li><li>W5–8：承接扩容谈判（招聘/排班）以消化超载线索，否则扩量无意义。</li><li>W9–12：第一版放量方案（参考 L7 系列）提交评审。</li></ul><p><b>禁止项：</b>第一周改受众/素材/出价三连；未经口径对齐就调预算；动 RT 信号通道。</p>",
cs:"<p><b>演练场景：接手上述工业设备账户的第一周与第 30 天。</b></p><ul><li><b>第一周只做三件事：</b>修 CAPI Qualified 去重回传（event_id 用 CRM 记录号＋状态名，保证幂等）、冻结 RT 加码（占比从 35% 压到 28% 观察）、建四段式命名规范。其余 9 项全部进 30 天路线图，不做。</li><li><b>W2 数据修复见效：</b>后台 Qualified 率从 22% 爬升到 33%（仍低于 CRM 真实 38%，但缺口收窄），真实 Qualified CPL 从 $30.3 降到 $24.2——模型开始学「找合格询盘的人」。</li><li><b>W4 结构瘦身：</b>12 组合并到 7 组（4 个 Broad→2 个、RT 6→2 且占比 15%），学习期重置一次但 2 周内重新稳定，平均 CPL $38→$31。</li><li><b>W8 承接瓶颈暴露：</b>销售承接容量仍是 40/月，而修复后真实 Qualified 已达 52/月——线索积压 12 个，转化信号反噬。据此暂缓放量、先谈排班扩容（应用 L7-08 的「增量 ≤ 承接余量 80%」）。</li><li><b>复盘：</b>若第一周就「大改三连」，会再重置学习期、且因尺子未校无法判断任何改动的效果——这就是克制省下的钱。审计发现「数据半聋 3 个月」本身就是最大的效果问题，比任何结构优化都值钱。</li></ul>",
f:"<p>论坛接管场景的社区智慧可佐证书中的克制原则：①「资产迁移」（户死 BM 活）是接管的技术前菜——本例资产健康所以省了这步；②「成熟品牌站能学到账户框架与底层逻辑」——接手好账户先学结构再动手，反向说明烂账户更不该乱动；③大量「接手就改改改结果更差」的踩坑帖，正是接管期乱改的反面教材。社区没有系统化的「七步接管」框架，但经验方向与本课程完全一致。</p>",
e:"<ul><li>接管即大改（证明自己 vs 尊重现状）——再重置学习期且无法归因；</li><li>不审计数据先信报表——建立在坏尺子上做决策；</li><li>忽略「为什么当初这么设」的口述历史——很多怪结构有真实原因（如某 RT 组是为大客户定制）；</li><li>没有 30 天路线图——接管变漫游，老板催一下动一下。</li></ul>",
q:{q:"接管第一周，老板催你「先改改效果」。你怎么回应与安排？",a:"回应框架：①先给「审计发现」建立信任（如已发现数据半聋 3 个月——这本身就是效果问题，真实 Qualified CPL 被虚高 70%）；②承诺节奏：第 1 周修数据与止血（可逆项），第 2–4 周结构优化，30 天路线图附里程碑；③用「接管期改三连=无法归因后续一切效果」的专业理由守住纪律（L0-05 学习期重置代价）。用流程争取信任，而非用大改赌博。"},
b:"完成一次模拟接管（真实或虚构账户），输出七步全部交付物：资产审计表、数据可信度对账、历史结构复盘、在投结构诊断、业务上下文、第一周清单、30 天路线图。"},
{id:"L11-02",lv:11,t:"综合案例 2：0→1 冷启动全流程",
g:"演练从零起步的完整开局：市场→技术→结构→素材→节奏的顺序与时间表，核心是「用外部信号替代内部数据、用小额买早期信号」。",
c:"<p><b>背景数据（0→1 起跑线）。</b>一个客单 $69 的 DTC 家居新品，目标市场北美（L1-07 一票否决项先过：竞品月搜索量 >5 万、COD 投诉率低、毛利 55%）。启动总预算 $600、周期 6 周。此时账户没有任何转化数据，像素是全新的——模型没东西可学，你也没东西可判断，这是 0→1 的核心矛盾。</p><p><b>诊断推演（为什么顺序不能乱）。</b></p><ul><li><b>① 市场选择（L1-07）。</b>先看外部信号：竞品、搜索量、毛利、合规。一票否决项不过，后面全白做。本例北美通过。</li><li><b>② 技术基建（L2-06 清单）。</b>像素＋CAPI 双通道（EMQ 目标 ≥7）、落地页转化事件配齐（PageView/Lead/Contact）、归因窗口锁 7 天点击。技术不过关，养出来的数据也是残的（L0-04）。</li><li><b>③ 最小结构。</b>1 个 Campaign、1–2 组、Broad＋专业素材自我筛选（L0-08：不切碎、让模型吃满样本）。</li><li><b>④ 首批素材。</b>2–3 个 Angle×Hook 变体，每条绑定一个假设（如「价格锚点」vs「场景痛点」），假设错了才好迭代。</li><li><b>⑤ 节奏。</b>小步验证：$10–20/天起步、出单组翻倍、周复盘（L7-05 阶梯纪律的雏形）。</li></ul><p><b>决策选项（6 周关键分叉）。</b></p><ul><li>选项 A：加码（信号方向对，边际 CPL 可接受）。</li><li>选项 B：换假设（Angle 不对，但市场对）。</li><li>选项 C：换市场（市场选错，L1-07 一票否决没过透）。</li></ul><p><b>决策与理由（用预设淘汰线做判断，不是凭感觉）。</b>0→1 阶段的判据是「信号方向」而非「结果绝对值」——前 6 周的亏损买的是决策资产（像素数据/素材基准/落地页经验）。第 5 周花 $600、来 28 个 Lead、Qualified 率 18%（标准 40%）但无成交（成交周期 3 个月）。决策：信号方向对（Lead 在来、落地页到达率 62% 健康）但 Qualified 率偏低→选 B 换 1 个 Angle＋加严 Offer，再给 2 周；若 Qualified 率仍不收敛→换假设重测；市场本身不否决。用 L10-01 决策环：假设=「价格锚点 Angle 能拉 Qualified」，动作=换 Angle，验证窗=2 周看 Qualified 率是否向 30% 收敛。</p>",
m:"<p>0→1 的核心矛盾＝「没有数据时什么都难」：模型没数据学不动、你也没数据做判断。解法＝用外部信号（市场研究/竞品/假设库，L1-07）替代内部数据，用小预算买「早期信号」而非追求回报。边际视角提醒：新像素直接优化 Purchase 几乎学不动（50 事件/周门槛够不着），所以先优化 Lead 走量、再迁移到 Qualified（L5-01）——一切回到 L0-05 的样本量约束。</p>",
h:"<p><b>6 周开局表（每步淘汰线预先写死）。</b></p><ul><li><b>W1 技术基建＋素材生产：</b>双通道装好、EMQ ≥7、出 2–3 个 Angle 素材。淘汰线：EMQ <4 不开投。</li><li><b>W2–3 探测（$20/天，只看前端健康）：</b>盯 CTR/CPC/CPM/落地页到达率。淘汰线：CTR <1.0% 或落地页到达率 <50%→先修落地页，不进 W4。</li><li><b>W4–5 信号判读：</b>首批 Lead 的 Qualified 率 >40% 比 CPL 绝对值重要。淘汰线：Qualified 率 <20% 且无成交→换假设；有 Qualified 但 CPL 离谱→优化素材。</li><li><b>W6 决策：</b>加码/换假设/换市场三选一，必须给出数字依据。</li></ul><p><b>预算纪律：</b>单组 $10–20/天、出 1 单翻倍到 $40、总止损 $600–800 没正向信号换品（论坛测品纪律 $50–80 总止损的放大版，因客单更高）。</p>",
cs:"<p><b>论坛 0-1 实录全程对照（玩具收纳类，客单 $47）。</b></p><ul><li>新户 $10/天养像素（技术基建）→数据积累→出单组翻倍（节奏）：W1–2 跑主页浏览/加购养事件，W3 起跑转化，第 18 天出第一单。</li><li>第二个月 $1,800 花 36 单、GMV $1,600——账面亏损，但拿到全部「决策资产」：像素数据（单美 CPC 稳到 $1.2）、素材基准（3 条 winner）、落地页经验（支付图标/评价/FAQ 优化点）。</li><li><b>对照本课：</b>它的「亏损」正是 0→1 该买的信号。若用本课框架，W4 就该用 Qualified 率（而非 GMV）判读，提前 2 周决定换 Offer 还是加码——把「亏钱」变成「可控的实验成本」。</li></ul>",
f:"<p>论坛 0-1 智慧密度极高且与课程同构：①完整复盘（养像素链路/落地页优化/结账流失排查，用 Hotjar 看行为）；②测品纪律（$5–10/组、48h 止损、$50–80 总止损）；③起手参数（客单 $50–70→$30–50/天）。社区经验与课程框架在 0→1 完全对齐——区别只在社区靠直觉喊停，课程把淘汰线写成数字。</p>",
e:"<ul><li>0→1 一上来冲大预算（学费指数级）——新像素学不动，钱打水漂；</li><li>没有淘汰线（僵尸开局拖三个月）——不知道该换还是该加；</li><li>素材赌一张（无假设矩阵）——错都不知道错在哪；</li><li>忽略养数据期（新像素直接跑转化目标）——50 事件门槛够不着，模型乱学；</li><li>把前 6 周的亏损当失败——它买的是决策信息，不是回报。</li></ul>",
q:{q:"0→1 第 5 周：花了 $600，28 个 Lead，Qualified Rate 18%，无成交（成交周期 3 个月）。继续吗？",a:"按预设判据看：①Qualified Rate 18% 偏低（若标准 40%）→先查根因树（筛选/受众/素材，L6-03）；②但 B2B/长周期成交周期未到，无成交属预期，不算失败；③决策：小修（换 1 个 Angle/加严 Offer）再给 2 周；若 Qualified 率无收敛→换假设重测；收敛→进入加码评估。0→1 阶段的判据是「信号方向」而非「结果绝对值」（用 L10-01 决策环框住假设与验证窗）。"},
b:"写出一个真实/虚构产品的 6 周开局表（含每周动作与淘汰线），并用 L1-07 市场否决项 + L0-05 样本量约束论证你的起手预算。"},
{id:"L11-03",lv:11,t:"综合案例 3：放量与瓶颈突破",
g:"演练「跑得好但扩不动」的标准破局：诊断瓶颈类型→选择扩量路径→执行节奏，核心是「诊断先于动作、路径优于蛮力」。",
c:"<p><b>背景数据（扩张前快照）。</b>德语区 B2B 设备账户 DE 组：月预算 $9,000、平均 CPL $48、Qualified 率 41%、真实 Qualified CPL $117。边际曲线显示：当前周花费 $2,250（周预算 $2,250），边际 Deal Cost（新增花费带来的成交成本）$260，上限 $300——还没到拐点。素材组合 4 个 Angle 健康。销售余量 25%（承接容量 50/月，已用 38）。奥瑞（同语言区）尚未并组。这是典型的「能扩但没扩对地方」。</p><p><b>诊断推演（先确认瓶颈类型）。</b></p><ul><li><b>① 三层天花板（L7-01）：</b>受众触达率 24%（远未到 70% 饱和）→不是受众天花板；竞争层 CPM 稳定→不是竞争天花板；承接层销售余量 25%→承接有余。结论：瓶颈不在「触顶」，而在「路径没选对」。</li><li><b>② 五维扩量顺序（L7-04）：</b>新 Angle→受众→版位→同语言区→新市场。当前素材健康，优先同语言区（奥瑞）扩池，零学习成本。</li><li><b>③ 横向选项评估（L7-02）：</b>复制 DE 组（重叠 47%，内耗）、并奥瑞（同语言扩池、零学习成本）、开新市场（法国，学习成本高）。</li></ul><p><b>决策选项。</b></p><ul><li>选项 A：直接复制 DE 组冲量（最直觉）。</li><li>选项 B：并奥瑞同语言区＋新 Angle 上线＋阶梯 +20%。</li><li>选项 C：直冲法国新市场。</li></ul><p><b>决策与理由（选 B）。</b>复制 DE 组会与现组重叠 47%（L0-08 数据碎片化＋互相抢量），且边际 CPL 会因内耗上升；直冲法国学习成本高（新语言/新素材，50 事件门槛难达）。最优解=并奥瑞（同语言扩池、零学习成本）＋新 Angle 上线（Creative 维再挤一轮，成本低）＋阶梯 +20%×3 步（L7-05）。边际演算：并奥瑞后总可触达人群 ×1.8，边际 Deal Cost 预计从 $260 降到 $235（池子变大、竞争不变）；阶梯 +20% 三步后周预算 $2,250→$2,700→$3,240→$3,888，每步验证边际 Deal Cost 是否仍 <$300、销售余量是否 ≥20%。</p>",
m:"<p>放量失败的三种典型：①盲目纵向（直奔天花板买贵量）——边际 Deal Cost 突破 $300 还加；②一次性横向（多组同开内耗＋归因混乱）——复制 DE 组重叠 47% 就是反面教材；③放量不管承接（线索积压反噬转化信号）——销售余量跌破 20% 还加预算。破局＝诊断先于动作（先定位三层天花板）、路径优于蛮力（按 L7-04 五维顺序走）。</p>",
h:"<p><b>案例演练流程（给一组扩张前数据走决策树）。</b></p><ul><li>输入：边际曲线/受众触达率/素材组合/销售容量。</li><li>步骤：①确认瓶颈类型（L7-01）→②选扩量路径（L7-04）→③定节奏（L7-05 阶梯 +20%）→④横向选项评估（L7-02 复制/并区/新市场边际对比）→⑤承接确认（L7-08 增量 ≤ 承接余量 80%）。</li><li>输出：扩量方案书（路径/节奏/里程碑/回撤线）。</li></ul><p><b>回撤线（纪律护栏）：</b>任一步边际 Deal Cost >$300，或销售余量 <20%，或 Qualified 率周环比跌 >5pt→回撤到上一步预算，重新诊断。</p>",
cs:"<p><b>演练数据复盘（最优解 vs 常见错解）。</b></p><ul><li><b>最优解（选 B）：</b>并奥瑞（同语言扩池，零学习成本）＋新 Angle 上线＋阶梯 +20%×3 步。结果：3 周后周预算 $3,888、边际 Deal Cost $238（<上限 $300）、Qualified 率稳 40%、销售余量 22%（仍在 80% 原则内）。</li><li><b>错解一（复制 DE 组）：</b>重叠 47%，两周后 DE 与原组互相抢量，边际 Deal Cost 飙到 $315，Qualified 率跌到 33%——触发回撤线。</li><li><b>错解二（直冲法国）：</b>新语言新素材，6 周才勉强出 12 个 Lead，学习期反复重置，真实 Qualified CPL $190 但样本太小无法判断——前三维没吃满就动新市场，浪费一个周期。</li></ul>",
f:"<p>论坛放量打法对照：①小强（自动化规则 +10%/小时分层加预算＝节奏纪律，可正规复用）；②一拖三/一拖五（横向阶梯，给不同预算撞不同出价层级）；③品牌站换时区拉预算（择时，晚 11 点观察 ROAS 再拉 15%）；④一刀流是放量纪律的反面全书（对冲思路可借鉴、整体不可学，见附录 A4）。社区这些打法都在做同一件事：阶梯式、看边际、管承接。</p>",
e:"<ul><li>加预算当唯一的放量手段——撞到天花板买贵量；</li><li>多组同日全开——内耗＋归因混乱；</li><li>放量期不盯边际（只看平均）——边际 Deal Cost 爆了还在加；</li><li>销售容量从未纳入计算——线索积压反噬转化信号。</li></ul>",
q:{q:"边际曲线到拐点、素材组合健康、销售有余量、无同语言区可并。下一步？",a:"按五维顺序（L7-04）走到「新市场」档：①先用 Creative 维再挤一轮（新 Proof/新 Hook 类型，成本低）；②评估新市场：六维排序选候选→探测期小预算（$20–30/天×3 周）→晋级线明确（边际 Deal Cost <上限、Qualified 率达标）；③同期准备承接（本地化 LP/时区排班）。新市场是「贵但必要」的最后一维——前三维（新 Angle/受众/版位）没吃满前不动它（用 L7-08 承接 80% 原则兜底）。"},
b:"完成一次放量破局演练，输出完整扩量方案书（路径/节奏/里程碑/回撤线），并用 L7-01 三层天花板论证你的瓶颈判断。"},
{id:"L11-04",lv:11,t:"综合案例 4：质量恶化大排查",
g:"演练「量还在、质崩了」的复杂排查：多因素交织下的系统定位，纪律＝一次只处理一个嫌疑变量＋用对照数据交叉验证。",
c:"<p><b>背景数据（恶化前/后快照）。</b>某 SaaS 询盘账户：恶化前 Qualified 率 45%、月 Lead 900、真实 Qualified CPL $22；恶化后 Qualified 率 28%（跌 17pt）、Lead 量持平 905、真实 Qualified CPL 从 $22 涨到 $35。量没变、质崩了——这是最难排的案，因为「量还在」会麻痹人。</p><p><b>诊断推演（剥洋葱，先确认真恶化）。</b></p><ul><li><b>① 先确认「真的恶化」（口径检查）。</b>查 Qualified 定义是否变了、回传是否断了、Cohort 是否成熟（L6-13/09）。本例回传正常、Cohort 成熟，确属真恶化。</li><li><b>② 根因树四大分支（L6-03）：</b>口径/人群/素材/Offer 流程。埋 4 个真实因素：①上月上新 2 条泛流量素材；②Broad 组扩了一个国家；③销售部悄悄改了 Qualified 判定口径（收紧）；④季节性竞价上涨。</li><li><b>③ 组合效应排查（L4-09）：</b>哪个「素材×受众」组合在拖累——用交叉表定位「Broad＋新国家＋泛素材」组合。</li><li><b>④ 验证动作（L10-01 决策环）：</b>单变量暂停/回撤，设验证窗。</li></ul><p><b>决策选项。</b></p><ul><li>选项 A：同时回撤所有嫌疑变量（最快，但无法归因）。</li><li>选项 B：按「口径→结构→素材」顺序逐层剥，每层单变量验证。</li><li>选项 C：只换素材（最直觉，但漏掉口径因素）。</li></ul><p><b>决策与理由（选 B）。</b>质量案比成本案难在「多因素共线」——人群漂移、素材换血、销售标准微调可能同时发生且互相掩护。必须按「口径→结构→素材」顺序剥洋葱：先剥离口径因素（销售标准收紧）重算，真实降幅从 45%→28% 修正为 45%→36%（口径因素贡献了 9pt 的「假恶化」）；再定位 Broad＋新国家＋泛素材组合暂停。一次只处理一个嫌疑变量＋用对照数据交叉验证（MSG 294：恢复≠证明）。若选 A 同时回撤，永远不知道是哪个因素作的怪，下次原样重犯。</p>",
m:"<p>质量恶化排查的纪律＝一次只处理一个嫌疑变量＋用对照数据交叉验证（MSG 294 的 Difference-in-Differences：降预算后质量恢复仍不能 100% 证明因果）。多因素共线时，并列变量未排除就「定案」，等于把相关性当因果。这里用 L0-08 的 First Loss 定位：第一处掉链子的不是投放层，而是「口径＋结构」两层，所以修复后必须升格 SOP 防复发。</p>",
h:"<p><b>演练包数据设计（埋 4 因素）。</b></p><ul><li>账户：Qualified 率 45%→28%、Lead 量持平。</li><li>真实因素：①上新 2 条泛流量素材；②Broad 组扩 1 个国家；③销售部改 Qualified 口径（收紧）；④季节性竞价上涨。</li><li>排查顺序：口径（剥离销售标准因素重算）→结构（Broad＋新国家组合）→素材（泛流量素材）。</li></ul><p><b>防复发 SOP（修复后升格）：</b>①素材准入含 Qualified 预估（新素材上线前预估 Qualified 率）；②口径变更必须通报市场部（销售改标准＝口径事件，走 L6-13 变更通报）；③月度交叉表复盘「素材×受众」Qualified 率。</p>",
cs:"<p><b>演练解法路径（W1–W3）。</b></p><ul><li><b>W1 发现口径变了：</b>销售标准从「留电话即 Qualified」收紧为「留电话＋预算区间达标」。剥离该因素重算：真实 Qualified 率 45%→36%（而非后台显示的 28%），「假恶化」9pt 来自口径。</li><li><b>W2 定位结构＋素材：</b>交叉表显示「Broad＋新国家＋泛素材」组合 Qualified 率仅 19%（其余组合 41%）。暂停泛素材、收回新国家扩展。</li><li><b>W3 回升验证：</b>Qualified 率回到 39%（仍低于原 45%，因口径已收紧——这是新基线，属正常），真实 Qualified CPL 从 $35 回到 $25。防复发 SOP 落地：素材准入含 Qualified 预估、口径变更必须通报市场部。</li></ul>",
f:"<p>论坛同类案（质量崩）的讨论常停在「素材不行/风控来了」单因子，三大致命操作是单因子版（同时回撤所有变量）。课程 MSG 284–296 的 Difference-in-Differences 训练（降预算后质量恢复仍不能 100% 证明因果）是本案例的统计学地基——社区凭直觉「恢复了就是它干的」，课程要求「证据链闭合才定案」。</p>",
e:"<ul><li>同时回撤所有嫌疑变量——无法归因，下次原样重犯；</li><li>把「恢复」当「定罪」——并列变量未排除，相关性当因果；</li><li>口径变更被销售隐瞒——无跨部门通报机制，假恶化当真恶化；</li><li>修复后无防复发——半年后原样重犯。</li></ul>",
q:{q:"排查发现暂停泛素材后质量回升。能定案「就是它干的」吗？",a:"不能 100%（MSG 294 的 Difference-in-Differences 边界）：同期可能有竞争者退出、季节性回暖、或另一变量自行衰减。补强证据：①该素材单独漏斗是否本就差（事前数据）；②Difference-in-Differences（与其他组的质量趋势对照）；③必要时再启停一轮复现。定案＝证据链闭合，而非「时间上对得上」（用 L10-01 决策环的验证窗＋对照组数据交叉验证）。"},
b:"完成质量恶化演练（或用真实数据），输出排查报告（口径→结构→素材三层）+ 防复发 SOP。"},
{id:"L11-05",lv:11,t:"毕业考：Blind Decision + Post-mortem",
g:"终极演练：给定陌生账户的完整数据包，限时独立做出全套决策，再对照「上帝视角」复盘，重点不在对错而在「决策过程质量」。",
c:"<p><b>背景数据（盲考数据包）。</b>陌生账户 90 天数据：①漏斗——CPM $9.2、CTR 2.1%、LPV 率 64%、Lead 率 3.8%、Qualified 率 33%；②Breakdown——3 个市场 DE/AT/CH，DE 占预算 60%；③CRM——真实 Qualified 率 33%、成交周期 45 天；④变更日志——上月加了新国家（PL）、预算月环比 +40%；⑤市场背景——竞品 Q2 加大了 Meta 投放。考生需在 90 分钟内产出决策包。</p><p><b>诊断推演（考生视角，先校尺子再动手）。</b></p><ul><li><b>① 接管审计（找 3 个发现）：</b>发现一＝CPM 三周 +35%（外部竞争，非内部问题）；发现二＝Qualified 率 -12%（混合恶化）；发现三＝变更日志显示上月加新国家 PL 且预算 +40%——扩量稀释＋承接可能过载。</li><li><b>② 用 L0-08 First Loss 定位：</b>CTR 稳、LPV 稳，掉在 Lead 率与 Qualified 率——属「人群/承接」层而非落地页层。</li><li><b>③ 用 L7-01 三层天花板：</b>新国家 PL 触达率低（扩量稀释）、销售容量打满（承接过载）、竞品加投（外部竞争）——混合型恶化。</li></ul><p><b>决策选项（3 个紧急动作的决策环）。</b></p><ul><li>动作一：PL 新国家暂停（假设＝扩量稀释导致 Qualified 率跌）。验证窗：2 周看 Qualified 率是否回升。</li><li>动作二：预算回撤到 +15%（假设＝承接过载）。验证窗：销售容量利用率是否 <80%。</li><li>动作三：DE 组加新 Angle（假设＝竞争需用 Creative 维再挤，L7-04）。验证窗：CTR/CPL 是否改善。</li></ul><p><b>决策与理由（过程分 > 结果分）。</b>按依赖序给组合方案：先止血（动作一＋二，可逆）再优化（动作三），而不是单点开药。评分维度：纪律分（先校口径、单变量、验证窗）、框架分（First Loss/根因树/边际/组合调用得当）、判断分（关键分叉选对）、沟通分（Memo 质量）。</p>",
m:"<p>考核的评分维度：①纪律分（是否先校口径再动手、是否单变量、是否设验证窗）；②框架分（工具调用是否得当：First Loss/根因树/边际/组合）；③判断分（关键分叉点的选择）；④沟通分（Memo 质量）。过程分 > 结果分——结果受运气影响，过程才是能力。判断全对但加码幅度过大被扣分，说明「判断」与「力度感」是两种能力：后者来自 L7-05 阶梯节奏、L7-08 承接 80% 原则的数字纪律内化。</p>",
h:"<p><b>备考建议与通过标准。</b></p><ul><li>把 L1–L10 的每个「达标标准」过一遍（它们就是考点）。</li><li>做 2–3 轮完整演练（可用真实历史账户倒推）。</li><li>找同行互考互换复盘（Post-mortem 对照「标准决策路径」）。</li><li>通过标准：四维评分均 ≥70% 且无「纪律类」硬伤（数据未校就动手、多变量同改、无验证窗）。</li></ul><p><b>1 页 Memo 模板：</b>3 个审计发现 → 30 天路线图（3 里程碑）→ 3 个紧急动作（各含假设/动作/验证窗）→ 回撤线。</p>",
cs:"<p><b>样题片段对照（上帝视角）。</b></p><ul><li>数据包显示「CPM 三周 +35%、CTR 稳定、Qualified 率 -12%、变更日志上月加新国家、销售容量打满」。</li><li><b>标准决策路径：</b>识别混合型恶化（外部竞争＋扩量稀释＋承接过载）→ 按依赖序：先回撤 PL＋压预算到承接余量内（止血，可逆），再对 DE 上新 Angle 对抗竞争（优化），最后谈销售排班扩容（承接）。</li><li><b>评分要点：</b>能区分「外部竞争不可控、扩量稀释可控、承接过载可控」并分层出方案者得高分；只开「换素材」一味药者纪律/框架双丢分。</li></ul>",
f:"<p>论坛没有此层（社区以问答与案例分享为主），但 311 页手册与品牌站复盘是社区「案例教学」的最高形态；本课程的毕业考把「读案例」升级为「做决策」——知行合一的最后一步。社区老手靠真金白银积累「力度感」，课程用决策日志把这种隐性能力显性化（L7-05/L7-08 数字纪律回填）。</p>",
e:"<ul><li>追求「标准答案」——真实投放没有唯一解，过程分才是考核对象；</li><li>跳过纪律直接秀技巧——过程分大头在纪律（先校口径、单变量、验证窗）；</li><li>只复盘结论不复盘过程——错对的运气成分无法区分；</li><li>考完不复盘——演练价值归零。</li></ul>",
q:{q:"毕业考中你「判断全对但建议的加码幅度过大」被扣分。这类错误说明什么？",a:"判断分与纪律/幅度感是两种能力：前者是分析（找对问题），后者是「力度感」——来自大量决策环的校准（每次动作幅度/节奏的后果反馈）。修补法：把 L7-05（阶梯节奏）、L7-08（承接 80% 原则）的数字纪律内化为默认值，并在决策日志里持续回填「实际幅度 vs 效果」的对应关系（用 L10-01 决策环的验证窗积累校准数据）。"},
b:"完成一次完整 Blind Decision，四维评分（纪律/框架/判断/沟通）与改进清单落库。"},

{id:"A1",lv:"A",cat:"A1",t:"CRM→CAPI 回传架构精要",
g:"浓缩课程第九章的工程精华：CRM 业务状态如何可靠地变成 Meta 事件，分「状态检测→事件生成→队列→发送」四层。",
c:"<p><b>核心概念。</b>State（状态，如「已合格」）vs Event（状态第一次转换的瞬间）；State Machine（允许的状态跳转路径表）；Event Record（业务事件的存证）与 Transmission Log（发送记录）分离；Event Queue（异步发送队列，失败可重试）。</p><p><b>数据流图（文字＋箭头，四层）。</b></p><p>CRM 状态变更 ──▶ ① 状态差检测（比对 Previous/Current）── 仅当「首次转换」──▶ ② 生成 Event Record（存证）──▶ ③ 入 Event Queue（异步）── 退避重试 ──▶ ④ Meta 发送 ＋ 写入 Transmission Log（发送记录）</p><ul><li><b>① 状态差检测层：</b>每日定时跑任务，对比每条 CRM 记录的 Previous 状态与 Current 状态。只有「状态首次前进」（如 待定→Qualified）才生成事件；回退（Qualified→待定）不生成。失败模式：没存 Previous 快照 → 每次都误判为「首次」→ 重复事件。</li><li><b>② Event Record 层：</b>业务事件的存证（谁、什么时候、从什么变到什么），与发送分离。失败模式：只发不存 → 出问题无法审计、无法补发。</li><li><b>③ Event Queue 层：</b>异步发送队列，削峰＋解耦＋可靠。失败模式：同步直发 → 发送端一挂，事件永久丢。</li><li><b>④ 发送＋日志层：</b>带 event_id 发送，记录 Transmission Log（事件 ID/发送时间/响应码/重试次数）。失败模式：无 Transmission Log → 无法回答「Meta 收到没」。</li></ul><p><b>核心字段表（每个事件必备）。</b></p><ul><li><b>event_id</b>：事件唯一身份证＝CRM Record ID ＋ 状态名（如 LEAD-88231-Qualified），保证去重一致性（同一记录同一状态只算一次，L0-03 双通道机制）。</li><li><b>event_name</b>：语义名（Lead / Qualified / Purchase），标准事件优先。</li><li><b>event_time</b>：业务发生时间（用状态变更时间，而非发送时间）。</li><li><b>crm_id / user_info</b>：用户标识（哈希后的 email/phone），供 Meta 匹配回画像、拉高 EMQ（L0-03）。</li><li><b>value / currency</b>：业务价值（如 Qualified 预估 LTV $1,200），让模型学「高价值人群」。</li><li><b>hash 字段</b>：em（邮箱 SHA-256）、ph（手机 SHA-256），CAPI 侧必传以拉 EMQ。</li></ul>",
m:"<p>为什么不能「销售点个按钮就发事件」：①状态回退会产生假事件（Day 5 又点一次 Qualified=重复，污染模型）；②同步发送失败即丢信号（无队列则宕机即丢）；③无存证则无法审计（出事查不出）。正确架构＝状态变更检测→生成 Event Record→入 Queue→带重试发送→记录 Transmission。这四层对应 L0-03 的「Signal 才是模型真正学的」，事件不可靠＝信号不可靠。</p>",
h:"<p><b>最小可行方案。</b></p><ul><li>① CRM 状态字段＋变更历史表（存 Previous/Current）。</li><li>② 每日定时对比 Previous/Current 状态，首次转换才生成事件。</li><li>③ Event ID＝CRM Record ID＋状态名（保证去重一致性，MSG 433）。</li><li>④ 发送失败退避重试（1h/6h/24h，见 A2）。</li></ul><p><b>四层失败模式对照表（自检用）：</b></p><ul><li>检测层漏＝重复事件；存证层漏＝无法审计；队列层漏＝宕机丢事件；日志层漏＝无法对账。</li><li>深度工程（DLQ/幂等）见课程第九章原文与附录 A2。</li></ul>",
cs:"<p><b>演练：工业设备账户的 Qualified 回传修复。</b></p><ul><li>修复前：CAPI 只发 Lead/Purchase，Qualified 漏发 3 个月 → 模型「半聋」，真实 Qualified CPL 被虚高 70%（见 L11-01）。</li><li>修复动作：加「状态差检测」任务（比对 Previous/Current），首次 待定→Qualified 才生成 Event Record（event_id＝LEAD-88231-Qualified），入 Queue 退避发送，写 Transmission Log。</li><li>结果：上线 3 天后后台 Qualified 率从 22% 爬到 33%，真实 Qualified CPL 从 $30.3 降到 $24.2；Day 5 回退（Qualified→待定）未发事件，Day 30 重新合格发新事件（新 event_id，MSG 433 合规）。</li></ul>",
f:"<p>论坛无对应工程实践（社区停留在手工导入导出）；各类报错处理本质是「无架构时代的手工补丁」。此附录是 B2B 投放从「会投」到「体系化」的分水岭——把销售系统的状态变化变成模型可学的可靠信号。</p>",
e:"<ul><li>重复事件（状态回退未防）——污染模型、虚增转化；</li><li>Event ID 不稳定（去重失效）——双通道算成两次；</li><li>发送无存证（出问题无法审计）——丢数据无人知；</li><li>同步直发（失败即丢）——宕机即永久丢失。</li></ul>",
q:{q:"客户状态 Day 5 从 Qualified 改回「待定」，Day 30 又改回 Qualified。系统应该发几次事件？",a:"Day 5 回退不发（回退不是新的合格瞬间）；Day 30 重新合格=一次新的状态转换→可发新事件，但 Event ID 必须与第一次不同（同一 Record 的第二次 Qualified 是新事件，MSG 433 的标准答案：Day 30 可以产生新的 Qualified Event，且不能继续使用第一次的 Event ID，否则会被 L0-03 去重机制判为同一事件而丢弃）。"},
b:"能画出「状态变更→事件生成→队列→发送」四层图并指出每层的失败模式，并写出你账户的 Qualified 事件字段表。"},
{id:"A2",lv:"A",cat:"A2",t:"Event Queue / Retry / 传输日志",
g:"掌握回传系统的可靠性三件套：队列化、退避重试、全链路日志，并把发送过程建模成状态机。",
c:"<p><b>可靠性三件套的协同。</b></p><ul><li><b>Queue（队列）</b>：削峰（营销活动导致的状态变更洪峰）＋解耦（业务系统与 Meta API 互不拖死）＋可靠（失败不丢）。</li><li><b>Retry（退避重试）</b>：指数退避 1h→6h→24h，叠加随机扰动（Jitter）避免「重试风暴」打爆 API。</li><li><b>Transmission Log（传输日志）</b>：必录事件 ID / 发送时间 / 响应码 / 重试次数 / 最终状态。</li></ul><p><b>发送状态机（State Machine）。</b></p><p>Pending（入队未发）──▶ Sending（发送中）── 成功 ──▶ Sent（Meta 已确认）<br>　　　│　　　　　　　　　　　│── 失败（可重试：5xx/限流 429）──▶ Retrying（按退避计时）<br>　　　│　　　　　　　　　　　│── 失败（不可重试：4xx 字段非法）──▶ Dead（进 DLQ 人工）<br>　　　└─ Retrying 重试耗尽（>3 次）──▶ Dead（DLQ）</p><ul><li><b>可重试错误</b>：网络超时、Meta 限流（429）、5xx。进 Retrying，按 1h/6h/24h 退避＋Jitter。</li><li><b>不可重试错误</b>：字段校验失败（4xx 业务错误）、event_id 非法。直接进 Dead Letter Queue（DLQ），人工修数据后重发。</li></ul><p><b>幂等设计（为什么重复发送无害）。</b>每个事件带稳定 event_id；Meta 侧按 event_name＋event_id 去重（L0-03 双通道机制）。即便因重试导致「发送两次」，Meta 也只记一次。幂等的关键：event_id 在重发时不变（不能用发送时间当 ID）。另：业务侧重发前先查 Transmission Log 该 event_id 是否已是 Sent，避免无谓重试。随机扰动（Jitter）确保一批失败事件不会在同一秒集体重试，压平 API 峰值。</p>",
m:"<p>「事件发生」和「事件送达」是两件事：必须分开记录才能回答「Meta 为什么没收到」——是没生成（业务侧）、没发送（网络侧）、还是没匹配（Meta 侧，EMQ 低）。这是第八章 Debugging 框架（MSG 424）的工程基础。没有状态机，你无法区分「正在重试」与「已死」；没有幂等，重试会制造重复事件——两者缺一不可。</p>",
h:"<p><b>监控面板三指标。</b></p><ul><li>队列深度（积压＝业务洪峰或 API 故障）：告警线 >1 天工作量。</li><li>发送成功率：告警线 <95%。</li><li>Meta 侧 Event Received 对账（周度）：业务侧 Sent 数 vs Meta 收到数，差额 >5% 即查 EMQ/去重。</li></ul><p><b>退避参数表：</b>第 1 次失败 1h 后重发、第 2 次 6h、第 3 次 24h、第 4 次（仍失败）进 DLQ。每次重试叠加 0–300s 随机 Jitter。</p>",
cs:"<p><b>演练：服务器宕机 2 小时的事件丢失测试。</b></p><ul><li>场景：周一发现上周五服务器宕机 2 小时，期间 30 个 Qualified 状态变更。</li><li>架构 A（Event Record 与 Transmission Log 分离＋队列）：宕机只影响「发送」，恢复后队列自动补发（带重试），30 个事件未丢，周一上午全部 Sent。</li><li>架构 B（同步直发且无存证）：这 30 个事件永久丢失，只能从 CRM 状态历史人工补发（且易重复）。</li><li>结论：状态机让「正在重试」可见、「已死」可捞；分离架构让宕机≠丢数据。</li></ul>",
f:"<p>论坛对应物为零（纯工程领域）；但「Meta 收到了吗」的困惑社区高频存在（数据对不上）——本附录就是那个困惑的系统级答案。社区手工补发的本质，就是把本该由 Queue＋Retry 自动做的事人肉化了。</p>",
e:"<ul><li>失败后无限快重试（触发限流 429，雪崩）——应指数退避＋Jitter；</li><li>无对账（丢数据无人知）——业务侧 Sent 与 Meta Received 必须周度比对；</li><li>日志缺失时间戳（无法排查时序问题）——Transmission Log 必录发送时间＋响应码；</li><li>用发送时间当 event_id（破坏幂等）——重试变重复事件。</li></ul>",
q:{q:"周一发现上周五的服务器宕机 2 小时，期间 30 个 Qualified 状态变更。事件丢了吗？",a:"取决于架构：若事件生成（存证）与发送分离且进队列——宕机只影响「发送」，恢复后队列自动补发（带重试），事件未丢（对应 A2 状态机的 Pending/Retrying 自愈）；若同步直发且无存证——这 30 个事件永久丢失，只能从 CRM 状态历史人工补发。这正是「Event Record 与 Transmission Log 分离」的价值（与 A1 四层架构呼应）。"},
b:"为你的回传链路补上三件套（Queue/Retry/Log）与发送状态机，或写明现有链路的可靠性缺口（DLQ/幂等/对账是否齐备）。"},
{id:"A3",lv:"A",cat:"A3",t:"Data Dictionary / Event Schema 规范",
g:"建立字段级的数据字典：让每个事件的每个字段「只有一个含义」，并用 Schema 版本化管理跨事件复用。",
c:"<p><b>Data Dictionary 的核心纪律。</b>所有事件的字段清单（名称 / 类型 / 含义 / 取值范围 / 负责人）集中管理；一个字段一个含义，跨事件复用不许变义（「标准变了」＝历史数据报废，MSG 355–356）。Schema 版本化：v1/v2 记录变更日期与理由，历史数据不改。新增字段走评审（谁提/谁审/影响面）。</p><p><b>三个核心事件的 Schema 示例。</b></p><p><b>① Lead 事件（询盘提交）。</b></p><ul><li>event_id：CRM Lead 号（如 LEAD-88231），唯一。</li><li>event_name：Lead（标准事件）。</li><li>event_time：表单提交时间（UTC）。</li><li>crm_id：CRM 记录号。</li><li>em / ph：哈希用户邮箱/手机（拉 EMQ，L0-03）。</li><li>content_name：产品/表单名。</li><li>value / currency：预估询盘价值（如 $300 / USD），可选但建议传。</li><li>lead_source：渠道标记（Meta / Google / 直接）。</li></ul><p><b>② Purchase 事件（成交，CRM 回传）。</b></p><ul><li>event_id：CRM Deal 号（如 DEAL-5521），与 Lead 不同事件、不同 ID 空间。</li><li>event_name：Purchase（标准事件）。</li><li>event_time：成交时间。</li><li>crm_id / em / ph：同 Lead 的用户标识（用于跨事件匹配同一人）。</li><li>value / currency：真实成交额（如 $3,200 / USD），必传。</li><li>order_id：订单号。</li><li>product_category：品类（用于细分分析）。</li></ul><p><b>③ Qualified 事件（合格询盘，CRM 状态转换回传）。</b></p><ul><li>event_id：CRM Record ID ＋ 状态名（如 LEAD-88231-Qualified），保证「同一 Lead 的第二次 Qualified 是新 ID」（MSG 433）。</li><li>event_name：Qualified（自定义或标准 Lead 的进阶，建议自定义以区分）。</li><li>event_time：状态变更为 Qualified 的时间。</li><li>crm_id / em / ph：用户标识。</li><li>value / currency：预估 LTV（如 $1,200 / USD），让模型学高价值人群。</li><li>qualifier：判定人/销售（审计用）。</li><li>industry / region：行业档/地区档（A3 字段字典的复用字段，含义固定）。</li></ul>",
m:"<p>为什么 Schema 一致性 > 字段数量：模型与你的分析都依赖「同样的输入=同样的含义」。字段乱义的后果是双重的——回传信号失真＋内部报表不可比。Data Comparability（口径可比）是跨时间/跨市场分析的前提（MSG 356–358）。一个字段两个含义，等于把历史数据悄悄废掉——这是比「少一个字段」更贵的错误。</p>",
h:"<p><b>落地四步。</b></p><ul><li>① 先建字典（哪怕只有 10 个字段），每个字段写清名称/类型/含义/取值范围/负责人。</li><li>② Schema 版本化（v1/v2 变更记录＋生效日期），历史数据不改。</li><li>③ 新增字段走评审（谁提/谁审/影响面：依赖此字段的报表与回传逻辑）。</li><li>④ 季度审计：抽 20 条真实事件对照 Schema 检查合规率（目标 ≥95%）。</li></ul><p><b>字段变更＝口径事件：</b>走版本管理（L6-13 原则在数据层的落地），通知所有消费方（CRM 报表/回传脚本）。</p>",
cs:"<p><b>演练：给 Qualified 事件的「行业」字段增加两个新取值。</b></p><ul><li>影响面评估：历史事件此字段分布、依赖此字段的报表（行业维度 Qualified 率）/回传逻辑。</li><li>Schema 升版：v1→v2，记录变更日期与理由（如新增「新能源/工程机械」两档）。</li><li>历史数据不改（保留原口径），新取值从生效日启用。</li><li>通知消费方：CRM 报表、CAPI 回传脚本、Meta 事件映射同步更新。</li><li>结果：跨时间对比时 v1 与 v2 分段清晰，不会出现「同一行业两种含义」的脏数据。</li></ul>",
f:"<p>论坛无对应概念；各类术语帖是「社区字典」的雏形——同一个词大家理解一致才能协作，数据字段同理，只是要求更严格（字段错义会直接污染模型信号）。</p>",
e:"<ul><li>同一字段多含义（不同人填不同东西）——历史数据报废；</li><li>Schema 随手改（无版本）——跨时间对比失真；</li><li>无字典（新人靠问老员工）——口径随人漂移；</li><li>字段越多越好论（低质字段污染）——少而准胜过多而乱。</li></ul>",
q:{q:"想给 Qualified 事件的「行业」字段增加两个新取值。正确流程？",a:"①评估影响面：历史事件此字段的分布、依赖此字段的报表/回传逻辑；②Schema 升版（v1→v2）记录变更日期与理由；③历史数据不改（保留原口径），新取值从生效日启用；④通知所有消费方（CRM 报表/回传脚本）。字段变更＝口径事件，走版本管理（L6-13 原则在数据层的落地，与 MSG 355–356 的「标准变更=历史报废」反向操作——用版本化避免报废）。"},
b:"写出你核心 3 个事件（Lead/Purchase/Qualified）的 Schema 与字段字典初版（含字段名/类型/含义/负责人）。"},
{id:"A4",lv:"A",cat:"A4",t:"奇技淫巧与野路子打法（论坛实录）",
g:"看懂社区流行过的非标准打法：机制、兴衰与教训——理解即可，不建议照搬。",
c:"四大流派：①一刀流（1-1-1 极低预算强拉，靠小幅加预算/开关挤量；「刀」=美金预算单位，衍生 10 刀流/万刀流/无刀流玩梗分级）；②小强打法（20 刀起、1-1-1、空投受众、自动化规则分层 +10% 加预算）；③结构命名流（111/11N/121/1NN = 系列-组-广告）；④玄学派（复制/开关重置学习期）。",
m:"兴衰史最有教育意义：一刀流 2026 年 3–5 月有效（「数据又好又能花钱」）→6 月初风控一来集体崩盘（「一整个月都在亏钱」）→7 月基本废（「一刀死了之后账户跑不起来」，短剧玩家 ROI 从 0.4 掉到 0.2）。机理：低预算玩法依赖风控窗口，窗口关闭即反噬——垃圾流量（「CPM 低的厉害，进的全是垃圾」）、花不动、转点炸。",
h:"可迁移的内核：①小强打法的「自动化规则分层加预算」（ROAS>3.5→+10%/小时、分层上限 $50/$100/$200/$300、不达标自动停）=正规可复用；②「横向激进纵向保守」（关快、建多、加慢）；③结构命名的控制变量思想（测素材 1-1-N、测受众 1-N-1、猛攻 1-1-1）；④「巨量怎么玩 FB 就怎么玩」的迁移心法。不可迁移：一切依赖风控窗口的钻空子部分。",
f:"全部来自 veryfb：一刀流；小强；结构命名；玄学翻车（「刚跑过学习期几天就归零了」）；社区态度：「没时间为一刀流哀悼，接下来登场的是无限流」——玩梗背后是「基本功回归」的共识。",
e:"把玄学当方法论（复制重跑常归零）；只学一刀流的「形」不学小强的「神」（有新人被只教一刀流的师傅带废，「一刀没了就彻底不会测品」）；把玩梗分级（亿刀流）当真打法。",
q:{q:"小强打法与一刀流的本质区别是什么？哪个内核值得 B2B 借鉴？",a:"一刀流赌的是「风控窗口+低预算挤出的算法红利」（外部漏洞）；小强赌的是「小步验证+规则化纪律+止损」（内部能力）。B2B 可借鉴小强内核：小预算起步、1-1-1 单条可归因、自动化规则小步加预算、跑坏即关复制重开——这些与课程 L7-05/L6-07 完全同构；一刀流不可借鉴（窗口已关+灰产关联）。"},
b:"能向同事讲清各流派的兴衰原因，并写出可迁移的三条内核。"},
{id:"A5",lv:"A",cat:"A5",t:"术语 & 黑话词典（论坛实录）",
g:"打通「课程书面语 ↔ 论坛社区语」的双向词典，看懂实战社区的每一句黑话。",
c:"结构类：ABO=组预算优化；CBO=系列预算优化；ASC=进阶赋能型销量广告（社区称「仙女座」，2025-02 更名 Advantage+ Sales）；111/11N/121/131/1NN=系列-组-广告数（直接念「一一 N」）。算法类：学习期（50 转化/7 天）、起量/掉量/跑量/空耗/满预算、像素/CAPI/BM/主页/企业户。指标类：ROAS/ROI/MER/CPA/客单价 AOV/LTV/CTR/CVR/CPM/CPC/频次。",
m:"黑话是「压缩的共识」：每个词背后是一段集体经验——「仙女座极度吃素材」压缩了 ASC 需 8+ 素材的实战规律；「空投」压缩了 Broad 受众思路；「吞金兽」压缩了放量失度的教训。双语能力=既读得懂官方文档，也听得懂一线社区。",
h:"使用建议：投放社区交流时用黑话（高效），写 Memo/对外文档时用标准语（清晰）；本课程正文用标准语+括号注黑话。高频对照：Broad=空投/通投；Winner=跑量素材；Learning Limited=学不动；Marginal CPL≈「加预算后新买的量贵不贵」。",
f:"全表来自 fb_tricks_terms.md（约 40 帖提炼）；「锅（现有帖子/受众）」「一波流」「卡头/接码」等词论坛未抓到明确原话，已标注「通用/存疑」——词典也讲究证据纪律。",
e:"黑话与标准语混用导致团队沟通歧义（「ASC」有人以为还是旧名）；把玩梗词（亿刀流）当正式术语写进文档；只懂黑话不懂机制（会背「吃素材」不知道为什么）。",
q:{q:"新人问「1-1-N 是什么意思、怎么读、什么时候用」。你的三句回答？",a:"①三个数字=系列数-广告组数-广告数；②直接念「一一 N」；③用途按社区共识：ASC/测素材场景用 1-1-N 且 N≥8（仙女座吃素材），单组塞多条差异化素材让算法优胜劣汰。"},
b:"自测：随机抽 10 个黑话能秒答含义与出处场景。"},
{id:"A6",lv:"A",cat:"A6",t:"高危警示区（论坛灰产实录）",
g:"认识社区里真实存在的高危玩法及其代价——定位是风险科普，不含任何操作手法。",
c:"五大高危区（论坛真实讨论存在）：①仿牌 FP（卖侵权品；双封、TRO 律师函、国内代理拒接、「割一波换一波」）；②买卖/租赁广告户（号商生态、假企业户骗局、号被找回、盗刷局、跑路）；③养号 farm（指纹浏览器+独立 IP 批量养号、死号连坐）；④绕过验证（视频验证改图片、地区「过审」偏方，有效性低随时失效）；⑤博彩/Slot（H5/PWA、地区轮换、素材秒拒、盘总上下游）。",
m:"真正的代价（社区原话实录）：封号封 BM 封支付通道是「常规操作」；资金冻结与追讨无门；「号商小泽被抓案」——抄家、蹲几年，这是灰产链顶端的结局样本。合规卖家的社区共识：「干掉灰的让我们吃口饭」。2026-06 风控潮证明：平台收紧时灰产首当其冲，波及的还有与灰产混谈的边缘打法（一刀流躺枪）。",
h:"自卫清单：①只与合规 BSP/官方接口合作；②拒绝一切「代开/包过/资源号」推销；③资产自主（自有 BM/主页/像素，提前绑老 BM 切忌裸奔）；④收款通道合规（黑五死户潮的教训）；⑤发现合作方涉灰立即切割（连坐风险）。",
f:"来源帖：仿牌；买卖户；养号；验证；博彩；代价与被抓案。完整提取物见 fb_risk.md（约 120 帖）。",
e:"低估「连坐」（同 BM/同收款链一损俱损）；相信「别人做了没事」（幸存者偏差——被抓的不会再发帖）；为短期 ROI 引入灰产流量认知（把垃圾流量当「行业常态」）；把高风险打法与正规打法混在同一套资产里。",
q:{q:"有人向你推销「包过验证的企业户，ROI 能到 3」。给出三层评估。",a:"①合法性层：买卖户+验证绕过属明确违规，法律风险真实（小泽案：抄家+刑责）；②经营层：户被找回/盗刷/跑路概率高，资产归零是常态而非尾部风险；③机会成本层：同样的钱与精力投在正规资产（自有 BM/素材/数据）会产生复利，灰产资产归零即清零。结论：不碰，且记录推销者避免牵连。"},
b:"能向团队讲清五大高危区的「代价清单」，并检查自家资产是否与灰产有接触面。"},
{id:"A7",lv:"A",cat:"A7",t:"错误代码速查（论坛整理）",
g:"建立报错响应手册：高频错误代码的含义、场景与处理，附排查优先级。",
c:"高频代码速记：1359036/3253001=广告数量上限（删/归档）；1815014=主页被取消发布；1487658=像素未设转化事件；1885272/1885650=预算过低；1870165/3858064=年龄红线（全球 18-/泰国 20-/印尼 21-）；2490042=域名不一致（落地页跳转）；1346003=落地页/App 被举报（隐性消耗！）；2446880=绑定的 WhatsApp 号已解绑；3843013=CTM 展示 EPD 广告需排除欧洲日本；1885029=主页不一致（假动作切换转化位置）。",
m:"排查优先级心法：先「权限/资产类」（个号受限、主页状态、BM 权限——「登录不进先查个号是否受限」）→再「配置类」（像素/事件/预算/年龄）→最后「内容类」（拒审/落地页）。高频事故 80% 集中在权限与配置层。",
h:"使用方式：报错→按「1 开头=结构/资产、2 开头=参数/创意、3 开头=政策/账户」粗定位→查本表处理→复现不了的操作（2446391 类）用「假动作」（切换选项再切回）触发系统重新校验。建议每季度对照官方帮助中心更新本表。",
f:"全部整理自《Facebook 错误代码大全》（143 回复的社区共建）；「落地页被举报会隐性消耗费用」是全表最值钱的一条——它解释了大量「CPL 莫名变差」的疑难杂症。",

q:{q:"广告组突然报 1815014。发生了什么？影响链是什么？怎么处理？",a:"含义：公共主页被取消发布。影响链：主页是广告的「发出身份」→主页异常导致广告无法编辑/停止消耗（「主页被暂停是不是就不消耗了」）。处理：①查主页状态与被取消原因（违规/申诉）；②申诉恢复（代理户可找代理直客付费拿回速推权限；被停用大概率无法恢复）；③长期：备用主页+资产不裸奔。"},
b:"把本表落成团队的报错响应文档，并补充你遇到过的实战条目。"}
);

</script>
<script>
/* ===== Meta Ads 互动课程 渲染器 ===== */
const LEVELS=[
 {n:0,name:"Level 0 · 基础精讲（完整教学）",desc:"ChatGPT 课程第 1–8 章的完整教学内容：生态与账户、目标三连、数据体系、CAPI、学习期、竞价、归因、交付与边际。零基础从这里开始。"},
 {n:1,name:"Level 1 · 市场与客户洞察",desc:"广告从「解决什么商业问题」开始：ICP、购买委员会、异议、竞品、假设库。"},
 {n:2,name:"Level 2 · 账户架构与自动化",desc:"账户怎么搭、怎么拆、怎么合；Advantage+ 全家桶与自动化边界；账户健康。"},
 {n:3,name:"Level 3 · 创意智能系统",desc:"Angle → Hook → Message → Proof → CTA → Format → 组合 → 测试 → 疲劳 → 迭代 → 经济学。"},
 {n:4,name:"Level 4 · 受众 + Offer + 版位 + 消息",desc:"给 Meta 什么约束、用什么 Offer、走什么版位与消息链路（含 Click-to-WhatsApp）。"},
 {n:5,name:"Level 5 · 优化架构与交付控制",desc:"优化事件迁移、Deep Signal、Highest Volume / Cost Cap / Bid Cap 与交付权衡。"},
 {n:6,name:"Level 6 · 诊断、测量与因果实验",desc:"First Loss、指标拆解、根因树、何时不动、Holdout / Lift / Geo 实验。"},
 {n:7,name:"Level 7 · 扩量与资本配置",desc:"从「会扩量」到「下一块预算投哪」：天花板、边际利润、组合配置。"},
 {n:8,name:"Level 8 · B2B 高客单增长",desc:"EPC / 经销商 / 市政 / 工业客群、长周期信号、Lead Quality 与销售承接。"},
 {n:9,name:"Level 9 · 跨渠道与全球增长",desc:"Meta / Google / TikTok 分工、Search Capture、跨渠道增量与多市场结构。"},
 {n:10,name:"Level 10 · 操盘手决策系统",desc:"事实→判断→假设→动作→验证→回滚；不确定性决策与操盘节奏。"},
 {n:11,name:"Level 11 · 综合案例训练",desc:"陌生账户接管、0-1、放量、质量排查与毕业 Blind Decision。"},
 {n:"A",name:"附录 · 工程精要 + 论坛实战区",desc:"CRM/CAPI 工程精要 3 篇 + 论坛奇技淫巧、术语黑话、灰产警示、错误代码速查。"}
];
const CATS={A1:"A1 · CRM→CAPI 回传架构精要",A2:"A2 · Event Queue / Retry / 传输日志",A3:"A3 · Data Dictionary / Event Schema 规范",
A4:"A4 · 奇技淫巧与野路子打法（论坛实录）",A5:"A5 · 术语 & 黑话词典（论坛实录）",A6:"A6 · 高危警示区（论坛灰产实录）",A7:"A7 · 错误代码速查（论坛整理）"};

const SKEY="metaCourseV8";
let state={done:{},quiz:{},open:{}};
try{const s=localStorage.getItem(SKEY);if(s)state=Object.assign(state,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(state));}catch(e){}}
const MAIN_IDS=MODULES.filter(m=>typeof m.lv==="number"&&m.lv>=0).map(m=>m.id);
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function modById(id){return MODULES.find(m=>m.id===id);}

function renderNav(){
 const nav=document.getElementById("nav");let h="";
 LEVELS.forEach(L=>{
  const items=MODULES.filter(m=>m.lv===L.n);
  if(!items.length)return;
  const dn=items.filter(m=>state.done[m.id]).length;
  const isMain=typeof L.n==="number";
  h+=`<div class="lvl-group" data-lv="${L.n}"><div class="lvl-head"><span>${L.name}</span><span class="cnt">${isMain?dn+"/"+items.length:items.length}</span></div><div class="lvl-items">`;
  items.forEach(m=>{h+=`<div class="mi ${state.done[m.id]?"done":""}" data-id="${m.id}"><span class="dot"></span><span>${m.id} ${m.t}</span></div>`;});
  h+="</div></div>";
 });
 nav.innerHTML=h;
 nav.querySelectorAll(".lvl-head").forEach(el=>el.addEventListener("click",()=>el.parentElement.classList.toggle("open")));
 nav.querySelectorAll(".mi").forEach(el=>el.addEventListener("click",()=>{openMod(el.dataset.id,true);}));
}

function secHTML(cls,lab,body){return `<div class="sec"><div class="lab ${cls}">${lab}</div>${body}</div>`;}

function renderMain(){
 const main=document.getElementById("main");
 const q=document.getElementById("search").value.trim().toLowerCase();
 const f=document.getElementById("filter").value;
 let h="";
 LEVELS.forEach(L=>{
  let items=MODULES.filter(m=>m.lv===L.n);
  if(q)items=items.filter(m=>(m.id+" "+m.t+" "+Object.values(m).join(" ")).toLowerCase().includes(q));
  if(f==="todo")items=items.filter(m=>!state.done[m.id]);
  if(f==="done")items=items.filter(m=>state.done[m.id]);
  if(!items.length)return;
  h+=`<div class="level-banner"><h2>${L.name}</h2><p>${L.desc}</p></div>`;
  items.forEach(m=>{h+=modCard(m);});
 });
 main.innerHTML=h||`<p style="color:var(--muted);padding:30px">没有匹配的模块。</p>`;
 wireMods();
}

function modCard(m){
 const open=state.open[m.id]?"open":"";
 const done=state.done[m.id];
 const st=done?`<span class="st done">✓ 已完成</span>`:`<span class="st todo">未完成</span>`;
 return `<div class="mod ${open}" id="mod-${m.id}">
  <div class="mod-head" data-id="${m.id}"><span class="num">${m.id}</span><span class="ttl">${m.t}</span>${st}</div>
  <div class="mod-body">
   ${secHTML("lab-goal","🎯 学习目标",m.g)}
   ${secHTML("lab-mech","📖 核心概念",m.c)}
   ${secHTML("lab-mech","⚙️ 工作机制",m.m)}
   ${secHTML("lab-how","🛠️ 操作方法",m.h)}
   ${m.cs?secHTML("lab-case","💼 实战案例",`<div class="box-case">${m.cs}</div>`):""}
   ${secHTML("lab-forum","🔥 论坛实战印证",`<div class="box-forum">${m.f}</div>`)}
   ${secHTML("lab-mist","⚠️ 常见错误",`<div class="box-mist">${m.e}</div>`)}
   ${secHTML("lab-quiz","✏️ 自测题",quizHTML(m))}
   ${secHTML("lab-bar","✅ 达标标准",m.b)}
   <div class="mod-actions">
     <button class="done-btn ${done?"on":""}" data-done="${m.id}">${done?"✓ 已标记完成（点击撤销）":"标记本章已完成"}</button>
     <div class="nav-btns"><button class="qbtn" data-nav="prev" data-id="${m.id}">← 上一课</button><button class="qbtn" data-nav="next" data-id="${m.id}">下一课 →</button></div>
   </div>
  </div>
 </div>`;
}
function quizHTML(m){
 const qz=state.quiz[m.id]||{};
 return `<div class="quiz-area">
  <p><b>题目：</b>${m.q.q}</p>
  <textarea placeholder="先自己作答，再对照参考答案（Socratic 训练法）…">${qz.ans?esc(qz.ans):""}</textarea>
  <div class="qbtns"><button class="qbtn" data-act="reveal" data-id="${m.id}">查看参考答案</button><button class="qbtn" data-act="saveans" data-id="${m.id}">保存我的作答</button></div>
  <div class="qanswer" id="ans-${m.id}"><b>参考答案与评分逻辑：</b><br>${m.q.a}</div>
  <div class="qgrade" id="gr-${m.id}">
    <button class="gbtn ok" data-grade="ok" data-id="${m.id}">✓ 我基本答对了</button>
    <button class="gbtn no" data-grade="no" data-id="${m.id}">✗ 有差距，需复习</button>
  </div>
  <div class="grade-msg" id="gm-${m.id}"></div>
 </div>`;
}
function wireMods(){
 document.querySelectorAll(".mod-head").forEach(el=>el.addEventListener("click",()=>{toggleMod(el.dataset.id);}));
 document.querySelectorAll("[data-done]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
   const id=b.dataset.done;state.done[id]=!state.done[id];save();renderNav();renderMain();}));
 document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
   const i=MODULES.findIndex(m=>m.id===b.dataset.id);
   const j=b.dataset.nav==="prev"?i-1:i+1;
   if(j>=0&&j<MODULES.length)openMod(MODULES[j].id,true);}));
 document.querySelectorAll("[data-act='reveal']").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
   const id=b.dataset.id;document.getElementById("ans-"+id).style.display="block";document.getElementById("gr-"+id).style.display="flex";}));
 document.querySelectorAll("[data-act='saveans']").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
   const id=b.dataset.id;const ta=b.closest(".quiz-area").querySelector("textarea");
   state.quiz[id]=state.quiz[id]||{};state.quiz[id].ans=ta.value;save();
   b.textContent="已保存 ✓";setTimeout(()=>b.textContent="保存我的作答",1500);}));
 document.querySelectorAll("[data-grade]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();
   const id=b.dataset.grade==="ok";
   state.quiz[b.dataset.id]=state.quiz[b.dataset.id]||{};state.quiz[b.dataset.id].ok=id;
   if(id)state.done[b.dataset.id]=true;
   save();document.getElementById("gm-"+b.dataset.id).style.display="block";
   document.getElementById("gm-"+b.dataset.id).textContent=id?"已记录：通过，本章标记完成 ✓":"已记录：需复习（进度条不计入完成）";
   renderNav();updateProgress();}));
}
function toggleMod(id,force){
 const el=document.getElementById("mod-"+id);
 const willOpen=force?true:!el.classList.contains("open");
 el.classList.toggle("open",willOpen);
 state.open[id]=willOpen;save();
}
function openMod(id,scroll){
 renderMain();toggleMod(id,true);
 if(scroll){const el=document.getElementById("mod-"+id);if(el)setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),50);}
}
function updateProgress(){
 const total=MAIN_IDS.length,done=MAIN_IDS.filter(id=>state.done[id]).length;
 const pct=total?Math.round(done/total*100):0;
 document.querySelector("#progressbar>div").style.width=pct+"%";
 document.getElementById("progtext").textContent=`主线完成度 ${done}/${total}（${pct}%）· 附录不计入`;
}
document.getElementById("search").addEventListener("input",renderMain);
document.getElementById("filter").addEventListener("change",renderMain);
document.getElementById("menuToggle").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("show"));
renderNav();renderMain();updateProgress();

</script>
</body>
</html>
