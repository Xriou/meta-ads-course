{id:"L5-01",lv:5,t:"Optimization Event 迁移决策框架",
g:"掌握「何时从浅层信号切到深层信号」的决策公式：Signal Volume × Quality × Delay × 稳定性。",
c:"<p><b>优化事件迁移（Event Migration）是什么？</b>在 L0-02 我们讲过「目标三连」：Objective 决定方向、Conversion Location 决定成交场地、Optimization Event 决定模型具体学哪个动作。所谓迁移，就是把模型的「靶心」从浅层事件（如 Lead 询盘）换到更深、更靠近业务价值的事件（如 Qualified Lead、Deal）。模型是一个「你奖励什么它就学什么」的系统——你让它优化 Lead，它就拼命找会留联系方式的人；你让它优化 Qualified，它就学会找「留了方式、而且真有意向」的人。迁移的本质，是把模型的学习目标从「量」对齐到「业务价值」。</p><p><b>为什么需要迁移、而不是直接优化最深的事件？</b>因为模型学习需要足够样本。官方术语里，这套信号分三个层级：<b>Signal（信号）</b>泛指一切回传事件；<b>Deep Signal（深层信号）</b>指离成交更近、价值更高的回传（如 Qualified Confirmed、Deal）；<b>Optimization Event（优化事件）</b>是你当前选定的靶心。一个常见误区是「越深越值钱，所以直接优化 Deal 最好」——这是错的。Deal 虽最值钱，但量极少、延迟极长，模型根本学不动（见 L0-05 的 50 事件/周门槛）。</p><p><b>用「靶心」类比理解四要素权衡：</b>想象你在教一名射手，给他一个靶子。靶子越大（Lead），他天天能打中，越练越准；靶子越小越偏（Deal），他一个月才看到一次命中，根本练不出手感。迁移不是「把靶子换小」，而是「在打得准的前提下，把靶子挪到更值钱的位置」。这就引出决策四要素：</p><ul><li><b>Signal Volume（信号量）</b>：深层事件每周够不够样本？低于约 30–50/周，模型会饿死。</li><li><b>Quality（质量）</b>：深层事件是不是真的比浅层更代表业务价值？定义必须固化、可验证。</li><li><b>Delay（延迟）</b>：从浅层事件到深层结果要等多久？B2B 常常 1–4 周，延迟越长，反馈越晚到、学习越慢。</li><li><b>Stability（稳定性）</b>：回传链路稳不稳？CAPI 断流、去重失败、EMQ 掉分都会污染信号（见 L0-03/04）。</li></ul><p>四要素同时达标，迁移才划算；只要有一项崩，就先别动。多数 B2B 账户的最优解不是 Deal，而是 Qualified Confirmed——它在「量、质、延迟、稳定」之间取得最佳平衡（MSG 373 称其「及时性、连续性和稳定性相对最优」）。</p>",
m:"<p><b>机制链（为什么不能机械切到最深事件）：</b></p><ul><li>① <b>链接 L0-02 目标三连</b>：优化事件一经改变，模型重新定义「谁是好用户」。原本学的是「留联系方式的人长什么样」，改成 Qualified 后变成「留了方式且被销售认可的人长什么样」——模型得从头探索新分布。</li><li>② <b>链接 L0-05 学习期与 50 事件</b>：模型退出学习期约需 7 天内 50 个优化事件（部分场景降至 25/周）。事件越深，样本越少。把 Lead 1000 / Qualified 100 / Opportunity 25 / Deal 4 代入：Lead 周量 1000 远超门槛，模型轻松成熟；Qualified 100 勉强够；Opportunity 25 已临界；Deal 周量仅 4——远低于 50/周，模型永远走不出学习期，等于「随机探索＋延迟学习」，花出去的钱大部分在试错。</li><li>③ <b>链接 L0-03/04 信号与 CAPI</b>：深层事件依赖 CRM 状态回流，必须靠 CAPI 稳定回传（含 event_id 去重，EMQ 达标）。信号链路一断，模型学到的就是噪声。</li></ul><p><b>数字演算例子：</b>假设某 B2B 账户周 Lead 90、Qualified 32、Deal 2。若强行优化 Deal：每周仅 2 个事件，模型 25 周都凑不齐稳定样本，Spend 与稳定性双崩。若优化 Qualified Confirmed：每周 32 个事件，接近 50 门槛，模型能学；且 Qualified 与 Deal 强相关，Deal 价值可通过价值回传间接影响模型（见 L5-04）。所以 B2B 的升级路径应是 Lead → Qualified，而非一步跳 Deal。</p>",
h:"<p><b>迁移决策四查清单（带具体数字）：</b></p><ul><li>① <b>量够吗？</b>目标深层事件周量 ≥ 30–50。低于 30 不迁；30–50 临界可小比例试（见 L5-03）；≥50 才稳。</li><li>② <b>定义固化了吗？</b>Qualified 必须是 CRM 里客观状态（如「销售已电话确认需求且预算≥X」），不是销售随手点的「感觉还行」。定义不固化就回传噪声。</li><li>③ <b>链路稳吗？</b>CAPI 回传正常、event_id 去重到位、EMQ ≥ 7（参见附录 A1/A3）。链路不稳先修链路，再谈迁移。</li><li>④ <b>相关性验证过吗？</b>历史数据证明「Qualified 与 Deal 正相关」（如 Qualified 组的成交率显著高于 Lead 组）。没验证过，迁了也不知道是否更好。</li></ul><p>四条全过才考虑迁移；任意一条不过，先留在浅层事件、把该补的补上。迁移本身也要用小比例＋Cohort（L5-03），不要全量一刀切。</p>",
cs:"某工业设备（B2B 工业设备）案例：迁移前周 Lead 90、Qualified 32、Deal 仅 2。按四查：量——Qualified 32 接近门槛，够格切；定义——销售已在 CRM 固化「已电话确认需求且预算≥5 万欧元」的 Qualified 标准；链路——CAPI 双通道＋event_id 去重已跑通 3 个月；相关性——历史 6 个月显示 Qualified 组成交率 38%、纯 Lead 组仅 11%，强相关成立。于是第 1 个月从 Lead 迁到 Qualified Confirmed。结果：Lead 量 -25%（系统不再盲目抓留资人群），但有效询盘成本 -18%；第 2 个月模型学稳后 Lead 量企稳回升，且 Qualified 占比从 32% 升到 51%。Deal 因周量仅 2，始终不设为直接靶心，改用价值回传（L5-04）间接影响。",
f:"论坛实操层几乎不讲迁移（社区多数停留在 Lead/Purchase 两级），但小强的「ROAS 门槛随利润率调整」「先算盈亏平衡再定扩量标准」体现了同一思想：优化靶心必须对齐业务价值——只是课程把这件事工程化了，变成可验证的四查清单。社区反复强调「根据目标 ROAS 去判断 CPA」，本质也是「先定业务线再倒推可接受成本」，与「靶心要对齐价值」同源。另一印证：社区对「深事件样本不足导致学不动」的朴素观察散落在「过学习期反而崩」「稳定出单一周进入学习期立刻大崩」等帖——正是分布变化＋样本不够的双重后果，与 L0-05 的机制完全对应。",
e:"<ul><li>「Deal 更值钱所以直接优化 Deal」——忽视样本量，周 4 个事件远不够模型学习，Spend 与稳定性双崩（根因：违背 L0-05 的 50 事件门槛）。</li><li>Qualified 定义没固化就切——回传的是销售随手点的噪声，模型学到错误人群（根因：信号质量差，对应 L0-03 的 Signal 完整性）。</li><li>迁移当天就下结论——反馈分布变了、深层结果延迟 1–4 周才到，当天数据不完整（根因：忽略 Feedback Delay）。</li><li>链路没修就迁——CAPI 断流/EMQ 掉分，深层事件回传虚高或缺失（根因：信号不稳，对应 L0-04）。</li><li>一步跳最深层——跳过 Qualified 直接 Deal，样本量与延迟同时爆炸（根因：没走 Lead→Qualified 阶梯）。</li></ul>",
q:{q:"周 Deal 仅 4 个但单笔利润极高。为什么不直接优化 Deal？",a:"核心不是值不值钱，是学不学得动。模型退出学习期约需 50 个优化事件/周（L0-05），而你每周只有 4 个 Deal 事件——模型 12 周都凑不齐稳定样本，会退化为「随机探索＋延迟学习」，Spend 与稳定性双双崩掉。正确路径：优化 Qualified Confirmed（样本够且历史验证与 Deal 强相关），让模型学「找优质询盘的人」；Deal 的高价值通过「价值回传」（L5-04）影响模型方向，而非直接当靶心。靶心要选「量够＋质高＋延迟可接受」的事件，不是最贵的那个。"},
b:"算出你各信号层（Lead/Qualified/Opportunity/Deal）的周量，对照 50 事件门槛写出「能切/不能切」的结论与理由；并列出你账户的 Qualified 定义是否已固化、EMQ 是否 ≥7。"},
{id:"L5-02",lv:5,t:"Event Migration 风险与 Spend 影响",
g:"预判切换优化事件后 Spend/CPL/Volume/Delivery 的系统性变化，做好迁移预案。",
c:"<p><b>迁移改变的是「模型学习的问题本身」。</b>你在 L0-02 学过，优化事件就是模型的学习靶心。靶心一换，模型面对的数据「反馈分布（Feedback Distribution）」就变了——原来它积累的「谁会 Lead」的经验部分作废，要重新学「谁会 Qualified」。这不是换个数字，是给模型换了一份作业。</p><p><b>三个可预见的系统性变化：</b></p><ul><li><b>短期 Spend 波动</b>：模型重新探索，Delivery 先收缩再回升，预算花出去的节奏会乱。</li><li><b>CPL 口径失效</b>：旧 CPL（按 Lead 算）和新 CPL（按 Qualified 算）不是同一个东西，直接对比是「拿苹果比橘子」，一定会得出「变差了」的错觉。</li><li><b>部分历史人群「失效」</b>：模型之前偏好的那批「爱留资但不一定优质」的人，不再被优先推，旧受众的转化特征被打散。</li></ul><p><b>最常见误区：</b>「迁移当天就评估成败」。深层结果的反馈有 1–4 周延迟（Feedback Delay），当天的 Qualified/Deal 数据远不完整；而且学习期大概率重置（对应 L0-05 的分布漂移）。把迁移当「换身衣服」，其实它是「换教练、重新练」。正确心态是：迁移是工程变更，要像发版一样有预案、有回滚。</p>",
m:"<p><b>机制链（为什么 Spend 会系统性变化）：</b></p><ul><li>① <b>链接 L0-05 分布漂移</b>：优化事件改变 → 数据分布改变 → 模型重新探索。探索期 Delivery 收缩是机制属性，不是 bug。</li><li>② <b>历史资产作废</b>：模型此前对「谁会 Lead」的判断失效，要重新建立「谁会 Qualified」的映射，学习期内效率天然偏低。</li><li>③ <b>报表与规则连锁失效</b>：历史对照组、CPL 报表、自动化规则阈值（按旧事件设的）全部需要同步调整——否则旧规则会基于新口径误杀好广告，或者把波动误读为异常。</li></ul><p><b>数字例子：</b>某组旧 CPL $30（Lead）。迁到 Qualified 后，第 1 周只看到「有效 CPL $52」就 panic 关掉——其实这是新口径＋学习期叠加的正常现象；如果按 Cohort 看满 4 周，Qualified 有效 CPL 稳定在 $41，且成交率更高。用旧 $30 的尺子量新事件，必定误判。</p>",
h:"<p><b>迁移预案清单（五部分，带具体数字）：</b></p><ul><li>① <b>预算冻结</b>：迁移期（前 2–4 周）预算不加不减，避免把「分布变化波动」和「预算调整效果」混在一起无法归因。</li><li>② <b>自动规则停用或改阈值</b>：按旧事件 CPL 设的自动化规则（如「CPL＞$40 就关」）在迁移期会误杀——全部停用，或改成按新事件的新阈值。</li><li>③ <b>报表口径切换日期标注</b>：旧数据（Lead 口径）与新数据（Qualified 口径）分 Cohort 看，禁止合并成一条趋势线。</li><li>④ <b>预期管理</b>：向老板预告 2–4 周波动期，写明「Spend 可能短期 -20%~-40%，属预期内」。</li><li>⑤ <b>回滚标准预设</b>：如 Spend 崩到 -50% 且连续两周无恢复 → 回滚到旧事件（L5-03 给出 Cohort 判断法）。</li></ul>",
cs:"某工业设备切 Qualified 前的预案：停用 3 条按 Lead CPL 设的自动规则（其中一条「CPL＞$45 关组」若留着会在第 1 周误杀新组）；报表切 Cohort 口径（W1/W2/W3 进线组分别追踪）；向管理层发邮件预告「未来 4 周 Spend 可能 -30%，有效成本看满月」。实际第 2 周 Spend -30%（属预期内），第 5 周恢复且 Qualified 占比提升。因为预案做足，没有人在波动期误操作。",
f:"论坛对应教训极多：「过学习期反而崩」「稳定出单一周进入学习期立刻大崩」是社区对「分布变化引发动荡」的朴素观察；「千万别一键应用 Meta 建议」同理——因为改优化配置=动模型根基，一键应用往往把探索期波动当成「要修的问题」去修，越修越乱。社区还有「昨天 ROI 3 出 7 单今天就跟 1」的抱怨，正是用日级波动下结论的典型病，与「迁移当天评估」同源。",
e:"<ul><li>迁移当天同时改素材/受众——多重变量无法归因，不知道是迁移还是别的在起作用（根因：没做单变量实验）。</li><li>用旧 CPL 口径评估新事件——一定是「变差」的错觉，苹果比橘子（根因：口径不可比）。</li><li>没有回滚标准——崩了只能硬扛，错过止损窗口（根因：预案缺失）。</li><li>忘记同步自动规则——旧阈值误杀新组（根因：规则与事件强绑定却未更新）。</li><li>向老板隐瞒波动——波动期被当成「投放失败」干预，打断模型学习（根因：预期管理缺失）。</li></ul>",
q:{q:"切 Qualified 后第 3 天 Spend 掉 40%。这是失败吗？",a:"不是结论，是预期内波动：反馈分布改变→模型重新探索→短期 delivery 收缩（对应 L0-05 分布漂移）。正确动作：①按预案观察，不乱动；②看 Qualified 事件的到达节奏（Cohort），确认信号在按新节奏回来；③第 2 周末评估趋势而非日波动。回滚只在预设标准触发时执行（如 Spend -50% 且两周无恢复）。把日级波动当判决书，是迁移最贵的错误。"},
b:"写出你的迁移预案清单（含规则/口径/预期/回滚四部分），并标注每条对应的风险点。"},
{id:"L5-03",lv:5,t:"迁移实验设计与 Cohort 观察",
g:"用小比例迁移+Cohort 分析设计可归因的切换实验，避免「第一天就下结论」。",
c:"<p><b>实验设计的第一原则：不要全量切换。</b>全量切等于「把整个账户押在一次改配置上」，一旦出问题没有对照、无法归因，且学习期全账户重置。正确做法是小比例灰度：拿 20–30% 预算切新事件（实验组），70–80% 保持原事件（对照组），跑 3–4 周再决策。</p><p><b>Cohort（同期群）是 B2B 的命门。</b>因为深层结果有 1–4 周延迟，当周进线的 Lead，要等 1–2 周后才显现 Qualified 结果。所以「按进线周分组、逐周回填」才是真数据：W1 进线的 100 个 Lead，在第 2、3、4 周陆续变成 Qualified——你必须在第 4 周才能看完整 W1 组的真实 Qualified 率。当周报表永远是残缺的，用残缺数据下结论是社区最常见的病（「昨天 ROI 3 今天跟 1」）。</p><p><b>误区纠正：</b>「实验组 Spend 掉就是迁移失败」——短期掉是分布变化期的正常收缩（见 L5-02）；「全量切更快见效」——全量切没有对照、不可归因，且风险翻倍。</p>",
m:"<p><b>机制链（为什么不能第一天下结论）：</b></p><ul><li>① <b>Feedback Delay（反馈延迟）</b>：本周进线的 Lead 要 1–2 周后才显 Qualified 结果，当天数据不完整（链接 L0-07 归因窗口的思考：口径一变，数字就变）。</li><li>② <b>分布变化期噪声大</b>：模型重新探索，前两周数据混合了「旧人群残余＋新探索」，信噪比低。</li><li>③ <b>周内季节性伪装</b>：B2B 周一询盘多、周五少，单看日级波动会把「周五本来就少」当成「迁移搞砸了」。</li></ul><p><b>数字演算：</b>实验组 25% 预算切 Qualified。第 10 天看：Spend 腰斩、Qualified 数寥寥——但若查 Cohort：W1 进线组在回填后 Qualified 率 41%、W2 组 52%，模型在学、趋势向上。若此时误判叫停，就丢了后面 55% 的成熟收益。所以决策节点必须放在第 4 周、看 Cohort 回填后的「边际有效成本」。</p>",
h:"<p><b>25% 灰度迁移实验步骤（带决策节点）：</b></p><ul><li>① <b>建实验组</b>：复制原组，切 25% 预算到新事件，受众/素材/落地页完全不变（只动这一个变量）。</li><li>② <b>Cohort 报表</b>：按「进线周」分组，追踪 W1/W2/W3 进线组的 Qualified 率逐周回填（如 W1 组第 2 周回填到 41%、第 3 周 52%）。</li><li>③ <b>第 4 周决策</b>：实验组「边际有效成本」优于对照组 → 逐步加码到 50%/75%/100%；反之则回滚或继续观察。</li><li>④ <b>回滚线</b>：Spend -50% 且两周无恢复，或 Qualified 流断流 → 立即回滚。</li></ul>",
cs:"某工业设备迁移实验：25% 预算切 Qualified 跑 4 周。Cohort 显示 W1 组 Qualified 率 41%、W2 组 52%、W3 组 55%——模型在学习，趋势确认后第 5 周切到 100%。对照组（75% 旧事件）全程稳定，证明波动来自迁移本身而非外部因素。整个过程中实验组没有动过素材和受众，确保变量唯一，结论可归因。",
f:"论坛案例反向印证：「昨天 ROI 3 出 7 单今天就跟 1」——用日级波动下结论是社区常态病；课程 Cohort 方法正是解药：B2B 的转化延迟决定了「今天的报表是昨天的问题」。社区「关广告要快、建广告要多、加预算要慢」的口诀，也暗含「给新配置留观察期」的纪律，与灰度实验同源。另一印证：社区「复制老广建新广告刚过学习期几天就归零」的玄学翻车，本质是复制破坏了对照、又撞上分布变化，和「全量切无对照」一脉相承。",
e:"<ul><li>全量切换无对照组——效果无法归因，好与坏都说不清（根因：没做单变量实验）。</li><li>按日评估——B2B 至少按周 Cohort，当天数据残缺（根因：忽略 Feedback Delay）。</li><li>实验期间顺手优化其他东西——污染实验，变量不纯（根因：纪律缺失）。</li><li>观察期不足——反馈没到齐就判死刑（根因：不懂 Cohort 回填节奏）。</li><li>实验组改了受众/素材——把「迁移效果」和「结构效果」混为一谈（根因：变量不唯一）。</li></ul>",
q:{q:"迁移实验第 10 天，实验组 Spend 腰斩。继续还是叫停？",a:"先查「是否预期内」：分布变化期收缩常见（对应 L0-05 分布漂移）。看两个指标：①Qualified 事件是否在按新节奏到达（Cohort）；②对照组是否正常（排除外部因素如节假日、竞品）。若 Qualified 流稳定且未触发回滚标准（Spend -50% 且两周无恢复）→ 继续观察到第 4 周；触发回滚标准才叫停。日级波动不是判决书，Cohort 回填后的趋势才是。"},
b:"设计一个 25% 迁移实验（组设计/观察指标/决策节点/回滚线），确保变量唯一、可归因。"},
{id:"L5-04",lv:5,t:"Deep Signal / Value Optimization（价值回传）",
g:"掌握把「业务价值」传回模型的两条路：优化事件升级与价值参数回传（value/Deal Value）。",
c:"<p><b>把业务价值喂给模型，有两条路：</b></p><ul><li><b>路径一：换优化靶心</b>（L5-01）：直接让模型优化深层事件（Qualified Lead），模型「亲自」学找高价值人群。代价是深层事件样本少、学习慢。</li><li><b>路径二：保持浅层靶心＋回传价值信号</b>：继续优化 Lead，但通过 CAPI 把 Lead 后续的 Qualified/Deal 价值作为「下游反馈」传回去。模型不重置学习，但影响更间接——它逐渐「漂移」到会带来价值的 Lead。</li></ul><p><b>官方术语：</b>Value Optimization（价值优化）指让模型优化「转化价值」而非「转化次数」；Value Parameter（value 参数）是每次事件携带的预估价值（金额或加权分）。误区纠正：以为「回传了 value，系统就立刻按利润优化」——错。价值信号要跨过四道门槛才能真正影响模型（见下）。也别把价值回传当成「不迁移的万能替代」：它和路径一是互补，不是二选一。</p><p><b>类比：</b>路径一像「直接让射手打更值钱的靶」，路径二像「射手还打原来的靶，但你每次都告诉他『这一枪值钱／不值钱』，他慢慢悟出哪种人值钱」。后者不用重练，但悟得慢。</p>",
m:"<p><b>价值回传的机理（链接 L0-03/04 与 L0-06）：</b></p><ul><li>① <b>链接 L0-03 信号与参数</b>：value 是 Event Parameters 的一种（如 value=3000、currency=EUR）。它让 Meta「有迹可循」——知道这是一笔大单还是小单。</li><li>② <b>链接 L0-04 CAPI</b>：价值信号靠 CAPI 从服务器回传最稳（不受浏览器/ATT 限制），且要带 event_id 去重，避免虚增。</li><li>③ <b>链接 L0-06 竞价公式</b>：价值信号提升的是 Estimated Action Rate（EAR）——模型学到「这类人后续价值高」，预测行动率更准，总价值公式里 Bid×EAR 更有竞争力。所以价值回传最终在竞价里变现。</li></ul><p><b>四道门槛（MSG 400–404）：</b>① Data Integrity（数据完整性，CRM 状态真实）；② Value Definition（价值定义稳定，口径不变）；③ Event Volume（回传量够，否则学不动）；④ Matching/EMQ（事件匹配得上人，见附录 A3）。四道任一不过，价值信号就是噪声。</p>",
h:"<p><b>价值回传落地步骤（带具体数字）：</b></p><ul><li>① <b>固化状态与时间</b>：CRM 里固化 Qualified/Deal 的时间点与价值（金额或加权分），定义写进 SOP。</li><li>② <b>CAPI 回传 Qualified Confirmed</b>：含 event_id（用 CRM 记录号，确保去重，见附录 A1/A3），EMQ 目标 ≥7。</li><li>③ <b>value 参数分档</b>：不要传精确敏感合同额，按小单/中单/项目三档回传（降噪且合规）。</li><li>④ <b>回传时机克制</b>：Qualified 确认后再回传，未确认的 Qualified 会污染信号（MSG 368：约 1/4 错误率会严重伤模型）。</li></ul>",
cs:"某工业设备：Qualified 在 CRM 确认后 48 小时内回传（CAPI，event_id＝CRM 记录号），value 按 3 档（小单/中单/项目，对应 1/2/3 加权分）。前 3 个月模型只优化 Lead，价值信号在后台悄悄影响 EAR；第 4 个月起，Broad 组自动倾向「工程类客户」——模型自己找到了价值人群，有效询盘成本再降 12%。关键：value 始终分档、从不传精确金额，且只回传已确认的 Qualified。",
f:"论坛几乎没有做到这一层的（社区普遍停在 Lead/Purchase），这正是论坛实操与课程体系的能力差所在；「素材每周评级＋弃单挽回」是「把后端结果反哺前端决策」的原始形态，但没工程化为价值回传。社区「根据目标 ROAS 去判断 CPA」也是同一思想的民间版：先定价值线再倒推成本。落地前先读附录 A1–A3（双通道去重与 EMQ），否则价值信号会因匹配不上人而白传。",
e:"<ul><li>Qualified 没确认就回传——信号污染，约 1/4 错误率伤模型（根因：违背 MSG 368 的时机纪律）。</li><li>value 口径经常变——模型无法学习稳定规律（根因：违背 Value Definition 门槛）。</li><li>以为回传＝系统立刻按利润优化——还有 Coverage/Matching 等门槛，价值信号稀疏时反而放大噪声（根因：忽略 MSG 404 的 Event Volume）。</li><li>回传与 Pixel 事件不做去重——转化虚增，预算建在假数据上（根因：违背 L0-03 去重机制）。</li><li>传精确敏感合同额——失真且合规风险（根因：应分档降噪）。</li></ul>",
q:{q:"「我把 Deal 金额都回传了，为什么 Meta 还在给我推小客户？",a:"排查四门槛：①回传的 Deal 事件量是否够（太少学不动，对照 L0-05 的 50 事件）；②Matching/EMQ——事件是否匹配得上人（附录 A3，EMQ 低等于白传）；③value 定义是否稳定一致（今天按金额明天按主观分，模型学乱）；④时间滞后——价值信号的效果要按月级观察，不是几天。若四项都正常，再查优化靶心本身是否还是浅层 Lead：价值回传只影响方向，靶心才决定靶子（路径一 vs 路径二的区别）。"},
b:"梳理你的 CRM→CAPI 价值回传链路，标注四道门槛（Data Integrity / Value Definition / Event Volume / Matching-EMQ）的达标情况，并说明 value 是否分档。"},
{id:"L5-05",lv:5,t:"Highest Volume（原 Lowest Cost）",
g:"掌握默认出价策略的正确认知：命名演进、适用阶段与「成本波动」的原理。",
c:"<p><b>命名演进（2026 官方已改名）：</b>「Lowest Cost」现已更名为 <b>Highest Volume</b>（也叫 spend-oriented bidding），与 Highest Value 并列为「以花费为中心」的两大策略。注意：行为没变，只是 Ads Manager 标签换了——这是 2024–2026 多次改名的一部分（Cost Cap→Cost Per Result Goal、Minimum ROAS→ROAS Goal 同理）。还在看旧文档写「Lowest Cost」的，会找不到对应按钮。</p><p><b>Highest Volume 是什么？</b>你给系统一个预算，它把预算尽量花完、拿尽可能多的优化事件，<b>不设任何成本约束</b>。特点是「平均成本会波动」——它优化的是「量」，不是「价的稳定」。官方术语：它是 Meta 的默认出价策略（default bidding），适合还没积累密集转化历史的账户。</p><p><b>误区纠正：</b>「成本一天好一天差，是不是投崩了？」——大概率不是。无约束策略下，日/周波动 ±20–30% 是机制属性（见 L0-06 总价值公式：竞价环境一变，你的成本就跟着变）。它不是 bug，是「用价格不确定性换量的确定性」的代价。另一个误区：「Highest Volume 就是乱花」——它仍追求在预算内拿到最多结果，只是不保证单价。</p>",
m:"<p><b>机制链（为什么默认推荐它，链接 L0-05 与 L0-06）：</b></p><ul><li>① <b>链接 L0-05 学习期</b>：学习期最需要「探索自由度」。任何成本约束（Cost Cap/Bid Cap）都会限制系统能参与的拍卖机会，拖慢模型成熟——等于「饿着肚子让模型学习」。Highest Volume 给模型最大自由度，最快退出学习期。</li><li>② <b>链接 L0-06 总价值公式</b>：系统每场拍卖算 Total Value＝Bid×Estimated Action Rate＋Ad Quality。Highest Volume 下系统自行决定 Bid 以拿最多结果，不受你设的 cap 限制，所以能抓住所有「划算」的展示。</li><li>③ <b>成熟后再约束</b>：账户跑出真实成本基线后，再按需引入 Cost Per Result Goal（L5-06）保护效率。顺序错了（学习期就上 cap）会卡死探索。</li></ul><p><b>数字演算：</b>新组预算 $100/天，Highest Volume 第 1 周 CPL $35、第 2 周 $28、第 3 周 $31——波动 ±20% 属正常；累计 3 周拿到 280 个事件，顺利退出学习期。若第 1 周就设 Cost Cap $25，则只花出 $60/天、事件骤减，卡在学习期更久。</p>",
h:"<p><b>适用与预期管理清单：</b></p><ul><li>① <b>适用</b>：学习期账户、放量期、优化事件量充足的成熟投放（≥50 事件/周，见 L0-05）。</li><li>② <b>预期管理</b>：向团队说明成本日波动 ±20–30% 属正常——它是「平均目标」不是「绝对成本」。</li><li>③ <b>波动焦虑的正确解法</b>：看周/月均值与边际趋势，而非日数据（对应 L0-08 边际经济学：决策看边际不看平均）。</li><li>④ <b>切换时机</b>：跑出真实 CPL 基线、且需要保护利润时，再引入 Cost Per Result Goal（L5-06）。</li></ul>",
cs:"某工业设备新市场（奥地利）前 4 周一律 Highest Volume：学习期不被约束卡死，3 周拿到约 210 个 Lead 退出学习期，真实 CPL 基线落在 $48。第 5 周起对达标组评估引入 Cost Per Result Goal（L5-06），先把 $48 当锚设 Goal $55。若学习期就上 Cap，按 L0-05 分布漂移，模型会花不动、事件不够、长期更贵。",
f:"论坛对成本波动的大量抱怨（「一天好一天差」）本质就是在无约束策略下的正常现象，社区用血泪验证了「自由竞价在学习期的价值」。社区「竞价加速容易卡死花不出钱」「强行提竞价值转点成本爆炸」反证了约束的副作用——提竞价值（类似加 Bid Cap）会丢机会、花不动。另一印证：「横向激进纵向保守」「加预算要慢」的口诀，暗合「放量期用 Highest Volume 拿量、别过早约束」的思路。",
e:"<ul><li>因为「成本不稳」在学习期就上 Cost Cap——卡死探索，模型饿死（根因：违背 L0-05 学习期需要自由度）。</li><li>把日波动当异常天天干预——越干预越重置学习（根因：不懂波动是机制属性）。</li><li>不知道 Lowest Cost 已更名——看新文档找不到按钮，以为功能没了（根因：命名演进未跟进）。</li><li>用 Highest Volume 却期待单价稳定——它优化的是量不是价（根因：策略定位误解）。</li><li>成熟账户长期不引入约束——放量后边际成本爬升仍不保护利润（根因：错过切换时机）。</li></ul>",
q:{q:"Highest Volume 下本周 CPL $28 上周 $22，正常吗？",a:"大概率正常：无约束策略的日/周波动是机制属性（±20–30% 常态，对应 L0-06 竞价环境变化）。判断动作：①看月均值与趋势，而不是单周；②检查是否有外部变化（竞争加剧、素材衰减、受众饱和，见 L0-08）；③无异常则不动（对应 L6-06 When Not to Act）。只有持续单边爬坡（如连续 3 周 CPL 从 $22→$30→$38）才需要介入，那通常是市场变贵或模型疲劳，而非策略本身错。"},
b:"向一位同事解释清楚 Highest Volume 的机制与「为什么成本会波动」，并说明学习期为什么不该上成本约束。"},
{id:"L5-06",lv:5,t:"Cost Cap 深度",
g:"掌握 Cost per Result Goal 的真实机制：它是「平均目标」不是「保证价」，核心权衡是 Delivery 限制。",
c:"<p><b>命名与定义：</b>「Cost Cap」现官方名为 <b>Cost Per Result Goal（Cost per Result Goal）</b>，中文常称「单次结果成本目标」。你给系统设一个「平均成本目标」，系统在有机会时超抓低价结果、在高价机会上收敛，让平均成本趋近你的目标。注意：它约束的是「结果的平均成本」，<b>不是</b>每一次的出价（那是 Bid Cap，L5-08 的事）。</p><p><b>最关键的一句话：Cost Cap 是「平均目标」，不是「保证价」。</b>个别转化可能贵可能便宜，但平均会贴着你的 Goal。很多人把它当「单价天花板」，设得比市场低一大截，结果花不出去——这是 Highest Volume 之后第二常见的出价坑。</p><p><b>核心权衡：Delivery（交付）vs 成本确定性。</b>Goal 设得越接近/低于历史真实成本，系统放弃越多「贵一点的机会」→ Spend 下降、量减少、（若太激进）预算花不出去 → 模型学习变慢（见 L0-05）。所以 Cost Cap 是用「量的空间」换「价的确定性」。</p><p><b>误区纠正：</b>「Cost Cap 能帮我省钱」——错，它帮你「控平均价」，代价是可能花不出去、量更少；「Goal 设越低越省」——越低越花不动，最终连基线量都没有。</p>",
m:"<p><b>机制链（链接 L0-06 与 L0-05）：</b></p><ul><li>① <b>链接 L0-06 总价值公式</b>：Cost Cap 给系统设平均成本目标，系统仍自行决定每次 Bid，但会避开「拉高平均太多」的高价拍卖。它不像 Bid Cap 那样直接锁死单次出价，所以弹性更大。</li><li>② <b>链接 L0-05 学习期</b>：Goal 太紧 → 系统放弃贵机会 → 优化事件↓ → 学习期更难退出、模型变弱。MSG 269–270 完整因果链：CPL 真实 25–30 却设 Goal 20 → 胜率低 → 花不动 → 事件骤减 → 学习退化 → 长期反而推高成本。</li><li>③ <b>Delivery 权衡</b>：Goal 每收紧一档，系统可参与的拍卖池就缩一圈，Spend 达成率随之下跌——这是用空间换确定性。</li></ul><p><b>数字演算：</b>真实 CPL $28。Goal 设 $31（均值×1.1）→ Spend 达成 95%、量稳；Goal 设 $25 → Spend 达成 60%、量少 30%；Goal 设 $20 → Spend 达成 25%、几乎花不动、学习期卡死。可见「越贪越花不动」。</p>",
h:"<p><b>Cost Cap 设定与调整方法（带具体数字）：</b></p><ul><li>① <b>锚定已验证均值</b>：首次设 Goal＝真实平均 CPL × 1.1–1.2（略宽，给系统余地），绝不用愿望数字。</li><li>② <b>观察 2 周</b>：看 Spend 达成率与事件量。达成率 ≥90% 且量稳 → 可逐步收紧。</li><li>③ <b>逐步收紧到甜点</b>：每次下调 5–10%，间隔 ≥1 周，找到「量与价的平衡点」。</li><li>④ <b>放开时机</b>：放量期、学习期、事件量不足时移除 Cap，回到 Highest Volume（L5-05）。</li></ul>",
cs:"某工业设备 DE 组稳态 CPL $52：Cost Cap 先设 $60（2 周 Spend 达成 95%，量稳）→ 收 $55（量 -8% 可接受）→ $52 时起量不稳即回调到 $55。最终找到「$55±5% 是该组的甜点」：比均值略宽保交付，比盲设 $52 更稳。对比：若一开始就设 $52（贴均值），Spend 达成仅 70%，等于自断一臂。",
f:"论坛「竞价加速容易卡死花不出钱」「翻倍加预算系统扩展人群彻底不出单」——社区在「约束 vs 跑量」间反复踩坑；小强打法的分层预算（ROAS>3.5 才加、上限 $50/$100/$200）本质是「用预算规则替代成本约束」的另一条路：它不锁单价，而是用「达标才放量」保护利润。社区「提预算同时把竞价值对半砍」的对冲，也是在对 Bid 做硬约束时深知「砍竞价=丢机会」——与 Cost Cap 的弹性形成对照。",
e:"<ul><li>把 Cost Cap 当「保证价」——它只保证平均，个别转化可远超（根因：策略定位误解）。</li><li>设得比历史最低还低——花不动，量崩（根因：违背 MSG 269–270 因果链）。</li><li>学习期就上 Cap——探索被卡，模型饿死（根因：违背 L0-05）。</li><li>Cap 与自动规则叠加互相打架——规则按旧 CPL 关组，Cap 还在控价（根因：配置冲突）。</li><li>Goal 设愿望数字（老板拍脑袋 $30）——脱离均值必花不动（根因：没用已验证基线）。</li></ul>",
q:{q:"真实 CPL 25–30，设 Cost Cap $20 会怎样？",a:"系统在竞价中大量放弃成本高于 $20 的机会→展示骤降、预算花不出去、优化事件量骤减→学习期模型饿死，长期反而推高成本（MSG 269 的完整因果链：紧 Goal→放弃机会→事件↓→学习退化→更贵）。正确做法：Cap 设在 $27–33 区间起步（均值×1.1），视 Spend 达成率再调；若真要控到 $20，得先靠优化（素材/受众/落地页）把真实 CPL 压下来，而不是用 Cap 强压。Cap 压不住市场，只压得住自己的交付。"},
b:"为你的主力组算出「甜点成本区间」（真实均值×1.1 起步）并写明调整规则：每档下调多少、间隔多久、达成率低于多少就回调。"},
{id:"L5-07",lv:5,t:"Bid Cap 深度",
g:"理解 Bid Cap 为什么是「更硬」的约束：它限制的是单次竞价资格，直接影响 Delivery。",
c:"<p><b>Bid Cap＝单次竞价出价上限。</b>与 Cost Cap（L5-06）的区别一句话讲清：Cost Cap 管「结果平均」（软约束，系统可在单次超支、靠低价单拉回平均），Bid Cap 管「每一次拍卖」（硬约束，超标即出局）。Bid Cap 是出价策略里最硬的一道闸——一旦市场成本高于你的 Cap，系统直接丧失那次竞价资格，连「贵一点但值得」的机会都拿不到。</p><p><b>为什么它更硬、也更危险？</b>在 L0-06 总价值公式里，Bid 是公式的第一项。Bid Cap 直接封顶 Bid，等于封顶了「你愿为这次展示付多少钱」。系统算完 Total Value，只要需要的 Bid 超过 Cap，就根本不参拍。这不是「平均拉高」，是「整场不参加」。</p><p><b>适用场景：</b>只对单次成本有硬性红线、且事件量充足、深知自己拍卖经济的成熟账户（如毛利刚性、CPA 红线清晰的品类）。B2B 线索价值离散度大，硬红线反而伤探索——多数 B2B 不该用。</p><p><b>误区纠正：</b>「Bid Cap 比 Cost Cap 更省」——错，它更可能「花不出去」；「设低一点更稳」——低到均值以下很多，资格大规模丧失，Delivery 直接熄火。</p>",
m:"<p><b>机制链（丧失竞价资格的连锁反应，链接 L0-06 与 L0-05）：</b></p><ul><li>① <b>链接 L0-06 总价值</b>：Bid Cap 封顶 Bid → 需要的 Bid 超 Cap 的拍卖全部不参 → 可赢的展示变少。</li><li>② <b>展示↓→事件↓→学习↓</b>：模型拿不到新样本，预测更弱 → 更赢不了竞价（恶性循环，对应 L0-05 分布漂移的反向）。</li><li>③ <b>Delivery 熄火</b>：预算花不出去（Spend 达成率暴跌），等于「用单价红线换来了量的归零」。</li></ul><p><b>数字演算：</b>某电商 CPA 红线 $12、历史均值 $11。设 Bid Cap $10（均值 90%）→ 大部分拍卖仍能参、Spend 达成 85%、量略减但稳。若设 Bid Cap $7（远低于均值）→ 大量拍卖出局、Spend 达成 30%、几乎停投。可见硬约束下「差一点」和「差很多」天壤之别。</p>",
h:"<p><b>Bid Cap 使用前提与监控（带具体数字）：</b></p><ul><li>① <b>明确商业红线</b>：对该事件的单次成本有不可妥协的上限（如毛利模型严苛的品类）。</li><li>② <b>事件量充足</b>：经得起资格损失，仍能达到 50 事件/周（见 L0-05）。</li><li>③ <b>起步设历史均值的 80–90%</b>：别一刀切到「心流血的数字」，留点弹性。</li><li>④ <b>每周监控</b>：Spend 达成率、事件量、CPM 三件套；达成率＜70% 即上调 Cap 或换 Cost Cap。</li></ul>",
cs:"某工业设备从未用 Bid Cap（B2B 线索价值离散度大，硬红线反而伤探索，且事件量不足以承受资格损失）。对比案例：某电商客户毛利固定、CPA 红线 $12 清晰、周 Purchase 2000+ 事件充足 → Bid Cap $10（均值 $11 的 90%）跑稳态，Spend 达成 85%、利润守住。这正是「有硬性单次红线＋事件量够」才成立的条件。",
f:"论坛教训直接对应：「提预算同时把竞价值对半砍，对冲避免转点成本爆炸」——社区在用 Bid Cap 做对冲时深知「砍竞价=丢机会」；一刀流时代「提预算＋降竞价」炸盘（「转点成本爆炸」）即 Bid 约束副作用的活样本。社区「竞价加速容易卡死花不出钱」也正是 Bid 类硬约束把 Delivery 卡死的现象。这些血泪都指向同一句：Bid Cap 是双刃剑，没红线别碰。",
e:"<ul><li>把 Bid Cap 当省钱工具——它是丢量工具，花不出去比花得多更常发生（根因：误解除约束的副作用）。</li><li>Cap 设在均值以下很多——资格大规模丧失，Delivery 熄火（根因：违背 80–90% 起步原则）。</li><li>事件量本来不足还加 Cap——饿死模型（根因：违背 L0-05 的 50 事件门槛）。</li><li>Cap 与 Cost Cap 同时压——双重枷锁，系统几乎无法交付（根因：约束叠加）。</li><li>设完不监控 Spend 达成率——悄悄停投几周才发现（根因：缺周检视）。</li></ul>",
q:{q:"「Bid Cap 比 Cost Cap 更硬」硬在哪？各自的适用场景？",a:"Cost Cap 约束「平均结果成本」，系统可在单次超支、靠低价单拉回平均——弹性在（见 L5-06）。Bid Cap 约束「每次拍卖出价」，超标即出局——无弹性。硬在它直接封顶 L0-06 公式里的 Bid 第一项，整场拍卖不参加。适用：Cost Cap＝多数成熟账户控成本的主流选择（软约束保交付）；Bid Cap＝有硬性单次成本红线、且事件量充足、懂拍卖经济的场景（如毛利刚性品类、电商 CPA 红线清晰）。B2B 离散度大，一般不该用 Bid Cap。"},
b:"判断你账户是否需要 Bid Cap：写出「红线是否存在、事件量是否够（≥50/周）、均值 80–90% 起步是否仍盈利」的论证；若不需要，说明为什么 Cost Cap 更合适。"},
{id:"L5-08",lv:5,t:"Cost per Result Goal 实操",
g:"落地 Cost Goal 的日常管理：设定、监控、波动解读与「业务反转」判断。",
c:"<p><b>Cost per Result Goal（即 Cost Cap，L5-06）的日常管理四要素：</b></p><ul><li>① <b>锚点</b>：用已验证的真实均值，不是愿望（对应 L5-06 的均值×1.1 起步）。</li><li>② <b>观察窗</b>：≥2 周，避开日级噪声（对应 L0-08 看边际与趋势）。</li><li>③ <b>监控指标</b>：Spend 达成率、事件量、实际平均成本 vs Goal。</li><li>④ <b>业务反转（Business Inversion，MSG 279–280）</b>：若「每天 10 个线索且质量好」对业务极有利，接受波动更高的策略反而正确——成本和量的取舍，取决于业务当下最缺什么。</li></ul><p><b>核心认知：</b>Cost Goal 的真正作用是「把系统的注意力从『最多量』拉向『平均成本附近』」——它牺牲量的确定性，换价格的确定性。哪个重要，取决于业务当下：缺量期松、缺利润期紧。误区纠正：把 Goal 当「对老板的成本承诺」——它只是平均目标，偶有超出正常，别拿它做财务保证。</p>",
m:"<p><b>机制链（链接 L0-06 与业务）：</b></p><ul><li>① <b>链接 L0-06</b>：Cost Goal 通过约束系统的平均出价行为，把总价值公式里的 Bid 引导到「贴着 Goal 拿量」，而非无上限追量。</li><li>② <b>业务反转逻辑</b>：当业务处于「抢市场/抢线索」阶段，多一点量带来的长期价值 ＞ 单均成本高一点，此时应放宽甚至移除 Goal（回到 Highest Volume）；当业务处于「保利润」阶段，紧 Goal 更对。</li><li>③ <b>波动性本质</b>：Goal 只控平均，单日/单周仍受拍卖环境影响波动（±20–30%），这是机制属性不是失灵。</li></ul><p><b>数字演算：</b>Goal $55、真实均值 $52。某周因公共假期 CPM 全线涨，平均成本 $61（超 Goal 11%）——这是外部因素，非 Goal 失效；假期后回落到 $53。若误判「Goal 失灵」去改 Goal，反而打断模型。正确：先查外部，再动 Goal。</p>",
h:"<p><b>Cost Goal 周检视模板（带判断分支）：</b></p><ul><li>① <b>Spend 达成率 ＜80%</b>：Goal 过紧 或 市场变贵 → 先查 CPM/竞争，再决定是否上调 Goal 5–10%。</li><li>② <b>事件量达标且平均≈Goal</b>：稳态，保持不变，记录为新的基线。</li><li>③ <b>平均持续高于 Goal 10%+ 超 2 周</b>：市场变贵信号，对照 L6-04 外部冲击诊断（竞争/季节性/素材疲劳）。</li><li>④ <b>业务反转检查</b>：本阶段是缺量还是缺利润？决定 Goal 松紧方向。</li></ul>",
cs:"某工业设备 Cost Goal $55 的周检视案例：某周 Spend 达成 70%、平均 $61。排查发现是德国公共假期 CPM 全线上涨（外部因素，对照组同样涨），非 Goal 过紧 → 不调 Goal，假期后自动恢复到达成 92%、平均 $54。若当时误改 Goal 到 $65，等于用成本换量、偏离了保利润目标。这个案例说明：周检视先分「内部 vs 外部」，再动配置。",
f:"论坛「根据目标 ROAS 去判断 CPA」=业务反转思维的社区版：先定业务线（ROAS/利润），再倒推可接受 CPA，而非反过来被系统数字牵着走；小强打法「ROAS 门槛随利润率调整（利润高就调低、低利润更严）」同理——利润结构变了，约束就变。社区用 ROAS 管预算、课程用 Goal 管出价靶心，同一货币两种用法，底层都是「业务优先于数字」。",
e:"<ul><li>用愿望定 Goal（拍脑袋数字）——脱离均值必花不动（根因：违背锚点原则）。</li><li>Goal 一跌就立刻改——应先查外部因素（CPM/竞争/季节），见 L6-04（根因：没做内外因区分）。</li><li>忘了 Goal 是平均而非保证——向老板做错误承诺，超一点就被当成失败（根因：策略定位误解）。</li><li>业务反转永不考虑——教条地紧 Goal，错过抢量窗口（根因：忽略 MSG 279–280）。</li><li>不设观察窗、按日调——日级噪声引发过度操作（根因：违背 ≥2 周观察纪律）。</li></ul>",
q:{q:"老板要求「Cost Goal 设 $30」但真实均值 $52。你的专业响应？",a:"分三步：①摆机制：$30 深低于均值→花不动→量崩→学习退化（MSG 269 因果链），最终连 $52 的量都没有；②给数据：展示 Spend 达成率模拟/历史波动，说明 $30 下预计达成率＜30%；③给替代：要么 Goal=$55–60 换「平均达标」，要么接受 Highest Volume＋事后按有效 CPL 考核。出价策略没有脱离业务的答案（MSG 280）——把业务目标（要量还是要利润）摆上桌，再定数字。"},
b:"为你一个主力组做一次完整的 Cost Goal 周检视（Spend 达成率/事件量/平均 vs Goal/外部因素排查/业务反转判断）并输出结论与下一步动作。"},
{id:"L5-09",lv:5,t:"ROAS / Value-based Goals",
g:"掌握以价值为靶心的出价目标（ROAS Goal / Value 优化）的适用条件与陷阱。",
c:"<p><b>两套以价值为靶心的出价目标：</b></p><ul><li><b>ROAS Goal（原 Minimum ROAS，2026 改名）</b>：系统按「回报率目标」竞价，多用于电商 Purchase＋value 场景。你设一个最低回报阈值（如 3x），Meta 只在预测回报≥该阈值的拍卖里出价。</li><li><b>Value-based / Value Optimization（价值优化）</b>：优化「转化价值」而非「转化次数」，让模型找「高价值人群」而非「多人」。需 Purchase value 经 Pixel/CAPI 可靠回传（见 L0-04）。</li></ul><p><b>铁律：</b>价值信号必须可信且覆盖足够——CAPI value 数据质量决定一切。误区纠正：①「value 数据半残就开 Value 优化」——价值信号稀疏或失真时，Value 优化反而放大噪声（MSG 404 的 Coverage 问题）；②「ROAS Goal 是 B2B 万能工具」——B2B 无线性 ROAS，硬套电商逻辑必翻车；③「传精确合同额」——敏感且失真，应分档（见 L5-04）。</p><p><b>类比（链接 L5-04）：</b>ROAS Goal 像「只打值钱的靶」，Value 优化像「让射手自己挑值钱的靶打」——两者都要先有可靠的价值信号，否则射手在瞎打。</p>",
m:"<p><b>机制链（链接 L0-06 与 L0-04）：</b></p><ul><li>① <b>链接 L0-06 总价值</b>：ROAS Goal / Value 优化提升的是 Estimated Action Rate 的「价值维度」——模型学到「谁会带来高价值」，Bid×EAR 在价值加权后更有竞争力。</li><li>② <b>链接 L0-04 CAPI</b>：价值信号靠 CAPI 回传最稳，且要带 value 参数与 event_id 去重（附录 A1/A3）。</li><li>③ <b>Coverage 陷阱（MSG 404）</b>：价值信号稀疏（如只回传头部订单）或失真时，模型在「少数样本」上学偏，放大噪声。B2B 价值离散度大（一个项目顶 100 个单），价值回传必须分档降噪。</li></ul><p><b>数字演算：</b>电商月单 2000、平均 ROAS 4.0、value 完整（退货已扣）。设 ROAS Goal 3.6（均值×0.9 略宽）→ 系统保底 3.6x 出价，Spend 达成 90%、ROAS 实测 4.1。若 value 只回传了 30% 订单 → Coverage 不足，模型在偏样本上优化，ROAS 实测跌到 2.8。</p>",
h:"<p><b>适用检查与落地（带具体数字）：</b></p><ul><li>① <b>优化事件有稳定 value 数据</b>：≥30–50/周（见 L0-05），口径稳定。</li><li>② <b>value 离散度可控</b>：分档回传（小/中/大），避免精确敏感数据。</li><li>③ <b>电商</b>：可直接 ROAS Goal，起步设历史均值×0.9（略宽），2 周观察 Spend 达成与 ROAS 双曲线，再逐步收至目标。</li><li>④ <b>B2B</b>：建议路径＝Lead 靶心＋Qualified 事件回传（L5-04）→ 成熟后再评估 Value 优化，不用 ROAS Goal（无线性 ROAS）。</li></ul>",
cs:"某工业设备不用 ROAS Goal（无线性 ROAS、单项目价值离散极大），采用「Qualified 事件＋value 三档回传」实现「价值感知」——3 个月后系统自动向工程类人群倾斜，有效询盘成本再降 12%（详见 L5-04 案例）。对比电商客户：月单 2000、ROAS 数据齐全，从 Highest Volume 切 ROAS Goal 3.6，2 周后 ROAS 实测 4.1、Spend 达成 90%，验证「先松后紧、量价双监控」路径成立。",
f:"论坛 ROAS 是最高频词汇之一：小强打法的 ROAS 分层规则（>3.5 才加预算、上限 $50/$100/$200；>3.0 且花费达 $20 上限 $100）就是「价值目标驱动预算」的民间自动化版；「根据目标 ROAS 判断 CPA」同理。社区用 ROAS 管预算、课程用 ROAS 管出价靶心——同一货币两种用法。社区共识「先算盈亏平衡再定扩量标准」也和「ROAS Goal 要对齐真实回报」同源。",
e:"<ul><li>value 数据半残就开 Value 优化——放大噪声，模型学偏（根因：违背 MSG 404 的 Coverage）。</li><li>把 ROAS Goal 当 B2B 工具——线性电商逻辑硬套离散 B2B，必翻车（根因：适用场景错配）。</li><li>value 传精确合同额——敏感＋失真，应分档（根因：违背 L5-04 降噪原则）。</li><li>ROAS Goal 设太高（贴近均值）——系统几乎不约束，等于 Highest Volume（根因：阈值失去意义）。</li><li>只盯 ROAS 不看价值信号质量——退货/折扣没扣，ROAS 虚高（根因：value 口径失真）。</li></ul>",
q:{q:"电商客户月单量 2000、ROAS 数据齐全。从 Highest Volume 切 ROAS Goal 的路径？",a:"①先验证 value 数据完整（退货是否已扣减、口径稳定）；②设 ROAS Goal＝历史均值×0.9（如均值 4.0 则设 3.6，略宽松起步）；③2 周观察 Spend 达成率与 ROAS 达成双曲线；④逐步收至目标阈值（每次小幅、间隔≥1 周）；⑤旺季/学习期临时松绑回 Highest Volume。原则：先松后紧，量价双监控（Spend 达成率掉就上调阈值）。B2B 无此线性 ROAS，走 L5-04 的价值回传路径。"},
b:"评估你的账户适用「事件迁移 / 价值回传 / ROAS Goal」中的哪条路径，写论证：事件量是否≥50/周、value 是否稳定可分档、是否有线性 ROAS。"},
{id:"L5-10",lv:5,t:"Constraint vs Delivery：什么时候放开限制",
g:"建立「约束的开关时机」决策模型：识别 Delivery Constraint 的信号，知道何时该松绑。",
c:"<p><b>四类常见约束，各有信号：</b></p><ul><li><b>Budget Constraint（预算约束）</b>：预算花完即停，量被钱限。信号：Spend 天天顶格、量到天花板。</li><li><b>Bid Constraint（出价约束）</b>：Cost Cap / Bid Cap 太紧 → 花不动＋资格丧失。信号：Spend 达成率＜80%、展示不足（见 L5-06/07）。</li><li><b>Learning Constraint（学习约束）</b>：学习 limited，样本不足。信号：事件量＜50/周、模型半懂不懂（见 L0-05）。</li><li><b>Audience Constraint（受众约束）</b>：池子见底，触达率降、边际成本升。信号：频次高但 CPM 涨、新受众扩不出（见 L0-08）。</li></ul><p><b>本质一句话：</b>约束是「用空间换确定性」。每加一道约束（预算/Cap/受众/事件），都在用 Delivery 空间换取某种确定性。放开时机的判断＝当前业务更需要空间还是确定性。</p><p><b>误区纠正：</b>「约束叠满最安全」——账户戴着镣铐跳舞，量价双输；「学习期就松绑」——顺序反了，学习期反而要少干扰，松绑是成熟后的事（见 L0-05）。</p>",
m:"<p><b>机制链（链接 L0-08 与 L0-05）：</b></p><ul><li>① <b>链接 L0-08 交付与边际</b>：Delivery 决定预算整体怎么流。任何约束都缩小「总价值够高的展示机会」池子，池子越小越花不动、边际成本越高。</li><li>② <b>链接 L0-05 学习期</b>：学习未完成时松绑（如翻倍加预算）→ 触发重大修改、重置学习期（分布漂移），模型退化。</li><li>③ <b>阶梯逻辑</b>：一次只松一道（先 Cap→再受众→再预算），每步观察 1–2 周，才能定位「哪道约束在卡」。全放开则量价质量同时失控，无法归因。</li></ul><p><b>数字演算：</b>某组 Learning 完成、Spend 达成 92%、CPL $52。移除 Cost Cap → Spend +35%、CPL 波动 +9%（可接受）→ 2 周后扩奥地利并组 → 再 +20% 预算。三步各留观察期，量价可控。若一步全放开（同时去 Cap＋扩受众＋加 50% 预算）→ CPL 波动 +30%、质量稀释，无法判断哪步出问题。</p>",
h:"<p><b>诊断与阶梯松绑步骤（带顺序）：</b></p><ul><li>① <b>先分清约束类型</b>：看系统标签＋触达率/边际成本/Spend 达成率，定位是哪道约束。</li><li>② <b>评估松绑代价</b>：成本波动↑？质量稀释？用 L0-08 边际视角预判。</li><li>③ <b>阶梯松绑</b>：一次只松一道（先 Cap 后受众再预算），每步观察 1–2 周。</li><li>④ <b>放量期默认松</b>：Cost Goal 放宽/移除 → 受众扩 → 预算跟。</li><li>⑤ <b>学习期不松绑</b>：未完成学习就加预算＝重大修改重学（见 L0-05）。</li></ul>",
cs:"某工业设备 DE 组放量决策：Learning 完成＋Spend 达成 92% → 先移除 Cost Cap（Spend +35%，CPL 波动 +9% 可接受）→ 2 周后扩奥地利并组（受众约束松开）→ 再 +20% 预算。三步各留 1–2 周观察期，量价可控、Qualified 占比稳定。若在 Learning 期就做这套，按 L0-05 会重置学习、CPL 飙升——顺序错了全盘皆输。",
f:"论坛「横向激进纵向保守」「关广告要快、建广告要多、加预算要慢」的口诀——社区对「约束松紧节奏」的经验版；流量高峰前加预算＋当天拉垮就关＝放量期的松紧实操。社区「翻倍加预算系统扩展人群彻底不出单」正是预算约束松太猛、撞上学习期重置的后果；「竞价加速容易卡死花不出钱」是出价约束过紧的写照。这些民间纪律与「阶梯松绑、一次一道」完全同向。",
e:"<ul><li>约束叠满从不评估——账户戴着镣铐跳舞，量价双输（根因：缺诊断）。</li><li>一次全放开——成本与质量双失控，无法归因（根因：违背阶梯逻辑）。</li><li>学习期就松绑——顺序反了，触发重大修改重学（根因：违背 L0-05）。</li><li>松绑后不盯边际——放飞的代价看不见（根因：缺 L0-08 边际监控）。</li><li>把 Budget Constraint 当唯一瓶颈——其实是 Bid/Audience 约束在卡，加预算只更贵（根因：没分清约束类型）。</li></ul>",
q:{q:"组显示「预算受限」（Budget Constraint）。直接加预算 50% 对吗？",a:"先确认约束类型与组的状态：学习期未完成＋翻倍＝触发重大修改重学（见 L0-05 分布漂移），正确做法——若学习已完成且边际健康→+20%，隔 2–3 天再评估（社区「加预算要慢」节奏）；若边际已爬坡（Audience Constraint，见 L0-08）→ 加预算只会更贵，先查受众容量。加预算是手段不是条件反射：先分清是 Budget/Bid/Learning/Audience 哪类约束，再决定松哪道、松多少。"},
b:"给你最受限的一个组做「约束诊断＋阶梯松绑计划」：列出四类约束的信号、判定你组属于哪类、给出一次只松一道的具体步骤与每步观察指标。"}
);

</script>
<script>
/* ===== 数据文件 6：Level 6 诊断、测量与因果实验（14 个） ===== */
MODULES.push(
{id:"L6-01",lv:6,t:"First Loss 定位法",
g:"掌握「找到第一处掉链子的漏斗层」的诊断纪律：先定位、再归因、后行动。",
c:"<p><b>标准漏斗长这样。</b>一条 B2B 线索从广告到成交要穿过六道门：Impression（曝光）→ Click（点击）→ LPV（落地页浏览，点击后真的打开页面）→ Lead（浏览后提交询盘）→ Qualified（询盘被销售判定为有效）→ Opportunity（进入商机）→ Deal（成交）。每一层的转化率相乘，才是最终的成交效率。这个链条最关键的特征是<b>串联</b>：前一层是后一层的输入，前一层塌了，后面全跟着塌。</p><p><b>First Loss 是什么？</b>它指的是「转化率偏离基线最早的那个层」——也就是整条链里第一个开始掉链子的环节。想象一根水管，中间某处破了个洞漏水，下游水压自然跟着掉，First Loss 就是你用手一摸、发现水最少的那一段。注意一个极易混淆的点：<b>First Loss 是「问题发生地」，未必是「原因所在层」。</b>比如落地页加载崩了（原因在 LPV 层的技术故障），但表现成 Lead 量腰斩（First Loss 可能显示在 LPV 层）。找到 First Loss 是定位问题的第一步，但并不等于已经找到原因。</p><p><b>为什么必须先找 First Loss？</b>因为漏斗是串联的，下游的所有异常都可能是上游的传导。如果你不看层级、直接对「最末端的异常」开刀——比如看到 Lead 少了就猛改素材——极可能两个问题：(1) 治错了地方（素材没问题，是落地页挂了）；(2) 制造新噪音（改素材重置学习期，见 L0-05，让本来就乱的数据更乱）。这就是「先定位、再归因、后行动」纪律的由来，它和 L0-08 里讲的 First Loss 是同一套思想，本章把它从一句话展开成可执行的诊断流程。</p><p><b>常见误区纠正：</b>很多人一看到 CPL 涨，本能反应是「素材不行了」然后换图。但 CPL = CPM/1000 ÷ CTR ÷ LPV率 ÷ Lead率，任何一层恶化都会推高 CPL（机制见 L6-02）。不定位 First Loss 就动刀，等于闭着眼睛修水管。正确姿势是先把每一层率算出来，看哪一环最先偏离。</p>",
m:"<p><b>① 机制：为什么「先找 First Loss」能避免方向性错误。</b>串联系统的可观测结果（最终 CPL、最终 Lead 数）是所有层共同决定的。如果你在没定位的情况下动刀，有 1/N 的概率（N=层数）正好打在 First Loss 层，其余概率都在浪费动作甚至制造伤害。定位之后，动作命中率变成 100%，且不会污染其他层的数据。这就是专业诊断把「定位」独立成一步的原因——它把随机试错变成定向手术。</p><p><b>② 机制：给定的数据怎么算 First Loss（完整演算）。</b>设某组上周数据：Impression 100,000、Click 1,100（CTR 1.1%）、LPV 935（LPV率 85%）、Lead 40（LPV→Lead 4.3%）、Qualified 18（Qualified率 45%）。本周：Impression 100,000、Click 1,210（CTR 1.21%，+10%）、LPV 1,029（LPV率 85%，持平）、Lead 22（LPV→Lead 2.14%，-50%）、Qualified 10（-44%）。逐层比对：CTR +10%（正常波动内）、LPV率 持平（说明流量到达没问题）、LPV→Lead 从 4.3% 掉到 2.14%（-50%，深度偏离）。所以 First Loss = LPV→Lead 层，而不是前端，也不是更下游的 Qualified。下一步只对该层列假设（落地页表单？Offer？竞争页？），绝不碰素材和受众。</p><p><b>③ 机制：为什么它和 L0 联动。</b>L0-08 把 First Loss 作为交付诊断的总纲一句话带过，本章是它的展开；而判断「这层的数据可信吗」要先回到 L0-03/04（像素与回传是否完好）和 L0-07（归因口径是否漂移）——如果底层数据本身在抖，First Loss 算出来的位置是假的。所以标准顺序是：先确认数据可信（L0-03/04/07）→ 再找 First Loss（本章）→ 再归因（L6-03）。</p>",
h:"<p><b>诊断三步清单（带具体阈值）：</b></p><ul><li>① <b>取同期基线</b>：拉本组过去 4 周的同口径均值（或同类平行组的同期值），算出每一层的基线转化率与允许的波动带（通常 ±20%）。没有基线就没有「偏离」，这是新手最常犯的错误。</li><li>② <b>逐层算率、找第一处显著偏离</b>：从 Impression 往 Deals 逐层算本周率，定位第一个偏离 >20% 且持续 ≥3 天的层。规则是「最早 + 最深」优先；若多层都偏，认第一处。</li><li>③ <b>只对 First Loss 层列假设</b>：写 3 条该层最可能的原因（如落地页技术故障、表单字段过多、Offer 变更），按验证成本从低到高排序去排查。严禁顺手去改无关层（会重置学习期）。</li><li><b>工具</b>：Ads Manager 的 Breakdown（看分版位/分设备/分地区的率）+ GA4 或网站分析的 LPV 数据 + CRM 的 Qualified/Opportunity/Deal 数据，三者拼成完整漏斗。</li></ul>",
cs:"<p>某工业设备（B2B 污水设备，主投德语区）曾发生一次「Lead 量腰斩」事件：周一到周三 Lead 从常态 42 条掉到 21 条，团队第一反应是「素材疲劳了，换图」。按 First Loss 流程逐层查：CTR 1.12%→1.09%（正常）、LPV率 85%→84%（正常）、LPV→Lead 4.1%→4.0%（正常）——前端三层全稳，说明流量质量和到达无恙；继续看发现是 LPV 绝对量从 935 掉到 510，即<b>LPV 本身崩了</b>。进一步查：某中东地区用户因本地 CDN 故障打不开落地页，而该组恰好把投放扩到了该地区。若直接改素材，就是冤案——既没解决问题，又重置了健康组的学习期。正确动作：恢复该地区落地页可达性，Lead 两天内回正。</p>",
f:"<p>论坛老手的盯盘实践，本质是消费级的 First Loss。他们的「三段盯盘法」把消耗分成三档：消耗不到 5 刀只看点击（确认最前端的曝光/点击层健康）；5–10 刀看 CPC/CPM/CTR 判断人群画像有没有跑偏（中段层）；10–30 刀才重点看转化，决定关停还是加预算（后端层）。这个「从前往后逐层确认」的顺序，和 First Loss 的「先定位层再动手」完全同源。论坛还有一句高频经验：「点击率高但转化 0，先查落地页」——点进来了却不转化，First Loss 就在落地页这一层，而不是素材。这些民间智慧没有漏斗公式，但方向和课程一致。</p>",
e:"<ul><li><b>跳过基线直接凭感觉</b>：没有「过去 4 周均值」作参照，就无法定义「偏离」，任何判断都是拍脑袋（根因：缺少历史口径基准）。</li><li><b>把下游症状当 First Loss</b>：看到 Lead 少就认定是 Lead 层问题，实际 First Loss 在上游（根因：忽视串联传导，只盯最末端点）。</li><li><b>一次怀疑五个层</b>：每层都动手，无法收敛，还重置了多个组的学习期（根因：没有「先定位再归因」的纪律）。</li><li><b>不查数据可信度就定位</b>：像素丢事件或归因口径变了，算出的 First Loss 是假的（根因：忘了 L0-03/04/07 是地基）。</li><li><b>用 2 天数据下结论</b>：日级波动常 ±20% 内，短期数据会把噪声当信号（根因：没等到持续 ≥3 天的偏离）。</li></ul>",
q:{q:"周数据：CTR 1.2%（基线 1.1%）、LPV率 85%（基线 86%）、LPV→Lead 4.1%（基线 6.8%）。First Loss 在哪？下一步？",a:"<p><b>推理步骤：</b>① 先比三层幅度：CTR 1.2% vs 1.1%（+9%，在正常 ±20% 波动带内，前端健康）；LPV率 85% vs 86%（-1%，持平，说明点击后到达没问题）；LPV→Lead 4.1% vs 6.8%（-40%，深度且显著偏离）。② 判断位置：前两层正常，排除「流量质量」和「到达」问题；偏离集中在 LPV→Lead 这一层，所以 <b>First Loss = LPV→Lead 层</b>。③ 下一步：只针对该层列假设——落地页近期改版？表单提交按钮故障？Offer/赠品变了？竞品页抢转化？按验证成本从低到高排查（先查表单提交日志与近期页面改动记录）。<b>绝不</b>去动素材和受众，因为它们对应的层（CTR/LPV）是健康的，乱改只会重置学习期、制造新噪音。</p>"},
b:"用三层真实数据（CTR、LPV率、LPV→Lead）完成一次 First Loss 定位，并写出对 First Loss 层的 3 条验证假设与验证动作。"},
{id:"L6-02",lv:6,t:"Metric Decomposition（指标拆解）",
g:"把 CPL 等复合指标拆成乘法链，看懂「每一项各贡献了多少恶化」。",
c:"<p><b>CPL 不是一个数，是一个乘法链。</b>完整写法是：CPL = CPM/1000 ÷ CTR ÷ LPV率 ÷ Lead率。每一项都是一个「率」，它们之间是除法关系——上游省一点、下游漏一点，最终 CPL 是各层共同决定的。同理往深拆：有效 CPL = CPL ÷ Qualified率（过滤掉无效询盘）；Deal Cost（成交成本）= 有效 CPL ÷ Opportunity率 ÷ Deal率。每一个分母都是漏斗里的一层「过滤网」。</p><p><b>为什么必须拆？</b>类比一张水电费账单：你只看到「总账单涨了 38%」没用，必须拆成「水费涨多少、电费涨多少、燃气涨多少」才能知道去哪查。CPL 也一样——不拆，你永远不知道恶化发生在「市场变贵了（CPM）」还是「素材老了（CTR）」还是「落地页烂了（LPV率）」还是「表单/Offer 劝退了人（Lead率）」。这四个因子对应四种完全不同的处方，对应错就是白忙。</p><p><b>常见误区纠正：</b>「只看 CPL 一个数字的黑箱诊断」是新手通病——看到 CPL 涨就笼统说「效果差了」，然后全面调账户。但 CPL 涨可能是 CPM 季节性上涨（你控制不了的市场问题，见 L6-04），也可能是 Lead 率跌（你完全能改的转化设计问题）。不拆，你无法区分该「忍」还是该「改」，方向错了全盘皆输。</p>",
m:"<p><b>① 机制：四因子对应四张处方。</b>CPM 涨 → 竞价环境/季节（市场问题，处方是评估承受力与错峰，见 L6-05）；CTR 跌 → 素材疲劳/人群错配（创意问题，处方是换素材角度）；LPV率跌 → 落地页加载/技术故障（站点问题，处方是修页面与速度，见 L6-08 同源）；Lead率跌 → Offer 吸引力/表单门槛（转化设计问题，处方是调 Offer 与表单）。拆出来的因子直接告诉你「该找哪个部门」。</p><p><b>② 机制：用乘法还原（完整演算）。</b>假设基线 CPM $10、CTR 1.0%、LPV率 85%、Lead率 5%。基线 CPL = 10/1000 ÷ 0.01 ÷ 0.85 ÷ 0.05 = 0.01 ÷ 0.01 = 1；1 ÷ 0.85 = 1.176；1.176 ÷ 0.05 = 23.53，即基线 CPL ≈ $23.5。本周 CPM $11.2（+12%）、CTR 0.92%（-8%）、LPV率 83%（-2.4%）、Lead率 4.25%（-15%）。本周 CPL = 0.0112 ÷ 0.0092 ÷ 0.83 ÷ 0.0425 = 1.217 ÷ 0.83 = 1.466；1.466 ÷ 0.0425 = 34.5，即本周 CPL ≈ $34.5，整体 +47%。四因子各自贡献：CPM +12%、CTR -8%、LPV率 -2.4%、Lead率 -15%——显然 <b>Lead率 是主因</b>，该去查表单和 Offer，而不是怪 CPM。</p><p><b>③ 机制：和 L0 的联动。</b>L0-08 给了 CPL 的链式公式作为「边际与漏斗」思想的一部分，本章把它变成每周可执行的拆解表；而乘法链里每一层的率，其数据可信度都依赖 L0-03（像素与事件）和 L0-04（CAPI 双通道）——回传掉了，某一层率会被算成假数，拆解结论跟着错。所以拆解前先确认数据通道健康。</p>",
h:"<p><b>周度四因子拆解表（SOP）：</b></p><ul><li>① 列出四个因子本周值与 4 周基线值：CPM、CTR、LPV率、Lead率。</li><li>② 各算「本周 vs 基线」的变化%（如 CPM +12%、CTR -8%）。</li><li>③ 用乘法还原总 CPL 的变化，找出贡献最大的 1–2 个因子（对数化或直接套公式：总变化≈各因子变化率的乘积还原）。</li><li>④ 同法拆「有效 CPL」：在 CPL 基础上再拆 Qualified率；拆「Deal Cost」：再拆 Opportunity率与 Deal率。</li><li>⑤ 输出一句话：本次 CPL 恶化 X% 中，CPM 贡献 Y 个点、CTR 贡献 Z 个点、Lead率贡献 W 个点——只针对最大贡献者开刀。</li></ul>",
cs:"<p>某工业设备 4 月有效 CPL 环比 +38%。团队第一反应是「CPM 又涨了，市场不行」。四因子拆解后：CPM +12%（贡献 12 点）、CTR -8%（贡献 8 点）、LPV→Lead 率 -15%（贡献 15 点）、Qualified率 -5%（贡献 5 点）。结论：主因在中后段（落地页+表单+资质筛选），不是 CPM。进一步查：当月表单从首屏挪到页尾 + 新增 2 个必填字段，导致 Lead率与 Qualified率双跌。<b>如果当初被「CPM 涨了」带偏去缩量，就会错过真正的修复点</b>——把表单改回首屏、删掉一个非必填字段后，有效 CPL 三周回到基线。</p>",
f:"<p>论坛盯盘口诀「高 CPM+高点击=高价值人群；低 CPM 低点击=垃圾受众；高 CPM 高 CPC 低 CTR=人群跑歪」，正是 CPM×CTR 双因子拆解的民间智慧——老手用消耗档位人工估计这两层的乘积，判断人群值不值得留。另一句「素材三指标联动（频次/CTR/CPC）」也是把单个指标放回关系里看，而不是孤立读 CTR。课程把这套直觉形式化成四因子乘法链，让「值不值得留」变成可计算的数字。</p>",
e:"<ul><li><b>只看 CPL 黑箱诊断</b>：不拆因子，笼统说效果差，方向全错（根因：把复合指标当原子指标）。</li><li><b>用加法思维看乘法链</b>：把各因子%简单相加还原总变化，结果对不上（根因：链是除法不是加法，必须乘法还原）。</li><li><b>拆完不对应处方</b>：知道 CPM 涨但没去区分市场问题还是自身问题（根因：忘了因子→责任人/处方的映射）。</li><li><b>忽略数据可信度</b>：回传掉了某层率被算假，拆解结论错（根因：L0-03/04 地基未校验）。</li><li><b>只拆 CPL 不拆有效 CPL/Deal Cost</b>：前端好看但后端 Qualified率崩，整体还是亏（根因：没沿漏斗往下拆到底）。</li></ul>",
q:{q:"CPM +25%、CTR -10%、Lead率持平。CPL 涨了多少？主因是什么？",a:"<p><b>推理步骤：</b>① 写出 CPL 链：CPL = CPM/1000 ÷ CTR ÷ LPV率 ÷ Lead率（LPV率未提，视为持平）。② 套变化：CPM 变 1.25 倍、CTR 变 0.9 倍、Lead率 1.0 倍，CPL 倍数 = 1.25 ÷ 0.9 ÷ 1.0 = 1.389，即 <b>CPL +38.9%</b>。③ 看主因：CPM 贡献 +25%、CTR 贡献 -10%（即 +11% 的放大），Lead率 0。主因是 <b>CPM 上涨（占绝对大头）</b>，属于竞价环境或季节性变贵（见 L6-04 外部冲击），素材只贡献约 11 个点。④ 处方：先查竞价环境（竞对是否加投、是否旺季），素材为辅；若确认市场级上涨，按承受力评估而非盲目改素材。注意：LPV率若也微跌，实际会更高，应一并核对。</p>"},
b:"为上周 CPL 异常做一次完整四因子拆解（CPM/CTR/LPV率/Lead率），算出总变化%并指出最大贡献因子，对应到具体处方。"},
{id:"L6-03",lv:6,t:"Root Cause Tree（根因树）",
g:"用根因树把「症状」系统展开成「可验证的假设清单」，避免拍脑袋归因。",
c:"<p><b>根因树是什么？</b>当你看到「Qualified率从 40% 掉到 28%」这种症状，不要立刻跳到结论，而是把它系统展开成一棵可验证的假设树：症状是树干，一级分支是几大类可能方向，二级分支是每类下 2–3 个具体、可验证的原因，每个叶子标注「怎么验证」。它本质是一个<b>结构化脑暴＋验证计划</b>，把「拍脑袋归因」升级成「穷举主要分支再排序」。</p><p><b>类比：医生问诊。</b>病人说「肚子疼」（症状），医生不会直接开止疼药，而是按系统排查：肠胃？肝胆？泌尿？肌肉？每个方向再做检查（验血、B超）。根因树就是给广告账户做的「问诊表」——先分系统，再下钻，最后用检查数据锁定真因。直接给「肚子疼」吃止疼药，就是论坛里常见的「素材不行」「风控来了」式单因子归因。</p><p><b>四大主干（通用模板）。</b>对「质量类」症状（如 Qualified率掉），一级分支通常四类：① 数据口径变了（Qualified 定义或回传规则改了）；② 人群变了（受众漂移、扩了新国家/新人群）；③ 素材变了（吸引了错的人）；④ Offer/流程变了（表单字段、销售响应时效变化）。每一类验证法完全不同，所以必须分清楚再动手。</p><p><b>常见误区纠正：</b>「最响的假设先动手」——哪个原因听起来最合理就先改哪个，结果常常改错。根因树的纪律是穷举+排序+按验证成本从低到高执行，而不是凭响度。</p>",
m:"<p><b>① 机制：为什么穷举比直觉可靠。</b>人的大脑有「可得性偏差」——最近发生的事、听起来最合理的解释会抢占注意力。根因树强制你把主要分支先列全（四类全写上），再排序，避免「第一个想到的原因」独享注意力。这和多臂老虎机/假设检验的「先列全集再选」是同一逻辑。</p><p><b>② 机制：四方向各自的验证法（演算式清单）。</b>①口径：问 CRM 是不是改了 Qualified 定义/销售判定标准，查 CRM 变更记录——验证成本最低，优先做；②人群：拉分国家/分人群 Breakdown，看各分项 Qualified率，若某新国家骤降即锁定；③素材：看消耗结构变化（是否新增/放量了某类素材），单独拉该素材的漏斗；④Offer/流程：对照表单字段变更记录与销售响应时效（如 SLA 从 4h 变 24h）。四类验证成本递增，按序执行。</p><p><b>③ 机制：和 L0 的联动。</b>①口径 这一支直接依赖 L0-03（事件与参数定义）和 L0-04（回传是否完好）——很多「质量掉了」其实是回传断了或定义变了，不是真掉了；④这一支依赖 L0-07 的口径一致性。所以根因树的第一步往往不是猜，而是先回 L0 校验数据本身。</p>",
h:"<p><b>实操四步：</b></p><ul><li>① 写下症状与幅度（如 Qualified率 40%→28%，跌 12 个点），并确认它不是正常波动（见 L6-07 阈值）。</li><li>② 画四大分支：口径/数据、人群、素材、Offer/流程。</li><li>③ 每分支写「最快验证动作」（见 m 的清单），标验证成本。</li><li>④ 按验证成本从低到高排序执行，每验证一个叶子就划掉或锁定，直到找到真因；禁止未验证就动手改。</li></ul>",
cs:"<p>某工业设备一次 Qualified率崩盘：两周内从 42% 掉到 26%。团队直觉是「素材吸引错人了」。按根因树走：①口径——问销售主管+查 CRM 变更记录，无变化；②人群——分国家 Breakdown 发现上周 Broad 组扩了波兰、罗马尼亚两个新国家，这两个国家的 Qualified率仅 12%（老市场 45%），稀释了整体；③素材与④Offer 无需再查即已定位。真因是<b>人群分支（扩新国家带来低资质流量）</b>，不是素材。处方：新国家单独建组控量+加资质预筛问题。若当初直接换素材，冤案且无效。</p>",
f:"<p>论坛里同类事故的社区归因常停留在单因子——一句「素材不行」「风控来了」就结束。根因树正是把这种「致命操作复盘」升级为系统方法。论坛反复强调「排查能力」才是核心能力，而课程把「怎么系统排查」讲成了四分支+验证动作的固定模板，差距就在 systematic（系统化）这四个字。</p>",
e:"<ul><li><b>直接采纳第一个想到的原因</b>：可得性偏差，最响的假设先动手（根因：没穷举分支）。</li><li><b>根因树画了不验证</b>：变成装饰，没执行就动手（根因：把「列假设」当「找到原因」）。</li><li><b>把时间先后当因果</b>：某改动后指标掉了就认定是它，可能是后此谬误（根因：缺控制组对照，见 L6-10）。</li><li><b>只查自己熟悉的分支</b>：只会看素材，忽略口径/人群（根因：分支没列全）。</li><li><b>验证成本高的先做</b>：先动大改，污染数据（根因：没按低成本优先排序）。</li></ul>",
q:{q:"Qualified率两周内 45%→30%。画出你的根因树四大分支与每个的验证动作。",a:"<p><b>推理步骤：</b>① 先确认幅度：45%→30% 跌 15 个点，超出正常波动，值得排查（见 L6-07）。② 画四大分支并写验证动作：<b>口径/数据</b>——CRM 的 Qualified 定义或销售判定标准变了？→ 问销售主管＋查 CRM 变更记录（成本最低，先做）；<b>人群</b>——受众或国家结构变化？→ 分国家/人群 Breakdown 看分项 Qualified率；<b>素材</b>——新增/放量素材吸引错人？→ 消耗结构对比＋新素材单独漏斗；<b>Offer/流程</b>——表单字段、销售响应时效变化？→ 对照变更记录与 SLA 数据。③ 按验证成本从低到高执行：先口径（问+查记录），再人群（Breakdown），后两者按需。④ 每验证一个叶子就记录结果，定位真因前不动手改。</p>"},
b:"为你最近一次质量异常画完整根因树（四大分支＋每叶验证动作），并记录每叶子的验证结果。"},
{id:"L6-04",lv:6,t:"外部冲击诊断（竞争/季节/政策）",
g:"识别「不是你的错」的三类外部冲击：竞价竞争、季节节奏、平台政策与口径变化。",
c:"<p><b>外部冲击＝「不是你的错」的三类变化。</b>广告账户的数据会同时被「你自己的操作」和「外部环境」影响。外部冲击有三类：① <b>Auction Competition（竞价竞争）</b>——竞对加大投放或旺季来临，全行业 CPM 上涨，特征是你什么都没动、CPM 却和同行一起涨；② <b>季节性</b>——节假日、财年周期、B2B 的暑假/圣诞淡季，需求本身起伏；③ <b>平台政策与口径变化</b>——Meta 改归因规则、算法调整，特征是对齐「平台公告日」、全账户同一天跳变。</p><p><b>类比：海面的潮汐 vs 你船的故障。</b>船速慢了，可能是自己引擎坏了（内部问题），也可能是碰上退潮（外部冲击）。退潮时所有船都慢、且和月亮周期对齐；引擎坏只有你一艘船慢、且和你上次保养时间吻合。区分「潮汐」还是「引擎」，决定你是该修船还是该等潮——修船修在退潮上纯属浪费。</p><p><b>常见误区纠正：</b>CPM 一涨就改素材，是把「市场变贵」当「创意问题」，相当于退潮了去拆引擎。还有一类更隐蔽的：平台改了归因口径导致「数据暴跌」，新手当成「效果崩了」疯狂换素材——其实数字尺子变了，生意没变（见 L6-13 口径陷阱，与 L0-07 联动）。</p>",
m:"<p><b>① 机制：外部冲击的特征识别。</b>三个特征同时出现＝外部冲击：<b>时间突变</b>（某一天集体跳变，不是渐进）、<b>空间普遍</b>（所有组/所有市场同时变，不是局部）、<b>与你自己的变更日志无关</b>（你上周没动，它自己变了）。内部问题的特征正好相反：渐进、局部、与你的操作时间吻合。</p><p><b>② 机制：用「对照」判定（演算式）。</b>假设你有 5 个组，其中 3 个本周没动过任何设置。若这 3 个「没动的组」CPM 也同步 +30%，而只有 2 个动过的组异常——说明是外部冲击（连静止组都被波及）；若只有动过的 2 个组异常、静止组平稳，则是你自己的操作引起的内部问题（见 L6-05）。「有没有不动的对照组」是区分内外的关键证据。</p><p><b>③ 机制：和 L0/L6 的联动。</b>平台口径变化（如 2026-03 归因重写）本质是 L0-07 讲的「口径≠效果」，必须回口径台账（L6-13）而不是动创意；而竞争/季节类冲击的决策逻辑，接 L6-05（预算问题 vs 市场竞争问题）和 L6-06（何时不该动）——很多外部冲击的正确动作是「按兵不动」。</p>",
h:"<p><b>外部冲击核查清单：</b></p><ul><li>① <b>变更日志对照</b>：拉自己过去 2 周的改动清单（预算/受众/素材/出价），确认异常是否和某次改动时间吻合。</li><li>② <b>横向对照</b>：用同行业大盘 CPM 工具、或自家多个账户/多个「未动过的组」横向比，看是不是全市场一起涨。</li><li>③ <b>平台公告核对</b>：查 Meta 政策/归因变化（如 2026-03 归因重写导致数据「暴跌」是口径非效果），公告日=跳变日即锁定。</li><li>④ <b>季节日历</b>：对照德国假期、中国春节、黑五等节点，判断是不是周期性需求起伏。</li><li>结论：三项指向「外部」→ 不内改，按 Cost Goal 机制观察（L5-08 周检视逻辑）；指向「内部」→ 走 L6-05 判别。</li></ul>",
cs:"<p>2026 年 3 月 Meta 归因重写（点击归因只算真实链接点击、点赞分享等互动移入 1 天窗口的 Engage-through、视频观看阈值 10 秒→5 秒）：大量账户「数据暴跌」——Lead 数环比砍掉一大截。看懂诊断的团队立刻意识到这是<b>口径变更而非效果变化</b>：建立口径台账、报表加版本线、全团队通报「数据将系统性下移 X% 属预期」。结果当月零误操作。而不懂诊断的团队大量误判「崩盘」、疯狂换素材、砍预算，白丢了一周学习期还制造了噪声。同一天跳变＋全账户同步＋对齐公告日＝教科书级外部冲击（平台口径型）。</p>",
f:"<p>论坛版本的「外部冲击」主要表现为风控与算法突变：社区高频帖「六月初风控一来，一整个月都在亏钱」——大批账户同天集体崩盘，就是平台级变化的民间信号；还有「一个月后再开效果变差，多半是算法已变」。社区用「一群人同时崩」来识别平台级变化，和课程的「空间普遍＋时间突变」特征完全对应，只是社区没有口径台账这套系统工具。</p>",
e:"<ul><li><b>CPM 一涨就改素材</b>：把市场问题当创意问题（根因：没做横向对照）。</li><li><b>忽视平台公告</b>：口径变化当效果变化，疯狂误操作（根因：没建口径台账，见 L6-13）。</li><li><b>没有变更日志</b>：无法排除自己，把内部问题甩锅外部（根因：操作不记录）。</li><li><b>只看单一组</b>：缺对照组，分不清局部还是全局（根因：没横向对照未动组）。</li><li><b>把季节当崩盘</b>：黑五/B2B 假期前慌乱缩量，错失量（根因：没对照季节日历）。</li></ul>",
q:{q:"周一早上全账户 CPM +30%、CPL +25%。周五你换过一张主图。归因？",a:"<p><b>推理步骤：</b>① 看特征：异常是「全账户同时 +30%」——一张主图不可能让所有组同步上涨，所以主图不是主因。② 三个外部特征核对：时间突变（周一集体跳变）✓、空间普遍（全账户）✓、与自己变更无关（只动过一张主图，且它只影响一个组）✓ → <b>外部冲击特征明显</b>。③ 动作：先查大盘/竞对 CPM 与平台公告（看是不是旺季或算法变更）；再单独查那张主图所在组有没有「额外」偏离（它可能另有内部问题，但要和全局冲击区分开）；④ 若确认市场级冲击 → 不内改创意，按 Cost Goal 机制观察一周，等潮退（接 L6-06 不动纪律与 L5-08 周检视）。</p>"},
b:"建立你的「外部冲击核查清单」（变更日志＋横向对照＋平台公告＋季节日历），并维护一份变更日志模板。"},
{id:"L6-05",lv:6,t:"预算问题 vs 市场竞争问题",
g:"区分「我扩出来的问题」和「市场变贵的问题」——两种病两种药。",
c:"<p><b>两种「成本涨了」的病因，长得一样，药完全不同。</b>A 型＝<b>预算扩张导致</b>：你主动加预算/扩受众后，Spend 上升且成本爬坡，特征是「你的动作」与「成本上升」时间吻合、触达更宽的人群（边际人群更贵，见 L0-08 边际经济学）。B 型＝<b>市场竞争导致</b>：你预算没动，CPM 全线上涨，事件量下滑，特征是「外部挤压」、和你的操作无关（见 L6-04 外部冲击）。</p><p><b>类比：餐厅排队变长。</b>A 型是你自己把门面扩大、吆喝更响，引来了更多边际顾客，平均每位顾客的成本（获客）自然略升——这是扩张的代价；B 型是整条街开了三家竞品、客流被分走，你啥也没动单子却少了——这是市场环境恶化。两种「排队变长」解法相反：A 型评估「扩张是否还划算」，B 型评估「要不要错峰/提质/扛住」。</p><p><b>常见误区纠正：</b>两个极端都常见且都错：① 一切恶化都怪「市场变贵」——掩盖了自己扩量失误，迟迟不收手；② 一切恶化都怪自己——旺季明明是外部挤压，却白白收缩错失量。判别的核心就是「对照自己的动作日志」。</p>",
m:"<p><b>① 机制：判别核心＝对照动作日志。</b>把成本曲线叠在你的变更时间轴上：若成本上升的拐点正好落在你「加预算/扩受众」之后 → A 型嫌疑；若成本上升和任何外部事件（旺季、竞对、平台变更）吻合、而你毫无操作 → B 型嫌疑。证据来自「时间对齐」。</p><p><b>② 机制：用对照组确认（演算式）。</b>你加了预算的组 CPL +15%，但查「同市场、没加预算的对照组」CPL 平稳 → 说明是你扩张的边际成本（A 型），正常现象；若对照组也同步 +15% → 说明是市场整体变贵（B 型），你的扩张只是叠加在趋势上。对照组是区分 A/B 的硬证据（呼应 L6-10 控制组思想）。</p><p><b>③ 机制：两种药方。</b>A 型 → 回调节奏/边际管理（扩量看边际 CPL/边际 Deal 成本，不只看平均，见 L0-08 与 L7 章）；B 型 → 评估承受力，用错峰、提质、Cost Goal 机制应对（接 L6-04 与 L5-08）。判错类型，药方就反，越治越糟。</p>",
h:"<p><b>判别三查：</b></p><ul><li>① <b>时间对齐</b>：变更日志 vs 成本曲线，拐点是否落在你的加预算/扩受众之后。</li><li>② <b>对照物</b>：未动的组/市场是否也在变贵？动了组独跌＝A；全市场齐跌＝B。</li><li>③ <b>幅度</b>：A 型通常与扩张幅度成比例（加 20% 预算，边际成本升 15% 级别）；B 型常表现为整体水位的跳变（全市场一起台阶式上涨）。</li><li>结论：A→看边际 Deal 成本是否在业务可接受线内，是则继续 +10–20% 节奏，否则暂停；B→按承受力评估，不盲目缩。</li></ul>",
cs:"<p>某工业设备 9 月 CPL 环比 +20%。变更日志显示当月预算 +25%（A 型嫌疑）；但横向一查，未动过的 RT（再营销）组 CPM 也同涨 18%（B 型信号）。结论＝<b>混合型</b>：既有扩张带来的边际成本上升（A），又有旺季竞价上涨（B）。处方不是「全怪市场不动」也不是「全收预算」，而是：扩张节奏放缓至 +10%，让边际成本可控；同时保持对旺季竞价的承受力评估，旺季结束再复盘。一刀切要么错失量、要么烧钱。</p>",
f:"<p>论坛老手的「横向激进纵向保守」「表现好加 10–30%、撞人群找能跑的」，本质是用手感控制 A 型风险——加预算克制、扩受众找能跑的，避免一把扩太宽触发边际暴涨。而旺季/黑五竞价上涨是社区每年固定话题（「黑五死户与成本」），属于 B 型的季节性早有共识。社区用经验区分这两类，课程用「变更日志＋对照组」把它变成可验证的判别流程。</p>",
e:"<ul><li><b>一切恶化怪市场</b>：掩盖自己扩量失误，迟迟不收手（根因：没对照变更日志）。</li><li><b>一切恶化怪自己</b>：旺季白白收缩，错失量（根因：没看对照组/季节日历）。</li><li><b>不做对照检查</b>：没有参照系，A/B 全靠猜（根因：缺静止对照组）。</li><li><b>只看平均 CPL</b>：A 型下平均还行但边际已爆，继续加（根因：忘了 L0-08 边际视角）。</li><li><b>把混合当单一</b>：既扩又旺，只认一种药（根因：没做三查分离）。</li></ul>",
q:{q:"加预算 20% 后 CPL +15%。是 A 还是 B？怎么确认？",a:"<p><b>推理步骤：</b>① 先做时间对齐：成本上升拐点是否落在加预算之后（是→A 嫌疑）。② 做对照检查：查同市场、未加预算的组 CPL 是否平稳。若平稳 → <b>A 型</b>（扩张的边际成本，正常现象，对应边际分析）；若全市场都涨 → <b>B 型叠加</b>。③ A 型确认后看边际 Deal Cost：若边际成交成本仍在业务可接受线内 → 继续按 +10–20% 节奏扩；若已逼近盈亏线 → 暂停扩张。④ 关键纪律：A 型下「平均 CPL 还行」会骗人，决策必须用边际数字（L0-08），且加预算幅度 ≤20%、间隔 24h（L0-05），避免触发学习期重置放大成本。</p>"},
b:"用你的变更日志＋对照组数据完成一次 A/B 型判别，写出结论与对应药方（扩量节奏 or 承受力评估）。"},
{id:"L6-06",lv:6,t:"When Not to Act（什么时候不该动）",
g:"建立「不动」的纪律：识别正常波动、样本不足与「修复型过度干预」三陷阱。",
c:"<p><b>「不动」是一种主动纪律，不是懒惰。</b>有三种情形，正确动作是记录观察、不要动手：① <b>正常波动</b>——日级数据在 ±20% 内晃、没有单边趋势，这是噪声不是信号；② <b>样本不足</b>——新组前 48–72 小时、小预算组周事件 <10，任何「结论」都是噪声；③ <b>干预会制造新变量</b>——你正在观测期/实验期里动手，前面的观察全部作废，等于推倒重来。</p><p><b>类比：守门员别乱扑。</b>新手守门员看到球一动就扑，结果扑错方向送球进门。老手先读趋势、确认是真威胁才动。广告盯盘一样：日级波动是「球晃了一下」，不是「射门」。乱扑（随手改）的唯一后果是永远在「重新站位」，数据永远不可读。</p><p><b>常见误区纠正：</b>「数据焦虑驱动的随手改」是新手最贵的手癖——看到 CPL 高一点就换素材、看到某格差就关组。但 2 天数据不是趋势，实验期间顺手优化会污染整个实验（见 L6-10/12）。不动比乱动专业得多。</p>",
m:"<p><b>① 机制：为什么每次干预都重置观测条件。</b>Meta 模型在「当前配置的数据分布」上学习（L0-05）。你改素材/受众/出价，等于改了配置，模型要重新探索——不仅当前的「学习期」可能重置，连你正在做的对比实验也被污染（实验组变了，前后不可比）。所以干预的代价 = 丢失已有学习 + 污染待读数据。</p><p><b>② 机制：样本不足时「结论」是噪声（演算式）。</b>新组 48h 只拿到 3 个 Lead，CPL 算出 $80（基线 $50）。但 3 个样本的标准误极大：可能下一波 10 个 Lead 进来，CPL 直接回到 $45。用 3 个样本判断生死，等于用抛 3 次硬币「证明」硬币不公平。B2B 还有转化延迟（见 L6-09），48h 连后端都没熟。</p><p><b>③ 机制：和 L0/L6 的联动。</b>不动纪律是 L0-05 学习期纪律的延伸（频繁改动＝不断重置学习期，三大致命操作之首）；而「什么时候该动」的量化标准接 L6-07（Action Threshold）。先有不動的纪律，再有动的阈值，顺序不能反。</p>",
h:"<p><b>行动前置三问：</b></p><ul><li>① <b>变化超出正常波动带了吗？</b>画过去 4 周均值 ±2σ 的带，当前值落带内＝正常波动，不动。</li><li>② <b>样本够下结论吗？</b>事件数、天数是否达到最小样本（新组≥72h、周事件≥10，B2B 还要等 Qualified 反馈 ~1–2 周）。不够＝观察，不动。</li><li>③ <b>现在动手会污染什么？</b>是否处在观测期/实验/Cohort 窗口中？会污染＝记录，不动。</li><li>三问有任一「否」→ 记录观察，不动；三问全「是」→ 进入 L6-07 阈值流程再动。</li></ul>",
cs:"<p>某工业设备「周五数据拉闸」事件：B2B 决策者周五不刷设备类广告，周内日级波动本是正常（周五 Lead 量规律性下探）。团队本能想换素材「救一下」。按不动纪律冻结到周一——周一数据自动回升，没有任何操作。避免了一场无意义的重学习。事后把「周五下探」标进波动带，从此不再误判。</p>",
f:"<p>论坛反例俯拾皆是：「每天频繁改动＝不断重置学习期，纯送钱」（三大致命操作之首）；「暂停 7 天内不会重新学习」——连开关都要克制；「单一素材除非数据离谱否则少做关停，让系统优胜劣汰」。这些社区血泪经验，正是「不动纪律」的民间版：系统自己会筛选，操盘手乱插手反而坏事。</p>",
e:"<ul><li><b>数据焦虑随手改</b>：最贵的手癖，永远在重学习（根因：把噪声当信号）。</li><li><b>2 天数据当趋势</b>：样本不足就下结论（根因：不懂标准误/延迟）。</li><li><b>实验期间顺手优化</b>：污染实验，前后不可比（根因：忘了 L6-10/12 的纯净性）。</li><li><b>周五改组周一评估</b>：横跨周末波动，结论失真（根因：没看波动带中的周期项）。</li><li><b>新组当天就判生死</b>：48h 连学习期都没进（根因：违反 L0-05 静默期）。</li></ul>",
q:{q:"新组上线 48 小时，CPL 高出目标 60%。改受众还是再等等？",a:"<p><b>推理步骤：</b>① 看样本：48h 通常只拿到个位数 Lead，远不足以判生死（B2B 还有转化延迟，见 L6-09）。② 套不动三问：第①问波动带——新组无历史带，但 48h 本就是噪声区；第②问样本——明显不足（事件<10、天数<72h）＝否；第③问污染——现在大改会重置刚起步的学习期＝会污染。任一「否」→ 不动。③ 正确动作：给满 72h＋至少花费 ≥1×CPL×3 的观察窗；期间只确认「前端健康」（CTR/CPM/pacing 正常即可）。真正的异常信号是「前端也崩」（说明定向/素材有问题），而不是「后端贵」（后端贵常是样本与延迟造成的假象）。</p>"},
b:"为你的团队写出「不行动三问」（波动带/样本/污染）并贴进盯盘 SOP。"},
{id:"L6-07",lv:6,t:"Action Threshold（动作阈值）",
g:"为每类异常预设量化阈值与最小样本，把「什么时候必须动手」变成制度而非情绪。",
c:"<p><b>把「什么时候必须动手」从情绪变成制度。</b>阈值三件套：① <b>触发线</b>——如 CPL > 基线×1.3 且持续 5 天；② <b>最小样本</b>——如 ≥15 个事件或花费 ≥2×CPL 才评估；③ <b>冷却期</b>——动作后 ≥72h 内不再动。每个账户/市场按自身波动性标定，不是抄别人的数。</p><p><b>类比：恒温器。</b>你不会在气温每波动 0.1 度时就冲去调空调——恒温器设了「低于 18 度才启动、且启动后锁 10 分钟」。阈值三件套就是广告账户的恒温器：预先在冷静时定好「多疼算疼、等多久、动多深」，盘中既当裁判又当球员时才不会乱。</p><p><b>常见误区纠正：</b>「阈值拍脑袋定」——没算过自身波动带就设 1.3 倍，结果天天误触发或永远不触发；「有触发线没最小样本」——被 1 天数据骗去动手；「动作后无冷却期」——干预链式污染（见 L6-06）。三件套缺一件都不稳。</p>",
m:"<p><b>① 机制：阈值的意义＝把决策权移交「上周的冷静」。</b>盘中情绪最贵：看到 CPL 飙就慌，慌就乱改。预先标定，等于让「没被情绪污染时的自己」替「盘中的自己」做了决定。这是行为金融里「承诺机制」的广告版。</p><p><b>② 机制：触发线来自波动带（演算式）。</b>你主力组过去 12 周日级 CPL 均值 $60、σ=$7.5，波动带 均值±2σ = $45–$75。天然「异常上沿」就是 $75。设触发线 = 超过 $75 且持续 ≥5 天（排除单日尖峰）。注意：触发≠立刻动刀，触发＝「启动 L6-02 拆解流程」。</p><p><b>③ 机制：和 L0/L2 的联动。</b>冷却期直接接 L0-05 的「重大修改重置学习期」——动完 72h 内再动，等于连续重置；最小样本接 L6-06 的样本纪律；而三件套写成规则后，可由 L2-11 的自动化规则承接监控（满足条件自动报警或自动停加），把人从盘中抽离。</p>",
h:"<p><b>标定四步：</b></p><ul><li>① 拉过去 8–12 周<b>日级</b>数据，算 CPL/CPA 的均值与 ±2σ 波动带。</li><li>② 波动带上沿＝天然触发线（或基线×1.3，取较严者）；持续天数设 ≥5 天排除尖峰。</li><li>③ 按事件延迟定最小样本：B2B Qualified 反馈 ~1–2 周，评估窗要覆盖；事件数≥15 或花费≥2×CPL。</li><li>④ 成文进 SOP：触发→等满样本→动作→冷却 72h。交给自动化规则监控（L2-11），并每季度回顾校准。</li></ul>",
cs:"<p>某工业设备阈值表节选：CPL>基线×1.3 且事件 ≥10/周 → 进入排查（走 L6-01 流程）；组花费 ≥$150 连续零 Lead → 检查前端（像素/落地页）；Spend 达成 <70% 连 3 天 → pacing 诊断（L6-08）。制度上线前，操盘手半夜焦虑改广告是常态；制度上线后这类误操作清零，因为「改不改」由阈值说了算，不由情绪。</p>",
f:"<p>论坛口诀「关广告要快、建广告要多、加预算要慢」，以及社区「小强打法」的自动停加规则（ROAS 不达标自动停止加预算），都是「预设阈值」的民间形态——用规则代替手感。还有「转点前后禁改」＝时间维度的冷却期规则。课程把这套直觉固化成「触发线+最小样本+冷却期」三件套，并可交给自动化规则执行。</p>",
e:"<ul><li><b>阈值拍脑袋定</b>：没算过自身波动带，误触发或永不触发（根因：缺历史数据）。</li><li><b>有触发线没最小样本</b>：被 1 天数据骗去动手（根因：忽略 L6-06 样本纪律）。</li><li><b>动作后无冷却期</b>：干预链式污染，连续重置学习（根因：违反 L0-05）。</li><li><b>阈值从不回顾校准</b>：季节性/结构性变了还不更新（根因：一次标定用一年）。</li><li><b>触发即动刀</b>：忘了触发＝启动流程，不是立刻改（根因：混淆信号与动作）。</li></ul>",
q:{q:"你的组周波动带是 CPL $45–75（σ=$7.5）。这周 CPL $82。触发动作吗？",a:"<p><b>推理步骤：</b>① 看触发线：$82 超出波动带上沿 $75（均值 $60+2σ=$75），满足「超带上沿」。② 但先查最小样本：本周事件数 ≥10 吗？花费 ≥2×CPL（≥$150）吗？若样本不足 → 记录观察，不触发（单周高值可能是小样本尖峰）。③ 若样本足且第 2 天仍在 $75 上沿外、持续 ≥5 天 → 进入排查流程（先 L6-02 四因子拆解归因，再决定动哪一层）。④ 关键：<b>触发≠立刻动刀</b>——触发只是「启动诊断流程」的信号，不是「马上改广告」的指令。等满样本、定位 First Loss（L6-01）后再动，且动完进 72h 冷却期。</p>"},
b:"算出你主力组的波动带（均值±2σ），写出三条阈值规则（触发线+最小样本+冷却期）。"},
{id:"L6-08",lv:6,t:"Pacing 异常诊断（花不动/花太快）",
g:"诊断预算执行偏差的两极：花不动（under-delivery）与花太快（front-loaded），并对症处理。",
c:"<p><b>Pacing（预算执行）只有两极异常：花不动（under-delivery）与花太快（front-loaded）。</b>花不动的原因链：受众太小/预算低于门槛（L2-05）→ Bid/Cost Cap 太紧（L5-06/07）→ 学习受限（系统还在试探）→ 素材早期阶段（系统没把握谁会转化）。花太快的原因：预算设低（真想要更多量却卡死）→ 受众过热（近期爆款素材+宽受众，抢着花）→ pacing 策略缺失（一天预算中午花完，错过晚间高峰）。</p><p><b>类比：水龙头。</b>花不动＝水压/阀门问题：要么管子太细（受众太小）、要么你拧的阀门太紧（Cap 太严）、要么水箱还没蓄满（学习期）。花太快＝水龙头开太大或供水太猛：要么你预算给少了系统想多给却卡在日限额、要么这波水太抢手（受众过热）一下喷完。两类病的阀门位置不同，治法不同。</p><p><b>常见误区纠正：</b>「花不动就盲目加预算」——若病因是 Cap 太紧，加预算没用，越加越不动；「花太快就立刻砍半」——学习期大忌（L0-05），且可能只是高效跑完。必须先查原因链再动手。</p>",
m:"<p><b>① 机制：Pacing 本质是「供给与需求的匹配」。</b>花不动＝需求（竞价资格）不足——你的出价/ Cap 在拍卖里赢不了，或受众里没人可投；花太快＝供给（预算）相对人群热度不足——系统想给你更多曝光，但日预算午前就见底。两者都破坏「全天均匀触达」，进而影响学习数据的时段代表性（模型只看到上午的人，下午的没学到）。</p><p><b>② 机制：复制组的隐形地雷（演算式）。</b>你复制一个表现好的组，系统把原组的 Cost Cap $45 一并复制过来，但新组真实均值已到 $52。新组出价上限卡在 $45，永远赢不了当前竞价的拍卖 → 花不动。这个「旧 Cap 跟着复制」是极常见的隐形故障，排查时必查复制来源。</p><p><b>③ 机制：和 L2/L5 的联动。</b>受众门槛接 L2-05 的公式（受众规模影响能否学到 50 事件/周）；Cap 接 L5-06/07（Bid Cap/Cost Cap 怎么设）。Pacing 异常几乎都是这两层设错的表现，所以诊断要先回这两章的定义。</p>",
h:"<p><b>花不动排查序：</b></p><ul><li>① 看系统诊断标签（Ads Manager 会提示「学习受限/受众过小/出价过低」）；</li><li>② 查受众规模与触达（是否低于可投放门槛，L2-05）；</li><li>③ 查 Cap（Cost Cap/Bid Cap 是否卡太紧，尤其复制组要核对来源值）；</li><li>④ 查素材状态（是否 in review / 低质判定）；</li><li>⑤ 查预算 vs 门槛（是否低于账户最低日预算）。</li></ul><p><b>花太快排查序：</b></p><ul><li>① 是否高峰时段集中消耗（正常高效跑完，非异常）；</li><li>② 若中午即花完 → 提高日预算 +20%、或对过热素材降权、或用分时段投放错峰；</li><li>③ 别条件反射砍预算（学习期大忌）。</li></ul>",
cs:"<p>某工业设备新组花不动四查实录：①系统标签「学习受限」；②受众 2.1 亿（没问题，排除太小）；③ Cost Cap 发现被复制组时带上了 $45 旧值（该组真实均值 $52）→ 这就是地雷；④放宽 Cap 到 $55 后 3 天恢复正常花费与转化。若当初「花不动就加预算」，预算从 $100 加到 $200 还是花不动（因为卡在 Cap 不在预算），白耽误三天还制造波动。正确动作是放 Cap 不是加预算。</p>",
f:"<p>论坛高频事故与课程同源：「花不动，快到转点才花几毛钱」是一刀流+竞价卡死的极端版；「转点前花光＝空耗、机器学崩」是花太快的经典伤害（转点=日预算重置点，午前花完等于浪费下午时段且学习数据偏态）。社区也讨论过预算低于账户下限直接建不了组的情况——和 L2-05 的门槛公式呼应。这些民间事故都在说同一件事：Pacing 是供给需求匹配问题，得先查阀门再调水量。</p>",
e:"<ul><li><b>花不动就盲目加预算</b>：若病因是 Cap 卡死，越加越不动（根因：没查原因链）。</li><li><b>花太快立刻砍半</b>：学习期大忌，且可能只是高效跑完（根因：违反 L0-05）。</li><li><b>从不看消耗时段分布</b>：中午花完 vs 全天均匀，治法相反（根因：只看总量不看节奏）。</li><li><b>复制组旧 Cap 跟着复制</b>：隐形地雷，新组花不动（根因：复制时没核对出价来源）。</li><li><b>忽略系统诊断标签</b>：标签已提示「学习受限/受众过小」却手动瞎猜（根因：不看官方提示）。</li></ul>",
q:{q:"组预算 $100，每天下午 2 点花完。问题大吗？",a:"<p><b>推理步骤：</b>① 先分两看：若转化集中在下午前且成本健康 → 可能是「高效跑完」（系统在便宜时段把量跑完了），非异常；但若成本同步走高、且错过晚间高峰流量 → 是过热信号（受众/素材太抢手，日预算午前见底）。② 看消耗时段分布：下午 2 点花完＝前 14 小时吃掉全天预算，下午+晚间的量没拿到，学习数据偏态（只学了上午的人）。③ 处理选项（先诊断再动，别条件反射砍预算）：提日预算 +20%（让全天均匀）、或对过热素材降权、或用分时段投放错峰。④ 关键纪律：花太快时「砍预算」是学习期大忌（L0-05），正确是「提预算或降权过热项」。</p>"},
b:"完成一次「花不动」与一次「花太快」的真实诊断记录（含原因链与动作）。"},
{id:"L6-09",lv:6,t:"Cohort 与 Time-lag 报告",
g:"用进线时间分组（Cohort）对抗转化延迟：看「同一批人后来的样子」，而非「今天的混合报表」。",
c:"<p><b>Cohort（同期群）＝按「Lead 进线周」分组的追踪报表。</b>每批同一周进线的 Lead 单独建组，追踪它们在 7/14/30 天后的 Qualified/Deal 转化。<b>Time-lag（转化延迟）</b>＝从进线到 Qualified/Deal 的天数分布——B2B 常见 5–15 天，决定了「报表需要多熟才能读」。举个例子：本周进线的 100 个 Lead，可能要等 9 天才能知道其中多少成了 Qualified。</p><p><b>类比：酿酒要等发酵。</b>你周一倒进瓮的葡萄，周五就开瓮尝「这周酒怎么样」毫无意义——它还没发酵完。Cohort 就是「按倒瓮的周分批记账」，等每批发酵满期再读。混合报表则像把所有周次的酒混在一缸里尝，你分不清哪批好哪批坏。</p><p><b>常见误区纠正：</b>「用当天报表评估当天投放」——B2B 的 Qualified 平均 9 天才成熟，今天的 Qualified 数大部分来自 1–2 周前进线的 Lead，和「今天投的好不好」几乎无关。用未熟数据评估投放，必然误判（呼应 L0-07 的延迟盲区）。</p>",
m:"<p><b>① 机制：为什么混合报表会骗人。</b>今天的 Qualified 数 = 过去几周各批 Lead 的「陆续成熟」之和，不是「本周投放质量」。公式上：今日 Qualified = Σ（第 k 周进线 Lead 数 × 该周第 (今日−进线日) 天的成熟率）。若三周前那批因为某种原因集中成熟，今天报表「暴涨」——但那和本周投放无关。这是滞后项的卷积效应。</p><p><b>② 机制：用 Cohort 还原真相（演算式）。</b>设 lag 中位 9 天。第 1 周进线 100 Lead，第 9 天成熟率到 45%→45 Qualified；第 2 周进线 100，第 9 天也到 45%。若你「按周切 Qualified 优化」后第 1 周报表 Lead 暴跌——其实是因为切的是「进线口径」，而当时读到的 Qualified 多来自更早批次的成熟，造成报表错位。Cohort 表一拉：≥2 周龄批次的成熟率对比才是同口径。</p><p><b>③ 机制：和 L0 的联动。</b>Time-lag 是 L0-07 讲的「B2B 长周期让归因失真」的量化版——滞后越长，Last Click 越低估种草。Cohort 是对抗滞后的标准工具；而 lag 分布本身依赖 L0-03/04 的回传完整（回传断了，成熟率算不出来）。</p>",
h:"<p><b>Cohort 四步：</b></p><ul><li>① <b>定 lag 分布</b>：从 CRM 算「Lead→Qualified」天数中位数（如 9 天）与分位数，知道每批要等多久才熟。</li><li>② <b>建 Cohort 报表</b>：每批 Lead 标注入线周，追踪 7/14/30 天成熟率。</li><li>③ <b>读数纪律</b>：最近 1–2 周的 Cohort 是「未熟」状态，禁止跨龄比较（1 周龄 vs 4 周龄不可比）。</li><li>④ <b>投放效果评估一律看「≥2 周龄」的 Cohort</b>，且同批对比（同进线周、不同优化设置）。</li></ul>",
cs:"<p>某工业设备 lag 中位数 9 天。10 月第 1 周切到 Qualified 优化后，团队看报表发现「Lead 量暴跌、Qualified 率也怪」慌了。拉 Cohort：其实是 9 月末那批批次集中成熟，造成报表错位（混合报表把历史成熟算进了本周）。而切优化后「≥2 周龄批次」的成熟率实际是上升的——<b>切换效果为正</b>。若当时被混合报表骗去回滚优化，就错过了真实增益。Cohort 让「切了到底好不好」有了同口径答案。</p>",
f:"<p>论坛普遍按「日/周报表」直读（社区痛点「一天好一天差」就是滞后盲区的表现）。Cohort 是从电商「按下单周看复购」迁移来的方法——电商早用同批买家看 LTV，B2B 只是把「复购」换成「成熟转化」。社区 0-1 复盘常「按月」而非按日，也是把时间颗粒度对齐转化延迟的意识，和 Cohort 思路相通。</p>",
e:"<ul><li><b>用当天报表评估当天投放</b>：滞后盲区，必然误判（根因：忽略 Time-lag）。</li><li><b>Cohort 建了但比未成熟组</b>：1 周龄 vs 4 周龄比较，结论失真（根因：跨龄不可比）。</li><li><b>lag 分布从没测过</b>：报表成熟度全靠感觉（根因：没算中位数）。</li><li><b>切换优化后立刻看报表</b>：读到的是历史批次成熟，非新效果（根因：忘了卷积效应）。</li><li><b>回传断了还读 Cohort</b>：成熟率算假（根因：L0-03/04 地基坏）。</li></ul>",
q:{q:"本周 Qualified率 38%（上周 45%）。能下「质量变差」的结论吗？",a:"<p><b>推理步骤：</b>① 先想滞后：本周计入的 Qualified 多来自 1–2 周前进线的 Lead（lag 决定），而上周报表对应更早批次——两个时点的「批次构成」不同，不能直接比。② 套 Cohort 纪律：最近 1–2 周 Cohort 是未熟状态，禁止跨龄比较；38% vs 45% 很可能是「本周读到了更多未熟批次」造成的报表错位，不是真质量差。③ 正确动作：按 Cohort 看「≥2 周龄批次」的成熟率对比，同口径才有结论。④ 若同口径批次成熟率确实跌 → 才走 L6-03 根因树查质量；若只是未熟造成的错位 → 等批次成熟再读。结论：<b>不能急下「质量变差」</b>。</p>"},
b:"测出你业务 Lead→Qualified 的 lag 中位数，搭起最小 Cohort 报表（表格即可，含进线周与 7/14/30 天成熟率）。"},
{id:"L6-10",lv:6,t:"Holdout / 控制组实操",
g:"设计并运行 holdout 实验：用「不投的那部分人」测出广告的真实增量。",
c:"<p><b>Holdout＝随机保留一部分人群/市场/预算「不投广告」作为对照。</b>三种形态：① <b>人群 holdout</b>——RT 名单留 20% 不投；② <b>地域 holdout</b>——A 地投 B 地不投（Geo 实验基础，见 L6-12）；③ <b>预算 holdout</b>——整体降 20% 看业务掉多少（增量下限估计）。</p><p><b>类比：吃药对照试验。</b>要判断一种药有没有效，不能只看「吃了药的人好了没」，因为有些人不吃药也会好（自愈）。必须随机分两组：一组吃、一组不吃，两组之差才是药的真实效果。广告同理：基线转化（本来就会来的人，如老客户回头、品牌词搜索）混在「广告带来的」里无法区分，只有「投 vs 不投」的差异才是广告的因果贡献。</p><p><b>常见误区纠正：</b>「对照组也成交了，实验失败」——恰恰相反，对照组的成交就是你要测出的「基线」（见 q）。还有「拿差市场当对照」——非随机、两组不可比，差值不能算增量。</p>",
m:"<p><b>① 机制：为什么必须留对照组。</b>归因报表把「本来也会来的 50 个人」也算进广告功劳（L0-07）。只有「投 vs 不投」的差异才是增量。设实验组转化率为 Rt、对照组为 Rc，增量 Lift = Rt − Rc；若无对照组，你只能拿到 Rt，永远不知道 Rc 多大，也就不知道广告「白花了」多少。</p><p><b>② 机制：为什么必须随机（演算式）。</b>随机保证两组「本来就会转化的人」比例相同。若你手动把「差市场」当对照，对照组 Rc 天生偏低，算出的 Lift 被虚高。随机分组下：实验组 1000 人成交 80（8%）、对照组 1000 人成交 40（4%），Lift=4 个点，可信；若对照是挑的差市场成交 10（1%），Lift 算成 7 个点——虚高 75%，决策会过度加预算。</p><p><b>③ 机制：和 L0 的联动。</b>这是 L0-07「增量与控制组」的展开：L0 讲概念，本章讲怎么设计执行。而对照组的「排除链配置」依赖 L0-03 的自定义受众排除能力——排除没配好，对照组会「泄漏」看到广告，实验全废。</p>",
h:"<p><b>人群 holdout SOP：</b></p><ul><li>① <b>随机二分</b>：名单按 ID 尾号/掷硬币式随机分实验组与对照组（各 50%，或对照组 20%）。</li><li>② <b>配排除链</b>：对照组在广告定向里彻底排除（上传为排除型自定义受众），否则会「泄漏」看到广告。</li><li>③ <b>跑 ≥4 周</b>：覆盖转化延迟（lag，见 L6-09），短期结果不可读。</li><li>④ <b>比较两组转化率</b> → 增量 Lift = 实验组率 − 对照组率。</li><li>⑤ <b>实验结束回补</b>：对照组可放回投放；注意对照组不能通过品牌搜索等渠道「泄漏」（会污染基线）。</li></ul>",
cs:"<p>某工业设备 RT holdout（见 L4-06 案例）：把 20% 的「未成交询盘名单」留白 30 天不投再营销，实验组照常投。结果两组成交率差 4 个点——说明 RT 的真实增量远小于报表功劳（报表把基线成交全算给了 RT）。据此重配预算：把虚高的那部分从 RT 挪到拉新。若不做了这个实验，团队会一直以为 RT「贡献巨大」而过度投入。</p>",
f:"<p>论坛几乎无人做 holdout（执行门槛高），但对「基线询盘」有朴素认知——社区提到「其中 50 个人即使没看广告也会来询盘」，和课程「对照组测基线」同源。B2B 品牌「老客户回头」本身就是基线，不做对照就无法把它从广告功劳里剥离。论坛的「停投观察」（见 L6-12）是 holdout 的粗糙版，社区用它测「算法变没变」，课程用它测「增量有多少」。</p>",
e:"<ul><li><b>对照组没配排除链</b>：泄漏污染，对照组也看到广告（根因：忘配自定义受众排除，L0-03）。</li><li><b>实验期太短</b>：lag 没覆盖，结果不可读（根因：违反 ≥4 周）。</li><li><b>非随机分组</b>：拿差市场当对照，Lift 虚高（根因：没随机二分）。</li><li><b>不防泄漏</b>：对照组通过品牌搜索看到广告（根因：只看直接曝光不管间接）。</li><li><b>holdout 结果不错峰解释</b>：季节因素混进增量（根因：没设前后基线期）。</li></ul>",
q:{q:"RT holdout 期间，对照组成交了 6 单。这算实验失败吗？",a:"<p><b>推理步骤：</b>① 先定性：对照组的成交就是「基线」——那些不看广告也会成交的人，正是实验要测出的东西。所以对照组成交 6 单不但正常，而且是实验有价值的证据。② 算 Lift：实验结论 = 实验组成交率 − 对照组成交率。若实验组成交率 12%、对照组 6/样本量对应 4% → Lift = 8 个点。③ 解读：若两组差异统计不显著（样本小）→ 该 RT 层增量低，预算该重配；若显著 → 增量真实存在。④ 结论：<b>这不算失败，反而是实验成功测出了基线</b>。很多人误以为「对照组成交=广告无效」，其实是把「基线」和「失败」搞混了。</p>"},
b:"设计并启动一个 20% 人群 holdout，写明随机方法（如 ID 尾号）与泄漏防护（排除链＋品牌词隔离）。"},
{id:"L6-11",lv:6,t:"Conversion Lift 测试",
g:"用 Meta 官方 Conversion Lift 工具做平台级增量测试：适用条件、申请与读数。",
c:"<p><b>Conversion Lift＝Meta 官方的随机对照实验工具。</b>平台自动把你的受众随机分成实验组（看到广告）与对照组（不见广告），跑完输出「每千次展示带来的增量转化」「增量 ROAS」「Lift%」等指标。它测的是「投放 vs 不投」的因果差，比归因报表诚实一个量级（L0-07 讲归因 vs 增量，本章是平台化落地）。2026 年 Meta 仍在 Ads Manager 的 Experiments 里持续提供 Conversion Lift（含 Lift Study 入口），并叠加了隐私增强的 Private Lift Service（用多方计算在不暴露用户级数据下跑实验），对受监管广告主尤其重要。</p><p><b>2026 工具现状（核实）。</b>自享版 Conversion Lift 面向有稳定消耗的账户：行业经验是月消耗约 $5K 以上即可自助开启，但结果可靠需要足够样本——Meta 建议约 100 个增量转化为稳定读数下限，Treatment+Control 合计 500+ 转化才够 80% 统计功效检测 5–10% 的 Lift；许多机构把「研究窗口内约 $30K 消耗」作为可读门槛。Holdout 占比通常 10–15%，周期最短 2 周、理想 4 周（必须用完整自然周，避开黑五等季节尖峰）。置信度达到 85–90%+ 才据此决策。</p><p><b>常见误区纠正：</b>「Lift 结果会推翻归因」——通常只是校准泡沫大小（归因数 − 增量数 = 泡沫），不是否定归因；「事件量不够硬申请」——结果不可读，白跑。</p>",
m:"<p><b>① 机制：与手工 holdout 的差别。</b>手工 holdout（L6-10）靠你自己在名单里分、自己配排除链，容易泄漏、样本小。平台 Conversion Lift 分组更干净（跨设备识别＋覆盖控制）、样本更大、自动防泄漏；代价是消耗规模与转化量门槛更高、周期更长（通常 4–8 周）。它测的是「投放 vs 不投」的因果差。</p><p><b>② 机制：读数怎么算（演算式）。</b>设 Treatment 触达 100 万、转化 2.0%；Control（holdout 10%）转化 1.4%。Lift = 2.0%−1.4% = 0.6 个点；增量转化数 = (2.0%−1.4%) × 总触达；增量 ROAS = 增量营收 ÷ 广告花费。若归因报表 ROAS 6.2x、增量 ROAS 1.9x → 泡沫 = 6.2−1.9 = 4.3x，即大部分「转化」本会发生。这和 2026 年行业案例（再营销 ROAS 6.2x 实则增量 1.9x）一致。</p><p><b>③ 机制：和 L0 的联动。</b>L0-07 把「归因 700 ≠ 真带来 700」讲透，Conversion Lift 就是量化这个差的工具；而它的事件口径依赖 L0-03/04 的回传完整（CAPI 双通道让增量事件算得准）。读数是「以增量口径重算真实 CPL」。</p>",
h:"<p><b>申请与读数 SOP：</b></p><ul><li>① <b>入口</b>：Ads Manager → Experiments → Lift Study / Conversion Lift，选对象（全账户或某 Campaign/Ad Set）。</li><li>② <b>选转化事件</b>：B2B 用 Qualified（更有业务意义）而非仅 Lead；确保像素/CAPI 配好（L0-03/04）。</li><li>③ <b>满足最小量门槛</b>：官方会提示样本是否够；不够就先累积消耗或缩小研究范围。</li><li>④ <b>跑 4–8 周</b>：覆盖 lag（L6-09），用完整自然周，避开季节尖峰；期间不改预算/素材（污染实验，见 L6-06）。</li><li>⑤ <b>读数</b>：看 Incremental Conversions、Incremental CPL、Lift%、Confidence。增量 CPL vs 归因 CPL 的差 = 归因泡沫大小，据此重配跨渠道预算（L9 章）。</li></ul>",
cs:"<p>某工业设备申请账户级 Lift 研究，跑 8 周：归因报表 CPL $48 vs 增量口径 $63——差值即品牌搜索与再营销的归因泡沫（这部分「转化」本会发生，不该算广告功劳）。据此调整了 L9 章的跨渠道预算权重：把 RT 与品牌词里虚高的部分挪去拉新。若无 Lift，团队会一直按 $48 的「假便宜」过度投 RT。</p>",
f:"<p>论坛层面基本无此实践（信息/权限门槛高，小团队难执行），但结论可由社区数据反推：品牌站的「弃单挽回」功劳里含大量基线（很多弃单用户本来就会回来）；社区也常说「FB 报表吹牛」，本质就是 Last Click 归因低估种草、或 View-through 虚报功劳。课程用 Conversion Lift 把这种「感觉」工具化——2026 年该工具仍是 Meta 培训核心，且趋向「常开型」与隐私增强（Private Lift Service），对小账户也更易触达。</p>",
e:"<ul><li><b>以为 Lift 会推翻归因</b>：通常只是校准泡沫，不是否定（根因：误解工具定位）。</li><li><b>事件量不够硬申请</b>：结果不可读，白跑（根因：忽视最小样本门槛）。</li><li><b>测试期覆盖季节突变</b>：黑五尖峰淹没信号（根因：没避开季节）。</li><li><b>实验中改预算/素材</b>：污染对照，前后不可比（根因：违反 L6-06 纯净性）。</li><li><b>只看 Lift% 不看置信度</b>：未达 85%+ 就决策，可能噪声（根因：忽略统计功效）。</li></ul>",
q:{q:"Lift 研究显示增量 Lead 比归因 Lead 少 30%。这个差值是什么？怎么办？",a:"<p><b>推理步骤：</b>① 定性差值：差值 ≈ 归因泡沫 = 基线转化 + 跨渠道重叠 + View-through 高估的部分。即那 30% 里很多是「不看广告也会来」的人，被归因报表算成了广告功劳。② 量化：归因 Lead 1000、增量 700，则 300 是泡沫。③ 处理：一是以增量口径重算各渠道「真实 CPL」（用 700 对应的成本，而非 1000）；二是重点复查 RT 与品牌词相关投放（泡沫大户，见 L4-06/L9-02）；三是预算分配改用「增量效率」权重，归因报表降级为运营监控工具（仍看相对趋势，不用于跨渠道拍板）。④ 结论：差值不是失败，是「让预算回归真实因果」的起点。</p>"},
b:"检查你的账户是否满足 Lift 门槛（消耗/转化量），并写出申请计划（对象/事件/周期/holdout 占比）。"},
{id:"L6-12",lv:6,t:"Geo Experiment（地域实验）",
g:"用地域分组测增量与扩量决策：设计、反事实逻辑与 B2B 的适用边界。",
c:"<p><b>Geo Experiment（地域实验）＝把市场/地区分成 Treatment（投或加投）与 Control（暂停或减投），比较两组业务差异。</b>它适合回答三类问题：渠道整体增量多少、某区域投放值不值、扩量前先验证（「多开一个国家的真实贡献」）。</p><p><b>反事实逻辑（核心）。</b>Control 区的作用＝回答「如果没投会怎样」。用它自己的自然趋势，去推断 Treatment 区「没有广告时」的样子，两者之差即增量。类比：两座相似城市，A 城投广告、B 城不投，月底比询盘量——B 城的「自然水平」就是 A 城没广告时的估计，A−B 即广告增量。</p><p><b>常见误区纠正：</b>「选业务互串的区域做 Control」——若 A 城的人会跑到 B 城买（或反之），两组互相污染，差值无效；「Control 停投期太短」——lag 没覆盖完，读数假；「把季节差异当地域差异」——两组基线没校准。</p>",
m:"<p><b>① 机制：反事实怎么算（演算式）。</b>设北欧三国的「自然询盘基线」用停投前 2 周测得：丹麦周询盘 100、瑞典 90、挪威 80。实验期丹麦停投（Control），瑞典挪威照投（Treatment）。实验期丹麦询盘跌到 85（−15%），瑞典挪威不变。则丹麦的「广告增量」≈ 100−85 = 15 单/周；若丹麦全量投放的花费对应边际，可算区域增量效率 = 15 × 客单 ÷ 丹麦花费。</p><p><b>② 机制：地域分组的优势＝泄漏小。</b>人群 holdout 的隐患是「对照组通过品牌搜索/自然流量还是看到广告」（L6-10）。地域分组隔离更干净：人不会因为住另一个城市就少刷广告，跨组「泄漏」比人群 holdout 小得多。所以 Geo 是更接近纯净的因果设计。</p><p><b>③ 机制：和 L6 的联动。</b>Geo 是人群 holdout（L6-10）的地域版，共享「反事实＋随机/可比」思想；周期要求同样覆盖 lag（L6-09）；而「区域值不值」的结论直接喂给 L9 章的跨市场预算分配。</p>",
h:"<p><b>Geo 四步：</b></p><ul><li>① <b>选对组</b>：市场/省州/城市，规模相近、无跨区业务串扰（用历史数据验证互不抢量）。</li><li>② <b>周期 ≥4–8 周</b>：B2B 覆盖 lag（L6-09），用完整自然周。</li><li>③ <b>处理方式</b>：Control 区暂停投放（激进但干净）或降 50%（温和但信号弱）；Treatment 照常或加投。</li><li>④ <b>读数</b>：两组「业务询盘/成交」差 ÷ Treatment 花费 = 区域增量效率；先校准两组停投前基线，排除季节差异。</li></ul>",
cs:"<p>某工业设备用 Geo 验证北欧市场：瑞典/挪威继续投，丹麦停投 6 周。前后各留 2 周基线期。结果丹麦询盘仅降 15%（基本盘稳固），瑞典挪威边际贡献被确认。结论：丹麦大部分是自然流量，增量有限——扩量决策有了因果依据，把原计划投向丹麦的预算改投瑞典挪威的高潜区。若不做 Geo，团队会凭「丹麦询盘数高」盲目加投，实则加在基线上。</p>",
f:"<p>论坛无对应实践（小团队难执行 Geo），但市场「停投观察」的朴素版存在：社区常说「一个月后再开效果变差，多半是算法已变」——停投本身就是最强的「真增量测试」，只是社区用它测「算法」而非测「增量」。课程把停投观察升级成有 Control/Treatment、有基线期、有判读规则的 Geo 实验。</p>",
e:"<ul><li><b>选互串区域做 Control</b>：串扰污染，差值无效（根因：没验证跨区独立性）。</li><li><b>Control 停投太短</b>：lag 没覆盖，读数假（根因：违反 ≥4–8 周）。</li><li><b>把季节当地域</b>：两组基线没校准（根因：缺前后基线期）。</li><li><b>只比总量不比效率</b>：丹麦掉 15% 但花费也少，要算增量效率（根因：没除花费）。</li><li><b>Treatment 期改策略</b>：污染反事实，前后不可比（根因：违反 L6-06 纯净性）。</li></ul>",
q:{q:"老板问「丹麦到底值不值得投」。设计一个 6 周 Geo 实验回答他。",a:"<p><b>推理步骤：</b>① 分组：丹麦停投（Control），瑞典+挪威照常（Treatment）；选这三国因历史数据互无串扰。② 基线期：前后各留 2 周，记录三国自然询盘与 Qualified 量作为校准基准。③ 处理：实验 6 周丹麦零投放，瑞/挪不变；周期覆盖 B2B 的 lag（L6-09）。④ 判读：若停投后丹麦询盘降至基线的 ~85% 以下且不再恢复 → 广告增量真实存在（值投，增量效率 = 掉量×客单÷原花费）；若几乎不掉（如仅 −5%）→ 丹麦大部分是自然流量，预算该挪去瑞/挪。⑤ 排外因：排除当季展会等外部事件（否则把季节当地域）。结论：用反事实差值给老板一个因果答案，而非「凭感觉值不值」。</p>"},
b:"设计一个双区域 Geo 实验（分组/周期/指标/判读规则），写明如何排除跨区串扰与季节差异。"},
{id:"L6-13",lv:6,t:"归因口径陷阱与历史比较",
g:"守住「口径一致性」这条命脉：跨时间/跨渠道/跨账户比较的前提是同口径。",
c:"<p><b>口径一致性是跨时间/跨渠道/跨账户比较的命脉。</b>常见陷阱四类：① <b>归因窗口变更</b>——7→28 天，数字变大不是效果变好；② <b>平台归因重写</b>——2026-03 Meta 把点击归因收紧到真实链接点击、互动归入 1 天窗口的 Engage-through，3 月数据「跳水」是口径不是效果（L0-07 讲过）；③ <b>CRM 与平台口径混用</b>——Attributed（归因）≠ CRM 成交（事实）；④ <b>模型更新</b>——Data-driven 归因权重漂移，同事件不同权重。</p><p><b>类比：度量衡变了，曲线就失忆。</b>你一直用市尺量身高，突然换成厘米，数值瞬间翻倍——人没长高，尺子变了。口径就是广告的「尺子」，尺子一换，一切历史曲线失去可比性，此时「涨」「跌」都不再是信息。</p><p><b>常见误区纠正：</b>「历史曲线横跨口径变更直读趋势」——等于用市尺和厘米拼成一条曲线，斜率是假的；「把窗口调宽当效果优化」——自欺（L0-07 老坑）；「跨平台拿 Meta 归因 vs Google 归因直接比大小」——各说各话。</p>",
m:"<p><b>① 机制：口径＝度量衡，变了就不可比。</b>同一条转化路径，First/Last/Data-driven 三种规则算出三个数（L0-07）。当你把「7 天窗口」改成「28 天」，Lead 数立刻涨 30%——这不是多带来 30% 转化，是尺子变长了。所以比较前第一问必须是「统计口径有没有变」。</p><p><b>② 机制：平台重写怎么骗人（演算式）。</b>2026-03 前，某账户旧口径（点击归因含点赞/分享等任意互动、7 天窗口）月 Lead 1000；重写后只算真实链接点击，月 Lead 掉到 700（−30%）。若操盘手不懂口径，会惊呼「效果崩了」疯狂换素材。实则 700 才是「真点击归因」的数，1000 里 300 是互动归因（点赞分享等非链接点击）的水分，其中互动后 2–7 天才转化的部分在新口径下不再计入。正确动作：建台账、报表加版本线、通报团队「预期下移」。</p><p><b>③ 机制：和 L0/L8 的联动。</b>这是 L0-07「口径≠效果」的展开；跨渠道比较要统一到 CRM/业务口径（L8-07），否则 Meta 归因 vs Google 归因永远各说各话。口径台账是专业投手的基本功。</p>",
h:"<p><b>口径纪律四步：</b></p><ul><li>① <b>建口径变更台账</b>：记录每次窗口/模型/事件定义的变更日期与前后值。</li><li>② <b>变更点用虚线切断历史曲线</b>：不跨版本比趋势，跨版本只做标注。</li><li>③ <b>跨渠道统一 CRM/业务口径</b>（L8-07）：Meta、Google、CRM 各表先对齐到同一把尺子再比。</li><li>④ <b>向管理层翻译口径事件</b>：「3 月下跌是量尺换了，不是生意变差」——用业务语言解释，防误操作。</li></ul>",
cs:"<p>某工业设备 2026-03 的应对：归因重写公告当日建立口径台账、报表加版本线、全团队通报「数据将系统性下移 X% 属预期」。当月零误操作——而同行大量冤枉换素材、砍预算。同一份公告，懂口径的团队按兵不动只改报表口径，不懂的团队把「尺子变短」当「人变矮」疯狂操作。差距就是有没有口径台账。</p>",
f:"<p>论坛对口径的敏感度低（多按平台报表直读），「一个月后再开效果变差」部分即口径/算法漂移所致——社区没意识到是尺子变了。课程把「口径一致性」单列成模块，正是补论坛最缺的一环：比较前先校表。社区的经验「别被 FB 报表骗」方向对，但缺台账这套系统工具，容易把真效果波动和口径变化混为一谈。</p>",
e:"<ul><li><b>历史曲线横跨口径变更直读</b>：市尺接厘米，斜率假（根因：没切断版本）。</li><li><b>窗口调宽当优化</b>：自欺，数字大≠效果好（根因：L0-07 老坑）。</li><li><b>跨平台直接比大小</b>：Meta vs Google 各说各话（根因：没统一 CRM 口径）。</li><li><b>口径台账不存在</b>：变更无记录，事后无法还原（根因：不记账）。</li><li><b>Attributed 当 CRM 事实</b>：把归因数当成交事实汇报（根因：混淆两层口径）。</li></ul>",
q:{q:"老板发现「10 月 Lead 比报表少 20%」（CRM 口径）。怎么解释并建立长期机制？",a:"<p><b>推理步骤：</b>① 先讲三层漏斗：Event Received（收到事件）→ Matched（匹配到用户）→ Attributed（归因）。归因口径只会少于收到、更少于 CRM 事实成交——所以「报表少 20%」可能只是口径层级不同，不是生意少了 20%。② 解释差：CRM 口径的 Lead 是「真实提交的询盘」，平台归因口径是「平台认为广告带来的」，两者天然不等（L0-03/07）。③ 建长期机制：定一把「业务真相口径」= CRM；平台报表降为运营监控（看相对趋势）；所有对上汇报统一 CRM 口径＋标注平台口径差异。④ 两把尺子各管各的，永不混比——老板看 CRM，操盘手看平台趋势，但汇报时说明口径差。</p>"},
b:"建立你的口径台账（含最近一次窗口/模型变更），并给最近一次历史比较做口径校验。"},
{id:"L6-14",lv:6,t:"Breakdown / 报告可靠性",
g:"掌握 Breakdown 的正确用法与统计陷阱：切片越多，每个格子的噪声越大。",
c:"<p><b>Breakdown（下钻）是把总数据按维度切片看：年龄/性别/地区/版位/设备/平台。</b>它本是定位问题的利器，但有致命陷阱：<b>切片＝把样本再切小</b>。总样本 1000 转化，切 20 个格子，每格平均 50 个；再切两层，每格可能只剩 8 个——此时看到的「差异」大多是随机噪声。<b>多重比较问题</b>：切 20 个格子，总有几个「显著」纯属运气（约 1/20 概率任一格假显著），不是规律。</p><p><b>类比：把蛋糕切太碎。</b>一整块蛋糕你能看出「这块甜」；切成 100 小块，每块尝一口，有的咸有的甜——那是尝的随机误差，不是蛋糕本身不均匀。Breakdown 切太细，每格都是「一小口」，差异不可信。</p><p><b>常见误区纠正：</b>「在样本 10 的格子里发现规律并立刻行动」——那是噪声当信号；「一次切三个维度」——格子数爆炸（如 年龄×性别×地区 = 几百格），几乎全是噪声；「单周 Breakdown 的偶发差异写进结论」——没复现。</p>",
m:"<p><b>① 机制：每格最小样本。</b>转化事件 <30 的格子只做参考——二项分布的方差 ∝ p(1−p)/n，n=8 时标准误极大，单格 ±35% 的波动完全可能是运气。所以「差异显著」要先看 n。</p><p><b>② 机制：多重比较怎么骗人（演算式）。</b>你切 20 个地区格子，每个格「偶然显著」的概率约 5%，则至少有一个假显著的概率 ≈ 1−0.95^20 ≈ 64%。也就是说，你不假思索地在 20 个格子里「发现」一个异常，有 64% 概率那是噪声。正确做法：先总层、再下钻、且可疑差异需连续 2 周复现才立项。</p><p><b>③ 机制：和 L6 的联动。</b>Breakdown 看前端层（CTR/CPM）可直接读（延迟短）；看后端层（Qualified/Deal）必须按 Cohort 口径（L6-09）——否则把未成熟批次的差异当成「某地区质量差」。总层健康时，单格异常大概率是噪声。</p>",
h:"<p><b>周报 SOP：</b></p><ul><li>① <b>先看总层</b>：账户与组级总指标（样本足），确认整体健康。</li><li>② <b>下钻最多两层</b>：如 地区→版位，避免过度切片。</li><li>③ <b>每格标注事件数</b>：n<30 只参考，不立项。</li><li>④ <b>可疑差异需连续 2 周复现</b>才处理（排除单周偶发）。</li><li>⑤ <b>后端指标按 Cohort 口径</b>（L6-09），不拿未熟批次比质量。</li></ul>",
cs:"<p>某工业设备「25–34 岁男性 Qualified 率最高」的发现：第一周差异 +18%，但样本仅 22（不可信）。团队没动手，标注观察；连续 3 周复现且幅度稳定在 +15~18%、样本累积 >30 → 才立项做「年轻技术员」专属素材。后续被验证有效。若第一周就按 22 样本砍掉其他人群或猛投该人群，就是被噪声带节奏。</p>",
f:"<p>论坛盯盘经验暗合此道：「消耗 $5 只看点击」＝按样本量决定读什么层（样本小只读前端）；社区也强调「样本量太少不足以支撑下结论（如 Reels 判断）」「统计表达要严谨」——课程把「什么时候数据可以信」讲透了：样本够＋差异大且持续＋自上而下，才下单。</p>",
e:"<ul><li><b>样本 10 的格子发现规律并行动</b>：噪声当信号（根因：忽略最小样本）。</li><li><b>一次切三个维度</b>：格子爆炸，全噪声（根因：多重比较）。</li><li><b>单周 Breakdown 偶发差异写结论</b>：没复现（根因：忽略持续 2 周规则）。</li><li><b>从不标注每格样本量</b>：无法判断可信度（根因：缺 n 标注）。</li><li><b>不先看总层就下钻</b>：在噪声层「发现」问题（根因：没自上而下）。</li></ul>",
q:{q:"Breakdown 显示某地区 Qualified率比均值低 35%（该格样本 8 个转化）。行动吗？",a:"<p><b>推理步骤：</b>① 看样本：n=8，二项波动巨大，±35% 的差异完全可能是随机噪声（尤其多重比较里它常是「最差格子」）。② 套可靠性底线：转化事件 <30 的格子只做参考，不立项（m 的机制）。③ 看总层：先确认账户/组级总指标健康——若总层健康，单格异常大概率是噪声。④ 正确动作：标注观察，连续 2–3 周复现且样本累积 >30 再立项；当下唯一合理动作＝确认总层健康，不动该格。⑤ 纪律：Breakdown 是「提假设」不是「下结论」，后端指标还要按 Cohort 口径（L6-09）排除未熟批次。</p>"},
b:"给你的周报加上「每格样本量」标注与「两层下钻上限」规则，并复盘一次最近被噪声误导的 Breakdown。"}
);

</script>
