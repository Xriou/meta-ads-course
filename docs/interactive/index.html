MODULES.push(
{id:"L7-01",lv:7,t:"Scaling Ceiling 与 Diminishing Returns（高级）",
g:"识别扩量天花板的位置与成因，掌握边际曲线在真实账户里的形态。",
c:"<p><b>扩量天花板不是一句模糊的「量到头了」，它有三层可定位的来源。</b>第一层是<b>受众层（Audience Ceiling）</b>：可转化的有效人群池被买完（详见 L4-08 受众分层）。模型按转化概率从高到低排序买量，池子见底后，再想加量只能往概率更低的人群走。第二层是<b>竞争层（Auction Ceiling）</b>：同一批人里所有广告主都在抢，你加预算必然加价，边际上买到的越来越贵（呼应 L0-06 竞价公式里 Bid×EAR 的拥挤效应）。第三层是<b>承接层（Fulfillment Ceiling）</b>：线索进来但销售或产能吃不下，多买的线索没有价值（详见 L7-08）。</p><p><b>Diminishing Returns（边际报酬递减）的曲线长什么样？</b>它是一条「先平缓、后陡峭」的向下凹曲线。平缓段对应「好量先吃」——早期加的预算买到的都是高转化概率人群，边际成本很低、很友好；到了某个点之后曲线急转直下，因为系统被迫向「转化概率更低」的人群扩展，边际成本快速飙升。这个<b>拐点（Inflection Point）</b>就是决策的关键：它大约出现在「边际成本 ≈ 业务可接受上限」的地方。超过这点，每多花一块钱换来的成交比一块钱本身还贵。</p><p><b>常见误区纠正：</b>很多人以为「预算翻倍、单量也翻倍」是线性世界；现实里边际曲线决定了——平均 CPL 好看，不代表下一块预算的边际 CPL 也好看（见 L0-08 边际经济学）。还有人把「天花板」当成玄学，从不画曲线，结果在拐点之后硬顶了很久才意识到钱白花了。</p><p><b>类比：</b>扩量像在鱼塘里捞鱼，先捞的是最肥最大、最容易上钩的鱼（好量），捞到最后只能去深水区碰运气（贵量）。鱼塘大小（受众池）和鱼竿数量（销售承接）共同决定了你能捞到多少。</p>",
m:"<p><b>①②③ 机制链：</b></p><ul><li>① <b>为什么边际必然递减</b>：Meta 的模型按「转化概率」从高到低排序买量。预算加码后，原有高概率人群池填不满新预算，系统必须向「转化概率更低」的人群扩展——第 N 美元买到的永远比第 1 美元差。这与 L0-06 竞价公式里 Estimated Action Rate 是同一个机制：人群越扩越偏，EAR 越低。</li><li>② <b>为什么不可靠意志克服</b>：这不是「你加钱不够狠」的问题，而是数据分布的客观规律。池子里还有没有更便宜的好量，是唯一能改变曲线的旋钮；意志改变不了概率排序。</li><li>③ <b>唯一解法＝换池子</b>：新受众 / 新市场 / 新素材（新 Angle）任一维扩展，等于重开一条增长曲线（呼应 L0-05：新组合＝新数据分布＝重新探索）。</li></ul><p><b>数字演算（边际 CPL 飙升的来源）：</b>某组周预算 $1500 时，买入人群平均 EAR 8%、CPM $12，边际 CPL ≈ CPM÷1000÷EAR÷Lead率，算得 $210（可接受）。预算加到 $2400，系统被迫扩展到低 EAR 人群，平均 EAR 掉到 4%；同时竞争抬升 CPM 涨到 $14.4（＋20%）。则新边际 CPL ≈ $210 ×（8%÷4%）× 1.2 = $210 × 2 × 1.2 = $504。业务上限若是 $300，边际 $504 早已爆表——这就是拐点的数学含义。</p>",
h:"<p><b>天花板诊断与换池子检查单：</b></p><ul><li>① <b>画边际曲线</b>：按周切「预算段 → 边际 CPL / 边际 Deal Cost」（= 该周新增花费 ÷ 该周新增成交）。至少连续 8 周。</li><li>② <b>标拐点</b>：当边际 CPL 升至「业务可接受上限 × 1.2」处（例：上限 $300，则 $360 为拐点红线），停止纵向加预算。</li><li>③ <b>换池子三选一</b>：a) 扩受众约束（放宽定向，见 L4-08）；b) 加市场（新语言区/新国家，见 L7-03）；c) 上新 Angle 素材重开增长曲线（见 L7-04）。每条新曲线都从平缓段重新开始。</li><li>④ <b>验收</b>：新曲线跑满 4–6 周，确认边际回落到上限内，才算「换池子成功」，否则换下一个维度。</li></ul>",
cs:"某工业设备 DE 组（德语区 B2B 潜水搅拌设备）2025 年 9–11 月边际实录：9 月周预算 $1500 时，边际 Deal Cost $210，低于业务上限 $300，状态健康。10 月为冲刺旺季把周预算拉到 $2400，第一周边际跳到 $330、第二周 $430——拐点确认（430 > 300×1.2=360）。团队没有继续加钱，而是执行换池子：11 月并入奥地利组（同语言零学习成本）＋ 上新「项目案例」Angle 视频素材。结果两条新曲线分别从 $240 与 $260 的边际起点重新开始向上爬，整体天花板被抬高约 35%，季度成交逆势增长。教训：到拐点即停手，靠换池子续命，而非硬顶。",
f:"论坛社区对天花板的体感非常真实：高频出现的「大预算容易只吃一两天流量、衰退很快」「大预算直接仙女座 1-1-1 猛攻跑出好素材」等讨论，说明老手已经凭直觉知道「预算猛＝衰退快」的现象——但往往只描述现象、不解释机制。本课程的边际曲线框架正好填补这个空白：它把「衰退快」解释成 Audience Ceiling 的拐点，并给出「换池子」的方法论。论坛里「万刀流跑不动」这类黑话，本质就是天花板的口语化表达——当所有便宜量被吃完，再堆预算只会买到垃圾流量（CPM 看着低、人群全是无效的坑）。社区知道现象，课程给出曲线与解法。",
e:"<ul><li>线性思维加预算：以为「预算翻倍＝单量翻倍」，无视边际曲线，根因是分不清「平均 CPL」与「边际 CPL」（见 L0-08）。</li><li>到拐点后硬顶：在边际 CPL 已超上限时继续加钱，根因是没画边际曲线、不知道拐点的存在。</li><li>从不画边际曲线：只盯整体平均成本，根因是把「平均」当成「下一块预算的价格」。</li><li>换池子时一次开三个维度：受众＋市场＋素材同时上，涨了不知谢谁、跌了不知怪谁，根因是缺乏一维一维验证的纪律。</li><li>把「竞争层抬价」误判为「素材变差」：CPM 涨导致的边际恶化被错归因为创意问题，根因是没区分 Auction Ceiling 与 Creative 问题。</li></ul>",
q:{q:"周预算 $2000 时边际 Deal Cost $260，业务上限 $300。还能加到 $2600 吗？",a:"先算斜率：上一段（1600→2000）边际已到 $260，接近上限 $300；按曲线陡峭化规律，再往上（2000→2600）的边际大概率 >$300，甚至逼近拐点红线（$360）。判断：不加。备选两条路：① 用「换池子」重开曲线——上新 Angle / 扩语言区 / 并入同语言组（呼应 L7-04、L7-02）；② 或把增量预算给边际更优的其他组，走 Portfolio 思维（L7-06）。推理关键：决策依据边际数字，而非平均数字。"},
b:"画出你主力组近 8 周的边际曲线并标注拐点（拐点为「边际＝业务上限×1.2」处）。"},
{id:"L7-02",lv:7,t:"Vertical vs Horizontal Scaling 决策",
g:"在「同一池子加钱」与「开新池子」之间做结构化决策。",
c:"<p><b>扩量有两条根本不同的路。</b><b>Vertical Scaling（纵向扩量）</b>＝在现有广告组里直接加预算：优点是模型延续、操作简单、不重置学习期（呼应 L0-05，小幅加 ≤20% 不改变数据分布）；缺点是直奔天花板，边际恶化快——你始终在同一个池子里往更贵的人群走。</p><p><b>Horizontal Scaling（横向扩量）</b>＝开新曲线：复制新组 / 新受众 / 新市场 / 新素材。优点是边际更优——新池子有大量未开发的好量，曲线从平缓段重新开始；缺点是要付出学习期学费（新组合需重新探索，见 L0-05），管理更复杂，还可能内耗（重叠人群被两边竞价抬高成本，见 L4-07）。</p><p><b>误区纠正：</b>很多人把「横向＝复制粘贴原组」理解错了。简单复制原组只是把同一个池子拆成两半，边际并不更优，反而因重叠（Overlap）互相抢量。真正的横向是「换一个维度开新曲线」：新受众、新市场、或新 Angle。论坛口诀「横向激进、纵向保守」正是这个意思——横向敢多建，纵向加预算要慢。</p><p><b>类比：</b>纵向像在同一口井里继续往下挖（越挖越难、出水越慢）；横向像在旁边再打一口新井（新井出水快，但要重新勘探、有打空的风险）。</p>",
m:"<p><b>①②③ 机制链：</b></p><ul><li>① <b>决策核心＝比较两条路径的「边际成本曲线起点」</b>。纵向的新增预算，其边际成本必然高于该组当前均值（因为均值=已吃的好量，新增=更差的量）；横向的新组起步贵（学习期），但曲线更平（未开发人群多）。</li><li>② <b>横向的额外成本＝学习期学费＋内耗风险</b>。学习期学费：新组前 1–2 周边际高、不出量；内耗风险：若新组与原组受众重叠（L4-07），两组合竞价同一个用户，CPM 被自己抬高。</li><li>③ <b>净优劣＝横向「更平的曲线」能否覆盖「学费＋内耗」</b>。覆盖得了就横向，覆盖不了就先吃满纵向缓坡。</li></ul><p><b>数字演算（MSG 249 案例）：</b>美国市场纵向边际有效成本 $40；扩德国市场横向边际 $28.57。横向更优，因为德国是新池子、未开发人群多，曲线起点低。但横向的真实加权成本还要加学习期：若德国新组前 4 周平均边际是 $45（含学费），仍低于纵向长期 $40 之外的后续恶化段，且德国市场已验证过模型基础（降低打空风险），所以净胜。</p>",
h:"<p><b>扩量决策树检查单：</b></p><ul><li>① <b>纵向还有空间吗？</b>查边际曲线拐点（见 L7-01）。未到拐点 → 先吃满纵向缓坡：每次 +20%、间隔 ≥48 小时（见 L7-05）。</li><li>② <b>到拐点 → 评估横向选项</b>，按风险升序：同市场新受众（重叠低）＞ 复制新组（需重叠预检）＞ 新市场（L7-03）。</li><li>③ <b>横向执行纪律</b>：新组独立预算（绝不从主干抽预算喂新组）；上线前做重叠预检（L4-07），重叠率 >30% 否决；给 4–6 周学习验收窗，不出彩不急着砍、但也不无限制养。</li><li>④ <b>内耗监控</b>：横向上线后观察原组与新组的 CPM 是否同步抬升，若同步涨说明重叠在抢量，需错峰或差异化受众。</li></ul>",
cs:"某工业设备 2025 年 8 月扩量决策实例：DE 组（德语区）纵向加到周预算 $2400 后边际 $430，远超上限 $300，纵向路线判死刑。横向三选项对比：① 复制 DE 组 → 重叠率测算 47%（与母组抢同一批德语工程客户），否决；② 并入奥地利组（奥瑞同德语、零学习成本、已验证模型）→ 首选，边际起点仅 $260；③ 法国新市场 → 备选，排到下季度探测期（见 L7-03）。最终选 ②，4 周后奥地利组稳定贡献边际 $250 的成交，未侵蚀 DE 组表现。决策关键是「用重叠预检否决了看似省事的复制」。",
f:"论坛口诀「横向激进、纵向保守」完整原话是：「横向多建广告、多复制、小预算起跑；测出能出单的，观察几天再保守加预算。关广告要快、建广告要多、加预算要慢。」这本质就是一套民间版决策树：横向敢铺量、纵向加钱要克制。社区的「周末扩量法」（组 $10 出 2 单翻倍、复制 $10 新组、只在周五六操作）是横向的微缩版——小预算验证、出单再复制晋级，与课程的「风险升序＋独立预算＋学习验收」完全同构。社区用直觉，课程用框架。",
e:"<ul><li>一味纵向硬顶：到拐点还往里加钱，根因是懒得开新曲线、怕学习期学费。</li><li>横向时抽主干预算喂新组：两边都没吃饱（都饿），根因是没给新组独立预算。</li><li>复制组不看重叠：简单复制致重叠 >30% 内耗（L4-07），根因是误以为「复制＝扩量」。</li><li>横向新组两周不出彩就砍：学习期（L0-05）没给够，根因是把电商节奏套到 B2B 长周期。</li><li>横向一次开 5 个同维度新组：管理失控、数据互相污染，根因是缺乏「一次一维」纪律。</li></ul>",
q:{q:"MSG 249 案例：美国纵向边际有效成本 $40，扩德国边际 $28.57。为什么横向更优？什么情况下纵向仍是对的？",a:"横向更优：新池子（德国）的边际成本起点低（未开发人群多、曲线更平），且德国已验证过模型基础（降低打空风险）。纵向仍对的情形：① 纵向边际仍显著低于任何横向选项的「学习期加权成本」——即横向学费＋内耗后还是更贵；② 业务需要立刻的确定性量（横向有 4–6 周不确定期，纵向是即时的）；③ 没有可复用的素材/受众资产开新池（巧妇难为无米之炊）。推理要点：比较的是「加权后的净边际」，不是起点数字。"},
b:"为你的账户画扩量决策树，标注当前该走哪条枝（纵向/同市场新受众/复制/新市场）。"},
{id:"L7-03",lv:7,t:"Market Scaling（新市场节奏）",
g:"掌握新市场从试投到主攻的预算节奏与里程碑管理。",
c:"<p><b>新市场扩量不是「今天决定、明天同预算开干」，而是四个有晋级线的阶段。</b></p><ul><li><b>探测期（Probe）</b>：$10–30/天 × 2–4 周，唯一目标是验证「这个市场有没有人响应」，看 CPM/CPC/Lead 是否合理。</li><li><b>验证期（Validate）</b>：$50–100/天 × 4–6 周，看有效 CPL 与规模是否达标，重点看 Qualified Rate（线索质量）。</li><li><b>起量期（Scale）</b>：独立 Campaign，追赶主市场结构，确认边际稳定。</li><li><b>主攻期（Main）</b>：进入 Portfolio 常规配置（见 L7-06）。</li></ul><p><b>官方术语：</b>这本质是「分阶段投资」（Staged Investment）——用小钱买「继续还是放弃」的决策权。误区纠正：很多人新市场首月就给主市场同预算，结果学费翻倍；或没有淘汰标准，让僵尸市场永久吸血。</p><p><b>类比：</b>新市场像在陌生海域试网捕鱼——先撒一小网探探有没有鱼（探测），鱼群确认后换大网（验证），渔获稳定了才长期布网（主攻）。一上来就铺大网，网到一堆水草还浪费油钱。</p>",
m:"<p><b>①②③ 机制链：</b></p><ul><li>① <b>为什么节奏不能快</b>：新市场＝新数据分布，模型要从零学（L0-05）。预算猛灌只会加速买错量——系统还没搞清楚「谁会转化」就狂撒钱。</li><li>② <b>阶段制的本质＝用小钱买决策权</b>：每个阶段结束时，你用极低成本拿到了「晋级或淘汰」的判断依据，避免一次性大赌。</li><li>③ <b>晋级/淘汰标准是提前写死的</b>：不带情绪，标准到了就晋级、没到就淘汰，避免「再给一次机会」的沉没成本陷阱。</li></ul><p><b>数字演算：</b>主市场有效 CPL $200。新市场探测期 $20/天 × 3 周 = $420 学费，拿到 19 个 Lead（有效 CPL $22）——看起来比主市场还便宜？不对，因为样本太小且未验证 Qualified。进入验证期 $80/天 × 6 周 = $3360，有效 CPL 收敛到 $280（主市场 1.4 倍），Qualified Rate 30% 可接受。判定：晋级。若验证期有效 CPL 不收敛、停在 $450（2.25 倍），则淘汰，总学费仅 $3780，远小于「首月就给 $300/天」会亏掉的 $9000+。</p>",
h:"<p><b>新市场四阶段检查单（B2B 参考）：</b></p><ul><li>① <b>探测期</b>：$10–30/天 × 2–4 周；晋级线＝CPM/CPC 合理 + 有首批 Lead（≥5 条）；淘汰线＝3–4 周连前端（CTR/CPC）都不健康。</li><li>② <b>验证期</b>：$50–100/天 × 4–6 周；晋级线＝有效 CPL ≤ 主市场 ×1.5 且 Qualified Rate 可接受；淘汰线＝有效 CPL 无收敛趋势。</li><li>③ <b>起量期</b>：独立 Campaign，小步加预算（每次 +20%）；晋级线＝边际稳定 2 个评估窗（如 2 周）。</li><li>④ <b>主攻期</b>：纳入 Portfolio 月度再平衡（L7-06），给常规预算占比。</li></ul>",
cs:"某工业设备法国市场 2025 年节奏实录：探测期 3 周，预算 $25/天，CPM 合理、拿到 19 个 Lead（初步响应确认）；验证期 6 周，预算提到 $80/天，有效 CPL 收敛到主市场（DE）的 1.4 倍（$280 vs $200），Qualified Rate 28% 通过；起量期 2 个月，本地化 Landing Page 上线后有效 CPL 降到 1.2 倍，独立 Campaign 追平主市场结构；主攻期纳入欧洲 Portfolio。全程 5 个月，学费总计约 $6000，零浪费（每个淘汰线都提前设好，未触发即晋级）。",
f:"论坛 0-1 案例的「周末扩量法」（组 $10 出 2 单翻倍、次日出 2 单的组复制 3 个 $10 组、只在周五六操作）就是市场/组合节奏的电商微缩版：小步验证 + 晋级复制 + 时间纪律。社区里「避开内卷市场」的市场选择教训，正是「探测期就该淘汰」的前置筛选——与其硬打一个不响应的市场，不如在探测期就放弃。社区用节奏控制风险，课程把它升级为四阶段里程碑。",
e:"<ul><li>新市场首月就给主市场同预算：学费翻倍，根因是没理解「新数据分布要从零学」。</li><li>没有淘汰标准：僵尸市场永久吸血，根因是舍不得「已经投了的学费」沉没。</li><li>各阶段混用素材/落地页：无法归因阶段效果，根因是缺乏分阶段实验设计。</li><li>探测期样本太小就晋级：被偶然的 Lead 误导，根因是不看 Qualified Rate 与收敛趋势。</li><li>验证期有效 CPL 超标仍「再给一次机会」：情绪决策，根因是没把淘汰线写死。</li></ul>",
q:{q:"新市场探测期 3 周：CPM 正常、CTR 1.4%、花了 $400 出 2 个 Lead（1 Qualified）。晋级还是淘汰？",a:"倾向晋级观察：前端健康（CPM/CTR 正常说明市场有响应）＋ 已有 Qualified 信号；$400 样本虽小但方向为正。动作：进入验证期小步加预算（$50/天），定死晋级线（4–6 周内有效 CPL 收敛至主市场 1.5× 内、Qualified Rate 达标），不达标即淘汰——标准前置、感情零干预。推理关键：探测期只看「有没有响应」，不看「成本绝对值」。"},
b:"写出你的市场四阶段标准（预算/时长/晋级线/淘汰线），并选一个待开拓市场套用。"},
{id:"L7-04",lv:7,t:"多维扩量：Audience / Creative / Placement",
g:"掌握天花板出现时「换哪个维度扩」的选择逻辑与组合顺序。",
c:"<p><b>扩量远不止「加预算」一个维度。</b>完整框架有五维：<b>预算（Budget）× 市场（Market）× Creative（素材/Angle）× Audience（受众）× Placement（版位）</b>。每一维都有「重开增长曲线」的能力，但成本与风险不同：</p><ul><li><b>Creative</b>：新 Angle＝新的「吸引谁」接口，在同一组内即可测试，成本最低、风险最小；</li><li><b>Audience</b>：放宽约束 / 新子人群，成本中等；</li><li><b>Placement</b>：新增展示场景（如 Reels），增量小；</li><li><b>Market</b>：新池子，增量大但贵、学习成本高；</li><li><b>Offer</b>：改变筛选器（如加重表单字段），影响线索质量。</li></ul><p><b>顺序原则：先便宜后贵、先低风险后高风险。</b>误区纠正：很多人只在预算维度扩（其他四维是盲区），或一次开三个维度（涨了不知谢谁、跌了不知怪谁）。还有人 Creative 扩量只加变体不加 Angle（换皮陷阱，见 L3-08）——换汤不换药。</p><p><b>类比：</b>扩量像装修房子扩大面积，最便宜是先重新布置（Creative/Angle），然后加隔断（Audience），再扩建房间（Placement），最后才是买下隔壁地块（Market）。一上来就买地最贵也最慢。</p>",
m:"<p><b>①②③ 机制链：</b></p><ul><li>① <b>为什么 Creative 优先</b>：新 Angle 在同一组内即可测试（不加预算结构复杂度），且它改变的是「吸引谁」而非「去哪找」——本质是让模型重新看见被漏掉的人群。</li><li>② <b>为什么 Audience 次之</b>：放宽约束扩的是「同一类人的边界」，比换市场便宜，但边际改善小于新 Angle。</li><li>③ <b>为什么 Market 最后</b>：新国家/新语言＝全新数据分布，学习成本与风险最高，应作为「池子真的见底」时的终极手段。</li></ul><p><b>数字演算（MSG 241 触达缺口）：</b>某组预估可触达 3000 万，实际只触达 30 万（1%），说明 2970 万人因「素材 Angle 不对」而没被吸引。换一个 Angle 素材，可能把触达从 30 万提到 80 万——这就是 Creative 维「低成本重开人群接口」的威力，不用多花一分预算结构成本。</p>",
h:"<p><b>扩维检查单（一维一维上）：</b></p><ul><li>① <b>新 Angle 测了吗</b>？在 Portfolio 缺口处补新素材角度（见 L3-09），同组 A/B。</li><li>② <b>受众还有 2 档可放宽吗</b>？逐步放松约束，每档观察 2–4 周。</li><li>③ <b>版位 Breakdown 有未开发高净值场景吗</b>？如 Reels 品牌向、右栏等。</li><li>④ <b>同语言区并完了吗</b>？如德/奥/瑞合并（见 L9-05）。</li><li>⑤ <b>最后才是新国家</b>。每维给 2–4 周观察期，确认边际变化有效再叠下一步。</li></ul>",
cs:"某工业设备 2025 年 9 月扩量序列（DE 组到拐点后，不动市场预算）：第一轮上新 Angle「项目案例」视频素材，消耗 +18%、边际 CPL 持平（$215），说明新 Angle 重开了人群接口；第二轮受众放宽 1 档（去掉「必须为污水处理厂」硬约束，改为「水务相关」），消耗再 +8%、边际微升到 $228（仍远低于上限 $300）；第三轮 Reels 品牌向素材小补充，吃下高净值场景。三轮合计把 DE 组天花板抬高约 30%，全程未动一分市场预算、未开新国家。验证「先便宜后贵」的扩维顺序有效。",
f:"论坛的 ASC 多素材「格拉满」（10 个素材 + 1 文案的 1-1-1）扩量法，以及「一拖三/一拖五」阶梯预算复制（不同预算对应不同出价层级、撞人群找能跑的），正是 Creative 维与 Audience 维的民间扩量术。社区还聊「高净值版位单投」＝ Placement 维的玩法。这些民间经验与课程的五维框架高度同构——社区靠手感堆素材，课程把「换哪个维度、什么顺序」讲成了可复用的决策框架。",
e:"<ul><li>只会在预算维度扩：其他四维是盲区，根因是把「扩量」等同于「加钱」。</li><li>一次开三个维度：涨了不知谢谁、跌了不知怪谁，根因是缺乏一维一维验证纪律。</li><li>Creative 扩量只加变体不加 Angle：换皮陷阱（L3-08），根因是混淆「同一角度的多个版本」与「新角度」。</li><li>跳过便宜维度直接开新市场：学习成本与风险最高却最先做，根因是贪快。</li><li>扩维不看边际变化：加了维度却不验证是否真的重开曲线，根因是缺观察期设定。</li></ul>",
q:{q:"主力组到拐点，预算维度已锁死。按顺序说出你的前三步。",a:"① 上 1–2 个新 Angle 素材（同组测试，成本最低、重开人群接口）——对应 Creative 维优先；② 受众放宽一档或并入同语言区（扩池不破结构）——对应 Audience 维；③ 版位 Breakdown 复查找未吃满的高净值场景（如 Reels）——对应 Placement 维。每步 2–4 周观察边际变化，有效再叠下一步；全部试完才考虑新市场。推理依据：先便宜后贵、先低风险后高风险。"},
b:"对你的主力组跑一遍五维检查单，产出本月扩量序列（标注每维的观察期与预期边际变化）。"},
{id:"L7-05",lv:7,t:"Budget Shock 与阶梯加预算",
g:"掌握加预算的节奏学：为什么大幅跳变有害、阶梯怎么设计、什么时机加。",
c:"<p><b>Budget Shock（预算冲击）＝预算大幅跳变，触发模型重新探索。</b>Meta 的模型学习的是「当前预算对应的数据分布」（见 L0-05）。你突然把预算翻倍，原有高概率人群池填不满新预算，系统必须向更广人群探索——数据分布突变，等于一次「重大修改」，学习期被打断、CPL 短期飙升甚至彻底不出单。</p><p><b>阶梯原则：</b>单次加幅 ≤20%、频率 ≥2–3 天一次、避开转点（每日预算重置的午夜凌晨节点）。这不是玄学，是给模型平滑过渡的时间窗口。</p><p><b>误区纠正：</b>出单兴奋次日翻倍是最常见的新手错误——以为「表现好就该猛加」，结果模型重置、好量断供。还有人转点前后大幅加预算，正好撞上系统最敏感的时刻（论坛老手用真金白银换来的教训）。</p><p><b>类比：</b>加预算像给跑步的人加速——每次提速 5% 他能平稳适应；突然让他从走路变成百米冲刺，他会岔气（模型重置）。阶梯就是「每次只快一点点」。</p>",
m:"<p><b>①②③ 机制链（与 L0-05 联动）：</b></p><ul><li>① <b>预算改变拍卖参与量</b>：预算 $50/天，模型在一小群人里找到高效人群；加到 $200/天，原池填不满，必须扩展——分布漂移（Distribution Shift）。</li><li>② <b>小步（≤20%）分布近似不变</b>：若人群池足够大（Broad/宽泛受众），+20% 几乎不触发重新探索，模型平滑过渡。</li><li>③ <b>翻倍突破池容量</b>：大范围重新探索，CPL 短期上升。所以「加多少不炸」取决于池子大小，不是固定百分比。</li></ul><p><b>数字演算：</b>组预算 $100，Broad 受众池可支撑 $500/天不溢出。+20%→$120：池子绰绰有余，分布几乎不变，CPL 稳定。若直接 $200：需求是原池的 2 倍，系统被迫扩展到低 EAR 人群，CPL 可能从 $30 跳到 $55（＋83%），且需 3–7 天重新学习。论坛与课程在数字上高度一致：「≤20%/次」是跨流派共识（自动化规则「每小时 +10%」本质也是高频小幅）。</p>",
h:"<p><b>阶梯加预算 SOP：</b></p><ul><li>① <b>基线确认</b>：连续 3 天边际健康（CPL 稳定、消耗顺畅）。</li><li>② <b>+20%</b>：如 $100→$120，观察 48–72h（CPL 与消耗稳定再动）。</li><li>③ <b>达标再 +20%</b>：如 $120→$144，如此类推；约 5–6 步、2 周到 $200。</li><li>④ <b>触发回撤条件即停手</b>：边际超上限 / 消耗崩 → 回落到上一步预算。</li><li>⑤ <b>时机</b>：流量高峰前加（捕捉高转化时段）；避开转点；电商可用周末扩量法。</li></ul>",
cs:"某工业设备 DE 组 2025 年 10 月从 $1500 阶梯爬到 $3000 的实录：分 5 步、每步 +20%、间隔 3 天，约 3 周完成（1500→1800→2160→2592→3000，最后一步略超以取整）。第 3 步（2160）后边际短暂跳升 $40，团队立即停 1 周让模型消化，恢复后继续。全程有效 CPL 波动 <10%，无 Budget Shock 事故。对比同期另一组「老板高兴直接翻倍」的组，CPL 飙升 60% 且 5 天不出单——正反案例印证阶梯纪律的价值。",
f:"论坛的「小强打法」自动化规则就是阶梯加预算的程序化版本：ROAS 达标 → 每小时检查 → 每次 +10% → 分层上限 $50/$100/$200/$300。它把课程的「小步＋择时＋止损」全部规则化——每 1 小时 +10% 本质就是高频小幅加，分层上限就是回撤条件。堪称本模块的论坛教科书：社区用自动化实现了理论，课程用文字讲清了原理。",
e:"<ul><li>出单兴奋次日翻倍：学习重置、好量断供，根因是误把「表现好」当「该猛加」。</li><li>加完预算当天关掉跑差的组：新平衡未形成就破坏，根因是不懂模型需要观察窗。</li><li>转点前加预算：撞上系统最敏感节点（空耗警告），根因是忽略时机纪律。</li><li>阶梯节奏 irregular：有时 +5% 有时 +50%，根因是情绪化操作、无 SOP。</li><li>只看加完当下的 CPL：Budget Shock 的恶化常滞后 1–3 天，根因是缺 48–72h 观察。</li></ul>",
q:{q:"组预算 $100 连续一周效果好。明天直接改 $200 行不行？想稳一点怎么加？",a:"翻倍＝重大修改风险：系统扩展人群、彻底不出单的教训比比皆是（L0-05 分布漂移）。稳法：明早 +20%→$120，观察 48–72h 边际与消耗；稳定则再 +20%→$144；约 5–6 步、2 周到 $200。若中途边际超限 → 停手，改走横向扩量（L7-02）。推理关键：加幅是否安全取决于人群池容量，而非「表现好」。"},
b:"写出你账户的加预算 SOP（幅度/间隔/时机/回撤条件），并据此把某个组加 1 倍。"},
{id:"L7-06",lv:7,t:"Portfolio Allocation（组合配置）",
g:"从「组与组的比较」升维到「组合层面的预算分配」：多市场多组同时争抢总预算怎么分。",
c:"<p><b>组合视角（Portfolio View）＝把所有在投单元（各组/各市场/各渠道）看成同一张资产负债表上的资产。</b>分配原则叫<b>边际效率趋同（Marginal Efficiency Equalization）</b>：不断把钱从「边际最差的单元」挪到「边际最好的单元」，直到各单元边际接近——此时总效率最优（经济学里的等边际原理）。</p><p>同时必须保留固定比例的<b>探索仓位（Exploration Slot）</b>：永远留一笔钱去试新市场/新 Angle，否则三个月后无兵可用。</p><p><b>误区纠正：</b>很多人「去年怎么分今年照旧」（静态分配），或所有钱喂历史冠军（看不见其边际已恶化），或业绩一紧就把探索仓砍光。组合再平衡是<b>持续过程</b>，不是一次性决定。</p><p><b>类比：</b>组合配置像园丁分配浇水——哪盆花边际长势最好（浇水回报最高）就多浇，但永远留一小壶去试种新种子（探索仓），不能把所有水都浇现有的花。</p>",
m:"<p><b>①②③ 机制链：</b></p><ul><li>① <b>为什么不能只喂冠军</b>：冠军组有天花板（L7-01），且其历史冠军 ≠ 下一块预算冠军（历史表现/边际效率/新增贡献是三个不同问题）。</li><li>② <b>再平衡动作＝回收边际最差、加注边际最优</b>：使各单元边际成本趋同，总效率最大化。</li><li>③ <b>探索仓不可动</b>：它是未来的增长期权，砍掉等于放弃下一条曲线。</li></ul><p><b>数字演算：</b>总预算 $10000，四个单元边际 Deal Cost：DE $210、北欧 $260、法国 $330、RT $180。RT 边际最优但容量余量仅 5%（已见顶），不宜再加；DE 余量 10%、北欧 40%、法国 70%。按趋同逻辑：从法国（边际最差且容量大→其实应回收边际最差的是相对上限的）回收 15% 预算转给北欧（余量大、边际次优）。探索仓固定 15%（$1500）不动，用于新开奥地利。再平衡后整体边际加权成本下降约 8%。</p>",
h:"<p><b>月度再平衡流程：</b></p><ul><li>① <b>列全单元表</b>：每个单元的「边际有效 Deal Cost」＋「天花板余量」。</li><li>② <b>排序</b>：从最差单元回收 10–20% 预算。</li><li>③ <b>分配</b>：给边际最优且有容量余量的单元。</li><li>④ <b>保留 15–20% 探索仓</b>（新市场/新 Angle）不动。</li><li>⑤ <b>记录配置理由</b>，月度复盘胜率（决策质量可积累）。</li></ul>",
cs:"某工业设备 2025 年 10 月组合配置表：DE 边际 $210（容量余 10%）、北欧 $260（余 40%）、法国 $330（余 70%）、RT $180（余 5%，已见顶）。动作：DE 冻结（余量小不宜再加）、北欧 +15%、法国 +20%（容量大、可承接）、RT 缩 10%（边际最优但见顶，回收给有余量的）、探索仓 $1500 新开奥地利组。执行后 11 月整体边际加权成本从 $268 降到 $246（－8%），且奥地利组在探测期跑出边际 $240 的新曲线。月度复盘记录了「为何法国加注」的理由，决策质量可追踪。",
f:"论坛的「一拖三/一拖五阶梯预算」（不同预算层级撞人群找能跑的）与品牌站「近 30 天 ROAS 低的直接关、留能赚钱的」，就是民间版组合再平衡——社区凭直觉把预算从赔钱系列挪到赚钱系列。课程把它形式化为「边际趋同＋探索仓」：不仅看谁赚钱，更看谁的「边际」还最优、还有容量。社区做对了一半（砍差的、留好的），课程补上「探索仓」这一半（永远留种子）。",
e:"<ul><li>预算「去年怎么分今年照旧」：静态分配，根因是懒得做月度再平衡。</li><li>所有钱喂历史冠军：看不见其边际已恶化（L7-01），根因是只看历史表现。</li><li>探索仓被业绩压力砍光：三个月后无兵可用，根因是不懂探索仓是增长期权。</li><li>从不记录分配理由：无法复盘决策质量，根因是缺「决策日志」习惯。</li><li>再平衡幅度过大（一次挪 50%）：破坏单元学习，根因是不懂小步调整。</li></ul>",
q:{q:"三个组边际 Deal Cost：A $200、B $260、C $400（上限 $300）。增量 $1000 给谁？",a:"C 已超业务上限（$400>$300）→ 回收而非加注（它该减预算）。A 边际最优但查天花板余量——余量足则 A 拿大头（如 $600），余量小则流向 B；剩余给 B 或探索仓。原则三句话：边际最优优先、超限单元回收、永远留探索仓。推理依据：组合配置看「边际＋容量」，不是看历史表现。"},
b:"做出你的首张组合配置表（单元/边际/余量/动作），并执行一个月后复盘。"},
{id:"L7-07",lv:7,t:"Marginal Profit 与 Risk-adjusted Scaling",
g:"把「边际成本」升级为「边际利润」与「风险调整后收益」，让扩量决策对齐经营。",
c:"<p><b>Marginal Profit（边际利润）＝新增预算带来的新增毛利</b>＝（新增营收 × 毛利率）－ 新增花费。它和 Marginal Cost（边际成本）的区别在于：Deal Cost 只回答「买一个成交花多少钱」，Marginal Profit 才回答「这块钱投下去赚不赚」。</p><p><b>Risk-adjusted（风险调整）</b>：不同市场的收益要打风险折扣——回款周期、汇率、政治/合规风险。账面边际 $260 但账期 120 天的市场，实际优先级可能低于 $290 现款市场，因为钱被占用的机会成本与坏账风险更高。</p><p><b>误区纠正：</b>只算成本不算毛利（低毛利品疯狂扩量）、所有市场一个风险权重、毛利率用「产品毛利」不用「项目毛利」（B2B 含安装服务）、从不更新（去年毛利今年失效）。</p><p><b>类比：</b>两个摊位都「每单赚 $10 毛利」，但一个当场收现金、一个要等 4 个月结账还可能跑单——你肯定优先押现金摊位。风险调整就是把「等 4 个月且可能跑单」的 $10 打折成「约等于 $7 的确定价值」。</p>",
m:"<p><b>①②③ 机制链：</b></p><ul><li>① <b>为什么边际利润是终点</b>：Deal Cost 只管「买量成本」，Marginal Profit 管「投了赚不赚」——经营决策要对齐利润不是成本。</li><li>② <b>为什么风险要打折</b>：账面收益 ≠ 到手收益，账期/汇率/合规会把「名义利润」侵蚀成「实际利润」。</li><li>③ <b>排序用折扣后边际利润</b>：配置才会对齐真实经营，而非表面成本最低。</li></ul><p><b>数字演算（MSG 396 美国 vs 德国）：</b>市场 X 边际 Deal Cost $200、毛利率 12%，同样 $1000 预算带来 5 单 × 平均客单 $4000 = $20000 营收 ×12% = $2400 毛利，减 $1000 花费＝边际利润 $1400。市场 Y 成本 $230（高 15%）、毛利 35%，$1000 带来 4 单 × $4000 = $16000 ×35% = $5600 毛利，减 $1000＝边际利润 $4600。Y 胜出，尽管 Y 的 Deal Cost 更高。这就是「看利润不看成本」的铁证。</p>",
h:"<p><b>风险调整扩量流程：</b></p><ul><li>① <b>算边际毛利</b>：需 CRM 的 Deal 金额与毛利率（分档即可），每个市场/单元都算。</li><li>② <b>建风险折扣表</b>：账期（>60 天打 10%、>90 天打 15%）、汇率波动（±5–10%）、稳定性（政治/合规 ±5–15%）。</li><li>③ <b>排序＝折扣后边际利润</b>。</li><li>④ <b>季度更新</b>：毛利与风险都会变，表要刷新。</li></ul>",
cs:"某工业设备 2025 年风险调整实例：市场 A（某东欧项目）月边际毛利 $5200，但账期 90 天＋汇率波动 ±8%，按折扣表打 15% 折后 ≈ $4420；市场 B（西欧现款项目）月边际毛利 $4400、现款结账、零汇率风险，折后 ≈ $4400，两者平手。但 B 资金周转快（现金当月回笼可再投），配置倾斜 B、A 保持观察。季度刷新时发现 A 所在国汇率恶化，折扣加到 20%，进一步把增量预算从 A 抽走。教训：账面毛利高不代表该多投，资金效率与风险才是最后一把尺。",
f:"论坛朴素版经验：「ROAS 门槛随利润率调整（高利润调低、低利润更严）」——社区已经意识到毛利应该改门槛，只是没系统化。而仿牌（FP）高 ROI 但投诉与封号风险极高的灰产案例，正是「风险调整的灰产反面教材」：高风险收益要打大折扣，否则账面漂亮、实际爆雷。课程把这两点形式化为「风险折扣表」——社区有直觉，课程给工具。",
e:"<ul><li>只算成本不算毛利：低毛利品疯狂扩量，根因是没把「利润」当终点。</li><li>所有市场一个风险权重：忽略账期/汇率差异，根因是不懂风险侵蚀名义利润。</li><li>毛利率用「产品毛利」不用「项目毛利」：B2B 含安装服务，根因是成本口径错误。</li><li>从不更新折扣表：去年毛利今年失效，根因是缺季度刷新机制。</li><li>用 Deal Cost 直接排预算：成本最低 ≠ 利润最高，根因是混淆边际成本与边际利润。</li></ul>",
q:{q:"市场 X 边际 Deal Cost 最低但平均毛利率仅 12%，市场 Y 成本高 15% 毛利 35%。预算倾斜谁？",a:"算边际毛利：同样 $1000 预算，X 毛利贡献 = 单量×12%，Y = 更少单量×35%——按数字算 Y 大概率胜出（MSG 396 的美国 vs 德国训练正是此题）。再叠加风险与资金效率后定：若 Y 还是现款、X 是长账期，则 Y 优势更大。答案永远来自「边际利润」而非「成本」单指标。推理步骤：① 各市场算边际毛利；② 打风险折扣；③ 折扣后排序配置。"},
b:"算出各市场的折扣后边际毛利排序表（含风险折扣理由），并与当前预算配置对比。"},
{id:"L7-08",lv:7,t:"Capacity-constrained Scaling（承接力约束）",
g:"把「销售与服务的承接力」纳入扩量公式：喂太多线索比喂更少更贵。",
c:"<p><b>承接力（Fulfillment Capacity）是扩量的隐形天花板。</b>瓶颈点有三：① 销售人数 × 响应速度 × 转化率；② 技术支持深度（选型/方案能力）；③ 交付产能。约束表现：Lead 响应超 24h（B2B 转化率断崖）、销售挑单（低质线索被浪费）、方案输出排队。</p><p><b>本质：</b>线索的价值实现依赖后端转化。超出承接力的增量线索＝边际价值趋零的浪费——你花钱买的是「库存积压」。</p><p><b>误区纠正：</b>投放只对「拿到线索」负责（成交断裂没人管）；承接崩了继续加量（越加越亏）；用「更多销售」作为唯一解（先优化响应与路由）；轻线索占满销售时间（没有分级）。</p><p><b>类比：</b>扩量像往漏斗里倒水，但漏斗下端管子太细——倒得越猛，溢出来的水（线索）全浪费，还可能把台面冲乱。真正的上限＝min（获客天花板，承接天花板）。</p>",
m:"<p><b>①②③ 机制链：</b></p><ul><li>① <b>为什么承接力是隐形天花板</b>：线索价值靠后端转化实现，超出承接力的增量线索边际价值趋零。</li><li>② <b>真正的扩量上限</b>＝min（获客天花板，承接天花板）——两者是「与」的关系，任一触顶都卡死整体。</li><li>③ <b>量质互替</b>：承接不足时，用「更严筛选」（Offer/表单升级）换质保量，而非硬加量。</li></ul><p><b>数字演算：</b>销售团队 3 人，每人每周深度跟进 20 条线索、转化率 20% → 周承接上限 = 3×20×20% = 12 个成交/周。若当前周成交 10 个、想冲 20 个，获客端能买来 20 个线索，但后端只接住 12 个——多买的 8 个线索边际价值≈0，且因销售超载，响应从 6h 恶化到 30h，连原本能成的 10 个也掉到 8 个。<b>加量反而减产出。</b></p>",
h:"<p><b>承接力约束检查单：</b></p><ul><li>① <b>测承接力</b>：销售人均每周可深度跟进线索数 × 转化率 → 周承接上限。</li><li>② <b>扩量前置检查</b>：目标增量 ≤ 承接余量的 80%（留缓冲）。</li><li>③ <b>补承接</b>：响应 SLA（<4h）、线索分级路由（Qualified 优先）、自助材料（选型工具/文档）分流轻线索。</li><li>④ <b>量质互替</b>：承接不足时用「更严筛选」（Offer/表单升级，见 L4-13）换质保量。</li></ul>",
cs:"某工业设备 2025 年 11 月教训：法国市场放量后 Lead 从周 40 翻倍到 80，但销售团队未扩编，响应时效从 6h 恶化到 30h+，当月成交不升反降（从 16 单掉到 13 单）。根因是承接力触顶、销售挑单且轻线索占满时间。补救：回撤 30% 预算 + 上线「工况参数表单」（L4-13，要求填流量/介质/功率）筛掉轻线索，有效线索占比从 40% 升到 65%，响应回到 8h，成交恢复并超过放量前。结论：承接力永远是第一性约束，扩量前先量承接余量。",
f:"论坛社区深知「进线质量与承接节奏」决定成败：有经验投手强调「销售先 Messenger/Email 建信任再电话」，以及「机器人（低意向）占比 >30% 就该重投」——都是在管理承接质量。另有美区「电话拒接 90%」的教训，本质也是「承接方式与市场不匹配」。社区用经验管承接，课程把「周承接上限」变成可计算的硬指标，并给出「量质互替」的系统性解法。",
e:"<ul><li>投放只对「拿到线索」负责：成交断裂没人管，根因是获客与承接割裂考核。</li><li>承接崩了继续加量：越加越亏，根因是不懂增量线索边际价值趋零。</li><li>用「更多销售」作唯一解：先优化响应与路由，根因是只加人力不提效。</li><li>轻线索占满销售时间：没有分级，根因是缺线索路由机制。</li><li>扩量前不测承接上限：盲目冲量撞墙，根因是缺「min（获客，承接）」意识。</li></ul>",
q:{q:"老板要求下月 Lead 翻倍，销售团队无法扩编。给出你的组合方案。",a:"① 质换量：Offer/表单升级（重 Offer＋工况字段，见 L4-13）筛掉低意向——翻倍的「有效线索」未必需要翻倍的进线量；② 承接提效：响应 SLA＋线索分级路由＋选型自助工具分流轻线索，释放销售产能；③ 阶梯放量：按承接余量 80% 分周爬坡，每周复核响应时效，恶化即踩刹车。让老板看到「翻倍的有效线索」可以不等于「翻倍的进线」。推理关键：承接天花板是硬约束，绕不过就用量质互替。"},
b:"算出你的周承接上限（销售人数×人均周跟进×转化率），并写出「质换量」的三个具体动作。"},
{id:"L9-01",lv:9,t:"Meta / Google / TikTok 角色分工",
g:"建立跨渠道的角色认知：Demand Creation vs Capture——谁种草、谁收割、谁拦截。",
c:"<p><b>跨渠道的第一性认知是「角色分工」。</b></p><ul><li><b>Meta＝Demand Creation（需求创造）</b>：被动触达，把不知道你产品的人带进漏斗，社交场景的干扰式曝光。</li><li><b>Google Search＝Demand Capture（需求捕获）</b>：主动需求拦截，用户带着意图来搜索，你截住他。</li><li><b>Google PMax/YouTube＝介于两者</b>：再触达＋需求激发。</li><li><b>TikTok＝超轻型 Creation</b>：年轻人群＋冲动型，B2B 角色有限。</li></ul><p><b>误区纠正：</b>三渠道比 CPL 定生死（不同职能不可比）、Search 报表好看就砍 Meta（自杀式配置）、TikTok 硬套 B2B 询盘逻辑、角色定义从未成文（每次争论重开）。</p><p><b>类比：</b>Meta 是「在街上发传单让人知道有这家店」（种草），Google 是「顾客主动走进店时你站在门口接待」（收割），TikTok 是「广场上跳段舞吸引路过的年轻人」（轻量种草）。拿「发传单的成本」和「门口接待的转化」比单价，毫无意义。</p>",
m:"<p><b>①②③ 机制链（呼应 L0-07 归因）：</b></p><ul><li>① <b>为什么角色分工决定预算</b>：Creation 渠道的功劳常被 Capture 渠道「截胡」——用户被 Meta 种草后去 Google 搜索成交，Last Click 归因全给 Google。</li><li>② <b>只看末次点击会系统性杀死 Creation</b>：Meta 的种草价值在 Google 的转化报表里完全看不见。</li><li>③ <b>正确预算逻辑＝按角色＋增量证据</b>，不是按 CPL 排名（CPL 跨职能不可比）。</li></ul><p><b>数字演算：</b>Meta 月花费 $10000、报表 CPL $58；Google 月花费 $6000、报表 CPL $35。表面 Google 更便宜，应把 Meta 预算转给 Google？错。停 Meta 实验（Geo）显示：停投后 Google 品牌词搜索量同步跌 40%——说明 Google 那部分「便宜转化」里，有大量是 Meta 种草带来的需求。Meta 的真实增量价值被 Google 的 Last Click 报表吞掉了。按增量而非 CPL 分配，Meta 反该加注。</p>",
h:"<p><b>跨渠道角色配置检查单：</b></p><ul><li>① <b>给每个渠道写角色定义</b>（在这个业务里它负责什么）——成文，不再口头争论。</li><li>② <b>按角色定 KPI</b>：Meta 看「进漏斗增量」（Cohort/Geo 测），Google 看捕获效率（CPL/CPC），别拿同一把尺子。</li><li>③ <b>预算按「漏斗职能＋增量证据」分</b>，不按 CPL 排名分。</li><li>④ <b>定期用 Geo/Lift 实验校准</b>角色贡献（见 L9-03、L9-04）。</li></ul>",
cs:"某工业设备跨渠道角色表（2025 年定版）：Meta＝新需求创造（负责把不知道潜水搅拌设备的工程师/业主带进漏斗，产出进漏斗询盘）；Google Search＝已激活需求捕获（品牌词＋品类词，截住主动搜索的人）；TikTok＝暂缓（B2B 决策者密度低，仅做品牌曝光、不考核询盘）。这个定义终结了内部「Meta CPL 比 Google 贵凭什么投」的永恒争论——因为两者职能不同，根本不该用同一把 CPL 尺子比。后续用 Geo 实验验证：Meta 停投区 Google 品牌词流量同步下滑，坐实了 Creation 价值。",
f:"论坛经验印证：「巨量（抖音）怎么玩 FB 就怎么玩」说明投放底层相通但角色不同（抖音偏 Creation、搜索偏 Capture）。社区里有投手抱怨「多渠道线索（搜索回来的）污染实验」——正是 Search Capture 与 Creation 混淆的民间观察；TG/独立站圈「种草-搜索-成交」路径的抱怨，也指向 Creation/Capture 分离的真相。社区用体感，课程用角色定义＋增量证据把争论清零。",
e:"<ul><li>三渠道比 CPL 定生死：不同职能不可比，根因是不懂 Demand Creation vs Capture。</li><li>Search 报表好看就砍 Meta：自杀式配置，根因是不看 Creation 的间接贡献。</li><li>TikTok 硬套 B2B 询盘逻辑：角色错配，根因是没写渠道角色定义。</li><li>角色定义从未成文：每次争论重开，根因是缺「角色定义表」。</li><li>用 Last Click 分配跨渠道预算：系统性低估 Creation，根因是不懂 L0-07 归因陷阱。</li></ul>",
q:{q:"老板：Google CPL $35、Meta CPL $58，为什么不把 Meta 预算全给 Google？",a:"① 职能不同：Google 捕获的是「已被激活的需求」，其中大量需求是 Meta 创造的（品牌词搜索量与 Meta 花费的相关性可验证）；② 关掉 Meta＝断流：3–6 个月后 Google 的「可捕获需求」也会萎缩（时滞掩盖因果）；③ 验证法：Geo 实验（停 Meta 的区域看 Google 品牌词流量是否同步下滑）。别用 Capture 渠道的报表审判 Creation 渠道。推理关键：CPL 跨职能不可比，分配看增量证据。"},
b:"写出你业务的三渠道角色定义表（职能/KPI/预算原则），并标注各自的归因方式。"},
{id:"L9-02",lv:9,t:"Brand Search Capture Bias",
g:"识别品牌搜索的「截胡效应」：你付钱捕获的很多是本来就会来的人。",
c:"<p><b>Brand Search Capture（品牌搜索截胡）</b>＝用户看了 Meta 广告/自然内容后搜索你的品牌词，点击你的搜索广告成交——广告费花在「捕获本来会来的需求」上。</p><p><b>判别信号：</b>品牌词 CPC 低、CTR 极高、转化率极高——<b>太好的数据常是截胡而非增量</b>。</p><p><b>品牌词的两种价值要分开算：</b>① <b>防御价值</b>——防止竞品截流你的品牌流量，有真实意义；② <b>增量价值</b>——让「本来直接输入网址」的人多付一次点击费，接近零增量。报表把两者混在一起，品牌词 CPL 才会美到失真。</p><p><b>误区纠正：</b>品牌词与非品牌词混投混报（数据失真源）、品牌词 CPL 好看就加码（买自己的流量）、完全不做品牌防御（被竞品截流也亏）、从未把品牌搜索量与 Meta 花费做相关分析。</p><p><b>类比：</b>品牌词广告像在家门口装个收费亭——本来路人会直接走进你家（直接访问），你却拦住他收一次过路费（点击费）。收的是「自家人的钱」，不是新客的钱。</p>",
m:"<p><b>①②③ 机制链：</b></p><ul><li>① <b>截胡如何发生</b>：Meta 种草 → 用户搜品牌词 → 点你的搜索广告成交；Last Click 把功劳给 Search，但需求是 Meta 创造的（呼应 L0-07）。</li><li>② <b>两种价值分离</b>：防御价值（防竞品）真实；增量价值（捕获本会来的人）≈0。</li><li>③ <b>报表失真根源</b>：平台把防御与增量混算，品牌词 CPL 被低估。</li></ul><p><b>数字演算：</b>品牌词广告周花费 $500、转化 50 单、CPL $10（美到失真）。Geo 实验停投一周：品牌词自然点击只降 25%（即 75% 的需求本来就会来）。则真实增量转化 ≈ 50×25% = 12.5 单，增量 CPL ≈ $500÷12.5 = $40——比报表的 $10 贵 4 倍。剩下的 37.5 单是「买自己的流量」。这 $500 里，只有防御那部分（防竞品截流）值得花，增量部分该砍。</p>",
h:"<p><b>品牌词防御配置检查单：</b></p><ul><li>① <b>品牌词与非品牌词分 Campaign</b> 分开看（永远别混）。</li><li>② <b>品牌词预算＝防御性配置</b>（少而稳），不参与「效果预算」竞争。</li><li>③ <b>验证截胡程度</b>：看自然搜索与直接流量的此消彼长（停投实验或 Geo）。</li><li>④ <b>把 Meta 种草→品牌搜索的路径</b>明确归入 Meta 的间接贡献（口径台账，见 L6-13）。</li></ul>",
cs:"某工业设备品牌词审计（2025 年）：品牌词占搜索花费 30%、转化占 55%——在报表里是明星。但做 Geo 实验停投品牌词广告后，品牌词自然流量补位 70%，证实那 55% 转化里大部分是「本来就会来的截胡」。预算重配：品牌词保留最低防御预算（仅防竞品竞价），效果预算全给品类词（非品牌）与 Meta（创造需求）。重配后总花费降 8%，有效增量转化不降反升 5%——因为钱从「买自己的流量」挪到了真增量。这是「看增量而非看报表」的典型胜利。",
f:"论坛大量「品牌词真香」的朴素汇报缺少此层校验——社区看到品牌词 CPL 低就猛加，却没验证「停了会不会掉」。社区里关于「锅（现有帖子/受众）」的长讨论，本质是同个问题：「已经属于你的流量，再花钱买它算不算本事」。课程 MSG 358–362 的跨渠道训练把这个问题形式化：防御要保留、增量要算清，两者分开。社区有体感无工具，课程给的是「分开+Geo 验证」的方法。",
e:"<ul><li>品牌词与非品牌词混投混报：数据失真源，根因是不懂两种价值要分离。</li><li>品牌词 CPL 好看就加码：买自己的流量，根因是没做截胡验证。</li><li>完全不做品牌防御：被竞品截流也亏，根因是只看增量忽略防御价值。</li><li>从未做品牌搜索量与 Meta 花费相关分析：看不见 Creation 间接贡献，根因是缺口径台账（L6-13）。</li><li>用品牌词 CPL 评判 Search 渠道整体：被失真数字误导，根因是混算。</li></ul>",
q:{q:"品牌词广告停投一周，品牌词自然点击只降了 25%。说明了什么？怎么配预算？",a:"75% 的品牌需求是「自然存在」的（不是广告买来的）——广告主要在做防御与便利性捕获，增量低。配置：品牌词保留最低防御预算（防竞品竞价），效果预算重新分配到品类词/竞品词/Meta 创造需求；品牌词的「报表功劳」从此单列，不参与效果考核。推理：停投后自然点击只掉 25%＝增量仅 25%，其余 75% 是买自己的流量。"},
b:"分离你的品牌词与品类词数据，估算截胡比例（用停投实验或自然点击此消彼长法）。"},
{id:"L9-03",lv:9,t:"跨渠道归因重叠与口径",
g:"处理多渠道报表「功劳之和 >100%」的必然冲突，建立跨渠道可比口径。",
c:"<p><b>跨渠道报表「功劳之和 >100%」是必然的。</b>一次转化路径常跨多渠道：Meta 种草 → Google 搜索 → 直接访问成交，各平台都按自己的口径认领，于是三大平台报告之和虚高 30–60%。再加上各家窗口/模型不同（Meta 7 天点击、Google 30 天、各自的 DDA 数据驱动归因），数字互不可比。</p><p><b>解法原则：</b>「平台报表只用于平台内优化，跨渠道决策只用中立口径」。中立口径＝CRM/业务数据（成交量、毛利）＋增量实验（Geo/Lift）校准。平台数字永远不能直接横向比大小。</p><p><b>误区纠正：</b>拿 Meta 报表 vs Google 报表直接比 CPL 定预算（头号禁区）、发现重叠后干脆不信任何报表（虚无主义）、中立口径只有销量没有毛利（价值层缺失）。</p><p><b>类比：</b>三个证人各自描述同一场事故，每人都说「主要是我的功劳」，加起来成了「三个事故」。你要的真相不在任何单个证人嘴里，而在「监控录像」（CRM 业务数据）和「现场实验」（Geo）里。</p>",
m:"<p><b>①②③ 机制链（呼应 L0-07）：</b></p><ul><li>① <b>重叠如何产生</b>：同一用户跨多平台被触达，每个平台都按自己的窗口/模型认领同一次转化 → 之和虚高。</li><li>② <b>为什么平台数字不可比</b>：窗口长度、归因模型、信号口径都不同，跨平台直接比 = 拿苹果比橘子。</li><li>③ <b>中立口径是唯一裁判</b>：CRM 归源成交（首触/末触双口径）＋增量实验校准。</li></ul><p><b>数字演算：</b>某周 Meta 报 40 Lead、Google 报 25、CRM 实收 48。重叠率＝(40+25−48)/48 = 35.4%。即 17 单被双计。若直接拿 Meta(40) 与 Google(25) 比 CPL 定预算，会误判「Google 量小该加」——但 Google 的 25 里可能 17 单是 Meta 种草的重叠。正确做法：以 CRM 48 为业务真相，平台数字只用于各自账户内优化，跨渠道挪预算只用 Geo/Lift 证据。</p>",
h:"<p><b>跨渠道口径检查单：</b></p><ul><li>① <b>建「业务真相表」</b>：周度按渠道记录花费 vs CRM 归源成交（首触/末触双口径都记）。</li><li>② <b>平台报表各管各的账户内优化</b>，不跨平台比大小。</li><li>③ <b>跨渠道挪预算只在两种证据下执行</b>：增量实验结果、或 CRM 口径连续 8 周+趋势。</li><li>④ <b>口径台账覆盖全渠道</b>（见 L6-13）。</li></ul>",
cs:"某工业设备「业务真相表」示例（2025 年某周）：Meta 报 40 Lead、Google 报 25、CRM 实收 48——重叠 17 单被双计（重叠率 35%）。此前团队为「Meta 报 40 比 Google 25 多所以该给 Meta」吵了半年。上线 CRM 双口径（首触归 Meta、末触归 Google）＋ 季度 Conversion Lift 校准后，跨渠道预算决策再没吵过架：Meta 拿创造需求的增量证据、Google 拿捕获的效率证据，各安其位。真相表让「谁的功劳」从口水战变成可查的数据。",
f:"论坛里「多渠道数据对不上」是常态抱怨（多链路归源困境），社区投手常困惑「为什么各平台数加起来比实际多」。有经验的老手会自己装 Hotjar、发邮件问流失客户来补齐「业务真相」——这是民间版的中立口径建设。社区靠直觉补数，课程靠「口径工程」：业务真相表＋双口径＋增量实验，把不可比的 platform 数字收敛到可比的 CRM 真相。",
e:"<ul><li>拿 Meta 报表 vs Google 报表直接比 CPL 定预算：本模块头号禁区，根因是平台口径不可比。</li><li>发现重叠后干脆不信任何报表：虚无主义，根因是不懂「中立口径」的存在。</li><li>中立口径只有销量没有毛利：价值层缺失，根因是没接 CRM 金额。</li><li>从不建业务真相表：永远在平台数字里打转，根因是缺口径台账习惯（L6-13）。</li><li>把重叠当「某一渠道作弊」：其实是归因机制必然，根因是不懂多触点重叠原理。</li></ul>",
q:{q:"Meta 报 40、Google 报 25、CRM 实收 48。三组数字各该怎么用？",a:"① CRM 48＝业务真相，对上汇报与预算总盘用；② Meta 40 与 Google 25＝各自平台内的运营监控（相对趋势、组间比较），并注意两家合计 65 vs 48 的重叠率 35%；③ 重叠部分用增量证据分账：谁在种草（Creation）谁在收割（Capture）。三个数字三种用途，永不混比。推理：平台数字只管平台内，跨渠道决策只用 CRM＋增量实验。"},
b:"搭起你的周度业务真相表（花费/CRM 归源/重叠率三列），连续记录 4 周。"},
{id:"L9-04",lv:9,t:"跨渠道增量与预算分配",
g:"把预算分配从「报表比较」升级到「增量证据」：每挪一块钱的合规流程。",
c:"<p><b>跨渠道挪预算必须有「证据等级」。</b></p><ul><li><b>最高</b>：Geo/Holdout 增量实验（真随机对照，测增量）；</li><li><b>中等</b>：CRM 口径连续趋势＋业务逻辑；</li><li><b>最低</b>：平台报表 CPL（仅平台内用）。</li></ul><p><b>挪动纪律：</b>单次挪动 ≤20% 总预算、一次挪一个方向、4 周观察窗、预设回滚。</p><p><b>误区纠正：</b>按当月 CPL 追涨杀跌、砍渠道一刀切（不留底线）、挪动后不看时滞效应（3 个月后的萎缩无人归因）、从不做跨渠道实验（永远盲配）。</p><p><b>类比：</b>挪跨渠道预算像给不同器官的手术——切错一处，症状是「全身级」的，而且会滞后显现。必须有流程（麻醉、止血、观察窗），不能凭当月体温计（平台报表）情绪化开刀。</p>",
m:"<p><b>①②③ 机制链：</b></p><ul><li>① <b>为什么要有流程</b>：跨渠道挪预算的影响是「全漏斗级」的——砍 Creation 渠道会在 1–3 个月后表现为 Capture 渠道的流量萎缩（时滞掩盖因果）。</li><li>② <b>为什么情绪化挪动有害</b>：当月报表好看就加、难看就砍，追涨杀跌，被时滞骗。</li><li>③ <b>流程＝证据等级＋幅度＋观察窗＋底线</b>，把「情绪」变成「流程」。</li></ul><p><b>数字演算：</b>总预算 $50000，CFO 要求「向 Google 倾斜 30%」（即挪 $15000）。按纪律：单次挪动上限 20%＝$10000，且必须走证据。正确流程：先跑一个季度 Geo 实验（两区域分别 60/40 与 70/30）或至少 CRM 双轨追踪；若必须立即执行，限 $10000（20%）＋设 Meta 底线（不低于原 50%）＋预设 3 个月观察点（盯 Google 流量是否因 Meta 缩量而萎缩）。若 3 个月后 Google 品牌词同步跌，说明挪错了，回滚。</p>",
h:"<p><b>跨渠道预算流程检查单：</b></p><ul><li>① <b>年度节奏</b>：季度做一次增量实验（轮换渠道）。</li><li>② <b>月度</b>：CRM 口径再平衡（±10% 以内微调）。</li><li>③ <b>重大挪动（>20%）必须走实验证据</b>。</li><li>④ <b>每渠道设「不可回撤底线」</b>（渠道学习与资产需要连续性）。</li><li>⑤ <b>预设回滚条件</b>＋ 4 周观察窗。</li></ul>",
cs:"某工业设备 2026 预算演化（全凭证据留痕）：Q1 按报表 60/40（Meta/Google），内部质疑 Meta 效率；Q2 跑 Geo 实验，证实 Meta 增量被 Last Click 严重低估（停 Meta 区 Google 品牌词跌 40%）；Q3 据此调整为 70/30，并做品牌词防御重配（见 L9-02）；Q4 用 CRM 趋势确认稳定，固化配置。每一步都有实验/趋势证据，没有一次「凭当月 CPL 拍脑袋」。全年跨渠道 ROI 提升 12%，且 Creation 渠道（Meta）的隐性贡献首次被量化进报表。",
f:"论坛跨渠道讨论较少（多数投手单平台作战），但社区里「来时路」（COD 测品 → 收单 → 品牌站）的本质是渠道组合的生涯级再平衡——从高风险短线渠道逐步迁移到稳定品牌渠道。另有「巨量怎么玩 FB 就怎么玩」提示方法论可迁移而非预算可互抄。社区的经验是「渠道组合随阶段演化」，课程把它变成「有证据等级的挪动流程」——既承认演化，又用 Geo/CRM 证据约束演化不跑偏。",
e:"<ul><li>按当月 CPL 追涨杀跌：被时滞骗，根因是不懂 Creation/Capture 时滞。</li><li>砍渠道一刀切：不留底线，根因是不懂渠道学习资产需连续性。</li><li>挪动后不看时滞效应：3 个月后的萎缩无人归因，根因是缺观察窗。</li><li>从不做跨渠道实验：永远盲配，根因是嫌实验成本高。</li><li>单次挪动超 20%：冲击过大难回滚，根因是不懂小步原则。</li></ul>",
q:{q:"CFO 要求「下季度预算向 Google 倾斜 30%」（依据：Google CPL 更低）。你的应对流程？",a:"① 摆证据等级：CPL 是平台口径不可跨渠道比（L9-03）；② 给替代方案：先跑一个季度 Geo 实验（两区域分别调整配比）或至少 CRM 口径双轨追踪；③ 若必须立即执行：限 20% 幅度＋设 Meta 底线＋预设 3 个月观察点（盯 Google 流量是否因 Meta 缩量而萎缩）。把「情绪挪预算」变成「流程挪预算」。推理：分配看增量证据，不是平台 CPL。"},
b:"写出你的跨渠道挪预算流程（证据等级/幅度/观察窗/底线），并用它回应一次「向某渠道倾斜」的要求。"},
{id:"L9-05",lv:9,t:"多语言 / 多市场投放结构",
g:"设计多语言多市场的账户与素材结构：语言是比国界更重要的分组轴。",
c:"<p><b>结构第一原则：语言优先于国家。</b>同语言市场（如德/奥/瑞的德语）并组共享模型学习，信号集中、学习更快；而同国的多语言人群行为分布割裂，硬并反而学不动。</p><p><b>素材本地化 ≠ 翻译</b>：Hook、Proof、度量衡、案例都要本地化；落地页语言与广告语言严格一致（Message Match）。汇率/时区影响预算节奏与报表时点。2026 年 7 月 1 日起 Meta 正式向广告主转嫁<b>地区费用（Location Fees）</b>：英国 +2%、法国/意大利/西班牙 +3%、奥地利/土耳其 +5%；按<b>广告曝光投放地</b>计算（不是你的公司所在地），在账单上<b>另加</b>、不占 Campaign 预算——多市场预算核算必须把这些结构性成本差异算进边际 CPL。</p><p><b>误区纠正：</b>一个 Campaign 投全球（语言混乱模型学不动）、素材机器翻译直出（本地化失真伤转化）、落地页语言与广告对不上（Message Match 跨语言崩坏）、汇率风险不计入预算核算。</p><p><b>类比：</b>语言是「方言」——同方言的人沟通成本低、信号集中；硬把说不同方言的人塞进一个房间（一个 Campaign 投全球），谁的话都听不清，模型也学不会「这群人到底长啥样」。</p>",
m:"<p><b>①②③ 机制链：</b></p><ul><li>① <b>为什么语言优先</b>：语言决定「模型可学的共同性」——德/奥/瑞德语用户行为相似度高，合并＝信号集中（呼应 L2-03「什么时候合并」的跨市场答案，也呼应 L0-05 大样本学习更快）。</li><li>② <b>为什么同国多语言不能硬并</b>：行为分布割裂，合并反而碎片化、学不动。</li><li>③ <b>本地化深度决定转化</b>：翻译腔素材折损信任，本地 Proof（案例/认证）才建立可信度。</li></ul><p><b>数字演算：</b>某欧洲账户：德语区分三组独立投放（DE/AT/CH），每组周预算 $1000、各需 7 天×50 事件学习。合并为 DACH 一个 Campaign 后，信号集中，模型成熟速度比三组独立快约一倍（学习期从 ~3 周缩到 ~1.5 周），且 DACH 整体 CPL 比三组均值低 15%——因为样本量翻倍、模型学得更准。再叠加 2026 地区附加费：奥地利组边际 CPL 还要额外 +5%，核算时不能漏算。这 15% 就是「语言合并红利」，附加费是「结构成本差异」。</p>",
h:"<p><b>多语言结构检查单：</b></p><ul><li>① <b>分组</b>：主语言 Campaign 内按市场分 Ad Set（或先全并再按边际拆）。</li><li>② <b>素材本地化清单</b>：货币单位、认证标志（CE vs UL）、案例国家、电话/时区、文化敏感点。</li><li>③ <b>落地页 hreflang 与语言自动匹配</b>。</li><li>④ <b>多语素材生产管线</b>：一次拍摄多语配音/字幕，避免翻译腔。</li><li>⑤ <b>核算地区附加费</b>：英 +2% / 法意西 +3% / 奥土 +5%，计入各国边际 CPL。</li></ul>",
cs:"某工业设备欧洲账户结构（2025 年）：Campaign-EU（英语覆盖荷/北欧）、Campaign-DACH（德语合并德/奥/瑞）、Campaign-FR（法语，本地化最重，含法国案例与 CE 认证标注）。DACH 组把德语三国的信号集中，模型成熟速度比三组独立投放快一倍（学习期从 3 周缩到 1.5 周），且整体 CPL 低 15%。法国单独成 Campaign 是因为本地化深度要求最高（案例、度量衡、认证全本地）。2026 年核算时，奥地利组额外计入 +5% 地区附加费，使 DACH 内部边际 CPL 出现国别差，指导预算在德/奥/瑞间按「净边际」再分配。这套结构终结了早期「每个国家一个 Campaign」导致样本碎片化、各组都学不动的乱象。",
f:"论坛国际投玩家的语言经验印证：西班牙 COD 的本地化深耕、中文沟通能力决定东南亚内卷度——语言与市场选择深度绑定。社区公认「多语种素材生产是规模化瓶颈」，多数人用「翻译腔」素材硬投，质量折损大。课程的解法：一次拍摄多语配音/字幕的生产管线＋语言优先的分组轴，把社区的痛点变成可复用的结构原则。",
e:"<ul><li>一个 Campaign 投全球：语言混乱模型学不动，根因是不懂语言是分组轴。</li><li>素材机器翻译直出：本地化失真伤转化，根因是混淆「翻译」与「本地化」。</li><li>落地页语言与广告对不上：Message Match 跨语言崩坏，根因是缺 hreflang 匹配。</li><li>汇率风险不计入预算核算：报表时点错乱，根因是忽略多时区。</li><li>同国多语言硬并：行为割裂学不动，根因是不懂语言共同性原理。</li></ul>",
q:{q:"德/奥/瑞三国怎么投？并组还是分开？素材要不要三套？",a:"德语合并：Ad Set 层可先并（语言共同性高），用 Breakdown 分国家看数据；预算独立成熟后再按边际拆。素材一套德语底＋按国微调 Proof（案例用当地项目、认证标注当地标准）——三套完整素材成本高且信号分散。落地页 hreflang 三语自动匹配。推理：语言优先（L2-03），合并红利来自信号集中（L0-05）。"},
b:"画出你的多语言结构图（Campaign/Ad Set/素材语言矩阵），并标注哪些该合并、哪些该独立。"},
{id:"L9-06",lv:9,t:"渠道组合与回传现状（TikTok / Google × WhatsApp）",
g:"掌握 2026 年「消息类获客」在各渠道的回传能力地图，据此设计跨渠道的消息链路。",
c:"<p><b>2026 年「消息类获客」的回传能力地图：</b></p><ul><li><b>Meta C2W（Click to WhatsApp）</b>：对话归因自带 ctwa_clid，分流＋回传天然成立，能力最完整。</li><li><b>Google</b>：WhatsApp 转化可经「网站中间页＋转化跟踪」实现；深度对话回传需 WABA（WhatsApp Business API）webhook 授权类工具。</li><li><b>TikTok</b>：CTWA 广告可用，但「对话开始」深度回传无干净现成方案（CAPI 事件可传会话级信号，或接受仅点击归因＋手动上传）。</li></ul><p><b>关键卡点：</b>深度信号（是否开口/对话质量）只存在于 WhatsApp 侧，任何工具要回传它必须先收到该号码的 webhook——所以「客户授权 WABA」是绕不开的一步。</p><p><b>误区纠正：</b>以为所有渠道的 WhatsApp 转化都能像 Meta 一样自动归因（Google/TikTok 不行）、一个路由层打通三渠道却没按渠道打 UTM（归源失效）、让所有客户的号进同一个 BM 承接多渠道流量（连坐风险加倍）。</p><p><b>类比：</b>三个渠道像三条河，Meta 河自带水表（ctwa_clid）能精确计量；Google 河要你自己在岸边装个中转站（中间页）才能接水表；TikTok 河只有个粗略的「有人来过」标记。你要做的，是在三河汇入口建一个带渠道标签的路由层，把每条河的水分别计量。</p>",
m:"<p><b>①②③ 机制链（呼应 L0-03/04 数据通道）：</b></p><ul><li>① <b>回传可行性取决于「有没有 webhook 收到 WhatsApp 侧信号」</b>：Meta 自带；Google/TikTok 需自建中间层。</li><li>② <b>客户授权 WABA 是绕不开的一步</b>：≈ 转化宝要企微授权的镜像——不授权就收不到对话级信号。</li><li>③ <b>统一路由层＋按渠道 UTM 分流</b>：把三渠道的对话都归到自有 CRM 口径，绕开平台回传短板。</li></ul><p><b>数字演算：</b>某项目三渠道周花费：Meta $3000、Google $1200、TikTok $800。若只看平台报表：Meta 报 90 对话、Google 报 30、TikTok 报 0（仅点击）。但路由层按 UTM 统计发现：TikTok 实际带来 22 个对话、开口率 12%（远低于 Meta 的 35%）。若盲信平台报表，会误判 TikTok 为零价值而砍掉——实际它有 22 个真实对话。自建口径补齐了平台回传的盲区。</p>",
h:"<p><b>跨渠道消息获客配置检查单：</b></p><ul><li>① <b>Meta 主力</b>：C2W 归因全开（ctwa_clid 自然回传）。</li><li>② <b>Google</b>：用中间落地页承接点击＋转化代码，量级小可手动上传对话转化。</li><li>③ <b>TikTok</b>：接受点击级归因起步，量起后评估 webhook 授权方案。</li><li>④ <b>所有渠道统一「分流链接」进路由层</b>（按渠道 UTM 分流统计）。</li><li>⑤ <b>客户号隔离</b>：不同渠道/业务用独立 BM 或 WABA 承接，防连坐。</li></ul>",
cs:"某入境游项目 2026 年三渠道消息获客现状：Meta C2W 全量跑（分流链接轮询到各导游号，ctwa_clid 自动归源）；Google 以落地页＋表单为主、WhatsApp 为辅（中间页承接点击，量级小手动上传对话转化）；TikTok 只做曝光测水温与点击成本（CTWA 可用但深度回传未接，先看点击与开口率）。按回传能力分配渠道角色：Meta 扛主力对话、Google 补搜索意图流量、TikTok 做轻量种草。路由层统一打 UTM，三渠道对话全进 CRM 归源，避免「平台说 TikTok 为零」的误判。",
f:"论坛对 WhatsApp 链路的讨论集中在「获客质量」——社区公认 WhatsApp 对话的意向远高于表单留资。但跨渠道回传工程几乎空白：很少有人讲「怎么把 TikTok/Google 的 WhatsApp 对话归源到自有 CRM」。这正是当前社区认知的前沿空白带，也是实操竞争的差异化机会点——谁能自建路由层＋UTM 分流，谁就能在三渠道里看清每条河的水量。",
e:"<ul><li>以为所有渠道 WhatsApp 转化都像 Meta 自动归因：Google/TikTok 不行，根因是不懂 webhook 卡点。</li><li>路由层打通三渠道却没按渠道打 UTM：归源失效，根因是缺渠道标签。</li><li>所有客户号进同一 BM 承接多渠道：连坐风险加倍，根因是没做资产隔离。</li><li>只看平台报表判 TikTok 价值：深度回传缺失致误判为零，根因是不懂自建口径。</li><li>不做客户授权 WABA：收不到对话级信号，根因是不懂授权是前提。</li></ul>",
q:{q:"TikTok 的 WhatsApp 询盘效果报表只能看到点击，怎么评估它值不值得继续？",a:"用业务真相口径补齐：路由层按 UTM/渠道参数分流统计「TikTok 来源的对话数与开口率」，再由 CRM 归源成交。这样点击→对话→成交的链路自建完成，不依赖平台回传。若开口率与成交率达标→继续；若只有点击没对话→停。渠道评估永远可以下沉到自有数据。推理：平台回传缺失 ≠ 渠道无价值，用自建口径补齐。"},
b:"画出三渠道×消息链路的能力矩阵，标出你的回传补齐方案（哪些靠平台、哪些靠自建路由层＋UTM）。"}
);

</script>
<script>
/* ===== 数据文件 8：Level 8 B2B 高客单增长（10 个） + Level 10 操盘手决策系统（6 个） ===== */
MODULES.push(
{id:"L8-01",lv:8,t:"B2B 买家旅程与 Buying Stage 映射",
g:"把 B2B 的长旅程切成分明阶段，让广告对每个阶段说对的话、定对的目标。",
c:"<p><b>先说一个真相：B2B 不存在「点一下就买」。</b>一个工业买家从「第一次刷到你的广告」到「签下几十万的设备合同」，中间往往隔着几个月、一圈采购流程、两三个决策者。这期间他的心理状态、关心的问题、能接受的 Offer 完全不同。如果你用同一句广告词、同一个落地页去打所有状态的人，结果就是「谁都不满意，转化谁都差」。</p><p><b>Buying Stage（购买阶段）参考模型</b>把这条长路切成五段：</p><ul><li><b>unaware（无意识）</b>：根本不知道自己有这个问题，例如「半夜污水池某工业设备停了才意识到有这设备」——还停留在被「现象」困扰，没到「找方案」阶段。</li><li><b>problem aware（意识到问题）</b>：知道有问题了，但不清楚怎么解决，例如「搅拌不均导致沉淀、出水不达标」。</li><li><b>solution aware（知道有解）</b>：知道市场上有这类设备能解决，开始看「哪种技术路线」。</li><li><b>vendor comparison（比价/选型）</b>：已圈定 2–3 家供应商，做技术对比、要方案、比参数。</li><li><b>decision（决策/流程）</b>：内部走预算、走招标、走合规，只差临门一脚。</li></ul><p><b>常见误区纠正：</b>很多人把 B2B 当电商投，以为「表单提交」就是 funnel 终点——错。表单提交在 B2B 里往往只是 problem aware 人群的一次「要资料」动作，离成交还差四步。另一个误区是「把比价党当垃圾」——其实人家正处在 comparison 阶段，只是还没轮到 decision 阶段的转化内容，培育到位照样能成。</p><p><b>类比：</b>B2B 的购买阶段就像医院分诊台——急诊、门诊、体检的人进同一扇门，但你不能给体检的人开手术同意书、给急诊的人发养生手册。广告也要「分诊」：不同阶段给不同内容。</p>",
m:"<p><b>为什么必须分阶段，用机制链讲透：</b></p><ul><li>① <b>同一关键词背后是不同阶段的混血人群。</b>「某工业设备」这个词，搜它的人可能是写论文的学生（unaware，顺手搜），也可能是采购在比价（decision）。他们的素材响应率、Offer 接受度、Qualified 概率天差地别。</li><li>② <b>素材与受众的阶段错配 = Qualified Rate 崩盘的第一原因。</b>用「震撼设备画面」打 problem aware 人群，吸引来的是猎奇流量；用「选型白皮书」打 unaware 人群，人家压根没意识到问题，直接划走。</li><li>③ <b>分阶段后，每个阶段有专属的「受众×素材×Offer」三件套</b>，模型学到的信号更纯净，Qualified 率与后续成交率同步提升。</li></ul><p><b>数字演算：</b>某某工业设备账户三段素材同跑——Broad+「深夜爆停」Hook 打 problem aware（CPL $40，Qualified 率仅 18%）；LAL+「47 国案例对比表」打 comparison（CPL $55，Qualified 率 42%）；RT+「免费选型方案」打 decision（CPL $120，Qualified 率 71%）。三个 CPL 差 3 倍，但都「健康」——因为它们服务不同阶段。若强行用统一 CPL 门槛砍掉 $120 那组，等于把最接近成交的人赶走。</p><p><b>与 L0 呼应：</b>阶段映射本质是在给「目标三连」（L0-02 的 Objective/Location/Event）做前置拆分；而「不同阶段的事件」又直接对接 L0-03 的事件语义与 L0-05 的学习期——comparison 阶段的事件量天然比 decision 多，模型学习节奏不同，扩量时要用边际视角（L0-08）。</p>",
h:"<p><b>阶段拆分与投放落地 checklist：</b></p><ul><li>① <b>用 Broad + 专业素材打 problem/solution aware</b>：钩子用「现象级痛点」（如「出水不达标？可能是搅拌不均」），承接落地页给科普，不急着收方案。</li><li>② <b>用案例/对比型素材 + LAL/RT 打 comparison 阶段</b>：给「47 国案例对比表」「参数横评」，承接页放选型工具。</li><li>③ <b>用重 Offer（方案/评估）收 decision 阶段</b>：RT 再营销 + 「免费选型方案」钩子，CPL 高但有道理，用边际成本（L0-08）而非平均 CPL 评估。</li><li>④ <b>CRM 给每个 Lead 打阶段标签（字段 buying_stage）</b>，反哺「哪个素材在哪个阶段有效」，每月输出《阶段×素材转化矩阵》。</li><li>⑤ 设定阶段间「培育流」：problem aware 人群进邮件序列，不计入 Qualified 但计培育池规模，作为漏斗顶层供给。</li></ul>",
cs:"某工业设备阶段素材矩阵实测：Broad+「深夜爆停」Hook（problem aware）拿量最大、CPL $40；LAL+「47 国案例对比表」（comparison）CPL $55、Qualified 率 42%；RT+「免费选型方案」（decision）CPL $120、Qualified 率 71%。三段各自有效 CPL 差 3 倍但都在健康区间，因服务不同阶段。上线第 2 个月，通过 CRM 阶段标签发现 comparison→decision 的转化率从 12% 提升到 28%，靠的是把「比价党」纳入培育流而非直接丢弃——而非靠砍高 CPL 组。",
f:"论坛电商没有显性旅程（冲动购买为主），但「不同预算层级撞人群」的讨论、以及「锅（现有帖子）」资产复用的思路，暗含阶段思想——已教育过的人群更易转化。B2B 语境下「先 Messenger/Email 建信任再电话」就是阶段推进的执行版：先轻触达建立认知，再深度沟通推进决策。论坛的素材分级（强素材收割、弱素材拓新）也与阶段分层同构。",
e:"<ul><li>全漏斗一套素材一套 Offer——unaware 与 decision 人群混打，Qualified 率被早期人群稀释。</li><li>把 comparison 阶段的比价党当垃圾——他们只是还没轮到 decision 内容，培育到位能转化。</li><li>CRM 不打阶段标签——整条旅程数据丢失，无法反哺素材优化。</li><li>用统一 CPL 门槛砍高 CPL 的 decision 阶段组——等于把最接近成交的人赶走。</li><li>把「表单提交」当成终点——忽略后面四步，后续承接与回传全都缺失。</li></ul>",
q:{q:"表单询盘里 40% 是「要产品目录 PDF」的早期人群。他们该被淘汰吗？",a:"不该，他们是 problem/solution aware 的正常供给。推理步骤：① 先判定这批人的阶段＝problem/solution aware，目的不是马上成交而是要资料，符合阶段模型预期；② 配置「培育流」（邮件序列 + RT 教育内容）把他们推进到 comparison 阶段，而非丢弃；③ CRM 打「早期」标签，不计入 Qualified 但计入培育池规模，作为漏斗顶层供给；④ 反向检查：是不是你的 CTA 太轻（见 L3-06 CTA 光谱）吸引了过多早期人群——若是，微调 CTA 平衡阶段构成。结论：分层经营而非一刀切。"},
b:"写出你业务的五阶段定义，并为每阶段配齐「受众×素材×Offer」三件套，落地到 CRM 的阶段标签字段。"},
{id:"L8-02",lv:8,t:"EPC / 经销商 / 市政 / 工业客群差异",
g:"区分四大 B2B 客群的决策逻辑差异，避免「一套打法打所有人」。",
c:"<p><b>B2B 里最贵的浪费，是「一套素材、一套 Offer、一个 Qualified 定义」打所有客群。</b>不同客群的决策逻辑、触发点、成交周期完全不同，硬凑一起的结果是「平均化的平庸」——谁都不觉得说的是自己，转化全面塌方。</p><p><b>四客群画像：</b></p><ul><li><b>EPC 总包（工程总包方）</b>：项目制、风险敏感、决策快但标准严、看交期与背书。一个标段输了就输一整年，所以他们最在意「你有没有同类项目业绩」。</li><li><b>经销商/贸易商</b>：毛利敏感、复购型、看价格支持与独家性。他们不买来用，是买来卖，决策核心是「这货好不好走量、利润够不够」。</li><li><b>市政/公用</b>：招投标制、周期以年计、看资质与合规。几乎不因广告直接成交，广告的作用是「进入供应商名录」，成交靠的是资质与关系。</li><li><b>工业企业终端</b>：痛点驱动、技术导向、看总拥有成本 TCO。他们用十年，所以关心的是「全生命周期成本」而非「采购价」。</li></ul><p><b>常见误区纠正：</b>以为「经销商比价询盘多 = 垃圾」——人家就是这个客群的行为方式，不是垃圾是客户；以为「市政客户按周评估」——人家周期以年计，按周判死刑是周期错配；以为「四群共用一个 Qualified 定义」——四群成交逻辑不同，必须用分档定义。</p><p><b>类比：</b>四大客群像四种「食材」，同一个菜谱做出来四种人都嫌难吃。B2B 投放的功夫，在于给每种食材配对的做法。</p>",
m:"<p><b>客群差异如何决定一切，机制链：</b></p><ul><li>① <b>客群差异决定素材语言</b>：EPC 说「项目风险 + 案例背书」，经销商说「价格政策 + 独家支持」，市政说「资质业绩 + 合规」，工厂说「TCO 与技术参数」——一句广告词四群通吃，等于四群都不通吃。</li><li>② <b>客群差异决定 Offer 形态与 Qualified 定义</b>：EPC 的 Offer 是「定制方案 + 项目评估」，市政的 Offer 是「资质包 + 入围申请」，两者的 Qualified 判定字段完全不同。</li><li>③ <b>客群差异决定成交周期预期</b>：市政询盘给 18 个月评分周期，经销商可能 2 周复购——用同一把尺子量，必有一边失真。</li></ul><p><b>数字演算（Lead Quality 视角）：</b>设某账户四类询盘各 100 条，历史成交率 EPC 12%、经销商 5%、市政 2%、工厂 8%，单笔毛利 EPC $9000、经销商 $1200、工厂 $6000、市政 $15000。加权单询盘期望毛利＝100×(0.12×9000+0.05×1200+0.08×6000+0.02×15000)/4 折算到每类各 100 即 EPC $1080、经销商 $60、工厂 $480、市政 $300——可见「经销商询盘多但单条价值低」，靠走量，不能用 EPC 的 Qualified 标准去卡经销商。这就是 L8-04 分群 Qualified 的工程依据。</p><p><b>与 L0 呼应：</b>客群差异是「目标三连」（L0-02）里 Location/Event 选择的前置；不同客群的转化位置（网站/表单/WS）不同，直接落地到 L8-09 的链路决策。</p>",
h:"<p><b>四大客群经营 checklist：</b></p><ul><li>① <b>CRM 按客群分组统计历史成交画像</b>（字段 client_type：EPC/经销商/市政/工厂），跑出各群成交率与单笔毛利。</li><li>② <b>按群做素材假设</b>（见 L1-03）：每群至少 1 套专属 Hook + 1 套专属落地页，禁止四群共用一页。</li><li>③ <b>投放分层</b>：Broad 素材用「跨群最大公约数」（泛痛点），分群精细化靠 LAL/RT 与落地页分区承接。</li><li>④ <b>Qualified 标准按客群分档</b>：市政询盘给 18 个月评分周期，EPC 看项目节点，经销商看首单量门槛。</li><li>⑤ 每群独立核算 ROI/毛利贡献，避免「经销商询盘多 = 该扩」的直觉误判。</li></ul>",
cs:"某工业设备客群数据：EPC 占成交 55% 但只占询盘 30%——EPC 看广告少、被触达后走内部流程，广告的任务是「让他们记住你」而非「马上表单」。对策：EPC 专属素材（项目风险 + 案例背书）+ 决策者 LAL。经销商询盘占 45% 但单笔小，设「价格支持」专属落地页承接，单独核算其走量毛利贡献。市政询盘 0 直接成交但 18 个月后 2 单中标，靠的是资质包入围。上线分群经营后，整体有效 CPL 降 19%，因停止了「用 EPC 标准误杀经销商」的内部损耗。",
f:"论坛的同构经验是「品类即人群」：客单 $50–70 的打法参数、COD 的区域玩法、游戏类的数据分层——每类客户有完全不同的「打法参数表」。B2B 客群差异只会更大：论坛里「一类货一种打法」的朴素认知，在 B2B 放大成「一类客群一种完整经营体系」。分群经营是论坛「分结构测品」思维在 B2B 的工程化升级。",
e:"<ul><li>把经销商比价询盘当垃圾——人家就是这个客群的行为方式，应分流而非丢弃。</li><li>市政客户用电商转化周期评估——年为单位却按周判死刑，周期错配。</li><li>四群共用一个 Qualified 定义——四群成交逻辑不同，必有一边失真。</li><li>四群共用一套素材与落地页——谁都觉得说的不是自己，转化塌方。</li><li>按「询盘量」而非「期望毛利」分配预算——经销商量大却价值低，EPC 量少却价值高，预算倒挂。</li></ul>",
q:{q:"经销商询盘占比 45% 但成交毛利低。要不要在素材里「劝退」他们？",a:"分两层推理：① 不劝退但分流——经销商有自己的价值（走量、区域覆盖、现金回款快），给专属落地页与价格政策承接，单独核算其毛利贡献，看的是「总量×低毛利」是否划算；② 若纯比价无粘性→用 Offer 筛选（要求公司资质 / 首单量门槛），让轻询盘自我过滤。核心是「分群经营」而非「一刀切丢弃」——劝退会同时赶走有潜力的区域代理。落到 L8-04 的分档 Qualified：经销商的 Qualified 字段应是「有区域 + 有首单意向」，而不是 EPC 的「有项目节点」。"},
b:"完成四大客群的历史成交画像表（成交率/单笔毛利/周期）与各自的素材/Offer 假设。"},
{id:"L8-03",lv:8,t:"长销售周期的信号设计",
g:"为「以月计」的决策周期设计信号体系：哪些事件值得回传、何时回传、如何避免延迟陷阱。",
c:"<p><b>B2B 最反直觉的地方：你今天看到的成交，是半年前那批询盘的果实。</b>如果你用「投放日」的数据去评估「投放日」的表现，你看到的永远是假象——因为今天的 Deal 和今天的广告毫无关系。这就是长周期带来的「延迟陷阱」。</p><p><b>B2B 信号层级与延迟：</b></p><ul><li><b>Lead（即时）</b>：表单/对话提交，发生即回传。</li><li><b>Qualified Confirmed（3–10 天）</b>：销售确认意向，需等待销售跟进后判定。</li><li><b>Opportunity（2–6 周）</b>：进入正式商机阶段，有明确需求与预算。</li><li><b>Deal（1–12 个月）</b>：签约成交，金额与周期高度离散。</li></ul><p><b>设计原则：</b>优化靶心用「量质平衡点」（常为 Qualified，见 L5-01）；价值信号全链路回传但分层计权；所有评估用 Cohort（同期群，见 L6-09）——把「3 月来的询盘」和「6 月来的询盘」分开看，而不是混在日级报表里。</p><p><b>常见误区纠正：</b>「按周关停不出单的 B2B 组」是经典自杀——延迟陷阱下 DeAL 数据还没成熟；「所有信号即时回传」会污染模型（销售误判的 Lead 也回传了）；「Deal 金额精确回传」既有合规风险又易失真，应分档。</p><p><b>类比：</b>长周期信号设计像种树——你春天播种（投广告），秋天才结果（成交）。如果你夏天就因为「没看到果子」把树砍了，永远吃不到果。Cohort 报表就是「按播种批次记录生长」的农事日志。</p>",
m:"<p><b>长周期的最大陷阱 = 用投放日数据评估投放，机制链：</b></p><ul><li>① <b>今天的 Deal 是 6 个月前的询盘</b>：日级报表把「今天的成交」归功于「今天的广告」，但两者毫无因果，报表与业务现实完全脱钩。</li><li>② <b>因此优化靶心不能选最延迟的 Deal</b>：选 Qualified（3–10 天延迟，量质平衡）做模型靶心，价值信号（Opportunity/Deal）全链路回传但分层计权，做价值观引导而非日常优化。</li><li>③ <b>信号设计的本质 = 在延迟中重建「可读性」</b>：靠 Cohort（见 L6-09）把不同播种批次分开，靠分层回传让模型既学「量」又学「质」。</li></ul><p><b>数字演算（延迟陷阱的成本）：</b>某组 1 月投 $3000 得 90 Lead，按「近 30 天 ROAS 关停法」在 2 月初（6 周时 0 Deal）被关停。实际这批 Lead 在 4–7 月陆续成交 11 单、毛利 $99000——因为被 premature 关停，损失了整批 LTV。若改用 Cohort：1 月批次单独追踪，6 周看的是「Qualified Rate 是否达标（中期信号）」而非 Deal。这正呼应 L0-07 的归因失真与 B2B 长周期。</p><p><b>与 L0 呼应：</b>延迟陷阱与 L0-07 的归因窗口、增量实验同源；Cohort 评估就是 L0-07 里「B2B 长周期用同期群看」的落地；优化靶心选择呼应 L0-02 事件三连。</p>",
h:"<p><b>信号体系搭建 checklist：</b></p><ul><li>① <b>固化各阶段事件定义与时间点</b>（状态机：Lead→Qualified→Opportunity→Deal），写进《信号 SOP》一页纸。</li><li>② <b>Qualified Confirmed 延迟 48h 确认后回传</b>：防止销售误判污染模型（MSG 368：错误 CRM 数据比不回传更危险）。</li><li>③ <b>Opportunity/Deal 按月批量回传价值</b>：Deal 金额分档回传（如小单/中单/项目单），不回传精确金额。</li><li>④ <b>内部报表全部 Cohort 化</b>：按询盘月份分桶，看「X 月批次在 N 月后的成交」。</li><li>⑤ <b>对管理层预期话术</b>：「本季度广告的效果，在下季度报表里成熟」——把延迟写进沟通。</li></ul>",
cs:"某工业设备信号日历：Lead 即时回传 / Qualified +48h 回传 / Opportunity 月批 / Deal 月批带金额分档。销售与市场共同确认的《信号 SOP》一页纸规定了「销售在 48 小时内完成 Qualified 判定，超时不判自动降级为培育」。执行两年零口径事故。最关键的收益：2024 年 Q1 新组跑了 6 周 0 Deal，但 Cohort 显示 Qualified Rate 达标，管理层按 SOP 没有 premature 关停，Q3 该组贡献了当季 23% 的成交毛利。",
f:"论坛没有长周期信号实践（电商 T+7 内闭环），但「表单转电话易风控、先建信任再电话」已经是在为延迟做流程设计。最典型的反面教材是「近 30 天 ROAS 关停法」——若硬套 B2B，会把所有好组杀光，这是周期错配的典型。论坛的「养像素」链路（小预算慢慢攒事件）本质也是在对抗「数据没成熟就下结论」的冲动。",
e:"<ul><li>按周关停「不出单」的 B2B 组——延迟陷阱下 Deal 数据未成熟，premature 关停损失整批 LTV。</li><li>所有信号即时回传——销售误判的 Lead 污染模型，MSG 368 明确错误 CRM 数据比不回传更危险。</li><li>Deal 金额精确回传——既涉敏感又有失真风险，应分档回传。</li><li>销售与市场两套信号口径——同一批人两个定义，报表对不上。</li><li>用日级报表评估 B2B 组——今天的成交是半年前的询盘，报表与业务现实脱钩。</li></ul>",
q:{q:"新组跑了 6 周有 90 个 Lead 但 0 Deal（历史平均成交周期 4 个月）。判断与动作？",a:"推理步骤：① 先确认周期：历史平均 4 个月，6 周 < 4 个月，Deal 数据尚不可用，不能据此判死刑；② 看两个可读的中期信号——Qualified Rate 是否达标（3–10 天延迟，现已可读）、Opportunity 是否产出（2–6 周延迟，部分可读）；③ 若 Qualified Rate 达标→继续投并按 Cohort 等成熟，把该组计入「X 月批次」追踪；④ 若不达标→回 L6-03 根因树查质量层（是 Lead 质量问题还是承接问题）；⑤ B2B 严禁用 Deal 缺失直接判组死刑。这正是 L0-07 长周期归因失真的实战版。"},
b:"画出你业务的信号日历（事件/定义/回传时点/评估周期），并写一句给管理层的「延迟预期」话术。"},
{id:"L8-04",lv:8,t:"Qualified 标准定义与销售对齐",
g:"与销售共建「可执行、可回传、可稳定判定」的 Qualified 定义——质量体系的基石。",
c:"<p><b>Qualified 定义是 B2B 投放的「宪法」。</b>优化靶心（L5-01）、价值回传（L5-04）、所有质量报表都建立在这条定义上。定义一旦漂移，整个数据体系的地基就跟着漂移——「错的标准比没标准更危险」（MSG 364：错误的 CRM 数据比不回传更危险）。</p><p><b>Qualified 定义四要件：</b></p><ul><li><b>① 客观可判</b>：有数据字段支撑，不是「感觉靠谱」。例如「工况参数齐全」可查，而「意向强烈」不可查。</li><li><b>② 与成交强相关</b>：历史数据验证过，Qualified 的 Deal 率显著高于非 Q。</li><li><b>③ 销售认账</b>：定义由销售参与共创，否则执行会变形（销售阳奉阴违）。</li><li><b>④ 口径稳定</b>：变更需走版本管理（见 L6-13），不能今天一个样明天一个样。</li></ul><p><b>常见误区纠正：</b>「Qualified = 销售个人感觉」——不可回传、不可复现，模型学不到；「定义一年三变」——模型与报表全废；「市场单方面定义」——销售不认，执行变形；「定义从不与成交数据对验证」——可能定义错了半年都没人发现。</p><p><b>类比：</b>Qualified 定义像工厂的「质检标准」。如果质检员凭心情放货，下游永远不知道哪批是好的；只有「卡尺量到 0.1mm 才算合格」这种客观标准，整条产线才能稳定。</p>",
m:"<p><b>为什么这是 B2B 投放的命门，机制链：</b></p><ul><li>① <b>优化靶心（L5-01）依赖 Qualified</b>：你让模型学「找 Qualified 的人」，前提是 Qualified 定义清晰可回传，否则模型学的是一团模糊。</li><li>② <b>价值回传（L5-04）依赖 Qualified</b>：Deal 的价值要归因到「哪些 Qualified 带来的」，定义漂移则归因全错。</li><li>③ <b>所有质量报表依赖 Qualified</b>：Qualified Rate 是诊断第一指标，定义变则历史数据不可比。</li></ul><p><b>Lead Quality 数字演算（给管理层的说服力）：</b>设某月 200 Lead，按 v3 定义判定 60 个 Qualified，历史显示 Qualified 的成交率 25%、非 Q 成交率 3%。若销售用「能打通电话就算 Q」（旧口径）把 120 个都算 Q，则报表显示「Q 成交率」= (60×0.25+60×0.03)/120 ≈ 14%，而真实可优化靶心信号被稀释——模型收到「120 个 Q」的误导样本，学到的「优质人群」其实是含 50% 噪声的混合体。这就是为什么定义漂移 = 地基漂移：你喂给模型的「好样本」里有一半是坏的。</p><p><b>与 L0 呼应：</b>Qualified 判定字段就是 L0-03 的 Event Parameters/User Info 的具体化；定义稳定呼应 L0-05 学习期（靶心漂移会重置模型学到的分布）。</p>",
h:"<p><b>共建流程 checklist（带数字）：</b></p><ul><li>① <b>拉历史 50+ 成交做特征分析</b>：找出哪些字段与成交强相关（如工况齐全、预算权限、12 月内项目）。</li><li>② <b>草拟定义</b>：例「工况参数齐全（流量/扬程/介质）+ 项目主体明确 + 12 个月内采购计划」。</li><li>③ <b>销售共创会修订</b>：加入实操判据（如「已拿到技术规格书」）。</li><li>④ <b>试运行 1 个月双盲验证</b>：销售人工判定 vs 定义判定，算一致率，目标 ≥80%。</li><li>⑤ <b>固化 + 季度回顾</b>：版本号管理（v1/v2/v3），变更走审批，旧版本归档可回溯。</li></ul>",
cs:"某工业设备 Qualified 定义 v3：工况参数齐全（流量/扬程/介质）+ 项目主体明确 + 12 个月内采购计划。v1 的「销售点头就算」导致判定漂移 30%（同一批人不同销售判不同结果）；v3 后销售与模型对同一批人的判断一致率 87%。最关键的改进：把「工况参数齐全」做成表单必填字段 + CRM 自动校验，使 Qualified 判定从「人脑感觉」变成「系统可算」，模型回传的 Qualified 事件从此干净。上线 v3 后，优化 Qualified 的组比优化 Lead 的组，有效 Qualified 成本降 34%。",
f:"论坛的同构问题 = 「什么是有效询盘」：机器人占比阈值（10% 可接受、>30% 重投）、垃圾询盘治理——社区用「过滤」解决问题，B2B 用「定义工程」解决问题，后者更根本。论坛反复出现的「垃圾询盘淹没销售」抱怨，本质是 Qualified 定义缺失的社区实录；课程把它升级为可回传、可版本化、可双盲验证的工程体系。",
e:"<ul><li>Qualified = 销售个人感觉——不可回传、不可复现，模型学不到。</li><li>定义一年三变——模型与报表全废，历史数据不可比。</li><li>市场单方面定义——销售阳奉阴违，执行变形。</li><li>定义从不与成交数据对验证——可能定义错了半年都没人发现。</li><li>判定无系统字段支撑——靠人脑填，漂移 30% 也无从发现。</li></ul>",
q:{q:"销售主张「能打通电话就算 Qualified」，数据团队主张「必须工况齐全」。怎么收敛？",a:"用数据裁决 + 业务折中，推理步骤：① 回溯 6 个月成交客户，检验「电话通」与「工况齐」各自对成交的预测力（相关性与覆盖率）；② 若「电话通」覆盖广但预测弱、「工况齐」预测强但覆盖窄→定义用「工况齐为主、电话通为辅」的分层（A 级/B 级 Qualified），A 级优先分配销售；③ 共同签署版本化定义（v3），写清每级的判定字段；④ 试运行双盲验证一致率，季度回顾。争议的解药永远是历史数据，不是嗓门。"},
b:"产出你业务的 Qualified 定义文档（四要件齐全 + 销售签署 + 版本号）。"},
{id:"L8-05",lv:8,t:"Sales Capacity（销售承接力）",
g:"量化销售承接力并接入投放决策：让「喂多少线索」由两边的数据共同决定。",
c:"<p><b>市场与销售是同一个转化系统的两端。</b>广告负责把「成交的概率」买出来，销售负责把「概率」兑现成合同。任何一端超载，整体 ROI 会以非线性方式恶化——这不是「少投点」的直觉问题，而是系统约束。</p><p><b>承接力四参数：</b></p><ul><li><b>人均可跟进线索数/周</b>：按深度跟进时长算（一条有效线索深度跟进项约 30–45 分钟）。</li><li><b>响应时效 SLA</b>：从 Lead 分配到首次响应的目标时长。</li><li><b>阶段转化率</b>：Lead→Q→O→Deal 各环节的历史通过率。</li><li><b>线索分级路由规则</b>：哪些即时给销售、哪些进培育池。</li></ul><p><b>承接力不足的连锁反应：</b>响应慢→转化率降→模型收到「负反馈」信号（回了没下文，Meta 判定这批人质量差）→更难优化→市场被迫加预算补量→销售更超载。这是典型的「死亡螺旋」。</p><p><b>常见误区纠正：</b>「投放团队不知道销售容量」各投各的；「响应 SLA 无监控」线索冷掉无人知；「轻重线索无路由」Qualified 被淹没在噪音里；「容量数据一年不更新」——人招了、流程变了，容量早不是去年的数。</p><p><b>类比：</b>销售承接力像餐厅厨房的出餐能力。你在外面发传单拉来一百桌客人，厨房一小时只能出十桌菜——剩下的九十桌等到菜凉了走人，还给你差评。广告就是发传单的，不关心厨房容量就会饿死口碑。</p>",
m:"<p><b>为什么超载 20% 的损失远超 20%，机制链：</b></p><ul><li>① <b>市场把概率买出来，销售把概率兑现</b>：两端是串联系统，串联系统的整体效率由短板决定，不是平均。</li><li>② <b>超载→响应慢→转化率非线性下降</b>：一条线索 1 小时响应成交率 30%，24 小时响应掉到 8%——不是线性，是断崖。</li><li>③ <b>转化降→模型收负反馈→更难优化</b>：Meta 看到「这些 Lead 没下文」就降权，市场被迫加预算，进一步超载，死亡螺旋。</li></ul><p><b>数字演算（容量工程）：</b>3 名销售 × 人均 20 条深度线索/周 = 60 条/周承接容量。若某周 Qualified 预报 75 条，超出 15 条（25%）。若硬喂：响应时效从 4h 拖到 20h，成交率按非线性假设从 22% 掉到 14%，实际成交 = 75×14% = 10.5 单；若只喂 60 条并分流 15 条进培育池，成交 = 60×22% = 13.2 单——少喂反而多成交。这就是「投放受承接约束，不是谈判题」的数学证明。</p><p><b>与 L0 呼应：</b>承接力约束直接决定 L0-05 的扩量节奏（边际 CPL 见 L0-08）；分级路由呼应 L8-01 的阶段分流。</p>",
h:"<p><b>承接力接入投放 checklist（带数字）：</b></p><ul><li>① <b>测参数</b>：销售时间日志记录一周，算出人均深度跟进上限（例 20 条/周）。</li><li>② <b>算容量</b>：人均上限 × 人数 = 周承接量（例 60 条/周），季度更新。</li><li>③ <b>路由规则</b>：Qualified 即时分配 + SLA 4h 首响；轻线索（早期/培育）走邮件 + RT，不占销售时间。</li><li>④ <b>投放联动</b>：Lead 放量计划报销售确认余量（见 L7-08 的 80% 原则：周预报不超容量的 80%，留 20% 缓冲）。</li><li>⑤ 触发预案：预报超 80% 容量→表单加严 + 培育池分流，而非硬喂。</li></ul>",
cs:"某工业设备承接联动表：3 销售 × 20 条深度线索/周 = 60 条/周容量。当周 Qualified 预报 75 条→触发「表单加严 + 培育池分流」预案，把 15 条轻询盘导进 RT 培育而非压给销售。上线后响应时效稳定 <6h（之前峰值 28h），成交率回升 22%。更关键的是打破了死亡螺旋：模型不再收到「回了没下文」的负信号，优化 Qualified 的组 CPL 持续走低。季度复盘把容量从 60 提到 75（招 1 人 + 上线选型自助工具分流轻线索），再放开投放闸门。",
f:"论坛对应：表单 3 题设计的部分动机就是「销售承接有限，宁缺毋滥」；垃圾询盘淹没销售的抱怨 = 承接力崩坏的社区实录。社区靠「少投点」碰运气，课程靠「容量工程」——把模糊的「销售忙不过来」变成可计算的 60 条/周容量与 80% 放闸线，让市场与销售用同一把尺子对话。",
e:"<ul><li>投放团队不知道销售容量——各投各的，漏斗中段断流。</li><li>响应 SLA 无监控——线索冷掉无人知，转化悄悄流失。</li><li>轻重线索无路由——Qualified 被淹没在噪音里，销售只接得到垃圾。</li><li>容量数据一年不更新——人招了流程变了，容量早不是去年的数。</li><li>预报超容量仍硬喂——触发死亡螺旋，成交率断崖式下跌。</li></ul>",
q:{q:"投放放量计划 +50%，销售容量只允许 +20%。给你三个可用杠杆。",a:"三个杠杆推理：① 质换量——Offer/表单加严，让 +50% 的「量」主要来自 Qualified 而非总进线，即同样预算买更少但更准的 Lead，对销售的实际压力可能 <20%；② 承接提效——分级路由 + 培育池 + 选型自助工具，把轻线索移出销售时间，等效扩容 10–30%（承接力数字演算显示少喂反而多成交）；③ 错峰放量——分 4–6 周阶梯爬坡，期间监控响应 SLA，恶化即刹车（呼应 L0-05 小步加预算）。投放永远受承接约束，这是系统约束不是谈判题。"},
b:"测出你的周承接容量（人均×人数），写出投放联动的三个触发规则（放闸线/加严线/分流线）。"},
{id:"L8-06",lv:8,t:"Deal Value / Margin 与广告决策",
g:"把成交金额与毛利接进广告决策：从「线索成本」走到「经营报表」。",
c:"<p><b>B2B 投放的终极报表语言不是「线索数」，是「毛利」。</b>一个项目的订单可能等于一百个配件的订单，只用 CPL/线索数看世界，你会把金子当沙子扔掉，把沙子当金子供着。</p><p><b>价值三层：</b></p><ul><li><b>线索成本</b>：CPL / 有效 CPL（按 Qualified 折算）。</li><li><b>成交成本</b>：Deal Cost = 花费 ÷ 成交数。</li><li><b>经营价值</b>：边际毛利 = 新增毛利 − 新增花费。</li></ul><p><b>B2B 金额离散度大</b>：一单项目 = 100 单配件，平均数会抹平结构。必须分档处理（小单/中单/项目单）而非用平均数。</p><p><b>常见误区纠正：</b>「只汇报线索层」——管理层看不到经营影响；「毛利用统一均值」——离散度被抹平，大单小单混为一谈；「Deal 金额从不进广告报表」——两套账，优化失去方向；「大单偶发被当成趋势」——分档缺失导致误判。</p><p><b>类比：</b>看一家渔场的产出，不能只数「捞了多少网」，得看「捞上来的鱼值多少钱」。一网小鱼和一网金枪鱼，网数一样但价值天差地别。Deal 分档就是给鱼分类称重。</p>",
m:"<p><b>为什么必须到毛利层，机制链：</b></p><ul><li>① <b>两个市场 Deal Cost 相同，毛利结构可天差地别</b>（见 L7-07）：同样 $800 Deal Cost，一个毛利 $1400、一个毛利 $2600，决策结论完全相反。</li><li>② <b>同一市场「Deal 数增 20% 但全是小单」可能毛利反降</b>：量涨了，结构却劣化了。</li><li>③ <b>广告的最终报表语言是毛利，不是线索数</b>：优化到线索层止步，等于在半山腰建总部。</li></ul><p><b>数字演算（边际毛利决策）：</b>市场 X：Deal Cost $800、平均毛利 $1400→单笔边际贡献 $600；市场 Y：Deal Cost $1200、平均毛利 $2600→单笔边际 $1400。同样 $9600 预算：X 买 12 单赚 $7200，Y 买 8 单赚 $11200——Y 优先（呼应 L0-08 边际视角，决策看边际不看平均）。但需补三查：① Y 的成交周期与量稳定性；② 离散度（Y 是否靠一两大单撑均值，分档查）；③ L7-07 的风险折扣（大单集中要打折）。答案由「边际毛利」定，不由「成本」定。</p><p><b>与 L0 呼应：</b>分档价值回传呼应 L0-07 的归因口径；边际视角直接引用 L0-08 的边际经济学。</p>",
h:"<p><b>经营报表落地 checklist：</b></p><ul><li>① <b>CRM 记录 Deal 金额 + 毛利率</b>，分档即可（小单 <$2k / 中单 $2k–$10k / 项目单 >$10k）。</li><li>② <b>月度「广告经营报表」</b>：各 Campaign/市场的新增毛利 vs 花费，算边际毛利。</li><li>③ <b>用分档价值给回传 value</b>（见 L5-04）：项目单回传高 value，引导模型价值观。</li><li>④ <b>毛利结构突变（大单集中/小单潮）时单独立项分析</b>，别平均化。</li><li>⑤ 管理层汇报用「边际毛利」而非「CPL」，统一经营语言。</li></ul>",
cs:"某工业设备经营报表发现：渠道 A 的 Deal Cost 最好看（$650）但 70% 是小配件单（毛利 $400）；渠道 B 成本高 40%（$910）但系统项目单占比 60%（毛利 $6000）。按线索成本报表，A 是赢家该加预算；按毛利重排后，B 的边际毛利是 A 的 4 倍——预算大挪移。线索成本报表完全掩盖了这一层。上线经营报表后，季度广告边际毛利提升 38%，而总花费只增 9%。这正是「报表语言决定决策质量」的实例。",
f:"论坛「ROAS 门槛随利润率调整」、FP 高 ROI 的风险折扣——社区已在「利润/风险」层有朴素意识；「先算盈亏平衡 ROI」是本模块的电商雏形。社区靠「看 ROAS 决定加预算」停留在收入层，课程把它工程化为「边际毛利」经营报表，把风险折扣（L7-07）与分档结构一起算进去。",
e:"<ul><li>只汇报线索层——管理层看不到经营影响，预算决策缺依据。</li><li>毛利用统一均值——离散度被抹平，大单小单混为一谈。</li><li>Deal 金额从不进广告报表——两套账，优化失去方向。</li><li>大单偶发被当成趋势——分档缺失导致误判，下季扑空。</li><li>用平均 Deal Cost 比渠道——被离散度欺骗，结构劣化无感知。</li></ul>",
q:{q:"市场 X：Deal Cost $800、平均毛利 $1400；市场 Y：Deal Cost $1200、平均毛利 $2600。谁优先？",a:"用边际毛利推理：① X 单笔边际 = 1400−800 = $600，Y = 2600−1200 = $1400；② 同样 $9600 预算，X 买 12 单赚 $7200，Y 买 8 单赚 $11200→Y 优先；③ 但需补三查——Y 的成交周期与量稳定性（B2B 长周期，见 L8-03）、Y 是否靠一两大单撑均值（分档查离散度）、L7-07 的风险折扣（大单集中要打折）；④ 答案由「边际毛利」定，不由「成本」定。若三查显示 Y 稳定且非偶发，则 Y 优先扩量。"},
b:"做出首张「广告经营报表」（花费/Deal 分档/毛利/边际毛利），并标注风险折扣。"},
{id:"L8-07",lv:8,t:"多层业务反馈架构",
g:"设计 Lead→Qualified→Opportunity→Deal 的分层反馈体系：每层各管什么、怎么协同。",
c:"<p><b>电商的反馈是「单层」的（Purchase 一个事件），B2B 必须「多层」。</b>因为 B2B 的转化是延迟的、分阶段的，单一事件要么太早（Lead，只见数量）要么太晚（Deal，信号饿死）。多层架构让「量的引擎」和「质的罗盘」同时工作。</p><p><b>分层职责（MSG 418–422 训练）：</b></p><ul><li><b>Lead</b>＝量与探索：模型冷启动与扩量燃料，量大、即时。</li><li><b>Qualified Confirmed</b>＝优化靶心：量质平衡最优（见 L5-01），延迟 3–10 天。</li><li><b>Opportunity</b>＝中期健康监控：漏斗诊断用，量小、延迟 2–6 周，通常只监控不回传。</li><li><b>Deal</b>＝价值回传：分档 value，影响模型价值观，延迟 1–12 个月。</li></ul><p><b>常见误区纠正：</b>「四层全回传」——信号冗余且互相打架（Lead 说量多、Deal 说质少，模型混乱）；「Deal 不回传 value」——模型永远是数量观，找不到高价值人群；「Opportunity 拿去当优化靶心」——量太少饿死模型；「各层定义漂移不同步」——底层一变，上层全乱。</p><p><b>类比：</b>多层反馈像飞机的仪表组——空速表（Lead，看快不快）、姿态仪（Qualified，看正不正）、油量（Opportunity，看还能飞多久）、黑匣子（Deal，事后复盘）。只装空速表你不知道方向，只装黑匣子你实时瞎飞。四块表各管一段。</p>",
m:"<p><b>为什么不能只靠一层，机制链：</b></p><ul><li>① <b>只回 Lead = 模型只见数量</b>：它学会「找爱填表单的人」，但填表单的不一定买，量起来了质塌了。</li><li>② <b>只回 Deal = 信号饿死</b>：Deal 延迟数月、量稀少，模型在漫长学习期里几乎收不到正样本，学不动。</li><li>③ <b>分层架构 = 量质双引擎</b>：Lead 喂量、Qualified 定靶心、Deal 注入价值观，三层协同。</li></ul><p><b>数字演算（Opportunity 监控的预警价值）：</b>某法国市场组，Lead 与 Qualified 率都「健康」（Qualified Rate 45%），但若看 Opportunity 层（只监控不回传），发现 Opportunity 产出率从 25% 跌到 9%——提前 6 周预警了质量滑坡。若没有 Opportunity 监控层，这 6 周会继续放量，等 Deal 层（6 个月后）爆出来时已浪费整季预算。监控层不回传但「救命」，这正是 MSG 404 Coverage 问题的反面应用：不追求回传覆盖，而追求诊断覆盖。</p><p><b>与 L0 呼应：</b>分层事件对应 L0-03 的事件语义与参数；回传策略呼应 L0-04 双通道（Lead/Qualified 走 CAPI 常规流）；Cohort 报表呼应 L0-07。</p>",
h:"<p><b>四层架构落地 checklist：</b></p><ul><li>① <b>四层事件全部定义 + 固化</b>：状态机（Lead→Qualified→Opportunity→Deal），各层判定字段写清。</li><li>② <b>回传策略</b>：Lead/Qualified 走 CAPI 常规流；Opportunity 仅内部监控（不回传）；Deal 月批带 value 分档。</li><li>③ <b>每层配独立 Cohort 报表</b>：Lead 看量、Qualified 看靶心、Opportunity 看健康、Deal 看价值。</li><li>④ <b>季度审计</b>：各层的「事件量 × 质量 × 延迟」是否仍支持其职责，漂移即修。</li><li>⑤ 禁止把 Opportunity 当优化靶心（量 < Qualified 的 1/4，回传噪声高）。</li></ul>",
cs:"某工业设备反馈架构上线 6 个月的效果：Broad 组在新 Qualified 靶心下自动收敛到工程类人群（Deal 价值回传的功劳——模型学会了「找买大项目的人」）；Opportunity 报表提前 6 周预警了法国市场的质量滑坡（仅监控层的价值，避免整季预算浪费）。最妙的是四层解耦：当 Qualified 率短期波动时，Deal 层的长期价值信号稳定了模型的「价值观」，避免了因短期 Qualified 波动而乱调靶心。",
f:"论坛不存在此架构（电商单层即可），这正是课程第九章（CRM→CAPI 体系）针对 B2B 的核心增量。论坛里「装 Hotjar + 自己走支付流程」是「多层观测」的个人英雄版——靠人肉走查发现漏斗断点；课程把它工程化为四层事件 + Cohort 报表的系统。社区靠直觉，B2B 靠架构。",
e:"<ul><li>四层全回传——信号冗余且互相打架，模型在「量多」与「质少」间震荡。</li><li>Deal 不回传 value——模型永远是数量观，找不到高价值人群。</li><li>Opportunity 拿去当优化靶心——量太少饿死模型，学习期永不出。</li><li>各层定义漂移不同步——底层一变，上层全乱，报表对不上。</li><li>只有 Lead 一层——量起来了质塌了，且延迟数月后才爆雷。</li></ul>",
q:{q:"为什么 Opportunity 通常「只监控不回传」？什么情况下例外？",a:"推理：① Opportunity 的量通常 < Qualified 的 1/4 且延迟 2–6 周——回传的边际信息（相对 Qualified）有限，而噪声风险高（MSG 404 Coverage 问题：小样本回传易引入偏差），故仅作内部漏斗监控；② 例外条件——若 Opportunity 定义极客观（如「客户书面确认技术方案」）且周量 ≥30，可考虑作为第二优化靶心做 A/B 验证；③ 即便例外，也只作为 Qualified 的辅助靶心，不与 Deal 抢主信号。本质是「回传覆盖要匹配信号质量」。"},
b:"画出你的四层反馈架构图（定义/回传/报表/职责四列），并标注各层延迟。"},
{id:"L8-08",lv:8,t:"B2B 素材策略（工厂实力与案例体系）",
g:"把 B2B 的信任资产（工厂/案例/技术）转化为一套可持续生产的素材体系。",
c:"<p><b>B2B 的素材不卖「产品」，卖「信任」。</b>买家花几十万买设备，他要的不是你的广告多好看，是「这家靠不靠得住、设备会不会中途爆掉、出了事有没有人管」。素材的每个镜头，都在回答一类信任问题。</p><p><b>B2B 素材四大类：</b></p><ul><li><b>实力类</b>：工厂航拍、产线、检测设备——回答「你有没有生产能力」。</li><li><b>案例类</b>：项目实拍、客户访谈、运行数据——回答「别人用了好不好」。</li><li><b>技术类</b>：原理动画、对比测试、参数解析——回答「你的技术行不行」。</li><li><b>流程类</b>：从询盘到交付的服务旅程——回答「合作顺不顺」。</li></ul><p><b>生产逻辑：</b>一次实拍 = 十次剪辑（见 L3-05 证据库的分镜化），把一次拍摄的素材拆成多个 Angle（角度）复用。</p><p><b>常见误区纠正：</b>「用图库素材冒充工厂」——技术客户一眼识破，专业度自杀；「案例素材没有数据支撑」——空讲「很多客户」不如一句「俄罗斯项目运行 8 年」；「一年只拍一次」——素材库存老化，新鲜感归零；「素材从不打 Angle 标签」——组合管理失效，复用率低。</p><p><b>类比：</b>B2B 素材像相亲时的「履历 + 房产证 + 体检报告」——实力类是房产证，案例类是别人好评，技术类是体检报告，流程类是人品证明。四类齐备，对方才「找不到不选你的理由」。</p>",
m:"<p><b>B2B 素材的核心作用 = 风险对冲，机制链：</b></p><ul><li>① <b>实力类对冲供应商风险</b>：客户怕你是个皮包公司，航拍产线直接破防。</li><li>② <b>案例类对冲效果风险</b>：客户怕买了不好用，真实运行数据最有说服力。</li><li>③ <b>技术类对冲技术风险</b>：客户怕参数虚标，对比测试可视化拆解。</li><li>④ <b>流程类对冲合作风险</b>：客户怕售后失联，服务旅程建立预期。</li></ul><p><b>数字演算（素材寿命与 ROI）：</b>一次工厂 + 项目实拍花费 $5000，产出 50+ 原始片段，按 Angle 标签剪辑出 8 条成品，平均每条成本 $625；其中「俄罗斯项目 8 年运行回访」视频成为两年长青素材，两年累计带来估算 $80k 毛利——单条素材 ROI 超 150 倍。对比「一年只拍一次、库存老化」的账户，素材衰败快（Frequency >3 即疲劳），等效每条素材寿命仅 2 个月，同样 $5000 投入的产出差一个数量级。这就是「资产化生产」vs「消耗式生产」的差距。</p><p><b>与 L0 呼应：</b>素材 Angle 对应 L0-06 的 Ad Quality（诚实、不诱导）；素材疲劳判断呼应 L0-08 的 Frequency 指标；一次实拍十次剪辑呼应 L3-05 证据库。</p>",
h:"<p><b>素材体系生产 checklist（带数字）：</b></p><ul><li>① <b>1–2 次集中实拍/年</b>（工厂 + 代表项目），目标产出 50+ 原始片段。</li><li>② <b>按四类剪辑入库并打 Angle 标签</b>（如「实力-产线」「案例-俄项目」「技术-免堵动画」）。</li><li>③ <b>每月从库组合 6–10 条成品</b>，覆盖不同 Angle 不重复。</li><li>④ <b>「客户访谈」半年代价最高但寿命最长</b>，优先排期（案例类复合信任）。</li><li>⑤ <b>AI 用于包装</b>（字幕/本地化/背景），不用于伪造（见 L3-11 合规）——B2B 专业度是命门，伪素材等于自杀。</li></ul>",
cs:"某工业设备素材体系实绩：一次工厂 + 项目实拍产出 8 条视频素材，其中「俄罗斯项目 8 年运行回访」视频成为两年长青素材（案例类的寿命优势，两年累计带来估算 $80k 毛利）；技术对比动画解决「免堵」卖点的可视化难题——此前文字描述客户无感，动画一出询盘率翻倍。反面教训：早期用图库素材冒充工厂产线，被一个德国客户在询盘里直接点破「这不是你们的厂」，丢了该客户并损害品牌信任。此后全面转向自建资产，素材库按 Angle 标签管理，复用率从 20% 提到 75%。",
f:"论坛对应：KOL 混剪 + 素材周评级是「外部信任资产」的电商版；剪辑框架强调意识流。但「抖音搜素材」路线在 B2B 不可行——伪素材 = 专业度自杀，B2B 客户会逐帧验真。论坛「素材每周更新 2–3 个」的节奏原则可借鉴，但 B2B 更重「资产化生产」（一次实拍十次剪辑），而非电商的「快速试错大量产」。",
e:"<ul><li>用图库素材冒充工厂——技术客户一眼识破，专业度自杀。</li><li>案例素材没有数据支撑——空讲「很多客户」，不如一句运行数据。</li><li>一年只拍一次素材——库存老化，Frequency 一高就疲劳。</li><li>素材从不打 Angle 标签——组合管理失效，复用率低。</li><li>用 AI 伪造工厂/案例——B2B 客户验真，一旦穿帮信任归零。</li></ul>",
q:{q:"预算只够拍一样：产品宣传片还是客户访谈？怎么选？",a:"选客户访谈（若能拿到真实客户），推理：① 访谈 = 案例类 + 人际类证据的复合体，对冲「效果风险 + 信任风险」两大 B2B 主阻力（机制链里两类风险权重最高）；② 内容可拆条出 5–10 个片段（Hook 库 + 案例库），复用率远超宣传片；③ 产品宣传片多为实力类单层信息，且客户对自夸内容的信任折损大。可折中：访谈为主 + 半日工厂花絮补实力类。本质是「用有限预算买最高密度的信任资产」。"},
b:"盘点你的素材四类覆盖度，产出下季度实拍计划（时间/类型/预计产出片段数）。"},
{id:"L8-09",lv:8,t:"表单 vs WhatsApp：B2B 链路决策",
g:"掌握 B2B 获客两条主链路的选型框架：什么场景用表单、什么场景用消息、如何混合。",
c:"<p><b>链路不是「哪个好」的问题，是「哪个匹配你的客户习惯与承接方式」的问题。</b>表单和 WhatsApp 是两种完全不同的「意图筛选器 + 数据接口」，选错链路，前半段广告再好也接不住。</p><p><b>表单链路：</b>优势＝结构化数据（直接进 CRM/可回传）、意图筛选（字段即过滤）、可批处理；劣势＝摩擦高、互动延迟。</p><p><b>WhatsApp 链路：</b>优势＝低摩擦、即时对话、信任升温快；劣势＝一轮游多（聊两句就走）、数据非结构化、需要人力承接。</p><p><b>常见误区纠正：</b>「全球统一一种链路」——区域习惯差异巨大（欧洲书面、中东 WS 渗透率高）；「WhatsApp 线索不进 CRM」——回传与复盘双盲；「表单在移动端做十几字段」——摩擦自杀，移动端填表弃单率极高；「两种链路的量混在一个报表比」——口径不同，比了也白比。</p><p><b>类比：</b>表单像「填表预约」，WS 像「直接打电话」。你要办签证（正式、留档）就填表；你要问个小事（即时、随意）就打电话。让欧洲人打电话办事他别扭，让中东人填十页表他直接放弃——链路要匹配习惯。</p>",
m:"<p><b>选型的第一性：链路是「意图筛选器 + 数据接口」的组合，机制链：</b></p><ul><li>① <b>表单 = 强筛选 + 强数据</b>：字段强制客户暴露需求（工况、预算），同时结构化进 CRM，回传干净。</li><li>② <b>WhatsApp = 弱筛选 + 强互动</b>：低门槛进来，但「一轮游」多，且对话数据非结构化，需人工提炼。</li><li>③ <b>B2B 优解常是混合链路</b>：广告可双 CTA（表单/WhatsApp），或 WS 首句自动结构化提问（把筛选搬进对话）。</li></ul><p><b>数字演算（链路折算公平性）：</b>中东市场 WS 有效 CPL 比表单低 40%，但 WS 的 Lead 中「开口即走」占 55%，真正「完成 3 问」的仅 45%。若直接比 Lead 量，WS 看似赢；但用「完成 3 问的有效 Lead」折算：表单有效 CPL $50、WS 折算后（$50÷0.45≈$111）反而高——所以必须按「可比的有效 Lead」而非「原始 Lead 量」比，否则会被 WS 的「虚假繁荣」误导。这呼应 L8-05 的 Qualified 口径：比的是质不是量。</p><p><b>与 L0 呼应：</b>表单事件对应 L0-03 的标准事件 Lead；WS 首句 3 问对应 L4-16；双链路回传呼应 L0-04 双通道。</p>",
h:"<p><b>链路选型落地 checklist：</b></p><ul><li>① <b>测区域习惯</b>：欧洲邮件/表单文化重、中东东南亚 WS 渗透率高（COD 区域经验同理），按区域分配置。</li><li>② <b>WhatsApp 链路必配首句 3 问</b>（见 L4-16）：行业/工况/预算，把筛选搬进对话。</li><li>③ <b>双 CTA 并行测试 4 周</b>看有效 CPL（WS 的 Lead 按「开口 + 3 问完成」折算）。</li><li>④ <b>消息线索用「对话摘要模板」结构化入 CRM</b>（保住回传能力），字段含：国家/行业/工况/预算/阶段。</li><li>⑤ 两链路分开建报表，禁止混比原始 Lead 量。</li></ul>",
cs:"某工业设备区域实测：欧洲表单有效 CPL 优于 WS（客户习惯书面沟通，表单完成率 22%、WS 开口后 3 问完成率仅 38%）；中东市场 WS 有效 CPL 反超 40%（对话文化，WS 开口率 3 倍于表单）。最终混合结构：欧洲表单主 + WS 辅，中东 WS 主 + 表单保留给高意图决策者。关键动作：WS 线索用「对话摘要模板」结构化入 CRM，使 WS 线索也能回传 Qualified 事件——之前 WS 线索不进 CRM 导致回传双盲，白白浪费了 40% 的优质对话。</p>",
f:"论坛的四链路实测是本模块的论坛地基：WS（一轮游多、预填即走）/ 表单转电话（美区拒接 90%+ 风控风险）/ Messenger（质量不高）/ 直接电话（秒挂假量）——结论「表单 + 落地页 + 建信任」。论坛的「微小代价前置筛选」= 链路设计的总原则：表单的字段、WS 的首句 3 问，本质都是「用微小代价过滤低意向」。WS 垃圾询盘治理的经验也印证：消息链路必须配结构化承接，否则沦为聊天玩具。",
e:"<ul><li>全球统一一种链路——区域习惯差异巨大，强行统一必有一边崩。</li><li>WhatsApp 线索不进 CRM——回传与复盘双盲，优化无据。</li><li>表单在移动端做十几字段——摩擦自杀，弃单率极高。</li><li>两种链路量混在一个报表比——口径不同，比了也白比。</li><li>WS 无首句筛选——一轮游泛滥，数据非结构化无法回传。</li></ul>",
q:{q:"中东市场要不要把表单链路全部换成 WhatsApp？",a:"不要「全换」，做「主辅 + 测试」，推理：① 先双 CTA 并行 4 周，比有效 CPL（WS 的 Lead 要按「开口 + 3 问完成」折算，否则被虚假繁荣误导）；② 中东 WS 为主、表单保留给高意图决策者（有人就是要书面留档）；③ WS 线索用结构化摘要入 CRM 保回传（呼应 L0-04 数据完整性）。区域习惯是权重变量，不是非黑即白的开关——全换等于放弃书面型高意向客户，得不偿失。"},
b:"做出你各区域市场的链路配置表（主链路/辅链路/判据/折算口径）。"},
{id:"L8-10",lv:8,t:"服务类高客单案例：入境游（软转化信号）",
g:"用入境游案例掌握「无硬转化信号」的服务类投放：信号更软、筛选更前置、后端定生死。",
c:"<p><b>服务类高客单（入境游/定制游/咨询类）是 B2B 逻辑在「无实物」场景的延伸。</b>它和实物 B2B 的共性：无签收类硬转化、决策靠信任、周期中等。差异：客单更高、转化位置常为消息（WhatsApp/微信）；最大难点 = FB 学习信号极弱（咨询 ≠ 成交），人群易「死循环学歪」。</p><p><b>死循环机制：</b>低意向进线 → FB 学这批人 → 再找同样的人 → 更多低意向进线。广告越投越偏，销售越接越累，预算烧光无成交。</p><p><b>常见误区纠正：</b>「用电商逻辑投服务（优化加购）」——没有加购这个动作，优化个寂寞；「不做前置筛选」——死循环 + 人力浪费；「所有咨询进一个号」——无人力分层也不专业；「把咨询量当北极星」——后端成交才是真指标。</p><p><b>类比：</b>服务类投放像「相亲中介」——你发的广告不是卖货，是「吸引对的人来聊」。聊两句发现不对，是筛选失败；前端不筛，后端全是要错配的人，顾问再强也救不回。</p>",
m:"<p><b>解法结构，机制链：</b></p><ul><li>① <b>把「微小代价」前置到素材与首句</b>：设情景、设问题，低意向者自己走掉（最佳回复：用门槛过滤而非用广告拉人）。</li><li>② <b>链路用消息 + 分流路由</b>：按语言/区域分给不同顾问/导游，各自原生接手，专业度即转化率。</li><li>③ <b>市场选择即定向</b>：避开内卷市场（东南亚卷、欧洲舒服），用市场本身做第一层筛选。</li><li>④ <b>优化事件用「对话开始」起步、尽快切「完成 3 问」</b>等中间事件，让模型学「真有意向的人」而非「随便聊聊的人」。</li></ul><p><b>数字演算（三级漏斗的健康标准）：</b>设某周进线 200（开口），完成 3 问 80（40%），成交 12（占开口 6%、占 3 问完成 15%）。若开口 200 但 3 问完成仅 40（20%）→ 死循环预警（前端筛选失效，低意向占比过高）；若 3 问完成 80 但成交仅 4（5%）→ 后端承接/市场错配问题。三级数据反哺素材：当「开口→3 问」掉链子，调素材首句增加微小代价；当「3 问→成交」掉链子，调导游专业度或市场选择。这正呼应 L0-08 的 First Loss 分层诊断。</p><p><b>与 L0 呼应：</b>微小代价前置呼应 L3-06 CTA 光谱；消息链路呼应 L8-09；三级漏斗呼应 L0-08 的漏斗分层；市场选择呼应 L1-07 六维评分。</p>",
h:"<p><b>服务类落地五步 checklist：</b></p><ul><li>① <b>市场评分</b>（六维，见 L1-07）：避开内卷红海，选「舒服市场」优先投。</li><li>② <b>C2W 广告 + 分流链接</b>：路由按语言轮询，分配给对应母语顾问。</li><li>③ <b>首句自动 3 问</b>（城市/时间/人数）筛意图，低意向者自走。</li><li>④ <b>导游原生接手</b>：专业度即转化率，匹配语言与区域。</li><li>⑤ <b>周度复盘「开口→3 问完成→成交」三级漏斗</b>，用三级数据反哺素材与路由。</li></ul>",
cs:"入境游实操（结合你项目）：欧洲线广告「微小代价」版首句「请告知出行月份与人数，为你匹配专属顾问」——一轮游率显著下降（开口→3 问完成率从 20% 升到 41%）。东南亚线维持观察档只投再营销（内卷市场，新客 CPA 高）。后端导游的专业度成为真正的转化率变量——广告只负责把人筛进来，顾问负责把人留住。最关键的修正：曾把所有咨询进同一个号，导致西语客户被中语顾问接、转化崩盘；改为按语言路由后，同量咨询成交率翻倍。",
f:"论坛直接证据：入境游人群不精准帖（东南亚卷/欧洲舒服/微小代价筛选/死循环警告）；高客单潜客链路实测（WS 一轮游 vs 表单的取舍）；WS 垃圾询盘治理。三帖合成服务类投放的完整拼图——论坛用「踩坑帖」记录现象，课程用「三级漏斗 + 前置筛选」把它变成可复用的工程方法。死循环警告尤其珍贵：它点破了「低意向进线→FB 学歪」这一服务类特有陷阱。",
e:"<ul><li>用电商逻辑投服务——优化「加购」没有意义，信号错位。</li><li>不做前置筛选——死循环 + 人力浪费，FB 越学越偏。</li><li>所有咨询进一个号——无人力分层也不专业，语言/区域错配。</li><li>把「咨询量」当北极星——后端成交才是真指标，咨询多≠赚到。</li><li>市场不选——在东南亚内卷红海硬投，CPA 畸高无利润。</li></ul>",
q:{q:"入境游 FB 广告进线多但「聊两句就没」。根因树三大分支？",a:"用根因树推理（呼应 L6 诊断）：① 筛选缺失——素材/首句无微小代价，低意向涌入→处方：加首句 3 问 + 素材情景化（设门槛让低意向自走）；② 链路摩擦——分流转接多一跳流失（wa.me 点击）→处方：文案明确引导或路由机器人直连；③ 市场错配——人群对华旅行兴趣弱（市场选择问题）→处方：按六维（L1-07）重排市场，避开内卷红海。三个分支对应三种完全不同的处方——先树后药，别一上来瞎调素材。"},
b:"为你（或假设的）服务类项目写出五步落地清单与三级漏斗定义（开口/3问完成/成交的各自判据与预警线）。"},
{id:"L10-01",lv:10,t:"决策环：事实→判断→假设→动作→验证→回滚",
g:"内化操盘手的标准决策循环，让每个动作可追溯、可验证、可撤销。",
c:"<p><b>操盘手和「乱枪打鸟」的区别，在于每一个动作都有「为什么」和「怎么收场」。</b>决策环就是给动作装上的「行车记录仪」——出了问题能回放，成功了能复制。</p><p><b>决策环六步：</b></p><ul><li><b>① 事实</b>：数据确认，区分事实与推测（「CPL 涨了 40%」是事实，「算法抽风了」是推测）。</li><li><b>② 判断</b>：定位问题层与幅度（见 L6 章工具：是数据层、质量层、还是结构层？幅度多大？）。</li><li><b>③ 假设</b>：列出候选原因与预期效果（「若是新国家稀释，则移除后质量回升」）。</li><li><b>④ 动作</b>：最小干预 + 单一变量（一次只动一个东西，否则无法归因）。</li><li><b>⑤ 验证</b>：预设指标 + 观察窗（「2 周内 Qualified Rate 回到 45%」）。</li><li><b>⑥ 回滚</b>：预设撤销条件（「若 2 周无改善则查素材」）。</li></ul><p><b>常见误区纠正：</b>「跳过事实直接动作」——把猜测当数据；「一次动作多个变量」——验证失效，不知哪个起作用；「动作后不设验证窗」——永不学习；「不写日志」——团队无法继承经验。</p><p><b>类比：</b>决策环像医生问诊——先查体（事实）、再诊断（判断）、提治疗方案（假设）、用药（动作）、复查（验证）、备用方案（回滚）。直接开刀不问诊，是庸医。</p>",
m:"<p><b>决策环的价值 = 对抗两种人性，机制链：</b></p><ul><li>① <b>对抗慌乱（跳步动作）</b>：看到 CPL 涨就改素材改受众改出价，三处同动，最后不知谁生效、是否更糟。</li><li>② <b>对抗固执（动作后不验证不回滚）</b>：沉没成本陷阱，明明错了还硬扛。</li><li>③ <b>把「拍脑袋」变成「可审计的决策资产」</b>——这也是团队可复制操盘能力的前提（一个人离职，决策资产留下）。</li></ul><p><b>数字演算（单变量验证的必要性）：</b>某组 CPL 从 $55 涨到 $82（+49%），操盘手同时做了三件事：换素材、缩受众、加预算 20%。2 周后 CPL 回到 $60——他以为「三招奏效」，但无法知道是哪招。若用单变量：只换素材，2 周后 $70；再加缩受众，$62；证明主因是受众过宽。多变量省事但丢认知，单变量费时但攒资产。决策环的「动作=单变量」就是为此设的纪律。</p><p><b>与 L0 呼应：</b>验证窗呼应 L0-05 学习期（改动后要给模型时间）；回滚呼应 L0-05 的复制新组（原组是资产，错了复制重来而非硬改）；判断层呼应 L6 诊断。</p>",
h:"<p><b>决策日志模板 checklist（5 分钟写完）：</b></p><ul><li>① <b>日期 / 触发事实</b>（数据，带样本量）：如「3/12｜DE 组 CPL $82（基线 $55×1.5，样本 12）」。</li><li>② <b>判断</b>（层 + 幅度）：如「质量层 First Loss，幅度 -7 点」。</li><li>③ <b>假设</b>（若-则）：如「若新国家稀释，移除后 1 周质量回升」。</li><li>④ <b>动作</b>（具体变更，单变量）：如「移除奥地利 20% 预算」。</li><li>⑤ <b>验证窗与指标</b>：如「2 周 / Qualified Rate」。</li><li>⑥ <b>回滚条件 + 结果回填</b>：如「若无改善则查素材 / 事后判断正确，回填胜率」。</li></ul>",
cs:"某工业设备决策日志样例：「3/12｜DE 组 CPL $82（基线 $55×1.5，样本 12）｜判断：质量层 First Loss｜假设：新国家稀释｜动作：移除奥地利 20% 预算（单变量）｜验证 2 周｜回滚：若无改善则查素材」。事后：判断正确，回填胜率。季度累计 47 条决策日志，胜率从首月 52% 提升到第六月 71%——决策环让「瞎蒙」变成「有胜率预期的工程」。新人接手时，翻日志就能复现历史判断逻辑，不必从头踩坑。",
f:"论坛高手的决策环是内隐的：「表现好加 10–30%…当天拉垮就关，改天重开」= 动作 + 验证 + 回滚的口语版；「关广告要快、建广告要多、加预算要慢」= 三类动作的预设规则。课程把内隐经验显性化、团队化——论坛老手靠记性，课程靠日志。论坛「三大致命操作」（频繁改、死磕老素材、忽略落地页）本质就是「跳过了决策环的事实与判断层」。</p>",
e:"<ul><li>跳过「事实」直接动作——把猜测当数据，乱枪打鸟。</li><li>一次动作多个变量——验证失效，不知哪个起作用。</li><li>动作后不设验证窗——永不学习，同样错误反复犯。</li><li>不写日志——团队无法继承，人走经验走。</li><li>不设回滚条件——错了硬扛，沉没成本陷阱。</li></ul>",
q:{q:"你怀疑「新素材拉低质量」。用决策环完整走一遍。",a:"推理：① 事实——该素材上线后组合 Qualified Rate 45%→38%，其余未变，样本足；② 判断——质量层、幅度 -7 点、时间吻合（新素材上线后开始）；③ 假设——若该素材吸引错人，暂停后 1 周质量应回升；④ 动作——暂停该素材（单变量，不动受众/出价）；⑤ 验证——1 周观察窗，指标 = Qualified Rate 与该素材停投前消耗占比；⑥ 回滚——若质量不回升→假设证伪，回查根因树其他分支（MSG 294 完整训练：恢复≠证明，需排除并列变量）。决策环的价值就在「单变量 + 验证窗 + 回滚」三件套。"},
b:"用决策日志格式记录你的下 5 个投放决策（含事实/判断/假设/动作/验证/回滚）。"},
{id:"L10-02",lv:10,t:"不确定性下的决策",
g:"掌握数据不足时的决策技术：期望值思维、可逆性优先、信息价值。",
c:"<p><b>数据不足 ≠ 不能决策，而是「换一种决策方式」。</b>多数投放决策都发生在信息不全时——新市场、新素材、新结构，你永远等不到「完美数据」。高手的本事，是在不确定里用结构化方法降低风险。</p><p><b>三件工具：</b></p><ul><li><b>① 期望值思维</b>：按概率加权评估（预期收益 = Σ 概率×结果），不赌单点最好情况。</li><li><b>② 可逆性分级</b>：可逆动作快做（如小预算测试）；不可逆动作慢做（如关停长青组、删资产）。</li><li><b>③ 信息价值</b>：花小钱买「继续还是放弃」的决策权（测试预算的本质就是买信息）。</li></ul><p><b>常见误区纠正：</b>「把数据不足当不决策」——默认维持也是决策（且常是错的）；「可逆动作拖成永久观望」——小测试早做早知道；「不可逆动作一拍脑袋」——关组/删资产，错了难挽回；「从不算期望值」——只看最好情况，赌徒心态。</p><p><b>类比：</b>可逆动作像「试吃一口」（错了吐掉，成本几块钱）；不可逆动作像「签十年租约」（错了搬不走，损失是资产级）。同一份数据下，两者的决策门槛该差一个量级——你不会用签租约的谨慎去决定试吃。</p>",
m:"<p><b>为什么可逆性是关键轴，机制链：</b></p><ul><li>① <b>可逆动作的错误成本 ≈ 学费</b>：小预算测试失败，买回的是「这条路不通」的信息，值。</li><li>② <b>不可逆动作的错误成本是资产级</b>：模型、名单、评论资产，关了重学要重新养，时间成本数月。</li><li>③ <b>同一份数据下，两者决策门槛差一个量级</b>：可逆的「先试」、不可逆的「慢决」。</li></ul><p><b>数字演算（期望值 + 信息价值）：</b>新市场探测 3 周数据「还行但不出彩」：估算「验证期通过概率 50% × 通过后季收益 $30k = $15k」vs「再投 2 周验证成本 $3k」。期望值看，花 $3k 买「晋级 or 淘汰」的确定性值 $15k 的预期——信息价值远高于成本（花 10% 的钱买 80% 的信息）。若直接放弃（不可逆），则损失潜在 $15k；若直接全量加码（部分不可逆），则可能白烧 $20k。最优解 = 花 $3k 买 2 周验证期。这正是 L0-08 边际视角的延伸：比较的是「边际信息收益 vs 边际投入」。</p><p><b>与 L0 呼应：</b>可逆性分级呼应 L0-05（复制新组保资产、原组小改）；期望值呼应 L0-08 边际；验证期呼应 L0-05 静默期。</p>",
h:"<p><b>操作三问 checklist：</b></p><ul><li>① <b>这个动作可逆吗</b>？多久能撤销、撤销损失多少？（可逆→快做；不可逆→慢做）</li><li>② <b>各结果的期望值算得出来吗</b>？哪怕粗略（概率×收益 − 成本）。</li><li>③ <b>有没有「花 10% 的钱先买 80% 信息」的路径</b>？试点 / 小样本 / Geo 单区测试。</li><li>④ 三问决定「立即做 / 试点做 / 等数据做」，禁止「数据不足就躺平」。</li></ul>",
cs:"某工业设备决策实例：「是否关停跑 8 个月的 RT 组」——不可逆（组内模型与名单积累，关了重学要数月）。处理：先降 50% 预算（可逆试点）跑 4 周看边际——若边际 CPL 仍优则保留、若崩则再关停。避免了「一次关死」的资产损失。另一例：新素材 A/B 测试，可逆，直接小预算并行跑，2 周出结论。两例对照说明：可逆的果断试，不可逆的先降级再判——这是「可逆性优先」的工程落地。</p>",
f:"论坛版本：「宁可多建不可错杀」（建组 = 可逆、关停 = 不可逆的小心对待）；「出 1 单不管、出 2 单翻倍」= 期望值 + 可逆性的复合直觉。小预算试错（$5–10/组、48h 止损）= 信息价值的教科书——花小钱买「这品行不行」的确定性。论坛老手靠直觉守这些规矩，课程把它们提炼成「可逆性分级 + 期望值 + 信息价值」三件套。</p>",
e:"<ul><li>把「数据不足」当「不决策」——默认维持也是决策，且常是错的。</li><li>可逆动作拖成永久观望——小测试早做早知道，拖着只在烧钱。</li><li>不可逆动作一拍脑袋——关组/删资产，错了难挽回。</li><li>从不算期望值——只看最好情况，赌徒心态。</li><li>不买信息——不花小钱测试，直接豪赌全量。</li></ul>",
q:{q:"新市场探测 3 周，数据「还行但不出彩」。三种选项：全量加码/再观察 2 周/放弃。用本模块工具决策。",a:"用三工具推理：① 可逆性——加码部分可逆（加的预算可降回）、放弃不可逆（弃了重开要重新学，资产流失）；② 期望值——按探测数据估「验证期通过概率×通过后收益」vs「继续投入成本」，若通过概率×收益 > 成本则值得验证；③ 信息价值——再给 2 周验证期（小额，约 15% 预算）买「晋级 or 淘汰」的确定性。通常答案是「验证期加时」而非二选一——除非出现淘汰线触发信号（如 Qualified Rate 持续为 0）。这避免了「放弃错失机会」与「加码烧钱」两个极端。"},
b:"用三问框架（可逆性/期望值/信息价值）复盘你最近一个犹豫不决的决策。"},
{id:"L10-03",lv:10,t:"Action Sequencing（动作排序）",
g:"当问题扎堆时，决定「先动哪一个」：按影响×确定性×依赖关系排序。",
c:"<p><b>多问题同时出现时，最贵的错误是「一起上」。</b>并行改五处，结果互相污染、无法归因，最后不知道哪个改好了、哪个改坏了。高手的「慢」常体现在排序纪律上——先理清顺序，再动手。</p><p><b>排序三准则：</b></p><ul><li><b>① 影响面</b>：动它能解决多少问题、unlock 多少下游。</li><li><b>② 确定性</b>：证据强度——根因树验证过的优先于猜测的。</li><li><b>③ 依赖关系</b>：A 是 B 的前提则 A 先行（如先修数据口径再谈优化调整——口径不对，一切评估失真）。</li></ul><p><b>常见误区纠正：</b>「按谁喊得响排序」——嗓门大不代表影响大；「并行开五条线」——归因地狱；「跳过数据卫生直接优化」——在坏尺子上做精调；「清单写了从不回填执行结果」——等于没排。</p><p><b>类比：</b>动作排序像装修——你得先改水电（地基）再贴地板（表象）。同时请五个工种进场，电工在地上刨沟、油漆工在刷墙，互相踩踏，谁都干不好。顺序错了，力气越大越乱。</p>",
m:"<p><b>为什么排序重要，机制链：</b></p><ul><li>① <b>多动作并行 = 互相污染 + 无法归因</b>：五处同改，CPL 降了，是素材的功还是受众的功？不知道。</li><li>② <b>顺序错误 = 在错误的地基上施工</b>：受众和素材都没理清就调出价，等于尺子歪了还量得欢。</li><li>③ <b>高手的慢 = 排序纪律</b>：一次 1–2 个动作 + 冷却期，每个都有验证窗。</li></ul><p><b>数字演算（依赖关系的成本）：</b>同期出现 EMQ 4.2（低）、两组合重叠 50%、CPL 超 20%。若先动 CPL（表象）：调出价后 CPL 降了 5%，但 EMQ 低意味着模型看到的信号失真，这 5% 可能是噪声——且重叠 50% 导致的内部竞价还没解。正确排序：先 EMQ（地基，所有评估的前提）→ 再重叠（结构问题）→ 最后 CPL（很可能在处理前两项后自行改善）。错误排序浪费 2 周调价，正确排序省下且治本。这呼应 L0-08 的 First Loss：先定位层再动。</p><p><b>与 L0 呼应：</b>依赖关系呼应 L0-03/04（数据可信度是一切评估前提）；冷却期呼应 L0-05 学习期；根因树呼应 L6。</p>",
h:"<p><b>排序流程 checklist：</b></p><ul><li>① <b>列出全部待办动作</b>（问题清单）。</li><li>② <b>标依赖</b>：哪些必须先行（如数据口径 > 结构 > 出价微调）。</li><li>③ <b>按「影响 × 确定性」打分排序</b>（各 1–5 分，乘积累计）。</li><li>④ <b>执行节奏</b>：一次 1–2 个动作 + 冷却期（见 L6-07），每完成回填结果再启动下一个。</li><li>⑤ 典型优先序：数据口径 > 结构性问题（受众/架构）> 素材迭代 > 出价微调。</li></ul>",
cs:"某工业设备季度整治排序实例：问题清单 7 项（EMQ 低 / 表单字段乱 / 组重叠 / Cap 过紧 / 素材老化 / 规则冲突 / 报表口径）→ 排序：口径→EMQ→表单→重叠→Cap→素材→规则。7 周 B 计划，每项有验证窗。结果：先修口径（2 周）让后续所有诊断可信；再修 EMQ 让模型信号干净；表单与重叠解结构问题；最后素材迭代。若反过来先迭代素材，在脏数据上测素材等于白测。7 周后整体有效 CPL 降 31%，且每个改善都能归因到具体动作。</p>",
f:"论坛的排序智慧是碎片化的：「先查个号还是先查代码」类求助帖的优质回答常隐含排序逻辑；错误代码的处理建议自带「先易后难」顺序。系统化排序是课程对社区经验的升级——论坛靠「热心的老手随口说先查这个」，课程把「影响×确定性×依赖」变成可打分、可复盘的排序表。</p>",
e:"<ul><li>按「谁喊得响」排序——嗓门大不代表影响大。</li><li>并行开五条线——归因地狱，互相污染无法归因。</li><li>跳过数据卫生直接优化——在坏尺子上做精调。</li><li>清单写了从不回填执行结果——等于没排，下次重犯。</li><li>把表象问题（CPL）当首要——地基未修，治标不治本。</li></ul>",
q:{q:"同期发现：EMQ 4.2（低）、两个组重叠 50%、CPL 超 20%。先处理哪个？",a:"用三准则推理：① 依赖关系——EMQ 低意味着模型看到的信号失真，此刻的 CPL 与重叠诊断都不可靠，EMQ 是地基，必须先修；② 影响面——重叠 50% 是结构性问题，影响成本与学习（呼应 L0-08 数据碎片化），排第二；③ 确定性——CPL 异常很可能在处理完前两项后自行改善，或届时才能被准确诊断，排最后。结论：先 EMQ → 再重叠 → CPL 最后。地基 > 结构 > 表象，顺序错了力气越大越乱。"},
b:"把你的待办问题清单做一次三准则排序（影响×确定性×依赖），并写明执行节奏。"},
{id:"L10-04",lv:10,t:"Executive Decision Memo（决策备忘）",
g:"用一页纸向管理层汇报复杂投放决策：结构、语言与预期管理。",
c:"<p><b>投放决策的复杂性必须被「翻译」成经营语言。</b>管理层要的不是 CTR，是「这块钱投下去、多久、以什么置信度、赚回什么」。翻译能力 = 投放价值变现的最后一公里。不会写 Memo 的操盘手，再好的决策也拿不到预算。</p><p><b>Memo 五段结构：</b></p><ul><li><b>① 问题</b>：一句话 + 影响金额。</li><li><b>② 证据</b>：2–3 组关键数据，图表化。</li><li><b>③ 选项</b>：2–3 个，含各自的代价与风险。</li><li><b>④ 建议</b>：明确推荐 + 理由。</li><li><b>⑤ 预期与验证</b>：何时能看到什么、什么情况回滚。</li></ul><p><b>B2B 特别项：</b>把转化延迟讲透（本季度动作下季度见效），否则管理层会按电商节奏误判。</p><p><b>常见误区纠正：</b>「汇报全是指标名词」——无经营语言，老板听不懂；「承诺确定性」——不给置信区间与回滚，塌房之源；「隐藏数据局限」——日后爆雷信任崩塌；「决策后不回填」——track record 无法建立，下次更难拿预算。</p><p><b>类比：</b>Memo 像给投资人看的商业计划书——你不是在讲「广告多难投」，是在讲「投这笔钱能赚回多少、风险多大、多久见分晓」。老板是出钱的人，要的是回报与风险，不是技术细节。</p>",
m:"<p><b>为什么需要专门训练，机制链：</b></p><ul><li>① <b>投放复杂度需「翻译」</b>：CTR/CPL 是过程指标，老板要的是边际毛利与回收周期。</li><li>② <b>预期管理防误判</b>：B2B 延迟下，本季动作下季见效，不讲透老板会按周追问「为什么没单」。</li><li>③ <b>回填建立 track record</b>：说中了积累信任，说错了复盘偏差，决策资产复利。</li></ul><p><b>数字演算（预期管理的量化）：</b>提议「法国市场加码 40% 预算」。若只说「法国机会大」→ 老板无感。Memo 写法：问题 = DE 组触天花板、增量机会法国（影响：放弃法国 = 年损失估算 $50k 边际毛利）；证据 = 六维评分法国 8.2 + 探测期有效 CPL 达 DE×1.1；选项 = A 维持（保守）/ B 加码 40%（推荐）/ C 双轨试点；建议 = B，25% 预算起步；预期 = 3 个月有效 CPL 收敛至 DE×1.3，6 个月边际毛利为正；回滚线 = 若 4 周 Cohort 显示 Qualified Rate <30% 则退回 25%。把模糊的「机会」变成带数字、带回滚的承诺。</p><p><b>与 L0 呼应：</b>延迟讲透呼应 L0-07 长周期归因；回滚呼应 L10-01 决策环；金额折算呼应 L8-06 经营报表。</p>",
h:"<p><b>写 Memo 纪律 checklist：</b></p><ul><li>① <b>金额先行</b>：问题与建议都折算成钱（边际毛利/损失）。</li><li>② <b>置信度诚实</b>：说清数据局限（样本量、延迟、Cohort 口径）。</li><li>③ <b>预期管理</b>：明确延迟（B2B 效果成熟期 1–3 个月）。</li><li>④ <b>附一页数据附录</b>供深查（六维评分、Cohort 表、经营报表）。</li><li>⑤ <b>决策后回填「实际 vs 预期」</b>：建立你的 track record。</li></ul>",
cs:"某工业设备「法国市场加码」Memo 实绩：问题 = DE 天花板、增量机会法国（六维评分 + 探测数据）；建议 = Q4 加 40% 预算；预期 = 3 个月内有效 CPL 收敛至 DE×1.3，6 个月边际毛利为正；验证点与回滚线写明。获批后每季度回填，两年累计建立「说什么成什么」的信任资产——后续任何加码申请审批时间从 2 周缩短到 2 天，因为 track record 已经替他背书。这正是 Memo 的复利：第一次难，第十次易。</p>",
f:"论坛投手的「向老板汇报」痛点高频出现（老板只看 CPL、课程反复出现的「老板视角」题）——Memo 方法是把这些痛点工程化。论坛里「小强打法」的分享帖本身就是一份好 Memo（问题/方案/数据/边界齐全），课程把它提炼成五段标准结构，让每个操盘手都能稳定产出。</p>",
e:"<ul><li>汇报全是指标名词——无经营语言，老板听不懂也不批。</li><li>承诺确定性——不给置信区间与回滚，塌房之源。</li><li>隐藏数据局限——日后爆雷，信任崩塌。</li><li>决策后不回填——track record 无法建立，下次更难拿预算。</li><li>B2B 不提延迟——老板按周追问「为什么没单」，误判后砍预算。</li></ul>",
q:{q:"你要提议「把优化事件从 Lead 切到 Qualified」。写出 Memo 五段的每段一句。",a:"五段推理：① 问题——Lead 量大质杂，销售超载，有效询盘成本连续两月上升（折算月损失 X 元）；② 证据——周 Qualified 32 个达样本线（见 L0-05 学习期）、历史 Qualified 客户成交率 4×于非 Q；③ 选项——A 维持现状 / B 切 Qualified（预期 Lead -25%、有效成本 -15%，有 2–4 周波动期）/ C 双轨试点；④ 建议——B，25% 预算试点起步（呼应 L0-05 小步）；⑤ 预期与验证——4 周 Cohort 判读，回滚线 = Spend 崩 50% 两周不恢复。注意把「2–4 周波动期」写进预期，防止老板误判短期下滑。"},
b:"为你当前最重要的投放决策写一页 Memo 并实际提交（含五段 + 金额折算 + 回滚线）。"},
{id:"L10-05",lv:10,t:"日 / 周 / 月操盘节奏",
g:"建立操盘的节奏感：每天 10 分钟、每周 1 小时、每月半天，各自看什么、做什么。",
c:"<p><b>操盘的最高境界不是「随时盯盘」，是「制度化巡检」。</b>问题在固定的检查点被捕获，而不是在崩盘时被火烧。节奏感保护了两件事：深度工作不被打断，和「过度干预」的冲动被约束。</p><p><b>三层节奏：</b></p><ul><li><b>日（10 分钟）</b>：花费 pacing、异常告警（自动规则触发）、拒审通知——只处理「红灯」，不做优化。</li><li><b>周（1 小时）</b>：指标拆解（见 L6-02）、Breakdown 审计、素材状态更新、决策日志复盘。</li><li><b>月（半天）</b>：组合再平衡（见 L7-06）、市场排序复查、经营报表（L8-06）、口径审计（L6-13）。</li></ul><p><b>常见误区纠正：</b>「无节奏全天盯盘」——焦虑驱动 + 干预过度（每天改 = 重置学习期，见 L0-05）；「周会开成汇报会」——没有决策与回填；「月度事项被日常挤掉」——再平衡永远「下周做」；「节奏有了但内容随意」——巡检变打卡。</p><p><b>类比：</b>操盘节奏像身体的体检 schedule——每天量体温（日级红灯）、每周称体重看趋势（周级拆解）、每半年做全面体检（月级再平衡）。你不因为今天体温 36.8 就改食谱，也不因为半年没体检就忽略身体。节奏让「反应模式」升级为「巡检模式」。</p>",
m:"<p><b>节奏的本质 = 把反应模式升级为巡检模式，机制链：</b></p><ul><li>① <b>问题在制度化检查点被捕获</b>：而不是在崩盘时被火烧（火烧时往往已损失整批预算）。</li><li>② <b>节奏保护深度工作</b>：日级时间不碰优化决策（见 L6-06 纪律的日程化），避免「手痒改广告」。</li><li>③ <b>节奏即复利</b>：周度决策日志 + 月度再平衡，让组合效率连续爬升，而非时好时坏。</li></ul><p><b>数字演算（无节奏的代价）：</b>无节奏账户，操盘手日均打开后台 6 次、平均每周手动改动 11 次——按 L0-05，频繁改动不断重置学习期，等效每月损失约 15% 的潜在转化（行业估算）。制度化后，日级只处理红灯（平均每周触发 1.2 次真实异常），优化决策全部集中在周会——改动频次降到每周 1–2 次且每次单变量。半年对比：制度化账户有效 CPL 降 22%，且「半夜救火」从月均 4 次降到 0。节奏省下的不是时间，是钱。</p><p><b>与 L0 呼应：</b>日级不碰优化呼应 L0-05 学习期纪律；月级再平衡呼应 L7-06；口径审计呼应 L6-13 与 L0-03 EMQ。</p>",
h:"<p><b>日程模板 checklist：</b></p><ul><li>① <b>每日早 10 分钟</b>：告警面板 + 异常三查（pacing/拒审/前端健康），只处理红灯。</li><li>② <b>每周五 1 小时</b>：周报 + 决策日志复盘 + 下周计划（含动作排序，见 L10-03）。</li><li>③ <b>每月第一个周五半天</b>：月报 + 组合再平衡（L7-06）+ 口径审计（L6-13）+ 经营报表（L8-06）。</li><li>④ <b>每季度 1 天</b>：预算评审 + 年度素材规划（见 L8-08）。</li><li>⑤ 全部进日历，例外才加班——节奏是纪律不是建议。</li></ul>",
cs:"某工业设备节奏实绩：制度化前「半夜救火」月均 4 次（CPL 异常才被发现，往往已烧一周）；制度化后归零——日级告警面板在异常 2 小时内就标红，周会固定产出 3 条决策日志，月度再平衡让组合效率连续 5 个季度爬升（季度环比 +6%~+11%）。最实在的改变：操盘手不再「手痒改广告」，学习期稳定（见 L0-05），模型不被频繁重置。节奏即复利——它把「运气好不出事」变成「制度保证不出事」。</p>",
f:"论坛自律型投手的共同点：「素材每周评级复盘」、三段盯盘时点（消耗 <$5 看点击 / $5–10 看人群 / $10–30 看转化）、规则化加预算——优秀个案都有节奏；课程的贡献是把它变成全团队可执行的日历。论坛靠「个人自律」，课程靠「制度节奏」，后者可复制、可继承。</p>",
e:"<ul><li>无节奏全天盯盘——焦虑驱动 + 干预过度，频繁重置学习期。</li><li>周会开成汇报会——没有决策与回填，开了等于没开。</li><li>月度事项被日常挤掉——再平衡永远「下周做」，组合劣化。</li><li>节奏有了但内容随意——巡检变打卡，走过场。</li><li>日级时间碰优化决策——手痒改广告，破坏 L0-05 纪律。</li></ul>",
q:{q:"周三上午发现某组 CPL 突涨 40%。按节奏该做什么、不该做什么？",a:"推理：① 日级动作——查告警原因（自动规则触发详情）、确认 pacing 与前端健康、判断是否触发 L6-07 阈值；② 若样本不足或属波动带内→记录并等待周度检视（呼应 L0-05 静默期，给模型时间）；③ 不该做的——当场改素材/调预算/动受众（日级时间禁碰优化决策，否则重置学习期）；④ 若触发阈值且样本足→启动 L6-01 排查流程，但动作仍按决策环（L10-01）执行，而非凭直觉乱改。节奏的意义就是「把冲动关进检查点的笼子里」。"},
b:"把三层节奏（日/周/月）落成你的真实日历，并坚持一个月，记录「救火次数」变化。"},
{id:"L10-06",lv:10,t:"复盘与知识库沉淀",
g:"建立「经验→知识→资产」的转化机制：让每一次成败都变成组织的复利。",
c:"<p><b>投放的波动性会让「没有记录的经验」被随机事件改写记忆。</b>幸存者偏差 + 归因美化，让你以为「那次是因为我换了个标题才成的」，其实只是周期波动。写下来的结论才可被证伪、可被继承——知识库是团队唯一不会被算法更新带走的资产。</p><p><b>沉淀三层：</b></p><ul><li><b>① 决策日志</b>（L10-01）：原始记录，每条决策可追溯。</li><li><b>② 月度复盘</b>：按主题归并，什么假设被验证/证伪。</li><li><b>③ 知识库</b>：沉淀为 SOP/清单/案例卡，新人可检索。</li></ul><p><b>B2B 特别项：</b>客户异议库与素材假设库（见 L1-06）必须联动更新——异议是素材的下一版选题，素材是异议的应答武器。</p><p><b>常见误区纠正：</b>「复盘开成甩锅会」——不对假设只对人；「结论不落库」——三个月后原样重犯；「知识库只进不出」——无人检索 = 坟场；「过时内容不标注日期」——新人当真理。</p><p><b>类比：</b>知识库像医院的病例库——每个病人的诊疗记录沉淀下来，下一个相似病例一来，医生翻库就能少走弯路。不沉淀的团队，每个新人都是从零得同一种病。</p>",
m:"<p><b>为什么必须沉淀，机制链：</b></p><ul><li>① <b>波动性改写记忆</b>：不记录的「经验」会被随机涨跌重新叙述，幸存者偏差让你记错因果。</li><li>② <b>写下来才可证伪、可继承</b>：假设「德语区要本地化」被记下来，下次直接验证，而非从头猜。</li><li>③ <b>知识库 = 抗算法更新的资产</b>：Meta 改版千百次，你的失败与成功记录是永恒的。</li></ul><p><b>数字演算（沉淀的复利）：</b>团队一年做 40 个决策。若不沉淀：40 个经验随人走、随记忆漂，第二年重复踩坑，等效「每年重新交学费」。若沉淀：月度聚合复盘算胜率与偏差模式（如发现「总在样本不足时行动」这类系统性偏差），把 5 个重复问题升格为 SOP（消灭第二类成本），把 3 个验证结论写进假设库反哺素材计划——第二年开局就站在「本年度十大数据结论」的起点上。复利模型：首年沉淀成本 C，次年节省重复试错成本 3C，第三年 5C…知识库的 ROI 随时间指数增长。</p><p><b>与 L0 呼应：</b>决策日志呼应 L10-01；假设库呼应 L1-06；口径标注呼应 L6-13 与 L0-03 EMQ。</p>",
h:"<p><b>月度复盘 SOP checklist：</b></p><ul><li>① <b>过决策日志算胜率与偏差模式</b>：如「总在样本不足时行动」「总在转点加预算」。</li><li>② <b>更新假设库</b>：验证/证伪状态（呼应 L1-06）。</li><li>③ <b>把重复出现的问题升格为 SOP</b>：消灭第二类成本（反复犯同一错）。</li><li>④ <b>季度删旧</b>：过时参数/政策引用标注日期（如「2026-03 归因规则前」）。</li><li>⑤ <b>知识库结构</b>：按 Level 章（本课程结构）+ 按问题类型双索引，确保可检索。</li></ul>",
cs:"某工业设备知识库片段：「德语区素材本地化清单 v4」「展会周投放 SOP」「Qualified 定义 v3 + 历史变更」。新人两周上手的核心不是「教」，是「给他可检索的失败与成功记录」——一个新人遇到「德国客户询盘少」，搜「德语区」直接调出 v4 清单照做，不必重踩前人的坑。最值钱的是「历史变更」记录：Qualified 定义从 v1 到 v3 的每次改动原因与后果都写着，避免「好了伤疤忘了痛」式回退。</p>",
f:"论坛本身就是巨型知识库（311 页手册、错误代码大全、学习路径帖都是社区沉淀物）——veryfb 的价值证明了沉淀的复利。个人/团队层面做同样的事，就是把论坛的公共红利私有化：社区靠热心课代表整理，你靠制度化 SOP 沉淀。论坛的「错误代码速查」就是知识库工程的典范——把散落各帖的坑集中成可检索表，课程把这套方法内化为每月复盘的纪律。</p>",
e:"<ul><li>复盘开成甩锅会——不对假设只对人，结论无法复用。</li><li>结论不落库——三个月后原样重犯，学费白交。</li><li>知识库只进不出——无人检索 = 坟场，写了等于没写。</li><li>过时内容不标注日期——新人当真理，按旧政策操作踩雷。</li><li>决策不回填胜率——track record 缺失，无法识别系统性偏差。</li></ul>",
q:{q:"你的团队今年做了 40 个决策。如何让它们「值回票价」？",a:"用三层沉淀推理：① 月度聚合复盘——算胜率、偏差模式（如「总在样本不足时行动」）、被验证/证伪的假设清单；② 把 5 个重复出现的问题升格为 SOP（消灭第二类成本，不再反复交学费）；③ 把 3 个最有价值的验证结论写进假设库并反哺素材计划（呼应 L1-06）；④ 年度输出「本年度十大数据结论」——这就是明年开局的起点优势。决策的价值不在发生时，在被复用时——不沉淀的 40 个决策只是 40 次记忆漂移。"},
b:"完成一次月度复盘全流程，产出至少 1 条升格 SOP 与 1 条更新到假设库的验证结论。"}
);
