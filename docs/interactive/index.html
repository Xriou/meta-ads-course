cs:"<p><b>某工业设备 · 阻力→Angle 实战：</b></p><ul><li>阻力「售后怎么办（买了没人管）」× 证据「海外备件仓＋48h 响应记录」＝ <b>「48h 全球备件响应」Angle</b>；</li><li>阻力「安装太复杂（要打混凝土基座）」× 证据「现场安装团队＋钢平台方案」＝ <b>「48 小时装好」Angle</b>。</li></ul><p><b>结果：</b>前者（48h 响应）素材在德国市场跑出全账户最高 Qualified Rate——因为德国客户最怕「设备停了找不到人」，这条 Angle 正戳中其最大顾虑。后者（48h 装好）在EPC 总包商群体转化突出。两条 Angle 逻辑完全不同（响应速度 vs 安装效率），可并行测试互不干扰。</p>",
f:"<p>论坛的电商选品思维有个迁移价值：「亚马逊能跑的品，独立站通常也能跑」——本质是用平台已有信号验证「需求确实存在」。B2B 版本就是：「用询盘邮件/销售录音里的客户原话，验证阻力确实存在」。阻力不是你猜的，是客户自己说出来的；Angle 从客户原话里长出来，才不会跑偏。另一个印证：论坛反复强调「老品不行往往是思想问题」——这里的「思想」就是 Angle 级创新，而非换个图。把阻力当矿脉、把客户原话当凿子，才能挖出真正有效的 Angle。</p>",
e:"<ul><li>从产品参数倒推 Angle（自嗨，没有回应任何阻力）；</li><li>阻力靠猜、不做销售访谈（Angle 脱离真实客户语言，素材像在自言自语）；</li><li>承诺无法兑现（如写「终身免费维修」但根本没体系）——Ad Quality 反噬、信任崩塌（见 L0-06）；</li><li>把所有阻力揉成一条素材（焦点稀释，哪个痛点都没打透）；</li><li>只做技术类 Angle，忽略采购/合规类（漏掉决策链上其他关键角色）。</li></ul>",
q:{q:"销售反馈客户最怕「买了以后没人管」。请生成 2 个 Angle 并各配 Proof。",a:"步骤：① 锁定阻力＝售后可达性（买了没人管）；② 找你真实能拿出的证据；③ 把证据翻译成承诺式 Angle。产出：①「48h 全球备件响应」+ Proof＝备件仓照片与响应时效记录（化解「找不到人」）；②「终身远程技术支持」+ Proof＝工程师上门安装视频、客户感谢案例（化解「不会用」）。两 Angle 逻辑不同（响应速度 vs 支持深度），可并行测，互不替代。关键是 Proof 必须真实存在，不能凭空编。"},
b:"产出 5 条「阻力×证据→Angle」清单，其中至少 3 条来自真实客户原话；每条 Angle 都能指到一条可验证证据。"},
{id:"L3-03",lv:3,t:"Hook Engineering（前 3 秒工程）",
g:"系统掌握 Hook 的类型学与写法，让素材在滑动决策中幸存。",
c:"<p><b>Hook（钩子）是素材前 3 秒的「抓人点」，它决定用户是停还是滑走。</b>信息流里用户的决策是毫秒级的滑动，前 3 秒留不住人，后面再好的 Proof 也没人看到。必须先纠正一个普遍误区：<b>Hook 的 KPI 不是点击，而是 3 秒完播/停留</b>。点击是后链路的事，Hook 只负责「让人停下并愿意继续看」。</p><p><b>Hook 的五种类型学：</b></p><ul><li><b>冲突型（反常识）</b>：打破认知，例如「你花 20 万做的混凝土基座，其实可以不要」；</li><li><b>损失型（风险点破）</b>：点名痛点，例如「污水处理厂最怕的 3 个深夜电话，你中过几个？」；</li><li><b>身份型（点名你是谁）</b>：例如「专业某工业设备制造商提醒你……」；</li><li><b>结果型（数字前置）</b>：例如「同样的池子，我们的叶轮 3 年没堵过」；</li><li><b>提问型（痛点发问）</b>：例如「你的某工业设备上次清淤停机几天？」。</li></ul><p><b>误区纠正：</b>最典型的烂 Hook 是用「公司名/产品名」开场（「XX 公司成立于 2008 年……」）——这是自我视角，用户凭什么关心你？Hook 必须瞬间回答用户内心的「关我什么事」。</p>",
m:"<p><b>机制链（为什么 Hook 如此关键）：</b></p><ul><li>① 信息流里用户是「滑动决策」，前 3 秒决定生死；</li><li>② 不同 Hook 会筛选出不同人群——同一产品，损失型 Hook 吸引正在经历痛的人，结果型 Hook 吸引做选型的技术员；</li><li>③ 所以 Hook 即隐形的定向：它替你决定「谁停下来」，这是 L4-09 Audience×Creative Fit 在素材侧的根源，也是 Andromeda「素材即定向」的具体落地（见 L0-08）。</li></ul><p><b>数字例子：</b>假设一个受众池有 10 万潜在相关用户，其中「正在经历停机痛」的只有 1 万、「做选型的技术员」有 2 万。损失型 Hook 可能从 1 万人里捞出高意图者，结果型 Hook 从 2 万人里捞出早期研究者。<b>选错 Hook＝把广告推给了错的那批人</b>，前端 CTR 也许不差，但后端 Qualified Rate 会崩——这正是 L0-06 里「EAR（预估行动率）」由内容与人群匹配度共同决定的体现。</p>",
h:"<p><b>Hook 写法 checklist：</b></p><ul><li>① 从 L3-02 的阻力库里挑最痛的一条作为 Hook 内核；</li><li>② 用「数字＋否定/反常识」重构，例如「别再花 20 万做混凝土基座」；</li><li>③ 视频把 Hook 放前 3 秒（0–3s 必须出现冲突点），单图把 Hook 放首图大字；</li><li>④ 每个 Angle 至少配 2 个不同类型 Hook（如损失型＋结果型）做 A/B；</li><li>⑤ 测试时每组 Hook 绑定同一 Angle、同一 Proof，只变 Hook 一个变量（见 L3-08 三级分类）；</li><li>⑥ 验收：每条主力素材前 3 秒能一句话复述「它戳中了哪条阻力」。</li></ul><p><b>节奏数字：</b>每条素材 Hook 时长 ≤3 秒（视频）；每个 Angle 储备 ≥4 个 Hook 文案（2 类型×2 写法）；Hook 迭代周期 ≤2 周一次（见 L3-13 疲劳）。</p>",
cs:"<p><b>某工业设备 · Hook 对决（真实数据）：</b>同一个「免堵叶轮」Angle，测两条不同 Hook——</p><ul><li>身份型：「专业某工业设备制造商」（自报家门）→ CTR 0.9%；</li><li>损失型：「污水处理厂最怕的 3 个深夜电话，你中过几个？」（点名痛点）→ CTR 2.4%。</li></ul><p>后者 CTR 是前者的 2.6 倍，因为它直接点名了使用者（运维主管）的真实恐惧。<b>关键洞察：</b>身份型 Hook 吸引的是「泛行业好奇党」，损失型 Hook 吸引的是「正在经历停机痛的人」——后者后端 Qualified Rate 显著更高，印证「Hook 即隐形定向」。</p>",
f:"<p>论坛的「换头不换身」术是 Hook 工程的最佳注脚：爆款素材衰退后，切掉前 3 秒、换一个冲突感更强的画面或热门 BGM，FB 当成新素材重新分配流量——说明 <b>Hook 是素材寿命的第一变量</b>。社区新手剪辑框架也强调「素材核心数据指标优化」与「意识流」，且都以「开头」为核心。另一印证：论坛盯盘里「高 CPM＋高点击＝高价值人群」的判断，本质是在看 Hook 有没有把对的人筛进来——Hook 写错，进来的人就错了，盘面立刻失真。</p>",
e:"<ul><li>用公司名/产品名开场（自我视角，用户无感）；</li><li>Hook 与落地页断裂（点进来发现对不上，误导体验扣 Ad Quality，见 L0-06）；</li><li>一个 Hook 包打天下（不同 Hook 吸引的人群质量不同，必须分测）；</li><li>把 Proof 当 Hook（开头就甩证书，用户还没停下就被劝退）；</li><li>Hook 太长（前 5 秒还没进入冲突点，滑动已经发生了）。</li></ul>",
q:{q:"给「免堵叶轮」Angle 写 2 个不同类型的 Hook，并预测各自吸引的人群差异。",a:"步骤：① 锁定 Angle 内核＝化解「清淤停机」阻力；② 选两种 Hook 类型；③ 预测人群差异。产出：损失型「清一次淤要停机 3 天？你的某工业设备选错了」——吸引正在经历停机痛的运营方（更急、Qualified 可能更高）；结果型「同样的池子，我们的叶轮 3 年没堵过」——吸引做选型的技术员（更早阶段、研究期）。差异本质：损失型筛「痛得正在找解药的人」，结果型筛「在比参数的人」，前者意图更强、后者体量更大，需分别测 CTR 与 Qualified Rate 再定预算分配。"},
b:"为 3 个 Angle 各写 2 个不同类型 Hook，并设计对应测试组（每组只变 Hook 一个变量），说清每条 Hook 戳中的是哪种人群。"},
{id:"L3-04",lv:3,t:"Message 结构与文案",
g:"掌握 Hook 之后的正文结构（Problem→Solution→Proof→CTA），让说服链条完整。",
c:"<p><b>Hook 把人留住后，正文（Message）要完成「说服链条」。</b>标准四段式是 Problem（放大问题）→ Solution（给出方案，即你的 Angle）→ Proof（堆证据，见 L3-05）→ CTA（行动指令，见 L3-06）。缺任何一段，链条就断：有方案无证据＝空喊，有证据无 CTA＝看了不行动。</p><p><b>B2B 文案的特殊要点：</b></p><ul><li><b>具体名词 ＞ 形容词</b>：「304 不锈钢叶轮」远胜「优质材料」——具体词才能被专业人群验证；</li><li><b>可验证数字</b>：写「47 国项目、连续运行 3 年」，不写「行业领先」；</li><li><b>专业术语筛选人群</b>：术语是天然门槛，看不懂的人划走，反而留下目标角色。</li></ul><p><b>误区纠正：</b>形容词堆砌（「卓越、高效、可靠」）是最常见也最无效的写法——它无法被验证，等于「没有信息」。另一条误区是「为了 CTR 写泛文案」：前端漂亮，后端崩（见 L0-08 漏斗，前端点击高但 LPV→Lead 率低）。</p>",
m:"<p><b>机制链（文案的 Qualifying 功能）：</b></p><ul><li>① 专业术语与具体名词会自动「过滤」非目标人群（看不懂的人划走）；</li><li>② 所以 B2B 文案的 CTR 低，有时反而是好事——它把泛流量劝退，留下的是目标角色；</li><li>③ 留下的目标角色，其 LPV→Lead 率与 Qualified Rate 更高，有效 CPL 反而更低。</li></ul><p><b>数字例子：</b>假设泛文案 CTR 3%、但 100 个点击只来 2 个 Lead（LPV→Lead 2%）；专业文案 CTR 1.5%、但 100 个点击来 6 个 Lead（6%）。专业文案 CTR 只有前者一半，单位流量产出却是 3 倍。<b>这就是 L0-08 说的「CTR 冠军可能是询盘倒数」</b>——文案承担的是 Qualifying，不是吸睛。</p><p><b>与 L0 的钩稽：</b>文案方向感直接决定进线人群质量，论坛盯盘里「低 CPM 低点击＝垃圾受众、高 CPM 高点击＝高价值人群」的判断，底层就是文案/素材在替模型做人群筛选（呼应 L0-06 的 EAR 与 Ad Quality）。</p>",
h:"<p><b>正文写法模板 checklist：</b></p><ul><li>① 场景痛点一句（具体画面，如「市政污水厂的深夜爆停」）；</li><li>② 方案一句（你的 Angle，如「免堵叶轮设计」）；</li><li>③ 3 个证据点（数据/认证/案例，见 L3-05）；</li><li>④ 明确 CTA（见 L3-06，轻承诺优先）；</li><li>⑤ 每条文案只讲一个 Angle，不贪多；</li><li>⑥ 验收：删掉所有形容词后，剩下的具体名词与数字仍能独立传达卖点。</li></ul><p><b>节奏数字：</b>Feed 图文正文 80–120 词内；视频口播 15–40 秒配字幕；证据点固定 3 个（多了稀释焦点）；每条 Angle 储备 ≥2 版正文（不同角色视角）。</p>",
cs:"<p><b>某工业设备正文范例：</b>「市政污水厂的深夜爆停（场景痛点）→ 免堵叶轮设计（方案＝Angle）→ 1200+ 项目 / 47 国 / ISO+CE（3 个证据点）→ 获取免费选型方案（CTA）」。这条文案里「选型」二字是术语门槛，天然筛掉 C 端好奇党，只留真有采购意向的 B 端角色。<b>结果：</b>该文案 Qualified Rate 高于账户均值，有效 CPL 低于均值——因为它用专业度做了前置筛选。</p>",
f:"<p>论坛的素材剪辑三块框架（信息流混剪 / 核心指标优化 / 复盘迭代）强调「意识流」——即素材要顺着用户真实心理流动，而不是堆参数。这和四段式（Problem→Solution→Proof→CTA）是同一回事的不同说法。另一印证：论坛盯盘里「低 CPM 低点击＝垃圾受众」反向证明，文案/素材的方向感直接决定进线人群质量——文案越泛，进来的人越杂；文案越专业，进来的人越准。落地页优化里「带图评价、支付图标显眼」同样是在做「证据布置」，与 Proof 段呼应。</p>",
e:"<ul><li>形容词堆砌（无法验证＝不可信，等于没说）；</li><li>一条文案塞 3 个卖点（焦点稀释，用户记不住主诉求）；</li><li>为了 CTR 写泛文案（前端漂亮后端崩，见 L0-08）；</li><li>证据与 Angle 错配（讲售后却放产品图）；</li><li>CTA 缺失或模糊（看了不知道下一步做什么）。</li></ul>",
q:{q:"为什么 B2B 素材 CTR 比电商低反而可能是好事？",a:"步骤：① 认清文案的 Qualifying 功能——专业术语与具体名词会自动过滤非目标人群；② 看漏斗而非单点——泛文案 CTR 高但 LPV→Lead 率低，专业文案 CTR 低但 Qualified 率高；③ 算有效 CPL＝CPL÷Qualified Rate，专业文案更低。结论：B2B 文案在「筛人」而非「吸睛」，CTR 低但进来的都是目标角色，有效 CPL 反而更优。这是「前端漂亮、后端差」的反面（呼应 L0-08 的 First Loss 诊断）。"},
b:"按四段式重写一条现有文案，并指出它自动筛选掉了哪类人、留下了哪类人。"},
{id:"L3-05",lv:3,t:"Proof Architecture（证据体系）",
g:"构建分层的证据库，让每条素材「张口就有据」，系统性提升信任转化。",
c:"<p><b>Proof（证据）是信任的载体。</b>B2B 决策周期长、金额大，买家最怕「说了不算」——所以每条素材都要「张口就有据」。把证据建成四层体系，比零散堆证书有力得多：</p><ul><li><b>① 数据层</b>：数量/年限/性能数字（1200+ 项目、连续运行 3 年、47 国）；</li><li><b>② 权威层</b>：认证/检测报告/专利（ISO、CE、第三方检测）；</li><li><b>③ 案例层</b>：客户 logo/项目实拍/使用场景（俄罗斯项目 8 年运行视频）；</li><li><b>④ 人际层</b>：客户评价/员工出镜/工厂直播（德国客户评价、工程师出镜）。</li></ul><p><b>B2B 证据的特殊要求：</b>要「可转发性强」——使用者（如运维主管）需要把你的证据转发给决策者（老板/EPC）去说服内部，所以证据必须「拿得出手、转得过去」。</p><p><b>误区纠正：</b>「质量可靠、行业领先」这类空证等于没证——它无法被任何第三方验证。<b>没有证据层支撑的承诺，在 B2B 里一文不值</b>，还会触发 L0-06 的「误导体验」扣分。</p>",
m:"<p><b>机制链（Proof＝风险对冲物）：</b></p><ul><li>① 信任是 B2B 转化的主要瓶颈（比冲动消费难得多）；</li><li>② 每回应一种风险（来自 L3-02 的阻力），就配一类证据——风险与证据一一对应；</li><li>③ 证据越可验证、越具体，买家「敢买」的概率越高，后端 Qualified→Deal 率随之上升。</li></ul><p><b>数字例子：</b>一个「怕寿命短」的阻力，配「俄罗斯项目 8 年运行视频」（案例层）＋「叶轮材质检测报告」（权威层），比只写「寿命长」可信度高一个量级。假设两条素材 CTR 相同，有双层证据的素材其 Lead→Qualified 率可能从 35% 提升到 55%——因为证据提前消除了买家的风险顾虑。</p><p><b>与 L0 的钩稽：</b>证据真实可验证，才能避免「素材承诺与落地页/事实不符」的误导体验（L0-06 Ad Quality 三大构成之一）。证据体系既是转化工具，也是合规护栏。</p>",
h:"<p><b>建证据资产库 checklist：</b></p><ul><li>① 一次拍摄工厂/案例现场，剪出 20+ 条可用片段（一鱼多吃，见 L3-07）；</li><li>② 认证扫描件、检测报告、项目航拍归类存储，打标签便于检索；</li><li>③ 每季度更新一次（新项目、新认证、新评价）；</li><li>④ 素材生产时按 Angle 直接调用对应证据（如讲售后→调备件仓视频）；</li><li>⑤ 每条主力素材至少覆盖 2 层证据（数据层＋案例层是底线）；</li><li>⑥ 验收：随机抽一条素材，能指到具体证据文件，且证据真实可查。</li></ul><p><b>节奏数字：</b>每次拍摄产出 ≥20 条片段；证据库每季度更新 ≥1 次；单条素材证据点 2–3 个；人际层证据（客户出镜）≥3 条储备。</p>",
cs:"<p><b>某工业设备证据库实战：</b>团队把证据按四层归档——</p><ul><li>CE/ISO 证书 → 化解「合规资质」阻力；</li><li>俄罗斯项目 8 年运行视频 → 化解「寿命短」阻力；</li><li>德国客户评价 → 化解「信任」阻力。</li></ul><p>其中一支「工厂实景 60 秒」视频（人际层＋案例层叠加）成为全账户最强素材，因为它同时满足了「看见真实工厂」与「听见客户背书」双重信任需求。<b>结果：</b>该视频的 Qualified Rate 比纯图文素材高约 40%。</p>",
f:"<p>论坛品牌站案例里，KOL 混剪视频＋素材每周评级复盘的做法，本质是「人际层证据」的电商版——用真实用户的背书替代品牌自夸。落地页优化里「带图评价、支付图标显眼」同样是在做证据布置（电商语境的证据体系）。两者都印证：信任不是靠一句 slogan 建立，而是靠可验证、可转发的证据层层堆叠。社区「素材决定命运」的共识，背后很大一部分是「证据密度决定信任」。</p>",
e:"<ul><li>证据只存在销售手里（市场部拿不到，素材无米下锅）；</li><li>全用「质量可靠」式空证（无法验证，等于无证据）；</li><li>证据与 Angle 错配（讲售后却放产品图）；</li><li>证据过期不更新（用了三年前的案例，被客户识破）；</li><li>人际层证据缺失（只有证书没有真人背书，B2B 信任厚度不够）。</li></ul>",
q:{q:"「47 国项目案例」这个 Proof，怎么判断它对哪个角色最有效？",a:"步骤：① 明确证据对应的阻力＝供应商风险（怕你活不久、交付不了）；② 看角色——决策者/把关者（老板、EPC）最吃「规模与存续证明」，因为他们要对「选错供应商」负责；③ 技术员更关心性能数据而非规模，对该证据兴趣一般。用法：把它放进面向采购/EPC 的素材与落地页「实力区」，技术员素材改用性能数据（如连续运行年限）。核心是 Proof 与角色匹配（呼应 L1-02 人群分层）。"},
b:"盘点你的证据库四层覆盖情况，补齐最弱一层；随机抽 3 条素材确认证据真实可查且与 Angle 匹配。"},
{id:"L3-06",lv:3,t:"CTA 设计与转化意图",
g:"设计与客户决策阶段匹配的 CTA，平衡「转化率」与「线索质量」。",
c:"<p><b>CTA（行动号召）是漏斗的「入口阀门」——它决定什么样的人会进来。</b>CTA 不是越激进越好，而要与客户的决策阶段匹配。把 CTA 排成一条「光谱」：</p><ul><li><b>低承诺→高承诺</b>：看案例 / 下载选型指南 → 免费咨询 → 获取报价 → 预约工程师。</li></ul><p><b>核心规律：</b>CTA 越轻，进线量越大但质越低（随便看看的人也点）；CTA 越重，量越小但质越高（只有真有意向的人才肯填）。所以 CTA 必须与 Offer（见 L4-12）和优化事件（见 L0-02）对齐。</p><p><b>误区纠正：</b>「全账户只用一个万能 CTA（立即询价）」是大坑——不同决策阶段的人被强行拉到同一个重承诺，轻意向者被吓退、重意向者混入比价党，量质双双失控。</p>",
m:"<p><b>机制链（CTA＝意图水位阀门）：</b></p><ul><li>① CTA 的轻重直接决定进线者的「意图水位」；</li><li>② B2B 常见策略：素材用轻 CTA（看案例）广撒网，落地页内再推重 CTA（报价），形成两级筛选；</li><li>③ 轻 CTA 天然把低意向者筛在外面，只放真有需求的人进漏斗，后端 Qualified Rate 反而更高。</li></ul><p><b>数字例子：</b>同一批流量，用「立即询价」CTA 可能来 100 个 Lead 但一半是比价党（Qualified 35%）；改用「下载选型技术手册」CTA，Lead 降到 60 个但几乎都是真技术选型者（Qualified 58%）。<b>有效 CPL＝CPL÷Qualified Rate：</b>前者可能 $100、后者可能 $69——轻 CTA 看似量小，单位有效成本更低。这正是 L0-08 边际经济学视角：看有效成本，不看表面 Lead 数。</p><p><b>与 L0 的钩稽：</b>CTA 承诺若与落地页/实际服务断裂，会触发 L0-06「误导体验」扣分；CTA 的选择本质是优化事件的选择（见 L0-02 三连）。</p>",
h:"<p><b>CTA 选型三问 checklist：</b></p><ul><li>① 目标客户现在处于什么决策阶段？（刚认知→用轻 CTA；比价中→用中 CTA；准备采购→用重 CTA）；</li><li>② 销售团队承接力能吃多重的线索？（承接弱就别用重 CTA 引洪流）；</li><li>③ 优化事件选什么（点击/表单/消息）？三者对齐后定 CTA；</li><li>④ 冷流量用轻 CTA 广撒网，再营销/高意图人群用重 CTA；</li><li>⑤ 验收：每个分区（冷/温/热）都有对应轻重的 CTA，而非全账户一个。</li></ul><p><b>节奏数字：</b>CTA 光谱至少铺 3 档（轻/中/重）；冷流量 CTA 用轻承诺；再营销人群 CTA 可升到重承诺；表单问题 ≤3 道（见论坛经验，长表单劝退）。</p>",
cs:"<p><b>某工业设备 CTA 测试：</b>原 CTA「免费获取报价」Lead 多但一半是比价党；改为「下载选型技术手册」后——</p><ul><li>Lead 量 −40%（从 100 降到 60）；</li><li>Qualified Rate 从 35% → 58%；</li><li>有效 CPL 反降（量小质高）。</li></ul><p>轻 CTA 做了天然的意图筛选：只想比价的人懒得下载手册，真做选型的人愿意留资。<b>结论：</b>用轻 CTA 换「有效成本」而非「表面 Lead 数」。</p>",
f:"<p>论坛对应经验印证：入境游打法里的「微小代价前置筛选」（设问题、设情景让低意向者自己走掉）正是 CTA/Offer 级别的 Qualifying——用设计而非加量来筛人。另一印证：落地页「表单 3 道单选题优于长表单」，因为筛选靠「设计门槛」而非「填表量」。社区这些实操，本质都是在调 CTA/Offer 的轻重来平衡量质，与光谱逻辑完全一致。</p>",
e:"<ul><li>全账户只有一个万能 CTA（不匹配决策阶段，量质双失控）；</li><li>CTA 承诺与落地页断裂（点了「免费咨询」却跳到付费页，误导体验扣 Ad Quality，见 L0-06）；</li><li>只看 Lead 量不看意图水位（被表面数字骗）；</li><li>对冷流量用重 CTA（吓退潜在客户，浪费顶部流量）；</li><li>表单过长（超过 3 道必填，劝退真意向者）。</li></ul>",
q:{q:"客户要求「CTA 全改成立即询价，要多拿 Lead」。请用数据说话反驳。",a:"步骤：① 拆两级数据——询价 CTA 的 Lead 量高但 Qualified Rate 低（比价党混入），销售承接超载；② 算有效 CPL＝CPL÷Qualified Rate，询价 CTA 的有效成本反而更高；③ 提替代方案：保留询价给高意图再营销人群，冷流量用轻 CTA（如看案例/下载手册）筛选。用「有效 CPL 口径」而非「Lead 量口径」说服客户——多拿的 Lead 若全是比价党，只会拖垮销售与有效成本。"},
b:"为你的账户设计 CTA 光谱（轻→中→重三档），并说明每档分配到哪个流量分区（冷/温/热）。"},
{id:"L3-07",lv:3,t:"Creative Format Strategy（格式策略）",
g:"按渠道场景与信息类型选格式（图/视频/轮播/直播），而非「什么火做什么」。",
c:"<p><b>Format（格式）是信息的「载体」，选错载体，再好的 Angle 也传不出去。</b>把格式按「场景×信息类型」排成矩阵：</p><ul><li><b>单图</b>：Feed 快速信息传递，适合承诺型/参数型 Angle；</li><li><b>轮播</b>：多产品/多步骤，适合「多型号、多场景」展示；</li><li><b>短视频</b>：Reels/Stories 情绪与演示，适合需要「眼见为实」的 Angle；</li><li><b>长视频</b>：深度信任，适合工厂实拍/客户访谈；</li><li><b>直播</b>：高互动逼单，适合大促/答疑。</li></ul><p><b>B2B 特别项：</b>视频偏「演示与信任」（设备运行、安装过程），单图偏「参数与承诺」（规格、认证）。</p><p><b>误区纠正：</b>「只有图片素材」是 B2B 最大浪费——视频能承载「眼见为实」的演示，这是图文给不了的说服力。反过来，把 9:16 素材硬裁成 1:1 也会切掉关键信息（如设备全景）。</p>",
m:"<p><b>机制链（格式＝信息带宽）：</b></p><ul><li>① 格式决定「能承载多少信息」——视频能演示运行过程，图文只能声称；</li><li>② B2B 的「眼见为实」是图文给不了的，所以演示型 Angle 必须用视频；</li><li>③ 但视频制作成本高，要用「一鱼多吃」：一次拍摄剪出 10+ 变体（见 L3-05 证据库、L3-14 迭代）。</li></ul><p><b>数字例子：</b>一条「安装过程延时摄影」9:16 短视频，一次拍摄可剪出：Reels 版（15s）、Feed 版（30s）、Stories 版（多段）、以及 3 张截图做单图——1 次拍摄＝10+ 条素材，单位制作成本降到 1/10。<b>与 L0-08 的钩稽：</b>素材供给量本身是信号——论坛上「仙女座极度吃素材」，给系统的格式/素材多样性越足，跑量能力越强（见 L3-10）。</p>",
h:"<p><b>格式选择 checklist：</b></p><ul><li>① 按 Angle 需要的信息类型反推格式（演示型→视频；承诺型→单图；多型号→轮播）；</li><li>② 规格齐备：同素材出 1:1 / 4:5 / 9:16 三版喂 Adv+ Creative（系统自动选最优版位）；</li><li>③ 视频时长：Feed 15–30s，深度信任 60s+；</li><li>④ 轮播用于「多场景/多型号」展示（一次滑完讲清全貌）；</li><li>⑤ 直播留给大促/高客单答疑场景；</li><li>⑥ 验收：每个主力 Angle 都有「最适格式＋三版比例」覆盖。</li></ul><p><b>节奏数字：</b>每条素材出 3 种比例（1:1/4:5/9:16）；短视频 15–30s、深度信任 60s+；单次拍摄剪 ≥10 条变体。</p>",
cs:"<p><b>某工业设备格式实战：</b>「安装过程延时摄影」9:16 短视频——一条素材同时回应「安装复杂」阻力＋展示工厂实力。Reels 版投放后，CPL 比同 Angle 的图文组低 22%。<b>原因：</b>视频让客户「看见不堵、看见装得快」，演示型 Angle 用视频才叫「证明」，用图文只是「声称」。该素材同时产出 3 张截图做单图、1 条 60s 工厂版做信任素材，一鱼多吃。</p>",
f:"<p>论坛手册把格式分成图/视频/轮播/Collection 四类，与矩阵一致。剪辑框架提到「视频 15 秒左右、部分品类 ≥2 分钟」——说明时长没有标准答案，由「信息量与人群耐心」决定，和本课程「按信息类型反推格式」逻辑吻合。另一强印证：ASC 大预算下「视频 10 个＋1 文案」效果优于单素材，因为格式供给量本身是系统信号——素材/格式越多，模型可探索的组合越多（见 L3-10 多样化）。</p>",
e:"<ul><li>只有图片素材（浪费视频的信息带宽，演示型 Angle 无力）；</li><li>9:16 素材硬裁成 1:1（关键信息被切，说服力崩）；</li><li>格式跟风不做归因（不知道哪格式在赚钱）；</li><li>一条视频想覆盖所有 Angle（焦点稀释）；</li><li>忽略三版比例（只给 1:1，错过 Reels/Stories 版位）。</li></ul>",
q:{q:"「免堵叶轮」Angle 应该用什么格式？为什么？",a:"步骤：① 判 Angle 类型＝演示型（需要「看见不堵」）；② 反推格式＝短视频，因为图文只能「声称不堵」，视频能「证明不堵」（杂质通过、连续运行的过程证据）；③ 配 15–30s 前置「堵塞对比」Hook（见 L3-03）＋同素材出 1:1/4:5/9:16 三版喂 Adv+。结论：演示型 Angle 必须用视频承载，否则说服链条在「Proof」环节断掉。"},
b:"把现有 Angle 清单逐个映射到最适格式，找出格式缺口（哪些 Angle 只有图没有视频）。"},
{id:"L3-08",lv:3,t:"Concept vs Variation（真创新 vs 换皮）",
g:"建立判断标准：一次改动属于「新假设检验」还是「执行微调」，避免测试资源错配。",
c:"<p><b>测试资源有限，必须分清「新假设」和「微调」。</b>判断标准只有一句话：<b>这次改动是否改变了「说服逻辑、目标人群或信息类型」？</b>是→新 Concept（值得独立测试位）；否→Variation（可批量挂载，不占测试位）。</p><p><b>三类改动的标准定义：</b></p><ul><li><b>改变说服逻辑/人群/信息类型</b> → 新 Concept（L3 级，独立测试位）；</li><li><b>只换 Hook 或 Format，逻辑不变</b> → L2 变体（小测，同 Angle）；</li><li><b>只换文字/配色/裁剪</b> → L1 执行微调（批量做，看整体）。</li></ul><p><b>误区纠正：</b>「每个小改动都开新组」和「爆款衰退只做 L1 微调」是两个极端。前者造成「测试位通货膨胀」（预算被稀释），后者在该换 Hook/Angle 时不动（错失翻新）。</p>",
m:"<p><b>机制链（为什么分类影响成本）：</b></p><ul><li>① 测试位的真实成本＝预算 × 学习时间（见 L0-05，新组要重新走学习期）；</li><li>② 把变体当新概念测→稀释真正的新假设能拿到的预算与样本；</li><li>③ 把新概念当变体挂载→错过潜在赢家（它本该独立拿到学习机会）；</li><li>④ 两者都是资源浪费，所以分类必须前置。</li></ul><p><b>数字例子：</b>假设测试预算只够 5 个独立组。若你把 3 个 L1 微调各开一组，只剩 2 个位置给真正的新 Angle——新假设被饿死。正确做法：3 个 L1 微调挂在同一组批量跑，5 个位置全留给新 Angle/新 Hook 测试。<b>与 L0-05 的钩稽：</b>换素材会重置学习期，所以「该独立测的」才独立建组，「该挂载的」挂在原组，避免无谓的学习期重置。</p>",
h:"<p><b>三级改动分类 checklist：</b></p><ul><li>① <b>L1 执行微调</b>（文字/配色/裁剪/换模特）→ 批量挂载原组，看整体表现，不占测试位；</li><li>② <b>L2 Hook/Format 变化</b>（换前 3 秒、换视频/图）→ 小测，绑定同一 Angle；</li><li>③ <b>L3 Angle/Proof/Offer 变化</b>（换销售逻辑、换证据重心、换落地页承诺）→ 独立测试位（见 L3-12）；</li><li>④ 每次改动先打等级标签，再决定「挂载 or 独立」；</li><li>⑤ 验收：现有素材库 100% 打上 L1/L2/L3 标签（见 L3-09 组合管理）。</li></ul><p><b>节奏数字：</b>L1 微调可一次挂 5–10 条；L2 每次测 2–3 条；L3 独立测试位预算占比 ≥15%（见 L3-12）。</p>",
cs:"<p><b>某工业设备「48h 响应」Angle 的改动分级：</b></p><ul><li>把「48」改成「24」→ 只是数字微调，L1 变体，挂原组即可；</li><li>改成「免费上门安装」→ 承诺逻辑变了（从「响应快」变成「服务到现场」），L3 新 Angle，需独立测试位。</li></ul><p><b>启示：</b>前者不值得占稀缺测试资源，后者必须给独立学习机会，否则错过潜在赢家。</p>",
f:"<p>论坛「换头不换身」＝ L2 级变体操作（切前 3 秒、换 BGM，不占新测试位就能翻新素材），正是本模块 L2 分类的社区实践。另一现象：有人「抖音随便搜素材丢一大堆上去」，看似乱测，实质是把大量 L1/L2 变体丢进市场让系统优选——成本低但认知积累少，是假设库（L1-06）缺失时的打法。两种做法都印证：分清「变体」与「新概念」，才能把有限测试位留给真正的新假设。</p>",
e:"<ul><li>每个小改动都开新组（测试位通货膨胀，稀释新假设）；</li><li>爆款衰退后只做 L1 微调（该换 Hook/Angle 时不动，错过翻新窗口）；</li><li>说不清手头素材属于哪一级（无法排测试优先级）；</li><li>把 L3 新 Angle 当 L1 挂载（错过独立学习机会）；</li><li>变体太多不归类（组合管理失控，见 L3-09）。</li></ul>",
q:{q:"爆款素材衰退（Frequency 3.0、CTR 腰斩）。按三级分类给出处理顺序。",a:"步骤：① 先判类型——Frequency 高＋CTR 降，典型素材疲劳（见 L3-13）；② 按「先便宜后贵、先变体后新概念」顺序：先 L2（换 Hook/前 3 秒）重测，成本低；③ 若 L2 仍衰退→回溯该 Angle 是否已被人群消化，换 Angle（L3）或扩受众（Creative Fatigue vs Audience Saturation 区分见 L6 章）；④ 全程保留原组模型资产（L0-05），用复制新组而非原组硬改。顺序原则：能用 L2 解决就不上 L3，省测试位。"},
b:"把现有素材库全部打上 L1/L2/L3 标签，并说明每个 L3 新概念对应的独立测试位安排。"},
{id:"L3-09",lv:3,t:"Creative Portfolio（创意组合管理）",
g:"用「组合」思维管理素材库：按 Angle×Format×阶段 配比，而不是堆数量。",
c:"<p><b>素材库不是「越多越好」的仓库，而是需要配比的「投资组合」。</b>用三个维度管理组合：</p><ul><li><b>Angle 覆盖</b>：几条销售逻辑在跑（避免单点，见 L3-01）；</li><li><b>Format 配比</b>：图/视频/轮播的分布（见 L3-07）；</li><li><b>生命周期阶段</b>：引入/成长/成熟/衰退；</li><li><b>性能分层</b>：Winner / Steady / Testing / Retired。</li></ul><p><b>健康组合的标准：</b>每个主力 Angle 至少 2 条活跃素材防单点——一条衰退，另一条还能顶上。</p><p><b>误区纠正：</b>「只看单条素材 ROI」是组合思维缺失——单条赢家一直投到死，等它衰退才发现青黄不接；或者只看总量，某条素材占了 80% 消耗却无人察觉风险。</p>",
m:"<p><b>机制链（素材是「会衰减的资产」）：</b></p><ul><li>① 任何素材都有生命周期，Frequency 升高后必然衰退（见 L3-13）；</li><li>② 若组合里只有 1 条主力，它一衰退，账户消耗就断崖、模型抖动；</li><li>③ Portfolio 管理的目标＝让任一时刻都有足够的新陈代谢，消耗不因个别素材衰退而断档。</li></ul><p><b>数字例子：</b>假设账户 80% 消耗集中在 1 条素材。该素材 Frequency 升到 3.0、CTR 腰斩，账户 CPL 一周内从 $30 飙到 $60——这就是单点风险。<b>对照 L0-08 的「数据碎片化 vs 多样性」：</b>组合管理追求的是「Angle 维度的多样」，而非「同一 Angle 的 15 个变体」，后者是伪多样。</p>",
h:"<p><b>组合管理 checklist：</b></p><ul><li>① 建 Portfolio 看板：编号 / Angle / 格式 / 状态 / 数据 / 最后更新日；</li><li>② 健康指标：Testing 中素材占比 20–30%；每主力 Angle 活跃素材 ≥2 条；</li><li>③ 月度淘汰 C 类（衰退且无翻新价值的）素材；</li><li>④ 补新节奏：「每周 2–3 个新创意」防断供（见 L3-10、L3-14）；</li><li>⑤ 每周五更新状态列，素材断供风险一眼可见；</li><li>⑥ 验收：看板上无「单条占比＞50% 消耗」的孤点。</li></ul><p><b>节奏数字：</b>Testing 占比 20–30%；每主力 Angle ≥2 条活跃；每周补 2–3 新创意；月度淘汰 C 类。</p>",
cs:"<p><b>某工业设备 Portfolio 实战：</b>活跃素材 30 条，按「5 Angle × 平均 3 格式 × 2 阶段」排布。每周五更新状态列——</p><ul><li>Winner 区：5 条（各 Angle 主力）；</li><li>Testing 区：8 条（占 27%，达标）；</li><li>Retired 区：当月淘汰 4 条衰老素材。</li></ul><p>因为每 Angle 都有 ≥2 条活跃素材，没有单点依赖，素材断供风险一眼可见、提前补位。</p>",
f:"<p>论坛素材迭代帖（上千回复）的社群共识＝「素材决定命运」＋持续迭代；「每周 2–3 个新创意」被社区视为数据崩塌的临界点——低于这个节奏，账户素材老化、消耗掉量。社区所谓「素材疲劳→往原系列注入活水」，就是本模块的组合补新操作。这些实战经验共同指向一个结论：素材库要用组合思维经营，而非堆数量。</p>",
e:"<ul><li>只看单条素材 ROI 不看组合健康（断崖才发现青黄不接）；</li><li>Winner 一直投到死（不迭代不补位）；</li><li>Portfolio 用表格管理但从不更新（看板建了等于没建）；</li><li>Testing 占比过低（＜20%，新陈代谢不足）；</li><li>单条素材占比过高（＞50% 消耗，单点风险）。</li></ul>",
q:{q:"账户 80% 消耗集中在 1 条素材。风险是什么？怎么调整？",a:"步骤：① 识别风险＝单点依赖，该素材一旦衰减（必然发生）消耗断崖、模型抖动；② 调整＝保持该素材跑量的同时，把节省/新增预算投到「第二/第三 Angle 的新素材测试」上；③ 用 2–4 周把集中度降到 50% 以下，每主力 Angle 养出 ≥2 条活跃素材；④ 同步启动每周 2–3 新创意的补新节奏（见 L3-14）。目标不是砍掉赢家，而是降低对单条赢家的依赖。"},
b:"建起 Portfolio 看板并完成一次健康度评估（列出单点风险、Testing 占比、各 Angle 活跃数）。"},
{id:"L3-10",lv:3,t:"Creative Diversification（官方多样化要求）",
g:"理解 Meta 2026 对创意多样性的系统级偏好，把「多样化」变成可执行的生产标准。",
c:"<p><b>2025 起 Meta 官方力推「Creative Diversification（创意多样化）」：系统奖励多概念、多动机、多格式的供给。</b>在 Andromeda 算法下，「素材即定向」——你喂给系统的素材越多样，它能匹配的人群组合越多。</p><p><b>关键纠正：「多样化 ≠ 数量多」。</b>多样化是「信息维度的覆盖广度」：不同 Angle、不同 Hook 类型、不同格式、不同 Proof。20 条全是同一 Angle 的图，叫「伪多样化」；5 条分别覆盖 5 个 Angle，才是真多样化。</p><p><b>官方术语对齐：</b>Diversification 与 Creative Breadth（创意广度）同义，是 Meta 2026 系统级偏好，不是可选项。</p><p><b>误区纠正：</b>「AI 批量产 20 张同质图」是最典型的伪多样化——看起来量大，维度却只有一个，在 Andromeda 下是系统性劣势。</p>",
m:"<p><b>机制链（系统为什么奖励多样性）：</b></p><ul><li>① 多样化素材＝更多「人群×内容」匹配组合；</li><li>② 模型可探索的空间更大，总价值（Total Value，见 L0-06）更高、更稳定；</li><li>③ 单一素材在 AI 时代是系统性劣势——它只覆盖一种人，一旦这类人饱和即断崖（见 L0-08 碎片化与疲劳）。</li></ul><p><b>数字例子：</b>假设系统有 10 类潜在相关人群。单一 Angle 素材只匹配其中 2 类；5 Angle 多样化素材匹配 8 类。后者不仅总量更大，且单类饱和时其他类还能续命——抗衰减能力天差地别。<b>与 L0-06 的钩稽：</b>Total Value＝Bid×EAR＋Ad Quality，多样化提升的是 EAR 的覆盖广度（更多人群被准确预测为高行动率）。</p>",
h:"<p><b>多样化生产标准 checklist：</b></p><ul><li>① 每月新素材中，新 Angle ≥30%（见 L3-01 生成流程）；</li><li>② 新 Hook 类型 ≥30%（见 L3-03 五类型）；</li><li>③ 新格式 ≥20%（见 L3-07 矩阵）；</li><li>④ 同 Angle 的变体不超过总量 40%（防伪多样）；</li><li>⑤ 用 Portfolio 看板（L3-09）的维度列做自检；</li><li>⑥ 验收：用「Angle×Hook×Format」三维分布审计，无单维独大。</li></ul><p><b>节奏数字：</b>新 Angle ≥30%、新 Hook 类型 ≥30%、新格式 ≥20%、同 Angle 变体 ≤40%；每月按三维分布排产。</p>",
cs:"<p><b>某工业设备月度素材计划（按 diversified 标准排产）：</b>2 条新 Angle（土建成本、免堵叶轮之外的新逻辑）＋ 2 个新 Hook 类型（实验身份型以外）＋ 1 条工厂长视频（新格式）＋ 若干 L1/L2 变体（控制在 40% 内）。<b>结果：</b>投放两个月后，账户「抗衰减能力」明显提升——某条主力素材衰退时，其他 Angle 的素材平滑接棒，整体 CPL 波动从 ±35% 收窄到 ±15%。</p>",
f:"<p>论坛数据侧强印证：ASC「素材格拉满（10 个视频＋1 文案）比单素材好、更稳定」；社区说「仙女座极度吃素材」——早期玩家就发现「喂给系统的素材多样性」与跑量能力正相关。这些实战观察正是 Meta 官方 Diversification 政策的民间先声。结论一致：把素材多样性当成生产标准，而非碰运气。</p>",
e:"<ul><li>把「多」当「多样」（20 条同 Angle＝伪多样化）；</li><li>多样化做成大杂烩（没有 Portfolio 逻辑，维度混乱）；</li><li>只用 AI 批量产同质图（见 L3-11，维度单一）；</li><li>同 Angle 变体超 40%（挤占新 Angle 空间）；</li><li>新维度占比不审计（凭感觉排产）。</li></ul>",
q:{q:"「我们每月产 40 条素材够多样化了吗？」——你怎么审计？",a:"步骤：① 不看数量看维度，拆三维分布：40 条里 Angle 分布？Hook 类型分布？Format 分布？② 若 30 条是同一 Angle 的图，多样化不达标（伪多样）；③ 用标准卡：新 Angle≥30%、新 Hook≥30%、新格式≥20%、同 Angle 变体≤40%；④ 补最薄的维度（如 Angle 太少就加新 Angle，格式太少就加视频）。结论：多样化是维度广度问题，不是数量问题。"},
b:"为下月素材计划按三维分布（Angle×Hook×Format）排产，并说明每条对应哪个维度缺口。"},
{id:"L3-11",lv:3,t:"AI 辅助创意与 2026 合规标注",
g:"用好 AI 创意工作流提效，同时守住 2026 AI 披露合规与品牌一致性两条线。",
c:"<p><b>AI 是创意杠杆，但 2026 年起它多了一条「合规绳子」。</b>先把 AI 的能力边界划清：</p><ul><li><b>AI 能做的</b>：背景扩展/变体生成（Adv+ Creative 内置 Muse Image 等）、脚本初稿、多语言文案、批量单图、静态图从视频提取；</li><li><b>AI 做不好的</b>：真实证据（工厂/案例/人物，见 L3-05）、品牌调性一致性、B2B 专业性的把关。</li></ul><p><b>合规红线（2026 硬约束）：</b>2026-07-07 起，Meta 政策扩大——任何用第三方 AI 工具（如 Adobe Photoshop 生成式填充、Midjourney、Canva AI）创建或「大幅修改」的广告，必须标注「AI 生成」；2026-06-01 起 Meta 已通过 C2PA 元数据自动检测并给第三方 AI 生成的广告打「AI info」标签（在广告三点菜单的「About this ad」里）。若广告含逼真 AI 生成人物，标签会直接出现在「Sponsored」旁边而非藏在菜单里。<b>违规＝拒审/账户风险，抵不过任何效率收益。</b></p><p><b>误区纠正：</b>「AI 图直接上线不标注」在 2026 是硬违规；「让 AI 自由发挥 Angle」更错——Angle 必须来自市场研究（L3-01/02），AI 只能执行不能决策。</p>",
m:"<p><b>机制链（合规为什么是硬约束）：</b></p><ul><li>① Meta 用 C2PA 元数据自动识别 AI 生成/大幅修改内容（文件自带「怎么被改过」的痕迹）；</li><li>② 2026-07-07 政策要求广告主自披露第三方 AI 工具的使用，未披露＝审核不通过；</li><li>③ 自动检测＋自披露双管齐下，AI 内容「想不标都不行」——文件本身会告诉平台发生过什么；</li><li>④ EU 附加 DMA/DSA/AI Act 强执行，合规边界只会更严。</li></ul><p><b>数字例子：</b>一张用 Photoshop 生成式填充换了背景的产品图，其 C2PA 元数据记录了「AI 修改」。上传 Ads Manager 后，即使你没手动标，系统也可能自动打标；若你用了 AI 却手动隐藏、被判定未披露，广告直接拒审、反复违规还会触发账户处罚。<b>与 L3-10 的钩稽：</b>AI 批量产同质图还制造「伪多样化」，既违规又低效，双重踩坑。</p><p><b>与 L0-06 的关联：</b>AI 生成内容若与事实不符（如虚构设备结构），属「误导体验」，同样扣 Ad Quality——合规与质量在此交汇。</p>",
h:"<p><b>AI 工作流 checklist（人定方向→AI 执行→人审合规）：</b></p><ul><li>① <b>人定</b> Angle 与 Proof（L3-01/05）——AI 不决策卖点；</li><li>② <b>AI 批量</b>出变体与文案初稿（背景扩展、多语言、单图）；</li><li>③ <b>人审</b>专业性与合规——技术准确性必须工程师把关（B2B 致命点）；</li><li>④ <b>标注上线</b>——凡 AI 生成/大幅修改，走 Meta 自披露流程打「AI 生成」标签；保留 C2PA 元数据，不要试图剥离；</li><li>⑤ <b>数据回喂</b>——表现好的 AI 变体回填假设库；</li><li>⑥ 验收：上线前查 AI 标注合规检查项（是否用了 AI、是否大幅修改、标签是否就位）。</li></ul><p><b>节奏数字：</b>AI 仅用于背景/排版等低专业风险环节；关键说服点（设备结构、性能数据）必须用真实照片/视频；每条 AI 素材过「技术准确性审核」关卡（工程师签字）。</p>",
cs:"<p><b>某工业设备 AI 实战：</b>用 AI 扩展产品背景图批量做 Feed 图，省下约 70% 美工时间；但核心「安装实拍」视频坚持真拍——因为技术员客户对「假图」极度敏感，一眼识破即信任崩塌。<b>合规操作：</b>所有 AI 扩展的背景图在上传时走自披露流程标注「AI 生成」，保留 C2PA 元数据。<b>结果：</b>效率提升的同时零拒审，品牌信任未受损。</p>",
f:"<p>论坛早期有「用 AI 批量产单图＋Advantage+ 强化投放交给系统决定」的正面案例，说明 AI 素材确实能提效。但 2026 的强制 AI 标注（7 月起第三方工具也必须披露）是论坛时代还没碰到的新变量——当年「悄咪咪用 AI」现在必须「明着标」。社区经验可复用的是「AI 产图＋系统优选」的效率部分，必须叠加的是合规标注这条新护栏。Muse Image（Meta 自研图像模型，2026-07-07 进入 Advantage+ Creative）目前由平台自动处理标注，但用第三方工具仍要自披露。</p>",
e:"<ul><li>AI 图直接上线不标注（2026 硬违规，拒审/账户风险）；</li><li>AI 生成设备细节失真（B2B 致命，技术员一眼识破＝信任崩塌）；</li><li>让 AI「自由发挥」Angle（Angle 必须来自市场研究，L3-01/02）；</li><li>全盘拒绝 AI（效率差距会复利，对手用 AI 你不用必落后）；</li><li>剥离 C2PA 元数据躲标注（政策红线，且平台能识别）。</li></ul>",
q:{q:"客户投诉素材里的泵体结构「一看就是 AI 编的」。事故根源与流程修补？",a:"步骤：① 溯源＝AI 产出未经技术审核直接上线，B2B 受众的专业眼光是隐形审核员；② 根因＝工作流缺「技术准确性」关卡；③ 修补＝AI 素材增加工程师签字的「技术准确性审核」关卡；真实照片/视频用于关键说服点（设备结构、性能）；AI 仅用于背景/排版等低专业风险环节；④ 合规补漏＝确认该素材已按 2026 政策标注「AI 生成」。结论：AI 提效的边界是「不碰专业真实性」。"},
b:"搭好「人定方向→AI 执行→人审合规」流程，并列出你的 AI 标注合规检查项（是否用 AI、是否大幅修改、标签是否就位、C2PA 是否保留）。"},
{id:"L3-12",lv:3,t:"Creative Testing 体系（测试池与预算分配）",
g:"建立标准化的素材测试机制：进什么、怎么测、判什么、毕业标准。",
c:"<p><b>测试不是「丢进去看谁赢」，而是有纪律的「小样本假设检验」。</b>先搭测试池：</p><ul><li><b>独立 Testing 区</b>（见 L2-02）：与放量区分开，避免污染（见 L0-05，测试素材乱入放量 CBO 会抢量、还会重置学习）；</li><li><b>组预算 ABO</b>：每组独立预算，可控可比；</li><li><b>每组 3–4 条</b>：常用 1-1-3 / 1-1-4 结构（避免 1-1-5 时个别素材首日不花钱被忽略）；</li><li><b>每条绑定假设编号</b>：测的是哪个 Angle/Hook（见 L3-08 分级）。</li></ul><p><b>预算与时长标准：</b>单条测试预算＝1.5–2× 目标 CPL（给足转化机会）；测试时长＝凑够约 30–50 个优化事件，或 7–14 天。</p><p><b>误区纠正：</b>「测试素材直接丢进放量 CBO」会污染主线且抢量；「测 2 天就下结论」样本不足，纯属掷骰子。</p>",
m:"<p><b>机制链（测试的统计本质）：</b></p><ul><li>① 测试是小样本假设检验，预算不允许追求统计完美，追求「方向性结论＋快速迭代」；</li><li>② 判据必须分层：前端（CTR/Hook 存留）诊断「注意力」，后端（Lead/Qualified Rate）判「生死」；</li><li>③ 单看 CTR 或单看 Lead 都会误判——必须两层联动（见 L0-08 漏斗与 L0-06 EAR）。</li></ul><p><b>数字例子：</b>单条测试预算设为 1.5×目标 CPL。若目标 CPL $40，则每条给 $60 测试预算；1-1-4 组共 4 条＝ $240/期。7–14 天内若凑够 30–50 个 Lead 事件，就能对「哪条 Hook 吸引对的人」下方向性结论。<b>与 L0-05 的钩稽：</b>测试组独立建、不频繁改，正是为了不乱重置学习期——每次重大修改都浪费一次学习机会。</p>",
h:"<p><b>测试 SOP checklist：</b></p><ul><li>① 假设入池并编号（如「H-07：损失型 Hook ＞ 身份型 Hook，针对运维主管」）；</li><li>② 生产素材：同 Angle 下 2 个 Hook（见 L3-03），或同受众下 3 个 Angle（见 L3-01）；</li><li>③ 跑 7–14 天，期间前 48 小时静默（L0-05）；</li><li>④ 判读：CTR 高＋Qualified 低＝钩子错人（改 Hook/人群）；CTR 低＋LPV 高＝Hook 弱内容强（换前 3 秒）；</li><li>⑤ 结论回填假设库（L1-06），胜出者毕业进 Scaling 区；</li><li>⑥ 验收：每条测试都对应一个可证伪的假设编号。</li></ul><p><b>节奏数字：</b>单条预算 1.5–2×CPL；每组 3–4 条；时长 7–14 天或 30–50 事件；测试预算占总预算 10–15%。</p>",
cs:"<p><b>某工业设备月度测试节律：</b>每月 2 批 × 3 条新素材，测试预算占 15%。「土建成本」Angle 在第 1 批测 2 个 Hook（损失型 vs 结果型），结果型胜出→第 3 批验证胜出→毕业进 Scaling 区放量。<b>结果：</b>3 个月内从测试池稳定毕业 4 条主力素材，账户有效 CPL 下降约 18%。</p>",
f:"<p>论坛「养蛊」框架完整版：1-1-3 / 1-1-4 同台竞价→跑出好数据的单独拉出新系列冲量→重复优中选优，与本模块测试池逻辑完全一致。测品预算纪律（单组 $5–10、48h 无动静停、单品总预算 $50–80 止损）是电商版测试纪律，B2B 按 CPL 折算即可：小预算快速试错、给足事件再下结论、不行就止损换假设。社区这些经验共同说明——测试要有「池子、编号、判据、毕业」四件套。</p>",
e:"<ul><li>测试素材直接丢进放量 CBO（污染＋抢量，见 L0-05）；</li><li>测 2 天就下结论（样本不足，方向性都谈不上）；</li><li>测试结果从不回填（每次从零开始，假设库空转）；</li><li>一条组塞 5+ 素材（首日不花钱的被忽略，见 L0-08 碎片化）；</li><li>单看 CTR 判赢家（忽略后端 Qualified，见 L0-08）。</li></ul>",
q:{q:"测试组跑 7 天：素材 A CTR 2.8% 但 0 Lead；素材 B CTR 1.1% 出 4 Lead。结论？",a:"步骤：① 分层判读——A 前端亮眼（CTR 高）但后端崩（0 Lead），说明 Hook 强但吸引错人/落地断裂，查 LPV→Lead 率与人群；② B 前端不起眼但后端有转化，假设初步验证；③ 动作：B 继续积累进放量观察；A 换 Hook 类型或修落地页匹配后二测；④ 核心：判断必须分层（前端诊断注意力、后端判生死），不能单看 CTR 或单看 Lead。这正是 L0-08 漏斗诊断的应用。"},
b:"写出你的测试 SOP（入池标准/预算/时长/判据/毕业条件），并跑通一轮带假设编号的测试。"},
{id:"L3-13",lv:3,t:"Creative Fatigue 诊断",
g:"准确识别素材疲劳，并与受众饱和、季节波动区分开。",
c:"<p><b>Creative Fatigue（素材疲劳）是素材的「自然衰老」，但常被误判。</b>先认准三个信号：</p><ul><li><b>Frequency 升至 2.5–3.0+</b>：同一批人反复看到；</li><li><b>CTR 持续下滑</b>：如 3% → ＜1%；</li><li><b>CPC 上升</b>：如 $0.5 → $1.5。</li></ul><p><b>关键纠正：Frequency 高 ≠ 一定疲劳。</b>小受众里高频曝光可能是正常的再营销；必须「Frequency ＋ 用户响应」联动判断——只有频次高「且」响应（CTR/负面反馈）变差，才是真疲劳。</p><p><b>误区纠正：</b>「数据一波动就换素材」会打断正常学习期（L0-05）；「Frequency 高就恐慌」则忽略了人群规模——大受众高频也未必疲劳。</p>",
m:"<p><b>机制链（疲劳为什么是恶性的）：</b></p><ul><li>① 同一人群反复曝光→注意力衰减＋负面情绪上升；</li><li>② CTR 降、负面反馈升→ Ad Quality 降（见 L0-06 三大构成：负面反馈/误导体验/诱导点击）；</li><li>③ Ad Quality 降→ 系统给的总价值降→ CPM 反升、展示变少；</li><li>④ 恶化是链式的，越拖越贵。</li></ul><p><b>数字例子：</b>素材 Frequency 从 1.5 升到 3.2，CTR 从 1.8% 掉到 0.9%，CPC 从 $0.6 涨到 $1.4。按 L0-06 公式，Ad Quality 下滑直接拉低总价值，系统减少展示——若不干预，CPL 会螺旋上升。<b>与 L0-08 的钩稽：</b>疲劳是「频次↑＋响应↓」的组合判断，单看频次会误杀健康素材。</p>",
h:"<p><b>疲劳诊断四步 checklist：</b></p><ul><li>① 看 Frequency 趋势（是否突破 2.5–3.0）；</li><li>② 看 CTR/CPC 联动（是否同步恶化）；</li><li>③ 排除外部因素（季节/竞争/政策，如 2026-06 Meta 两次宕机造成的假衰退）；</li><li>④ 分疲劳类型：素材看吐（换 Hook/换血，L2 级）vs 人群饱和（换受众/扩市场，见 L4-08）；</li><li>⑤ 验收：每次「换素材」前都走完四步，留判断依据链。</li></ul><p><b>节奏数字：</b>Frequency 警戒线 2.5–3.0；CTR 衰退阈值约 3%→＜1%；CPC 警戒约 $0.5→$1.5；换血周期 ≤2 周一次（见 L3-14）。</p>",
cs:"<p><b>某工业设备德国组实战：</b>Frequency 3.2、CTR 从 1.8% → 0.9%。走诊断四步：① Frequency 破线；② CTR 同步掉；③ 排除季节/竞争；④ 判定＝素材看吐（非人群饱和，因受众池仍大）。处理：换损失型 Hook 后 CTR 回到 2.1%，无需换 Angle——L2 级修复即可解决，省下重测新 Angle 的成本。</p>",
f:"<p>论坛量化指标直接可用：Frequency＞2.5~3.0＝看吐；CTR 3%→＜1%、CPC $0.5→$1.5＝该换血；「大预算容易只吃一两天、流量衰退很快」——放量越猛衰减越快，Portfolio 补新（L3-09/14）要跟上。社区这些数字与本模块阈值完全吻合，是可复用的实操标尺。注意 2026-06 Meta 两次宕机曾造成「伪疲劳」诊断，排查时要先排除平台事故。</p>",
e:"<ul><li>数据一波动就换素材（打断正常学习期，见 L0-05）；</li><li>Frequency 高就恐慌（先看人群规模与响应，大受众高频未必疲劳）；</li><li>换素材时连受众一起改（无法归因，分不清疲劳还是饱和）；</li><li>只看 CTR 不看的 CPC/负面反馈（误判）；</li><li>忽略外部因素（季节/竞争/平台宕机当成本身疲劳）。</li></ul>",
q:{q:"CTR 从 2% 降到 1.6%，Frequency 2.2。是疲劳吗？",a:"步骤：① 看 Frequency＝2.2，未到 2.5+ 警戒线；② 看降幅＝2%→1.6% 仅跌 20%，在正常波动区间（7 日内 ±20% 属常态）；③ 排除外部（CPM 是否同涨？是否新人群进入？）；④ 结论＝大概率不是疲劳，观察即可。呼应「When Not to Act」原则：没到阈值不动作，避免打断学习期（L0-05）。只有 Frequency↑＋CTR 持续↓ 同时出现才判疲劳。"},
b:"用四步法诊断一次真实衰退，写出判断依据链（Frequency/CTR/CPC/外部因素/疲劳类型）。"},
{id:"L3-14",lv:3,t:"Creative Iteration（Winner 复制链路）",
g:"建立 Winner → 变体 → 二次 Winner 的迭代生产线，让成功可复制而非偶然。",
c:"<p><b>爆款不是终点，而是「迭代生产线」的起点。</b>把 Winner 的价值榨干、复制、再突破，才是素材经济学的核心。迭代链路：</p><ul><li><b>Winner → 换 Hook</b>（Angle 不变，L2 级，见 L3-03）；</li><li><b>→ 换 Format</b>（视频/图/轮播，见 L3-07）；</li><li><b>→ 换 Proof 侧重</b>（换证据组合，见 L3-05）；</li><li><b>→ 新市场本地化</b>（语言/场景）；</li><li><b>→（全部迭代完）→ 新 Angle 补位</b>（组合新陈代谢，见 L3-09）。</li></ul><p><b>误区纠正：</b>「Winner 直接复用半年不迭代」必然衰退（见 L3-13）；「迭代时同时改 Hook＋Format＋受众」则无法归因——每次只动一个变量才是正确姿势。</p>",
m:"<p><b>机制链（为什么迭代能延续成功）：</b></p><ul><li>① Winner 之所以赢＝「Angle×人群×执行」组合被正确验证；</li><li>② 迭代的价值＝保留已验证的部分（Angle/人群）、只动一个变量（Hook/Format/Proof）；</li><li>③ 既延续成功又探索边界，与 L3-08 三级分类衔接（L2 级每次只变一个变量）；</li><li>④ 全部迭代完→必须上新 Angle，否则组合老化（见 L3-09/10）。</li></ul><p><b>数字例子：</b>一个 Winner 跑 2 个月后 Frequency 升到 2.8。若只复用不迭代，CTR 会从 2% 跌到 1% 以下（疲劳）。按链路迭代：第 1 周出 2 个 Hook 变体（防疲劳）、第 3 周加新 Proof 版——Winner 的「有效寿命」从 2 个月延长到 5 个月，单位获客成本下降约 30%。</p>",
h:"<p><b>Winner 迭代排期 checklist：</b></p><ul><li>① Winner 毕业后立即排迭代排期，不要等衰退；</li><li>② 第 1 周：出 2 个 Hook 变体（同 Angle，L2）；</li><li>③ 第 2 周：出 1 个新 Format（如图文转视频）；</li><li>④ 第 3 周：出新 Proof 版本（换证据组合）；</li><li>⑤ 同时启动替代 Angle 测试（组合新陈代谢，见 L3-09）；</li><li>⑥ 验收：原版与新变体并行一段时间（保留其模型与评论资产），不急于关原版。</li></ul><p><b>节奏数字：</b>Winner 毕业后 ≤1 周启动迭代；每周一个变量；全程并行不关原版；每 Winner 至少迭代 3 轮再上新 Angle。</p>",
cs:"<p><b>「土建成本」Winner 的迭代史：</b>原版（图）→ 损失型 Hook 视频版 → 泰国语本地化版 → 加「客户实拍基座对比」Proof 版。<b>结果：</b>单 Angle 撑起 5 个月主力消耗，期间通过迭代把疲劳点不断推后，有效 CPL 稳定。当所有变体都跑过一遍后，团队启动新 Angle（「免停机保交期」）补位，组合完成新陈代谢。</p>",
f:"<p>论坛「素材疲劳→往原系列不断补新素材（注入活水）」与素材工业线帖子，整体即本模块的迭代方法论。社区「每周 2–3 新创意＋换血技巧」是执行层工具——和本模块「Winner 迭代＋组合补新」完全同构。这些实战经验说明：爆款要「养」成生产线，而非「中」一次彩票。</p>",
e:"<ul><li>Winner 直接复用半年不迭代（必然衰退，见 L3-13）；</li><li>迭代时同时改 Hook+Format+受众（无法归因，分不清哪个变量有效）；</li><li>只迭代 Winner 不测新 Angle（组合老化，见 L3-09/10）；</li><li>Winner 一有波动就关原版（丢失模型与评论资产）；</li><li>迭代无排期（想到才做，错过最佳翻新窗口）。</li></ul>",
q:{q:"Winner 的 Hook 变体上线后表现超过原版。下一步？",a:"步骤：① 原版与新变体并行一段时间（不急于关原版，避免损耗其积累的模型与评论资产）；② 把新 Hook 的「类型结论」回填假设库（如损失型＞结果型？见 L3-12 回填）；③ 按迭代链路继续下一个变量（Format 或 Proof），并同步启动新 Angle 测试（组合新陈代谢，见 L3-09）；④ 核心：迭代是「保留验证部分＋动一个变量」的连续过程，不是一次性的。"},
b:"为你的最新 Winner 写出 4 步迭代排期表（第1周 Hook / 第2周 Format / 第3周 Proof / 并行启动新 Angle）。"},
{id:"L3-15",lv:3,t:"Creative Economics（素材经济学）",
g:"用全漏斗指标给素材定价：从「哪条素材好看」升级到「哪条素材赚钱」。",
c:"<p><b>素材评估不能靠「好不好看」，要靠「赚不赚钱」。</b>建立四层指标：</p><ul><li><b>① 注意力层</b>：CTR / Hook 存留（前端，诊断注意力）；</li><li><b>② 转化层</b>：CPL / LPV→Lead 率（中段，诊断承接）；</li><li><b>③ 质量层</b>：Qualified Rate / 有效 CPL（CPL÷Qualified Rate，见 L3-06）；</li><li><b>④ 价值层</b>：边际 Deal Cost / 边际利润贡献（后端，诊断业务价值）。</li></ul><p><b>误区纠正：</b>「按 CTR 排英雄榜」是最大的误判——注意力≠钱（见 L0-08，CTR 冠军可能是询盘倒数）。B2B 转化有延迟，关停「慢热」素材会误杀（要按 Cohort 看，见 L0-07）。</p>",
m:"<p><b>机制链（四层指标常互相矛盾）：</b></p><ul><li>① CPL 最低的素材可能质量最差（钩来比价党，见 L3-06）；</li><li>② Qualified CPL 最低的也可能不是最终赢家（还要看规模能力与边际）；</li><li>③ 所以素材排序必须用「业务价值口径」，而非单点指标；</li><li>④ 决策看边际（见 L0-08 边际经济学）：新增预算的边际 Qualified CPL，比平均 CPL 更重要。</li></ul><p><b>数字例子：</b>素材 A CPL $28（最便宜）但 Qualified 22%→有效 CPL $127；素材 C CPL $42 但 Qualified 61%→有效 CPL $69。按有效 CPL 重排，C 才是真赢家。<b>再往下问边际：</b>若给 C 翻倍预算后 Qualified Rate 掉到 45%，其边际有效 CPL 升到 $93，仍低于 A 的 $127——C 拿增量预算仍合理（呼应 L0-06 的 EAR 与 L0-08 边际）。</p>",
h:"<p><b>素材周报模板 checklist：</b></p><ul><li>① 每条活跃素材列出：CPL / Qualified Rate / 有效 CPL / 周消耗 / 边际表现；</li><li>② 红黄绿分级：绿＝维持＋缓迭代；黄＝观察＋准备接替；红＝暂停（组内替换，少关停让系统优胜劣汰，见 L3-09/14）；</li><li>③ B2B 用 Cohort 看转化延迟（不按当天 Lead 判生死，见 L0-07）；</li><li>④ 与 CRM 数据打通（Qualified 口径来自后端，非前台）；</li><li>⑤ 验收：周报含四层指标，且做过一次预算重分配。</li></ul><p><b>节奏数字：</b>周报每周更新；红黄绿三档；有效 CPL＝CPL÷Qualified Rate；边际口径决策扩量（见 L0-08）。</p>",
cs:"<p><b>某工业设备素材月度核算：</b></p><ul><li>素材 A：CPL $28（最便宜）但 Qualified 22% → 有效 CPL $127；</li><li>素材 C：CPL $42 但 Qualified 61% → 有效 CPL $69。</li></ul><p>按有效 CPL 重排后，C 获得翻倍预算，A 降权观察。<b>结果：</b>账户整体有效 CPL 下降约 25%，因为预算从「看起来便宜但质量差」的 A 移到了「单位有效成本真低」的 C。<b>这正是 L0-08 边际视角的落地。</b></p>",
f:"<p>论坛同构经验：盯盘三段法（消耗 $5 / $5–10 / $10–30 分别看点击/人群/转化）＝分层评估的实操版；「先算盈亏平衡 ROI 再看 ＞2 及格 ＞3 扩量」＝给素材/品定价的业务口径。社区这些做法与四层指标逻辑一致——不看表面数字，看「有效成本」与「边际价值」。另一印证：论坛「少关停慢热素材、让系统优胜劣汰」与本章「红黄绿分级、少关停」完全吻合。</p>",
e:"<ul><li>按 CTR 排英雄榜（注意力≠钱，见 L0-08）；</li><li>关停「慢热」素材（B2B 转化延迟，需按 Cohort 看，见 L0-07）；</li><li>素材评估与 CRM 数据脱节（Qualified 口径失真）；</li><li>只看平均 CPL 不看有效 CPL（被便宜但低质的素材骗）；</li><li>扩量只看平均不看边际（边际成本爆表还在加，见 L0-08）。</li></ul>",
q:{q:"素材 A：CPL $30、Qualified 30%；素材 B：CPL $45、Qualified 60%。谁该拿更多预算？",a:"步骤：① 算有效 CPL：A＝30÷0.30＝$100，B＝45÷0.60＝$75→B 单位有效成本更低；② 再问边际：B 的规模能力（预算翻倍后 Qualified Rate 守得住吗）与边际变化（新增部分的边际 Qualified CPL）；③ 若 B 边际仍低于 A 平均→B 拿增量预算，A 观察或降权；④ 核心：排序用「有效 CPL＋边际」双口径，而非表面 CPL 或单点 Qualified（呼应 L0-06 与 L0-08）。"},
b:"把素材周报升级为四层指标版，并据此做一次预算重分配（用有效 CPL 与边际口径）。"}
);

</script>
<script>
/* ===== 数据文件 4：Level 4 受众 + Offer + 版位 + 消息（16 个） ===== */
MODULES.push(
{id:"L4-01",lv:4,t:"受众架构总览",
g:"建立「受众=约束设计」的总架构：Prospecting / Retargeting / Customer List / Exclusion 四层各司其职。",
c:"<p><b>把受众想成「你给模型的约束」，而不是「你找到的人」。</b>这是 2026 年受众策略的第一次认知升级。老派思路是：我是个猎人，要把广告精准投给那 100 个会买的人——于是拼命堆兴趣词、堆排除词，越窄越得意。新思路是：我给 Meta 一个「约束范围」，系统在范围内用它的信号找「商业上最有价值的人」。约束太死，系统没空间学；约束太松，系统可能乱跑。四层架构就是帮你把「该紧的地方」和「该松的地方」分开管理。</p><p><b>四层各自干什么：</b></p><ul><li><b>Prospecting（拉新层）</b>：负责找到从未接触过你的新客户。常用 Broad（宽泛受众）、兴趣、Lookalike。目标是「扩」，约束只保留必要的地理、语言、年龄下限，把探索空间让给模型。</li><li><b>Retargeting（收割层）</b>：负责把「已经来过、有意图信号」的人临门一脚转化。数据源是网站访客、主页互动者、视频观看者。它天然质量高，但人群只出不进，必须靠拉新持续供给。</li><li><b>Customer List（客户名单层）</b>：你已有的成交客户与询盘客户。用途有三：①作为 Lookalike 的种子；②作为排除名单；③作为高价值再营销源。它是「业务事实」进广告系统的接口。</li><li><b>Exclusion（排除层）</b>：把不该再看广告的人挡在外面——已成交客户（别浪费预算）、已询盘未成交（交给 RT 单独承接）。排除层是数据卫生的基础设施，防止预算漏水和模型污染。</li></ul><p><b>一个常见误区：</b>「四层」不是四个独立账户，而是同一账户里按「约束松紧」划分的四个区域。很多人把拉新和收割混在一个组里跑，结果高质量转化信号把模型「带偏」去只找便宜的回头客，拉新的探索能力被废掉。分层的本质，是让每一层各学各的、互不污染。</p><p><b>类比</b>：四层像一家店的「前台揽客 / 柜台成交 / 会员档案 / 黑名单」。揽客的不该去服务会员，会员不该再被揽客广告骚扰——分工错了，整家店效率崩。官方术语里这四层对应 Prospecting、Retargeting、Custom Audience、Exclusion，是新版创建流里 Audience 板块的四个默认位置。</p>",
m:"<p><b>为什么「分层」本质是「约束设计」？</b>回到 L0-02 的目标三连：Objective 决定模型大方向，Event 决定学什么。同一账户里如果拉新组和收割组共用一个优化事件（比如都优化 Lead），模型面对两种完全不同的人群分布，却被要求「学同一件事」——这就是信号污染。分层的机理是把「不同意图水位的人」隔离开，让每层的数据分布干净。</p><ul><li>① <b>拉新层</b>：优化事件最好是原始 Lead（量够、学得快，对应 L0-05 的 50 事件/周门槛）；模型在大范围内探索，对应 L0-08「窄受众=数据碎片化、学得差」的底层原因——Broad 给模型大样本，学得快。</li><li>② <b>收割层</b>：优化事件可用更深的动作（如 Qualified Lead 或 Purchase，见 L5 章）；模型在小范围高意图人群里精收，但要警惕增量陷阱（见 L4-06）。</li><li>③ <b>排除层</b>：用 Customer List 把已成交客户从拉新层剔除——算一笔账：假设成交客户继续看到拉新广告，每 1000 次展示浪费一份 CPM 且混入转化信号，模型会以为「老客户转化」是拉新功劳，虚拉学习。</li></ul><p><b>数字演算</b>：某 B2B 账户月消耗 $3000，未排除已成交客户时约 8% 预算（约 $240/月）打在已成交客户身上；排除后这部分预算回到真实拉新，等效把拉新 CPL 压低约 8%。这就是排除链的「免费增量」——不花一分钱，靠架构设计把效率提上来。</p>",
h:"<p><b>动手顺序（先画架构图，再建组）：</b></p><ul><li>① 画四层架构图：拉新区（约束=国家+语言+年龄下限，Broad 为主）、收割区（约束=行为人群，如 30/14/7 天访客）、客户名单区（CRM 导出）、排除链（每层排除下游）。</li><li>② 拉新区受众规模下限：使用 Broad 时不人为卡窄，地理范围至少覆盖目标国全境；若用兴趣/LAL，种子人群下限 100–1000 人（按国别，见 L4-04）。</li><li>③ 预算档位：新市场冷启动单组 $20–50/天；成熟市场主力组 $100–300/天；收割层占整体消耗 10–20%（安全上限见 L4-06）。</li><li>④ B2B 必配排除项：每月 1 号同步一次「已成交客户名单」到排除层；每季度刷新一次 Lookalike 种子；已询盘未成交 90 天名单单独建 RT 组承接。</li><li>⑤ 验收：建组后 48 小时静默期（L0-05），首周看各层消耗占比是否健康，拉新层应占 70% 以上，排除链命中率（被挡人数）应持续大于 0。</li></ul>",
cs:"<p><b>某工业设备（B2B 工业设备）四层架构落地：</b></p><ul><li><b>Prospecting</b>：主投 Broad（仅约束德国/奥地利/瑞士+德语+年龄下限 25），不堆兴趣词。</li><li><b>Retargeting</b>：30 天官网访客 + 主页互动者，频次上限 4/周。</li><li><b>Customer List</b>：CRM 导出 312 个成交客户（含国家字段）做 LAL 1% 种子 + 排除源。</li><li><b>Exclusion</b>：排除「已成交客户名单」（每月 1 号同步）+「已询盘未成交 90 天名单」（单独立 RT 组承接，不进拉新）。</li></ul><p>时间线：第 1 月搭好四层；第 2 月发现未排除名单时约 8% 预算打水漂，排除后拉新有效 CPL 从 $61 降到 $56；第 3 月起 RT 组单独承接 90 天询盘名单，该组有效 CPL 仅为拉新的 1/3，成为高转化金矿。三层架构让账户从「一笔糊涂账」变成「可分层优化」。</p>",
f:"<p>论坛老手的「四组结构」——兴趣 / Lookalike / 再营销 / 通投，都只跑 Feed+Story+Reels 同版位——本质上就是四层架构的实操切分。社区把「通投 / 空投」（不开受众、交给系统找人）叫做「最小约束」的社区表达，和课程的 Broad 思路完全同构。多条学习路径帖反复强调：账户框架思维（先想清楚四层怎么分）优先于任何定向技巧——先把架构搭对，再谈怎么调受众。社区还流行「横向激进纵向保守」（多建组测、加预算要慢），正好配合分层后每层独立验证。老手们共识：一个市场打透优于到处撒网，框架先于技巧。</p>",
e:"<ul><li>拉新与收割混跑（同组同事件），高质量转化信号互相污染，模型学歪；</li><li>从不上传客户名单，排除层与 LAL 种子双双缺失，等于把「业务事实」挡在系统门外；</li><li>受众建了从不清人数与重叠（见 L4-07），多个组自相残杀抬价；</li><li>排除名单一年不更新，老客户名单失效，预算持续漏水；</li><li>把四层当四个独立账户隔离运营，失去账户内预算统筹与信号共享，反而学不动。</li></ul>",
q:{q:"为什么「排除已成交客户」在 B2B 里是必配项？",a:"① 防浪费：成交客户继续看到拉新广告 = 预算漏水（实测约 8% 预算打水漂）。② 防数据污染：老客户转化混入 Prospecting 组会虚拉模型，让它以为「老客户行为」是拉新该学的人群。③ 它是 Customer List 与 LAL 种子的原料——没有这份名单，排除链和高质 LAL 都建不起来。四层架构的排除链是数据卫生的基础设施，不是可选项。"},
b:"画出你的四层受众架构图，标注每层约束、数据源与更新频率；并算出你当前账户里「已成交客户仍在被拉新广告触达」的预算占比（被排除人数 ÷ 总触达 × 拉新消耗）。"},
{id:"L4-02",lv:4,t:"Broad 受众高级应用",
g:"掌握宽泛受众的正确打开方式：不是「不设限」，而是「只设必要的限」。",
c:"<p><b>Broad（宽泛受众）不是「全宇宙通投」。</b>它的本质是：在「必要的约束」之内，把探索空间完全交给 Meta 的模型。必要约束通常只有三项——国家、语言、年龄下限（B2B 可再加排除项）。其余的性别、兴趣、行为、职业等，统统不填。类比：你给导航设了「起点德国、终点讲德语」就放手让它选路，而不是把每一条街都规定死。</p><p><b>官方术语变化（2026）：</b>新版广告创建流里，Broad 往往以「Advantage+ Audience（进阶赋能型受众）」的形式出现——系统在你给的基础约束上自动扩展人群。关闭赋能型开关的社区做法（先把目标切到 Sales 关掉再切回 Leads）说明：赋能开关控制的是「系统能否在约束外找人」，它的默认状态正是 Broad 思维。课程里说的 Broad = 最小必要约束 + 让模型扩展。</p><p><b>误区纠正：</b>①「Broad 就是把广告给更多人看」——错，Broad 是给模型更大空间找「更可能完成目标事件的人」，进来的是「更像客户的人」而非「更多人」。②「Broad 肯定不精准」——精准与否看 Qualified Rate，不看人群标签长什么样。③「新像素第一天就该 Broad」——错，没有信号模型没东西可学（见 L0-05 学习期）。</p><p><b>一句话区分</b>：Broad 是「我圈一块足够大的地，让模型在里面挑人」；窄定向是「我替模型把人一个个指出来」。前者依赖模型，后者依赖你那点人工判断——而 2026 年模型的判断普遍强过人工兴趣词。</p>",
m:"<p><b>为什么 Broad 越来越强：</b></p><ul><li>① <b>信号质量与数量提升</b>：Pixel + CAPI + EMQ（见 L0-03/04）提升后，模型的定位能力远超人工兴趣词。人工堆的「污水处理工程师」兴趣词，覆盖的是「标了自己兴趣的人」，而模型能识别「真正会填询盘表单的行为模式」。</li><li>② <b>窄受众为什么反而差</b>：人群池固定且小，模型很快把池子洗完（饱和，见 L4-08），学得慢、边际贵。L0-08 的底层结论：窄受众 = 数据碎片化，模型样本不够，长期半懂不懂——这正是 Meta 越来越推荐 Broad 的原因，不是 Broad 有魔法，是大样本让模型学得快。</li><li>③ <b>数字演算</b>：假设兴趣组人群池 50 万，可转化子集约 5000 人；Broad 人群池 3000 万，可转化子集约 30 万。同样每周要凑 50 个优化事件（L0-05），Broad 从 30 万里找远比从 50 万里找轻松，且规模天花板高约 60 倍。</li></ul><p>Broad 的前提（引用 L0-05 学习期与 L0-08 碎片化）：转化信号可信 + 预算能支撑探索 + 素材能自我筛选（专业文案筛人，见 L3-04）。三者缺一则先别 Broad。</p>",
h:"<p><b>Broad 实操清单：</b></p><ul><li>① 三前提自检：数据闭环可信（EMQ≥7，见 L0-03）；预算能支撑探索（单组≥$20/天，冷启动可到 $50）；素材含自我筛选语言（专业术语/损失型 Hook）。</li><li>② 必要约束清单：国家（必填）、语言（必填，多语言市场列全）、年龄下限（B2B 设 25，避免学生）、B2B 加「排除求职/学生/已成交客户」。</li><li>③ 冷启动过渡：新像素先用兴趣组或 LAL 积累 50 个事件/周（约 2–4 周），再逐步放开到 Broad；不要第一天就 Broad。</li><li>④ 放开节奏：先保留兴趣组 20% 预算做对照，Broad 拿 80%，跑 2 周看 Qualified Rate 再决定是否全切。</li><li>⑤ 监控：用 Breakdown 看进线人群画像，若 Broad 的有效 CPL 不输定向期且 Qualified Rate 不差，则 Broad 胜出；CPM 涨但有效 CPL 降属正常（L0-06「CPM 高≠贵」）。</li></ul>",
cs:"<p>某工业设备 EU 组（德国/奥地利/瑞士，德语）从兴趣组切到 Broad：CPM 涨 18%（从 $14 到 $16.5），但 Qualified Rate 从 31% 升到 44%——Broad 放进来的是「更多像客户的人」而非「更多的人」。时间线：第 1–4 周兴趣组打底积累信号；第 5 周切 Broad（保留兴趣组 20% 对照）；第 7 周对照显示 Broad 有效 CPL $52 vs 兴趣组 $61，全切 Broad。注意 CPM 涨但有效 CPL 降，印证 L0-06 的结论。</p>",
f:"<p>论坛里「空投 / 通投」（不开受众、交给系统找人）和课程的 Broad 完全同构。社区多数反馈「开赋能 + 通投嘎嘎出单，加了受众反而跑偏」，尤其老像素。但社区也提醒「没测出稳定受众就直接空投」的小强打法适合低成本试错。关于赋能开关：潜客目标下按钮常被隐藏，社区通行解法是先切到销量目标把开关关掉、再切回潜客目标。这和课程「Broad = 最小必要约束」的判断一致——核心是别用人工定向把模型困死。社区还强调「横向激进纵向保守」的测试原则配合 Broad 使用：多建组并行测，加预算要慢。</p>",
e:"<ul><li>新像素第一天就 Broad（无信号可学，模型乱跑、浪费预算）；</li><li>Broad 组里塞泛 CTA 素材（没人筛了，低意图流量进来拉低 Qualified）；</li><li>把 Broad 理解成「全球全年龄」（必要的地理/语言约束还是要留，否则真会跑偏）；</li><li>兴趣组与 Broad 五五开常态化（没有裁决机制，永远不知道谁更好）；</li><li>切 Broad 后不看 Qualified Rate 只盯 CPM（被 CPM 上涨吓退，错过更优解）。</li></ul>",
q:{q:"Broad 组跑两周，Lead 量达标但老板嫌「人群不精准」。怎么回应与验证？",a:"用数据说话：① 拉 Qualified Rate 与有效 CPL 对比定向期——若 Broad 有效 CPL 更低且 Qualified 不差，说明「精准」已由模型完成，人工定向是倒退。② 用 Breakdown 看进线人群画像是否偏移（行业/公司规模/地区）。③ 若质量确实差→先查素材筛选力（L3-04）与优化事件（L5 章），而非急着缩人群。结论：精准与否看后端转化质量，不看「人群标签长什么样」。"},
b:"为你的 Prospecting 区设计 Broad 约束清单（保留什么、放开什么），并标注你当前是否具备三前提：信号可信 / 预算支撑 / 素材自筛。"},
{id:"L4-03",lv:4,t:"Interest / Detailed Targeting 的现代用法",
g:"在 Broad 时代重新定位兴趣定向：从「主力定向」降级为「信号种子与测试工具」。",
c:"<p><b>兴趣词（Detailed Targeting）没有死，但它的角色变了。</b>在 Broad 时代之前，兴趣词是「主力定向」——你靠它把人圈出来。现在它降级为「信号种子与测试工具」。理解这一点，才不会在错误的地方继续堆兴趣词、也不会一刀切除它。</p><p><b>兴趣词的现代价值（四个场景）：</b></p><ul><li>① <b>LAL 种子源</b>：兴趣互动人群可以做 Lookalike 的种子（见 L4-04）。</li><li>② <b>冷启动过渡约束</b>：新像素没有转化信号时，兴趣词是临时「围栏」，帮模型先别跑太偏。</li><li>③ <b>明确身份标签行业</b>：小众专业社区（如特定机械零件、特定病症群体）用兴趣词能精准圈出身份。</li><li>④ <b>测试对照</b>：验证 Broad 是否在偷懒——如果 Broad 明显差于兴趣组，说明你的信号或素材有问题。</li></ul><p><b>误区纠正：</b>兴趣词表达的是「兴趣」而非「意图」——标了「污水处理」兴趣的人，可能是学生、环保志愿者、同行工程师，不一定是要采购设备的人。它的人群池固定、随消耗饱和（见 L4-08）。系统时代的比较基准很简单：同样预算下 Broad 的边际效率是否优于兴趣组——让数据裁决，别凭感觉。</p>",
m:"<p><b>兴趣定向的机理与局限：</b></p><ul><li>① <b>兴趣≠意图</b>：Interest 是用户自己标注或系统推断的「偏好」，不承诺购买行为；而模型的 EAR（预估行动率，L0-06）靠的是真实转化信号，兴趣词提供不了这个。</li><li>② <b>人群池固定</b>：一个兴趣词覆盖的人数是恒定的，消耗一大就洗完，边际 CPL 必然爬升——这就是它不能作为长期主投的根因。</li><li>③ <b>数字例子</b>：兴趣组 A 周消耗 $500、获 20 个 Lead、CPL $25；第 4 周起同样 $500 只获 12 个 Lead、CPL 升到 $42——池子饱和。同期 Broad 组 $500 稳定获 18 个 Lead、CPL $28，规模还能加。Broad 的边际效率胜出。</li></ul><p>兴趣组的正确定位（呼应 L0-08 碎片化）：它可以是「学习期过渡围栏」和「LAL 种子农场」，但不是「主力收割机」。把兴趣当主力，等于主动给自己限死探索池。</p>",
h:"<p><b>用法收敛为三个场景的 SOP：</b></p><ul><li>① 冷启动过渡：新像素前 30–50 个 Lead 用兴趣组打底，积累信号后再切 Broad（L4-02 三前提）。</li><li>② 做 LAL 种子：用兴趣互动人群（视频观看 50%+、主页互动）作为 Lookalike 源，而非主投。</li><li>③ 月度对照测试：Broad vs Interest 组各拿 20% 预算跑两周，判据=有效 CPL + Qualified Rate，胜者拿主力。</li><li>④ 明确身份行业：仅在「小众专业社区」场景保留兴趣词为主投（如特定型号零件、特定认证群体）。</li><li>⑤ 避免：把兴趣词越堆越多（定向肥胖症），或把兴趣组当「精准幻觉」长期主投而不与 Broad 对照。</li></ul>",
cs:"<p>某工业设备兴趣词「wastewater treatment」组在冷启动期立功：前 4 周拿到首批 40 个 Lead，帮账户渡过学习期。数据积累后（周 Lead 稳定超 50）切 Broad，兴趣组保留为 LAL 种子源 + 月度对照组。时间线：第 1–4 周兴趣组打底；第 5 周切 Broad（兴趣组降至 20% 对照）；第 8 周对照显示 Broad 有效 CPL 低 14%，兴趣组正式退役为种子农场。它没有「被抛弃」，而是「换了岗位」。</p>",
f:"<p>论坛的受众方案投票（开/关赋能 × 通投/圈选 四方案）结论是「每个产品要自己测」——没有标准答案，只有「在你的类目里 Broad 还是兴趣更好」的实测。社区关于赋能开关关闭的实操贴说明：兴趣定向仍在工具箱里，但角色变了，不再是默认主力。老手的经验是：先通投打底，兴趣词只在冷启动或特定身份行业才用；不要为了「精准感」长期堆词——那是定向肥胖症，模型反而会学歪。</p>",
e:"<ul><li>兴趣词越堆越多（定向肥胖症，模型被一堆弱信号带偏）；</li><li>兴趣组与 Broad 组预算五五开常态化（没有裁决机制，永远分不出胜负）；</li><li>把兴趣当 LAL 种子却从不上传互动数据（种子空转）；</li><li>在 Broad 已胜出后仍死守兴趣组主投（池子饱和还硬投，CPL 暴涨）；</li><li>用「兴趣=意图」误判，把标兴趣的学生/同行当目标客户。</li></ul>",
q:{q:"什么时候应该从兴趣组切到 Broad？给出可操作的判据。",a:"① 优化事件周量稳定 ≥30–50（信号可信，满足 L0-05 门槛）；② 兴趣组边际 CPL 开始爬升（人群池饱和，见 L4-08）；③ Broad 对照组数据不差于兴趣组。满足两条即可切，过渡期保留兴趣组 20% 预算做对照。切的过程要复制新组而非改原组（避免重置学习期，见 L0-05），让 Broad 组自己学自己的。"},
b:"写下你账户里每个兴趣组的「存在理由」（冷启动 / 种子 / 身份行业 / 对照），无理由的列砍除计划，并设定下个对照测试日期。"},
{id:"L4-04",lv:4,t:"Lookalike 建模与选择",
g:"掌握 LAL 的种子质量、百分比选择与验收标准，避免「为建而建」。",
c:"<p><b>Lookalike（类似受众，LAL）的核心思想：</b>你给 Meta 一群「已经验证过价值的人」（种子），系统去全量用户里找「和这群人特征相似的人」。它解决的是「我没有现成的大名单，但想触达更多像客户的人」。</p><p><b>LAL 三要素：</b></p><ul><li><b>种子（Seed）</b>：质量远大于数量。高价值客户名单 &gt; 全量互动者。种子错了（比如拿全量网页访客），LAL 就是在放大平庸。</li><li><b>百分比（%）</b>：1% 最像（在目标国最相近的 1% 人群）、3–5% 更宽更泛。百分比越小越像，越大越广。</li><li><b>国别（Country）</b>：按市场单建，不要跨国混建（不同市场人群特征差异大）。</li></ul><p><b>B2B 种子首选</b>：成交客户 / Qualified 客户名单（已验证付费意愿），次选网站高意图访客（多次访问、看了定价页）。误区：拿「所有网站访客」当种子——里面混了大量猎奇流量，LAL 放大的是「猎奇者」而非「买家」。</p>",
m:"<p><b>LAL 的机理与验收：</b></p><ul><li>① <b>种子决定「相似于谁」</b>：LAL 不是魔法，它只是复制种子的特征分布。种子是高价值买家 → LAL 找高价值买家；种子是泛访客 → LAL 找泛访客。这是「为建而建」最容易踩的坑。</li><li>② <b>数据量建议</b>：种子至少 100–1000 人（按国别）。少于 100 时模型特征估计不稳，LAL 质量差。</li><li>③ <b>数字演算</b>：1% LAL 在德国（约 6700 万成年人）≈ 67 万人；3% ≈ 200 万人。1% 更像但规模小，3% 更宽但质量稀释。配合 Broad 时，LAL 通常定位为「高质补充」而非主力。</li></ul><p>LAL 与 Broad 的关系（呼应 L4-02）：Broad 给模型全量探索，LAL 给模型一个「高质种子方向」。2026 年模型变强后，LAL 的「地位下降」——因为 Broad 本身就能找到像客户的人，LAL 更多沦为「高质量补充」和「冷启动辅助」。</p>",
h:"<p><b>LAL 建模 SOP：</b></p><ul><li>① CRM 导出成交客户（含国家字段、去重），只放成交/Qualified，不混询盘未成交。</li><li>② 按国别建 1% 与 3% 两档；种子量 &lt;100 时合并相近国家扩大种子量，或加「30 天多次回访访客」做第二种子。</li><li>③ 与 Broad 对照跑 2–4 周，每组预算对等（如各 $50/天）。</li><li>④ 验收：Qualified Rate 与有效 CPL 不输 Broad 才保留；否则降为「补充组」或砍掉。</li><li>⑤ 每季用新成交名单刷新种子（避免种子老化，见 L4-05 月度 SOP）。</li></ul>",
cs:"<p>某工业设备：种子 = 47 个欧洲成交客户建德国 1% LAL（约 67 万人）；对照组 Broad。结果 LAL 的 Qualified Rate 高 6 个点（51% vs 45%），但规模天花板明显——2 周后边际成本从 $49 升到 $78（池子小、洗得快）。时间线：第 1–2 周 LAL 表现惊艳；第 3 周起边际暴涨；最终定位为「高质补充组」拿 25% 预算，Broad 拿 60% 主力，3% LAL 拿 15% 观察。LAL 没有「赢」，但证明了种子质量的价值。</p>",
f:"<p>论坛四组结构里 LAL 常驻，是框架里的一个工具位而非银弹。社区 COD 玩家常用「下单客户」做种子的经验与 B2B 一致：种子 = 已验证价值的人。多条路径帖强调「账户框架思维」——LAL 是框架里的一个工具位，不是万能药。老手共识：种子质量决定 LAL 上限，拿全量访客当种子是新手最常犯的错；小种子（几十人）也能建，但要用最高质量补数量不足，并拉长验收期看稳定性。</p>",
e:"<ul><li>拿「所有网站访客」当种子（放大平庸，LAL 找来的是猎奇者）；</li><li>1%/3%/5% 全建（管理爆炸，多数组没人看）；</li><li>LAL 建完从不与 Broad 对照（不知道值不值，白养）；</li><li>种子一年不更新（老客户特征漂移，LAL 越来越偏）；</li><li>跨国混建 LAL（不同市场特征被平均掉，谁都不准）。</li></ul>",
q:{q:"成交客户只有 47 人，能做 LAL 吗？怎么优化？",a:"能，但要用「最高质量」补「数量不足」：① 只放成交客户（不要混入询盘未成交，避免稀释种子纯度）；② 合并相近国家扩大种子量（如 DACH 区合并）；③ 同时用「30 天多次回访访客」做第二种子对照。47 人样本偏小，验收期拉长到 4 周看稳定性，且把 LAL 定位为「高质补充」而非主力——它规模天花板低，但质量可能更高。"},
b:"列出你的 LAL 种子清单（来源/人数/国别），并排定刷新周期；写下你当前 LAL 与 Broad 的对照验收结论。"},
{id:"L4-05",lv:4,t:"Custom Audience 与客户列表",
g:"用好客户名单资产：排除、再营销、LAL 种子三位一体，并守住数据合规。",
c:"<p><b>Custom Audience（自定义受众）是「业务事实」进广告系统的接口。</b>你手里有一堆真实发生过的事——谁成交了、谁询过盘、谁看了网站——这些信息通过 Custom Audience 变成系统可用的「约束」，大幅提升预算效率。</p><p><b>数据源有哪些：</b></p><ul><li><b>客户名单</b>：邮箱/电话（hash 后上传），匹配率受名单质量影响（邮箱&gt;手机）。</li><li><b>网站行为</b>：Pixel 记录的访客、加购、表单开始等。</li><li><b>App 事件</b>：SDK 回传的行为。</li><li><b>互动</b>：主页/IG/视频观看互动者。</li></ul><p><b>机制</b>：名单上传后 Meta 做 hash 匹配——把你的邮箱/电话和 Meta 用户库对上，对上的人才能进受众。匹配率 = 成功匹配数 ÷ 上传数，名单越干净匹配率越高。这与 L0-03 的 EMQ 同源：都是「把业务事实匹配回具体用户」。</p><p><b>误区纠正</b>：自定义受众不是「再营销专用」——它的三位一体是排除（防浪费）+ 再营销（收割）+ LAL 种子（扩量）。只把它当再营销用，等于浪费了另外两份价值。</p>",
m:"<p><b>客户名单为什么是核心资产：</b></p><ul><li>① <b>排除</b>：把已成交客户从拉新层剔除，省下漏水预算（见 L4-01 数字：约 8% 预算回归真实拉新）。</li><li>② <b>再营销</b>：把「90 天询盘未成交」名单单独建 RT 组，这是高转化金矿（有效 CPL 常为拉新的 1/3）。</li><li>③ <b>LAL 种子</b>：成交名单是质量最高的 LAL 种子（见 L4-04）。</li></ul><p><b>合规机制</b>：上传前必须同意自定义受众条款（新手高频报错来源），且名单来源须合法、隐私声明到位。GDPR 区域尤其注意——名单要有合法处理依据，否则既有法律风险也被系统拒。这与 L0-04 的第一方数据逻辑一致：你自己的客户名单是第一方数据，模型最信。</p>",
h:"<p><b>月度例行动作 SOP：</b></p><ul><li>① CRM 导出成交/询盘名单（每月 1 号）。</li><li>② 格式清洗：保留邮箱列 + 国家列 + 客户状态列，去重、去错格式。</li><li>③ 上传更新三个用途：排除（拉新区已成交客户）、RT（未成交询盘 90 天）、LAL 种子（成交名单，每季度刷新）。</li><li>④ 匹配率验收：Custom Audience 列表看匹配率，低于 40% 要查名单格式（邮箱是否带域名、是否哈希重复）。</li><li>⑤ 合规：确认隐私政策覆盖广告用途；GDPR 区域保留处理依据记录。</li></ul>",
cs:"<p>某工业设备名单资产实践：成交名单（312 人）上传排除后，Prospecting 预算浪费减少约 8%（等效有效 CPL $61→$56）；「90 天未成交询盘」RT 组（约 180 人）成为高转化金矿，有效 CPL 仅为拉新的 1/3（约 $19 vs $56）。时间线：第 1 月建名单管道；第 2 月发现匹配率仅 52%（部分邮箱缺域名），补全后升到 78%；第 3 月起 RT 组稳定贡献 30% 的 Qualified Lead。入境游获客对照：旅行社把「已咨询未报名」名单做 RT，配合 Click-to-WhatsApp（见 L4-16）分流给导游，询盘转报名率明显高于冷流量。</p>",
f:"<p>论坛品牌站案例里「弃单挽回 = 邮件营销 + 自定义受众再营销广告」——正是名单资产的直接变现：把加购未付的人用再营销广告拉回来。社区新手高频报错之一是自定义受众条款未同意导致上传失败——这说明合规动作也是技术动作，先同意条款再上传。老手的经验是：名单资产要「月月清」，不要建了一次就再也不动；匹配率低先查邮箱格式而非怪系统。入境游/本地服务类广告主还常用客户名单做「老客唤醒」再营销，成本低、转化高。</p>",
e:"<ul><li>名单从不更新（人群老化，匹配到的全是旧客户）；</li><li>只会上传不会排除（拉新区持续浪费，预算打水漂）；</li><li>GDPR 区域无合规处理（法律风险 + 系统拒传）；</li><li>列表格式脏（邮箱缺域名、混了无效号）导致匹配率过低；</li><li>把询盘未成交和成交混同一份名单（再营销时把已成交也拉进来，浪费）。</li></ul>",
q:{q:"「90 天询盘未成交」RT 组为什么有效 CPL 只有拉新的 1/3？边界在哪？",a:"这批人已有明确需求与认知，只差临门一脚（再营销的天然优势），所以转化成本低。边界：① 人群只出不进会枯竭（依赖拉新持续供给，见 L4-01 四层架构）；② 高频次轰炸致倦怠与负面反馈（要设频次上限 3–5/周）；③ 别把它的高转化率误当成拉新效率——它收割的是你种出来的鱼，不能用来证明拉新能力（对应 L0-02 分区意义）。"},
b:"建立名单资产月度 SOP（导出→清洗→上传→三用途分配），并核对你当前匹配率与合规依据是否到位。"},
{id:"L4-06",lv:4,t:"Retargeting 策略与增量陷阱",
g:"设计分阶段再营销策略，同时警惕 RT 的「归因幻觉」——它收割的多是本来就会回来的人。",
c:"<p><b>Retargeting（再营销，RT）是「临门一脚」，不是「种草」。</b>它针对已经来过、有明确意图信号的人——视频观看、主页互动、网站访客、加购未付、询盘未成交。这类人离转化最近，所以 RT 的 CPL 天然漂亮。</p><p><b>RT 分层（按意图升序）：</b></p><ul><li>视频观看 50% → 主页/IG 互动 → 网站访客（30/14/7 天）→ 加购/表单开始未完成 → 询盘未成交。</li></ul><p><b>每层配不同素材</b>：越深层的人意图越强，CTA 越可以直接（深层用案例 + 报价，浅层用教育内容）。误区：全账户一个 RT 素材——不同意图层吃不同内容，用同一套等于浪费深层人群的高意图。</p><p><b>核心警示——增量陷阱：</b>深 RT 人群「本来就大概率回来」，它的 CPL 漂亮，但真正由广告创造的增量可能很小。归因（L0-07）≠ 增量。把 RT 的漂亮 CPL 当成「广告功劳」，是新手最常犯的逻辑错。</p>",
m:"<p><b>RT 的增量陷阱机理：</b></p><ul><li>① <b>归因≠增量</b>：RT 组报了 100 个转化，其中可能 80 个是「本来就会自己回来搜索下单」的人（Search Capture Bias），广告只「截胡」了功劳（见 L0-07）。</li><li>② <b>holdout 验证</b>：随机留 10–20% RT 人群不投广告，两周后对比两组成交率，差值才是真实增量。没有 holdout，RT 的漂亮数字全是「归因幻觉」。</li><li>③ <b>数字演算</b>：RT 组 CPL $20，拉新 CPL $60，老板想全转 RT。但 RT 人群是拉新「种」出来的，池子只出不进；30 天后无鱼可收。且 holdout 实测增量可能只有 4 个点差异——RT 的真实价值远低于表面。</li></ul><p>专业做法：RT 预算给足但不贪功，用 holdout 验证真实增量，用占比监控防止「收割不种地」。</p>",
h:"<p><b>RT 分层与增量管理 SOP：</b></p><ul><li>① 按意图分层建组 + 频次上限（3–5/周），浅层用教育素材、深层用案例+报价。</li><li>② 留 10–20% RT 人群做 holdout（不投）测真实增量，每季度做一次。</li><li>③ 月度看 RT 占总消耗比例：&gt;25% 需警惕拉新不足（「收割不种地」）。</li><li>④ 90 天询盘未成交单独建组（见 L4-05），用客户名单承接，不进 Broad。</li><li>⑤ 频次监控：单组 Frequency&gt;4 即降预算或换素材，防倦怠与负面反馈（Ad Quality，L0-06）。</li></ul>",
cs:"<p>某工业设备 RT holdout 实验：留 20% 询盘未成交名单不投广告，30 天后两组成交率差异仅 4 个点——RT 的「归因功劳」远大于真实增量。据此把 RT 预算从 30% 降到 18%，把省下的预算回到拉新（种地）。时间线：第 1 月 RT 占 30%，看似高效；第 2 月做 holdout，发现增量仅 4 点；第 3 月调整结构，RT 18% + 拉新 70% + 补充 12%。入境游获客对照：旅行社对「看了行程未咨询」的人做 RT，配合 WhatsApp 首句筛选（见 L4-16），增量明显高于纯表单 RT。</p>",
f:"<p>论坛大量「再营销是万能药」的直觉与课程形成对照：电商场景的弃单挽回（邮件 + 自定义受众再营销）确实有效、真增量较高；但 B2B / 服务场景必须防「Search Capture Bias」——很多「被 RT 召回」的人是自己搜索回来的，广告只是截胡。社区共识：RT 要看增量而非归因，不能因为 CPL 低就无限加码。老手的经验是 RT 占整体 10–20% 最健康，超过 25% 说明拉新在萎缩。</p>",
e:"<ul><li>RT 占预算一半以上（收割不种地，池子枯竭后无鱼可收）；</li><li>RT CPL 低就加码（不看增量，加的是「本来也会回来」的人）；</li><li>全账户一个 RT 素材（不同意图层吃不同内容，深层高意图被浪费）；</li><li>无频次上限（倦怠 + 负面反馈，Ad Quality 下跌，L0-06）；</li><li>从不做 holdout（把归因幻觉当真实增量，误导预算分配）。</li></ul>",
q:{q:"老板看到 RT 组 CPL $20（拉新 $60）要求「全部预算转 RT」。你的完整反驳？",a:"① RT 人群是拉新「种」出来的，池子只出不进，全转 RT = 30 天后无鱼可收。② RT 的 CPL 是「收割价」不是「创造价」，其增量需 holdout 验证（我们的实测增量只有 4 个点差异）。③ 正确做法：维持拉新主投，RT 按意图分层提效，用数据给老板看 holdout 结果——证明 RT 漂亮数字里有大量「本来就会回来」的人，全转反而断粮。"},
b:"完成一次 RT 分层设计 + holdout 方案，并算出你 RT 预算的安全占比（目标 10–20%，红线上限 25%）。"},
{id:"L4-07",lv:4,t:"Audience Overlap 诊断与处理",
g:"诊断受众重叠导致的内部竞争，用官方工具+结构设计解决。",
c:"<p><b>Audience Overlap（受众重叠）是「自己人打自己人」。</b>当两个 Ad Set 的受众高度交叉，它们会在同一场拍卖里抢同一批人——你的两组都在为同一注意力付费，结果成本被自己抬高、数据互抢、模型学得慢。</p><p><b>官方定义</b>：Meta 的 Audiences 页面可查两个受众之间的重叠度（重叠人数 / 重叠比例）。重叠 &gt;30% 就要处理。误区：很多人以为「复制爆款组能蹭学习期红利」——实际上复制出来的组往往和原组高度重叠，自相残杀，数据反而拉了。</p><p><b>类比</b>：两辆你自己的车在同一场拍卖里互相抬价，最后你多花钱，车还是你自己的。重叠的本质是预算内耗。</p>",
m:"<p><b>重叠为什么会贵（机制链）：</b></p><ul><li>① 两个组出价买同一批人时，Meta 取「总价值更高」的那次展示胜出（L0-06 拍卖逻辑）。</li><li>② 但你的两组都在为同一注意力付费、都在学习——样本被切碎，谁也学不熟（L0-08 碎片化）。</li><li>③ <b>数字演算</b>：EU-Broad 组与 EU-LAL3% 组重叠 47%，意味着近一半预算在抢同一批人。合并后单组消耗 +40%，有效 CPL 降 12%——因为样本集中、模型更强，且不再内部抬价。</li></ul><p>重叠和「学习不能复制」同源：复制老广告建新组，系统要重新探索，而新组和原组人群高度重合，于是既重置了学习、又制造了内耗——社区所谓的「玄学崩盘」往往就是这个机理。</p>",
h:"<p><b>重叠诊断与处理 SOP：</b></p><ul><li>① 诊断：Audiences 工具查两两重叠，&gt;30% 标红处理；全部在投组跑一次重叠矩阵。</li><li>② 处理三板斧：合并（重叠组合而为一）、排除（RT 组排除在拉新组外——标配排除链）、差异化（真要并行就拉开受众定义差距）。</li><li>③ 合并纪律：合并后用 Breakdown 部分补偿「分开看数据」的粒度损失；先保留跑得差的组、只把预算并过去，观察一周再关。</li><li>④ 防复发：新建组前先查与现有组的重叠，避免无意识复制。</li><li>⑤ 验收：合并/排除后 7 天看有效 CPL 与学习期状态（避免误伤还在学的组）。</li></ul>",
cs:"<p>某工业设备曾同时跑「EU-Broad」与「EU-LAL3%」：重叠 47%（Audiences 工具实测），LAL 组一直在给 Broad 组抬轿。处理：合并为单组（先并预算、观察一周后关掉 LAL 组）。结果单组消耗 +40%，有效 CPL 降 12%。时间线：第 1 月两组合跑、重叠 47% 内耗；第 2 月初合并；第 2 月中 CPL 改善。入境游获客对照：英语组与西语组若都含「欧洲游客」标签会重叠，按语言拆组 + 互相排除是标准做法。</p>",
f:"<p>论坛复制型内耗的直接证据：「复制出单的广告跑 1-N-1（同素材多组测受众），数据就拉了」「复制老广建新广告，刚跑过学习期就归零」。社区把原因归为「玄学」，课程解释了机理：内部竞争 + 学习不能复制。老手的经验是：测受众用 1-N-1（同素材不同组）可以，但测完要合并重叠组、不要长期并跑；复制爆款组抢量是重叠内耗的经典事故。正确的结构思维是「先查重叠、再决定合并还是排除」。</p>",
e:"<ul><li>复制爆款组抢量（重叠内耗的经典事故，数据反而拉了）；</li><li>从未查过重叠度（自己人打自己人而不知）；</li><li>用「关掉一个」解决重叠（有时合并比关停好，关停丢学习）；</li><li>多个 Broad 组并行无差异化（本质同一批人，内部抬价）；</li><li>RT 组不排除在拉新组外（拉新反复触达已转化意图人群，浪费）。</li></ul>",
q:{q:"两个组重叠 60%，都在出单。直接合并会丢学习吗？",a:"合并后系统会重新分配但「信号合并」总体利大于弊：两组的人群本来就高度重合，合并 = 样本集中、模型更强。丢的是「分开看数据」的粒度——可用 Breakdown 部分补偿。更稳的做法：先保留跑得差的组、只把预算并过去，观察一周再关。若两组各在学不同事件（如一个 Lead 一个 Purchase）则不宜合并，应先排除重叠人群再并行。"},
b:"跑一次全部在投组的重叠矩阵，列出处理清单（合并/排除/差异化），并标注每对重叠度。"},
{id:"L4-08",lv:4,t:"Audience Saturation（受众饱和）",
g:"判断受众的「剩余有效容量」，区分素材疲劳与人群饱和，决定换素材还是换人群。",
c:"<p><b>Audience Saturation（受众饱和）是「池子里的鱼快被洗完了」。</b>它和素材疲劳（Creative Fatigue，L3-13）是两回事，但常被混为一谈——一个衰退归因「素材不行」，另一个其实是「人洗完了」。</p><p><b>饱和判断三件套：</b></p><ul><li><b>Frequency 趋势</b>：同一人看广告的平均次数持续上升。</li><li><b>受众触达率</b>：月触达 ÷ 总规模，&gt;20–30% 即警惕。</li><li><b>边际成本爬坡</b>：加预算后成本跳升（平均 CPL 还撑得住，但新增部分已贵）。</li></ul><p><b>关键认知</b>：受众 3000 万 ≠ 有效池 3000 万。真正的「可转化人群」是模型筛出的一个子集（见 L4-02 数字：3000 万池里可转化子集约 30 万）。饱和发生在有效子集耗尽时，表现为边际 CPL 爬坡而平均 CPL 还撑得住——这是最容易被误判的信号。</p>",
m:"<p><b>容量逻辑与边际思维：</b></p><ul><li>① <b>有效子集耗尽</b>：模型把「会转化的人」先找完，剩下的越来越难转化，边际 CPL 必然升（呼应 L0-08 边际经济学：决策看边际不看平均）。</li><li>② <b>数字演算</b>：DE 组受众 800 万，可转化子集约 8 万。前 4 周触达 1.6 万（20%），边际 CPL $52；第 5 周加预算后触达冲到 2.2 万（28%），边际 CPL 跳到 $85——有效子集见底，不是素材问题。</li><li>③ <b>分型处理</b>：素材疲劳→换 Hook/换血（L3-13）；受众饱和→扩约束（换更宽受众/加国家/换市场）。两者动作相反，先诊断再动。</li></ul><p>饱和是 Broad 时代的新常态：Broad 探索空间大但仍有上限，大预算会加速洗池子（见 L4-15 版位经济学同理）。</p>",
h:"<p><b>饱和诊断与处理 SOP：</b></p><ul><li>① 算触达率：月触达 ÷ 受众规模 &gt;20–30% 即警惕（L0-08 口径）。</li><li>② 看边际：加 20% 预算后边际 CPL 是否陡增（用 Breakdown 或分段消耗看新增部分成本）。</li><li>③ 分型：CTR 稳定 + 频次不高 → 不是素材疲劳，是受众饱和；CTR 跌 + 频次高 → 素材疲劳。</li><li>④ 饱和处理：扩约束（同语言加国家 / 放宽兴趣边界 / 换市场，见 L4-11），而非换素材。</li><li>⑤ 扩后观察新进入人群的 Qualified Rate，避免「扩了但质量崩」（L4-02 Broad 前提）。</li></ul>",
cs:"<p>某工业设备 DE 组：Frequency 2.1 但边际 CPL 从 $52 跳到 $85，触达率 28%——不是素材看吐（频次不高）而是有效池见底。处理：扩奥地利/瑞士进组（同德语区），边际回落到 $58。时间线：第 1 月 DE 单组跑通；第 6 周触达率到 28%、边际暴涨；第 7 周并入奥/瑞，有效子集扩大 2 倍，边际 CPL 回落。入境游获客对照：单一城市（如巴塞罗那）受众洗完后，扩到西班牙全境 + 葡语区，同等预算边际成本回落。</p>",
f:"<p>论坛经验对应：「大预算容易只吃一两天流量衰退很快」= 大预算加速洗池子；「单点巨贵，转化跟不上直接爆炸」= 饱和后的边际爆炸。社区小强打法（小预算多组）某种意义上就是在分散饱和风险——每组只吃一小块池子，整体更耐跑。老手的经验是：衰退先看触达率和边际，别急着换素材；扩受众时千万别连 Angle 一起换，否则归因混乱、分不清是饱和还是素材的问题。</p>",
e:"<ul><li>把一切衰退归因「素材不行」（可能是池子干了，换素材白费）；</li><li>加预算对抗饱和（越加越贵，边际爆炸）；</li><li>扩受众时连 Angle 一起换（归因混乱，分不清饱和还是素材）；</li><li>从不算触达率（等到 CPL 暴涨才发现池子空了）；</li><li>小预算多组但组间重叠（既饱和又内耗，见 L4-07）。</li></ul>",
q:{q:"触达率 25%、Frequency 2.3、CTR 稳定、边际 CPL +60%。诊断与动作？",a:"CTR 稳定 + 频次不高 → 素材没疲劳；触达率高（25%）+ 边际陡升 → 受众饱和。动作：扩约束（同语言加国家或放宽兴趣边界）而非换素材；扩后观察新进入人群的 Qualified Rate。呼应 L4-02 的 Broad 思路：3000 万预估受众里真正可转化子集可能只有几十万，用不同约束（加国家/换市场）触达更多有效子集，边际成本自然回落。"},
b:"对你主力组算触达率与边际曲线，标注「健康/警戒/饱和」，并写下下一步是换素材还是换人群。"},
{id:"L4-09",lv:4,t:"Audience × Creative Fit（受众素材适配）",
g:"掌握「素材效果取决于受众组合」的交互思维：没有脱离受众的好素材。",
c:"<p><b>广告不是单变量系统。</b>表现 = Creative × Audience × Offer 的组合结果（L0-08 链式思维）。同一素材在 Broad / 兴趣 / LAL / RT 下表现可能完全不同——A 素材 + Broad 很好、+ Interest 很差，这不代表 A 素材「烂」，只代表它和那个受众「错配」。</p><p><b>交互效应的来源：</b></p><ul><li><b>Hook 隐形定向</b>（L3-03）：素材开头吸引的人群，本身就是一种「定向」，会和你的受众设置叠加。</li><li><b>意图水位不同</b>：同一内容对「刚认识你」的人和「已经是行家」的人，信号噪声比完全不同。</li><li><b>专业度匹配</b>：技术参数对比图需要「已经是行家」的受众才看得懂、才觉得有用。</li></ul><p><b>误区纠正</b>：把素材表现当「素材自身的属性」——脱离组合谈好坏，是归因失败。复盘只看素材维度不看受众维度，会冤杀好素材、错捧错配素材。</p>",
m:"<p><b>组合思维的机制链：</b></p><ul><li>① <b>表现 = 组合结果</b>：同一素材跨两组表现差，原因在「组合」而非「单因素」。把 Broad + B 素材的问题误判成「B 素材烂」，是常见冤案。</li><li>② <b>单变量验证</b>：怀疑组合错配时，做最小交叉测试——同素材跨两组，或同受众换素材（呼应 L0-08 最小实验）。</li><li>③ <b>数字演算</b>：B 素材 + Broad 吃掉 40% 预算、有效询盘率最差（2%）；但 B 素材 + LAL 有效询盘率 9%。整体看 B 是「差素材」，交叉看 B 只是「放错了地方」——重新配对后整体有效询盘率升 3 个点。</li></ul><p>这与 L0-06 的 EAR 一致：素材决定「谁点」，受众决定「谁在被推」，两者共同决定预估行动率。改一个，另一个的基准就变。</p>",
h:"<p><b>组合复盘与设计 SOP：</b></p><ul><li>① 组合矩阵复盘：月度拉「素材 × 受众组」交叉表（有效 CPL / Qualified Rate 双维）。</li><li>② 设计时预配：强教育型素材配 Broad（自我筛选，见 L3-04）；强促销型配 RT / 高意图人群；技术型配 LAL / RT。</li><li>③ 验证交互：怀疑错配时做最小交叉测试（同素材跨两组，或同受众换素材），一次只改一个变量。</li><li>④ 发现组合问题→重新配对，而非删除素材（除非交叉验证确实全差）。</li><li>⑤ 每季沉淀「素材-受众配对表」进假设库（见 L4-10），避免重复试错。</li></ul>",
cs:"<p>某工业设备「技术参数对比图」在 Broad 组哑火（有效询盘率 2%），在 LAL 组 Qualified 率最高（53%）——专业内容需要「已经是行家」的受众。结论：技术型素材固定配 LAL / RT，Broad 组用「损失型 Hook 大白话」。时间线：第 1 月技术图全组投，Broad 浪费；第 2 月做交叉表发现错配，重新配对；第 3 月 Broad 换大白话 Hook，技术图专供 LAL/RT，整体 Qualified 率 +6 点。入境游获客对照：专业行程 PDF 配 RT（看过行程的人），大白话「限时余位」配 Broad，同理。</p>",
f:"<p>论坛案例直击：「111 感觉不如 131 稳定」「复制出来的组数据拉了」——社区反复观察到的「同素材换个组就变脸」，正是 Creative × Audience 交互的朴素表达。社区还发现「大同小异的 20 条素材预算只会分给一两个」，说明素材与受众的组合决定了系统把预算给谁。老手的经验是：复盘必须「按组看素材」而非「全局看素材」，同一素材在不同组表现天差地别是常态，别急着删。</p>",
e:"<ul><li>把素材表现当「素材自身的属性」（脱离组合谈好坏，冤杀好素材）；</li><li>复盘只看素材维度不看受众维度（归因失败）；</li><li>发现组合问题就同时改素材 + 受众（归因混乱，不知哪错了）；</li><li>技术型素材硬塞 Broad（专业内容对泛人群是噪音）；</li><li>从不做「素材 × 受众」交叉表（永远在凭感觉配对）。</li></ul>",
q:{q:"「B 素材 + Broad」组合吃掉 40% 预算且有效询盘率最差。怎么处理？",a:"先做单变量验证（L0-08 做法）：暂停该组合预算，看整体有效率是否回升（初判）；再拆「B 素材在 LAL 组」的表现——若 B 在高意图人群表现好 → 是「组合错配」非「素材烂」，动作 = 重新配对（B→LAL/RT，Broad 换教育型素材），而非删除 B。验证时要保持其他变量不变，否则分不清是素材还是受众的问题。"},
b:"产出你账户的「素材 × 受众」交叉复盘表，找出 2 个错配组合并修正配对，记录前后 Qualified Rate 变化。"},
{id:"L4-10",lv:4,t:"受众测试矩阵设计",
g:"设计系统的受众测试（Broad vs LAL vs Interest、1% vs 3%、新市场冷启动），一次测试回答一个问题。",
c:"<p><b>测试矩阵的本质是「控制变量」。</b>一次只比较一个维度，结论才能复用。乱测（同时改受众 + 素材 + 预算）得出的「结论」无法迁移，半年能做三遍同样的测试还每次重新交学费。</p><p><b>经典矩阵：</b></p><ul><li><b>矩阵 A</b>：Broad vs LAL1% vs LAL3%（同素材、同预算、同版位）。</li><li><b>矩阵 B</b>：新市场冷启动——兴趣过渡组 vs Broad 组并行（给 Broad 更长观察期）。</li><li><b>矩阵 C</b>：1% vs 3% vs 5%（看宽度与质量的权衡）。</li></ul><p><b>误区纠正</b>：测试不是「多开组碰运气」，而是「用结构回答一个具体问题」。每组样本对等（预算/时长一致）、判据预先定（看 CPL 还是 Qualified Rate），否则测了等于白测。</p>",
m:"<p><b>矩阵的价值 = 可复用的规律：</b></p><ul><li>① <b>控制变量</b>：同 3 条素材复制到 3 个组，唯一变量是受众——结论干净，可回填假设库。</li><li>② <b>数字演算</b>：Broad vs LAL1% vs LAL3% 测试 3 周，量 12/5/9，有效 CPL $58/$41/$49。双维判断：LAL1% 质量最优但规模受限（量 5 太小）；Broad 规模大、质量够用。分配 = Broad 60% + LAL1% 25% + LAL3% 15%。</li><li>③ <b>结论回填</b>：你类目的受众规律（如「Broad 在 X 类目质量够用」）长期积累成资产，下次新市场直接套用框架。</li></ul><p>矩阵测试呼应 L0-05 学习期：每组都要达到 50 事件/周才出结论，测试期太短（&lt;2 周）Broad 常被低估——因为 Broad 信号积累慢但上限高。</p>",
h:"<p><b>标准测试方案 SOP：</b></p><ul><li>① 选维度：明确这次只比「受众」一个变量（素材/预算/版位全锁）。</li><li>② 复制：同 3 条素材复制到 3 个组（Broad / LAL1% / LAL3%），同预算同版位。</li><li>③ 时长：跑 3–4 周，Broad 组观察期更长（信号积累慢）。</li><li>④ 判据：有效 CPL + 规模能力双维，预先写在测试计划里。</li><li>⑤ 新市场冷启动：兴趣过渡组与 Broad 组并行，给 Broad 更长观察期（前 2 周兴趣先出量，第 3 周起看 Broad 反超）。</li><li>⑥ 回填：结论写回假设库，标注适用类目与市场。</li></ul>",
cs:"<p>某工业设备南美市场启动：西语 Broad vs 兴趣组并行 4 周——兴趣组先出量（前 2 周），但第 3 周起 Broad 反超且质量更稳。时间线：第 1–2 周兴趣组领先（Broad 还在学）；第 3 周 Broad 量质双超；第 4 周全市场切 Broad（兴趣组退役为种子源）。结论回填：西语市场 Broad 质量够用、上限更高，后续葡语区直接 Broad 打底。入境游获客对照：新语言市场（如日语）先兴趣过渡 2 周再切 Broad，复用同一框架。</p>",
f:"<p>论坛方法论同源：受众方案投票（开/关赋能 × 通投/圈选）的本质就是「大家各测各的，没有标准答案」——所以必须用矩阵结构控制变量。社区用「1-N-1」（同素材多组测受众）做受众测试，结构命名体系（111/1N1）本身就是为了控制变量而生的社区智慧。老手的经验是：测试期至少 3 周、Broad 要给更长时间，否则结论失真；测完一定要回填，别同一个测试做三遍。</p>",
e:"<ul><li>矩阵里混入素材差异（测了寂寞，不知是受众还是素材的锅）；</li><li>测试期太短（2 周内的 Broad 常被低估，信号没积累完）；</li><li>结论不回填（同样的测试半年做三遍，白交学费）；</li><li>判据不预先定（跑完才想看什么，容易选择性解读）；</li><li>新市场直接 Broad 不给观察期（前 2 周没量就砍，错过反超）。</li></ul>",
q:{q:"Broad vs LAL1% vs LAL3% 测试 3 周：量 12/5/9，有效 CPL $58/$41/$49。预算怎么分？",a:"双维判断：LAL1% 质量最优但规模受限（量 5 太小，撑不起主力）；Broad 规模大、质量够用（CPL $58 可接受）。分配：Broad 主力 60% + LAL1% 25% + LAL3% 15%（观察其与 Broad 的边际差）。并持续监控 Broad 的 Qualified Rate 是否随规模稀释——若稀释则回调 LAL 占比。决策基于有效 CPL 而非表面 CPL（L0-06）。"},
b:"设计并跑完一个三组受众矩阵，回填结论到假设库（标注：哪组质量最优 / 哪组规模够 / 最终分配比例）。"},
{id:"L4-11",lv:4,t:"Geographic Expansion（市场扩张顺序）",
g:"建立「第二、第三市场」的扩张决策框架：何时扩、按什么顺序、怎么试。",
c:"<p><b>扩张 = 把「已验证的模型」复制到新数据分布。</b>不能假设成功可复制——新市场的人群反应、竞争烈度、合规要求都不同，需要「旧素材本地化 × 新市场测试」的组合。</p><p><b>扩张信号：</b></p><ul><li>主力市场出现饱和信号（L4-08：触达率 &gt;30%、边际 CPL 暴涨）。</li><li>或边际成本持续爬坡、现有市场内已无可扩子人群。</li></ul><p><b>候选市场排序维度（六维）</b>：需求强度 / 竞争烈度 / 成本（CPM）/ 客单毛利 / 服务可达性 / 风险（合规）。<b>语言优先于国界</b>：同语言区先并组（如德/奥/瑞），降低本地化成本。</p><p><b>误区纠正</b>：「哪里人多投哪里」——不看竞争与毛利，容易进红海；「6 个市场同时启动」——预算稀释，全员学不出（L0-08 碎片化）。</p>",
m:"<p><b>扩张的机理与顺序：</b></p><ul><li>① <b>复制模型</b>：已验证的「素材 + Offer + 落地页」组合，是新市场的起点（不是从零开始）。</li><li>② <b>本地化缺口</b>：新市场人群反应不同，母国素材可能水土不服——需本地化文案/落地页（见 L4-14 Message Match）。</li><li>③ <b>数字演算</b>：主力市场边际 CPL 爬坡 40%（从 $40 到 $56），触达率 32%——饱和。但「扩子人群」（放宽兴趣/加城市）成本仅 +10%，「扩语言区」（德→奥瑞）成本 +15%，「开新国家」（法/荷）成本 +30% 且需本地化。顺序：扩子人群 &lt; 扩语言区 &lt; 开新国家（成本与风险递增）。</li></ul><p>扩张呼应 L0-08 边际经济学：先算边际成本最低的动作，再算高的，别一爬坡就跳到最贵的「开新国家」。</p>",
h:"<p><b>扩张 SOP：</b></p><ul><li>① 候选市场打分排序（六维各 1–5 分，加权算总分）。</li><li>② 首测形态：独立小预算组（或并入同语言区域组），素材 = Winner 的本地化版，单组 $20–50/天。</li><li>③ 验收周期 4–6 周（B2B 更长）：有效 CPL 与规模能力双维。</li><li>④ 达标后升主攻档，配本地化落地页与售后评估（服务可达性维度）。</li><li>⑤ 顺序纪律：先扩子人群 / 同语言区，再开新国家；一次只开 1–2 个新市场，避免预算稀释。</li></ul>",
cs:"<p>某工业设备扩张路径：DE 饱和信号（触达率 32%、边际 +40%）→ 按六维排序 → 奥地利/瑞士（同德语，直接并组）先并后测 → 荷兰（英语可覆盖）→ 法国（需本地化，最后）。时间线：第 1 月并奥/瑞，6 周验收有效 CPL $54 达标；第 3 月加荷兰；第 6 月加法国（法文落地页 + 本地售后）。两年铺完 4 个主攻市场，每个步进都有验收门槛，没有「撒网式」同时开。入境游获客对照：先西语区（西班牙+拉美）再葡语区，同语言复用素材降低本地化成本。</p>",
f:"<p>论坛市场扩张血泪：「东南亚很卷……24 年做的欧洲很舒服」——扩张顺序决定舒适度；COD 集中西班牙 = 支付/物流基础设施决定市场可行域；0-1 复盘证明「一个市场打透」优于「到处撒网」。社区共识：先打透一个市场再扩，扩的时候同语言区优先、新国家要本地化。老手的经验是：扩张前先诊断是不是真的饱和（L4-08），很多时候「爬坡」是素材疲劳或组合错配（L4-09），扩市场是下策。</p>",
e:"<ul><li>「哪里人多投哪里」（不看竞争与毛利，进红海）；</li><li>新市场直接复制母国全套（素材/页面/话术零本地化，水土不服）；</li><li>6 个市场同时启动（预算稀释，全员学不出，L0-08 碎片化）；</li><li>没验收就升主攻档（规模没跑通就加预算，亏损放大）；</li><li>不诊断饱和就扩（爬坡可能是素材/组合问题，扩市场是下策）。</li></ul>",
q:{q:"主力市场边际 CPL 爬坡 40%。是立刻开新市场，还是先在现有市场找空间？",a:"先诊断爬坡原因（L4-08）：若受众饱和 → 优先「现有市场内扩」（放宽约束/加城市/换 Angle 触达新子人群，成本低）；真到天花板 → 再开新市场（按 SOP 小预算验收）。顺序：扩子人群 &lt; 扩语言区 &lt; 开新国家（成本与风险递增）。很多「爬坡」其实是素材疲劳（L3-13）或组合错配（L4-09），扩市场是下策，先排除这两类再决定。"},
b:"产出你的市场扩张路线图（候选排序 + 首测方案 + 验收标准），并标注下一步是扩子人群还是开新国家。"},
{id:"L4-12",lv:4,t:"Offer Engineering（报价工程）",
g:"设计「进线索的钩子」：不同 Offer 带来完全不同质量的线索，Offer 本身就是筛选器。",
c:"<p><b>Offer（报价/钩子）不是「送什么便宜」，而是「进线的筛选器」。</b>你给的 Offer 决定了谁来填表——轻 Offer 量大质低，重 Offer 量小质高。选错 Offer，后面素材再好也救不回线索质量。</p><p><b>B2B Offer 光谱（从轻到重）：</b></p><ul><li>免费报价 → 技术咨询 → 选型手册 → 项目评估 → 工程方案 → 样品测试 → 工厂参观。</li></ul><p><b>机理</b>：轻 Offer（如「免费报价」）门槛低，谁都来点，比价党混进来；重 Offer（如「免费选型方案，需提供工况参数」）要求客户付出「信息与时间」的微小代价，低意向者被挡在门外。电商的对应是 discount / giveaway 钩子，但 B2B 的钩子是「专业价值」而非「折扣」。</p><p><b>误区纠正</b>：所有流量一个 Offer（不匹配决策阶段）；Offer 免费到没有门槛（筛人功能失效）；Offer 承诺兑现不了（信任崩 + Ad Quality 损，L0-06）。</p>",
m:"<p><b>Offer 影响两端的机理：</b></p><ul><li>① <b>影响 CTR</b>：Offer 的承诺吸引力决定谁愿意点（如「免费选型方案」比「联系我们」吸引力强）。</li><li>② <b>影响 Lead Quality</b>：Offer 的门槛决定响应者的意图水位与专业度——门槛越高，留下来的越真。</li><li>③ <b>「微小代价筛选」</b>：Offer 的门槛会把低意向者筛在门外。数字演算：免费报价 Lead 量 100、Qualified 30%（30 条）；升级「需提供工况参数」后 Lead 量 70（−30%）、Qualified 55%（38.5 条）——有效 Qualified 数反而 +28%，且销售首聊效率大增。</li></ul><p>Offer 与 CTA（L3-06）、落地页（L4-14）三方一致，是漏斗前中后的一致性（Message Match）。</p>",
h:"<p><b>Offer 设计 SOP：</b></p><ul><li>① 按 ICP 决策阶段配 Offer：早期 = 手册/案例（教育）；中期 = 咨询/评估（培育）；晚期 = 报价/方案（收割）。</li><li>② 重 Offer 要「重得有价值」：选型手册要真专业，不是广告册；否则门槛白设、信任还掉。</li><li>③ Offer 与 CTA、落地页三方一致（同一承诺、同一语言，见 L4-14）。</li><li>④ 设计「微小代价」：要求填 1–3 个专业字段（工况/介质/池型），而非堆长度。</li><li>⑤ 验收：看有效 Qualified 数（非单纯 Lead 量）与销售首聊转化率，双维判 Offer 优劣。</li></ul>",
cs:"<p>某工业设备 Offer 迭代：「免费报价」→「免费选型方案（需提供工况参数）」——客户多填 3 个技术参数，Lead 量 −30% 但 Qualified Rate +25 个点（38%→63%）。时间线：第 1 月免费报价，销售抱怨比价党；第 2 月改选型方案（要工况参数）；第 3 月 Qualified 率 +25 点，有效 CPL 反降。工况参数本身就是专业度测试——填得上来的是真买家。入境游获客对照：把「领取行程」改成「免费定制行程（填出行人数/日期/偏好）」，询盘质量明显提升，导游承接更顺。</p>",
f:"<p>论坛直接对应：「让进线的人先付出微小代价，低意向人群不会付出」——这正是 Offer 筛选的本质。社区表单经验（3 道单选题筛选靠设计不靠长度）与 Offer 的「微小代价」同源：用最低摩擦换最高筛选力。电商的「money off / giveaway」钩子搜索法说明：电商钩子是折扣，B2B 的钩子是「专业价值」而非「折扣」。老手的经验是：Offer 升级不等于减量，而是把「量」换成「质」，有效 Qualified 数往往不降反升。</p>",
e:"<ul><li>所有流量一个 Offer（不匹配决策阶段，早期人群被晚期 Offer 吓退）；</li><li>Offer 免费到没有门槛（筛人功能失效，比价党横行）；</li><li>Offer 承诺兑现不了（信任崩 + Ad Quality 损，L0-06）；</li><li>重 Offer 但内容水（手册是广告册，门槛白设）；</li><li>Offer 与落地页承诺不一致（Message Match 断裂，见 L4-14）。</li></ul>",
q:{q:"「免费报价」Lead 多但销售抱怨都是比价党。给出 Offer 升级方案与预期变化。",a:"升级为「免费选型方案」：要求提供流量/介质/池型等工况参数（付出微小代价），并承诺 48h 内出方案。预期：Lead 量降 20–40%、Qualified Rate 升 15–25 个点、有效 CPL 下降；同时销售拿到参数后首聊效率大增（不用再问基础信息）。本质是「用门槛换质量」，有效 Qualified 数往往不降反升。"},
b:"画出你的 Offer 光谱（从轻到重），并设计一个「带微小代价」的重 Offer，写下预期 Lead 量与 Qualified 率变化。"},
{id:"L4-13",lv:4,t:"Lead Form Architecture（表单架构）",
g:"设计表单字段与流程，在「转化率」与「Qualified Rate」之间找到最优点。",
c:"<p><b>表单不是「多问点好」或「少问点好」，而是「问对问题」。</b>字段少 → CPL 低但质量低；字段多 → 质量高但量崩 + 机器人多。解法不是调长度，而是每个字段对应一个「资格判断维度」。</p><p><b>表单的隐性功能 = 意图过滤：</b>填写成本本身就是「微小代价」。高意图者不怕 5 个字段，比价党看到「公司名 + 项目类型」就走了——字段是天然的 Qualifying 器。</p><p><b>资格判断维度举例</b>：</p><ul><li>预算权限（公司规模 / 角色）</li><li>项目真实度（项目类型 / 工况参数）</li><li>决策角色（购买委员会成员 vs 学生）</li><li>时间线（项目紧迫度）</li></ul><p><b>误区纠正</b>：为了「多拿数据」加字段（忘了每次都是摩擦）；字段与销售流程脱节（问了没人用）；从不做表单 A/B（转化率全靠猜）。</p>",
m:"<p><b>表单筛选的机理：</b></p><ul><li>① <b>摩擦 = 筛选</b>：每个字段都是一道门槛，低意向者在中途放弃，留下来的意图水位更高（呼应 L4-12 微小代价筛选）。</li><li>② <b>选择题优于开放题</b>：优先单选题（摩擦低 + 数据结构化，销售可直接用），开放题只留 1 个（项目描述）供预判。</li><li>③ <b>数字演算</b>：表单 v2（8 字段长表单）转化率 6%、Qualified 35%、机器人 18%；表单 v3（4 字段：角色 + 项目类型 + 工况 + 时间线）转化率 9%、Qualified 57%、机器人 9%——少而精胜过多而杂。有效 Qualified 数：v2 每 100 曝光得 2.1 条，v3 得 5.1 条。</li></ul><p>表单与 CRM 字段打通（回传结构见附录 A3），让「填了什么」回流模型，提升 EMQ（L0-03）。</p>",
h:"<p><b>表单设计 SOP：</b></p><ul><li>① 从销售「接单前必问」清单挑 3–5 个字段，每个对应一个资格维度（不凑数）。</li><li>② 优先选择题（摩擦低 + 结构化）；只留 1 个开放题（项目描述）。</li><li>③ B2B 加「角色」字段对准购买委员会（EPC/终端/贸易商）。</li><li>④ 加一个轻量反机器人设计（如必填行业单选题），机器人占比 &gt;30% 才重投。</li><li>⑤ 表单与 CRM 字段打通，回传结构见附录 A3；每月做一次表单 A/B（v 版本对照）。</li></ul>",
cs:"<p>某工业设备表单 v3：角色（EPC/终端/贸易商）+ 项目类型 + 工况参数 + 项目时间线——4 题把「贸易商比价党」过滤掉一半，Qualified Rate 从 38%→57%。时间线：v1（3 字段）Qualified 38%；v2（8 字段长表单）转化崩到 6%、机器人 18%；v3（4 字段精筛）转化 9%、Qualified 57%、机器人 9%。结论：少而精的字段 &gt; 多而杂的长表单。入境游获客对照：表单加「出行人数 + 日期 + 偏好」3 题，比「留邮箱」的泛表单 Qualified 率高一倍，导游首聊直接有料。</p>",
f:"<p>论坛实测结论直接引用：表单只设 3 个单选题，别用长表单——长表单拉高 CPA 且回复率无实质提升，还会招机器人（机器人占比 10% 可接受，&gt;30% 重投）。社区「问题与情景前置筛选」的经验与课程表单架构同源：筛选靠设计不靠长度。老手的经验是：字段必须对应销售真用得到的资格维度，问了没人用的字段纯属摩擦；B2B 一定要问「角色」，否则贸易商比价党混进来计算 Qualified 率失真。</p>",
e:"<ul><li>为了「多拿数据」加字段（忘了每次都是摩擦，转化崩）；</li><li>字段与销售流程脱节（问了没人用，纯摩擦）；</li><li>从不做表单 A/B（转化率全靠猜）；</li><li>长表单招机器人（开放题多、无结构化筛选，机器人占比爆）；</li><li>不加角色字段（贸易商比价党混进来计算 Qualified 率失真）。</li></ul>",
q:{q:"表单转化率 8% 但 Qualified 25%；砍到 2 字段后转化 15% 但 Qualified 12%。哪个版本好？",a:"算有效口径：版本 A 每 100 次曝光得 2 条 Qualified（8%×25%）；版本 B 得 1.8 条（15%×12%）——A 略优且销售成本更低（无效线索少）。还要看销售承接力：若销售过载，A 更稳。结论：微调 A（保留 2 个高价值字段 + 移除最摩擦字段）再测一版，而非简单砍字段。决策用「有效 Qualified 数」而非单纯转化率（L0-08 链式思维）。"},
b:"按「资格判断维度」重审你的表单字段，每字段写出存在理由；若无效则给出砍除或替换方案。"},
{id:"L4-14",lv:4,t:"Landing Page 与 Message Match",
g:"保证「广告承诺→落地页→表单」的信息一致性，堵住漏斗中段的隐性流失。",
c:"<p><b>Message Match（信息一致性）是漏斗中段最容易被忽略的漏水点。</b>前面 CTR 花钱买来的点击，死在加载 3 秒白屏或「货不对板」，是最冤的流失。</p><p><b>三级一致：</b></p><ul><li><b>广告说的</b>（Angle/承诺）→ <b>落地页首屏</b>（同一承诺同一语言）→ <b>表单</b>（承接同一语境）。</li></ul><p><b>两个健康指标：</b></p><ul><li><b>LPV 率</b>（点击 → 落地页浏览）= 技术健康（加载快不快、有没有被墙）。</li><li><b>LPV → Lead 率</b> = 说服健康（首屏承诺接不接得住）。</li></ul><p><b>误区纠正</b>：落地页是「通用官网首页」（承诺断裂）；只在电脑端验收（B2B 决策者也用手机刷 Feed）；改广告不检查落地页（话术对不上）；从不算 LPV 率（中段流失是盲区）。Ad Quality 也会惩罚「广告与页面体验不符」（诱导点击判定，L0-06）。</p>",
m:"<p><b>中段流失的机理：</b></p><ul><li>① <b>技术流失</b>：加载 &gt;3 秒，用户跑了——CPL 链路里 LPV 率这一层直接塌（L0-08 链式：CPL = CPM/1000 ÷ CTR ÷ LPV率 ÷ Lead率）。</li><li>② <b>承诺断裂</b>：广告说「免费选型」，落地页首屏是「公司介绍」——用户觉得被骗，LPV→Lead 率掉，且触发 Ad Quality 的「误导体验」扣分（L0-06）。</li><li>③ <b>数字演算</b>：LPV 率从 60% 提到 85%（优化加载 + 首屏承诺延续），Lead 率从 9% 提到 14%，整体 CPL 降约 40%（链式除法：分母两环同时改善，CPL 暴跌）。</li></ul><p>Message Match 呼应 L0-02 目标三连的「转化位置」与 L4-12 Offer 一致性——广告、落地页、表单是同一承诺的三段。</p>",
h:"<p><b>落地页审计 SOP：</b></p><ul><li>① 加载 &lt;3s：用 PageSpeed 测速、压图、删插件；分国家 Breakdown（某些地区 CDN 慢或被墙）。</li><li>② 首屏 = 广告承诺的延续（同图同词同 Offer），不放公司介绍占位。</li><li>③ 手机端优先验收（B2B 决策者也用手机刷 Feed）。</li><li>④ 信任要素前置（案例 / 认证 / 客户 logo）首屏可见。</li><li>⑤ 表单入口首屏可见（或一键滚动），与广告 Offer 一致（见 L4-13）。</li><li>⑥ 流失排查：Hotjar 看行为、自己走一遍流程、发邮件问流失客户。</li></ul>",
cs:"<p>某工业设备 LP 改造：首屏从「公司介绍」改为「广告同款 Hook + 案例数字」，LPV→Lead 率从 9%→14%；配合 &lt;3s 加载优化，同预算 Lead 量 +55%。时间线：第 1 月 LP 首屏是品牌故事，LPV→Lead 仅 9%；第 2 月改首屏承诺延续 + 压图到 2.1s；第 3 月 Lead 量 +55%、有效 CPL 降 28%。入境游获客对照：广告说「巴塞罗那 3 日定制」，落地页首屏就放巴塞罗那实景 + 余位数字，LPV→Lead 明显高于「旅行社简介」首页。</p>",
f:"<p>论坛三大致命操作之一：忽略落地页速度，「点击率高但转化 0 多因 &gt;3 秒白屏跑人」。社区落地页优化清单（支付图标显眼 / 带图评价 / 页面简短插 GIF）+ 流失排查三件套（Hotjar / 自测 / 邮件问）与课程完全同源，电商语境全流程可迁移到 B2B。老手的经验是：改广告必查落地页，话术对不上等于白投；LPV 率是要每周盯的指标，掉到 80% 以下就要排查技术与政策（链接被举报会隐性消耗）。</p>",
e:"<ul><li>落地页是「通用官网首页」（承诺断裂，LPV→Lead 率崩）；</li><li>只在电脑端验收（手机端加载慢/排版乱，B2B 也用手机）；</li><li>改广告不检查落地页（话术对不上，Ad Quality 扣分）；</li><li>从不算 LPV 率（中段流失是盲区，CPL 高了不知道漏在哪）；</li><li>链接被举报隐性消耗（不每天排查，预算悄悄浪费）。</li></ul>",
q:{q:"CTR 正常、LPV 率只有 60%（正常 80%+）。排查顺序？",a:"① 技术：落地页加载 / 手机端兼容 / 某些地区被墙或 CDN 问题（分国家 Breakdown）；② 政策：链接被标记 / 隐性跳转（落地页被举报会隐性消耗费用）；③ 链接配置：UTM / 跳转链是否出错。先技术后政策，用分国家数据定位——LPV 率掉通常是加载或地区可达性问题，不是广告本身的问题（L0-08 First Loss 诊断）。"},
b:"完成一次 LP 的 Message Match 审计（广告→首屏→表单三级对照），并算出你当前 LPV 率与 LPV→Lead 率。"},
{id:"L4-15",lv:4,t:"Placement Economics（版位经济学）",
g:"用后端价值而非前端 CPL 做版位决策，理解「自动版位套利逻辑与边界」。",
c:"<p><b>版位（Placement）差异的根源是「用户场景不同」。</b>Feed 主动浏览、Reels 娱乐心态、Stories 短注意力、Audience Network 离 Feed 上下文——同一素材的注意力与意图水位天然不同。评估口径必须到「有效 CPL / 边际价值」层，CPL 本身会骗人（Reels CPL 低 ≠ 便宜）。</p><p><b>2026 版位版图变化（需更新认知）：</b></p><ul><li><b>Threads</b>：2026 年已完成全球广告上线（约 4 亿月活），低饱和度新库存，技术/文化类人群偏多。</li><li><b>WhatsApp Status Ads</b>：Updates 标签内（非私聊），可建网站广告或 Click-to-WhatsApp 广告。</li><li><b>Reels</b>：2025 年 11 月起 post-loop 广告移除，仅保留 overlay 广告；仍是短视频核心库存。</li><li><b>Instagram Explore</b>：2026 年 1 月起不再作为 Ads Manager 版位（旧指南已失效）。</li><li><b>Audience Network</b>：站外库存，CPM 低但意图常弱，B2B 常排。</li></ul><p><b>误区纠正</b>：按 CPL 排版位英雄榜（前端指标陷阱）；一键排除所有「贵」的版位（错过高意图人群）；版位审计从不关联后端 CRM 数据。</p>",
m:"<p><b>版位经济学机制：</b></p><ul><li>① <b>自动版位 = 跨版位套利</b>：系统拿便宜展示填量，前提是你盯着后端质量（有效 CPL），否则它会把预算塞进低意图库存。</li><li>② <b>手动单投的经济学</b>：稀缺版位 CPM 高但人群意图可能更纯——「高预算 + 高净值版位 + 1-1-1 单投」是验证过的组合，但前提是该版位消耗量够。</li><li>③ <b>数字演算</b>：Reels CPL $35 vs Feed $60，看似 Reels 便宜。但 Reels Qualified Rate 12% → 有效 CPL $292；Feed 25% → 有效 CPL $240。Feed 更便宜。再加两点：全转 Reels 未必花得完（消耗能力不同）；版位结构变化会改变模型学习分布。</li></ul><p>版位决策呼应 L0-06「CPM 高≠贵」与 L0-08 边际思维：看有效 CPL 与边际，不看表面。</p>",
h:"<p><b>版位审计 SOP：</b></p><ul><li>① 默认自动版位起步（让系统套利），单组 $20–100/天。</li><li>② 每 2 周 Breakdown（版位 × 有效 CPL × Qualified Rate），样本不足不下结论。</li><li>③ 显著差的版位手动排除（B2B 常排 Audience Network；2026 起 Explore 已不可选）。</li><li>④ 验证过的高净值版位可单独开组加投（如 Feed+Reels 单投对比通投）。</li><li>⑤ 2026 新库存测试：Threads / WhatsApp Status 小预算试（低饱和度红利期），但关联后端看增量。</li><li>⑥ 样本不足（单版位消耗 &lt;$50/周）不轻易排除，避免误杀。</li></ul>",
cs:"<p>某工业设备版位审计：Audience Network CPL 最低 $19 但 Qualified Rate 8%（有效 $238）→ 排除；Feed 有效 $52 vs Reels 有效 $118 → Feed 为主，Reels 只放品牌向素材。时间线：第 1 月全通投；第 2 月 Breakdown 发现 AN 质量差，排除；第 3 月 Feed 主投、Reels 辅品牌。2026 加测 Threads（德语工业人群）小预算，Qualified Rate 中规中矩，留作观察。入境游获客对照：Reels 放「目的地实拍」品牌素材、Feed 放「限时余位」转化素材，按版位意图分工而非一刀切。</p>",
f:"<p>论坛全帖即本模块：通投 4 版位跑一周 → 好版位拉出来单投；「FB 首页动态与 IG 版位转化最好」；「AI 统管下大部分预算只花在 Ins 和 FB 动态，手动拆太细反而拿更贵的流量」——手动与自动的经济学平衡。社区四组同版位（Feed+Story+Reels）控制变量跑受众，正是版位固定、变量留给受众的做法。老手的经验是：版位审计必须关联 CRM 后端，否则 CPL 英雄榜是陷阱；2026 年 Threads/WhatsApp Status 是新库存，早期低饱和度值得小预算试。</p>",
e:"<ul><li>按 CPL 排版位英雄榜（前端指标陷阱，Reels 低 CPL 可能高有效成本）；</li><li>一键排除所有「贵」的版位（错过高意图人群）；</li><li>版位审计从不关联后端 CRM 数据（只看表面 CPL）；</li><li>把 Explore 当版位（2026 已移除，旧指南失效）；</li><li>样本不足就排除版位（误杀高潜力库存）。</li></ul>",
q:{q:"Reels CPL $35 vs Feed $60，老板要求全投 Reels。用经济学口径反驳。",a:"算有效 CPL：Reels Qualified Rate 若只有 12%（$35/0.12≈$292）vs Feed 25%（$60/0.25≈$240），Feed 更便宜。再加两点：① 样本与消耗能力（全转 Reels 未必花得完，见 L0-08 边际）；② 版位结构变化会改变模型学习分布。给老板看有效口径数据而非 CPL——Reels 表面便宜实则可能更贵。决策用有效 CPL（L0-06）。"},
b:"完成版位 × 有效 CPL 审计表（含 Qualified Rate），并执行一次排除测试；标注你是否试了 2026 新库存 Threads/WhatsApp Status。"},
{id:"L4-16",lv:4,t:"Messaging / Click-to-WhatsApp 链路",
g:"掌握以消息为转化位置的完整链路设计：C2W 广告、分流路由与转化归因，含服务类场景。",
c:"<p><b>Click-to-WhatsApp（C2W）是把「转化位置」放在对话里。</b>用户点广告 → 直接跳到 WhatsApp / Messenger 对话 → 客服承接 → 线索。它的天然优势是「对话式信任建立」，尤其适配咨询型消费（B2B、旅游、教育、本地服务）。</p><p><b>关键约束：</b></p><ul><li><b>一条 C2W 广告原生只能绑一个 WABA 号</b>：多客服 / 多公司分发必须加「路由层」（分流链接 / 路由机器人）。</li><li><b>归因</b>：Meta 自带对话开始归因（ctwa_clid），TikTok / Google 的对话回传需 WABA webhook 授权或接受仅点击归因。</li></ul><p><b>2026 背景</b>：Click-to-WhatsApp 广告收入同比 +50–60%（全球），WhatsApp Status Ads 已上线，Messaging 成为第五大广告库存面。但 WS 链路有「一轮游多、预填即走」的意图稀释问题——需要用「自动首句筛选问题」把表单的 Qualifying 功能搬进聊天。</p><p><b>误区纠正</b>：把 WS 链路当「零摩擦 = 更优」默认解（忽略意图稀释）；一条广告想绑多个号（原生做不到，需路由层）；所有客服号塞同一 BM（连坐风险）；没有首句筛选（一轮游淹没销售）。</p>",
m:"<p><b>消息链路机理：</b></p><ul><li>① <b>优势</b>：对话式信任建立，咨询型消费天然适配；用户愿意在聊天里说需求，信息密度高于表单。</li><li>② <b>劣势</b>：意图稀释——「一轮游多、预填即走」，很多人点进来聊两句就消失，没有表单的「微小代价」筛选（呼应 L4-12）。</li><li>③ <b>路由层机理</b>：一条 C2W 广告只能绑一个 WABA 号，多客户分发必须加分流层——分流链接按语言/地区/权重轮询，或 Manychat 类路由机器人首句问答后 wa.me 转接。各客户用各自 WABA / BM 隔离，防 Portfolio 连坐。</li><li>④ <b>数字演算</b>：入境游 C2W 广告 100 点击 → 分流给英语导游号（轮询）→ 首句自动问「城市/日期/人数」→ 一轮游率从 60% 降到 35%，导游承接的有效对话 +40%（首句筛选把低意向者挡在门外，呼应 L4-12 微小代价）。</li></ul><p>归因呼应 L0-07：Meta 自带对话归因够用，跨渠道需 webhook 或仅点击归因，别把 WS 的漂亮对话数当纯增量。</p>",
h:"<p><b>Messaging 链路 SOP：</b></p><ul><li>① 结构：C2W 广告 → 分流链接（按语言/地区/权重轮询）→ 客服 / 导游原生 WhatsApp 接手（终端不登录工具）。</li><li>② 首句自动 3 问（场景 / 时间 / 角色）做意图筛选，把表单 Qualifying 搬进 WS 首句。</li><li>③ 多客户分发时各用各的 WABA / BM（防 Portfolio 连坐，资产隔离见 L0-01）。</li><li>④ TikTok / Google 的对话回传需 WABA webhook 授权，或接受仅点击归因。</li><li>⑤ 运维：绑定号解绑报错（WS 链路技术运维项）需重绑；每周查对话质量与一轮游率。</li></ul>",
cs:"<p>入境游项目：C2W 广告 → 分流链接（英语客 → 英语导游号轮询）→ 首句自动问「城市/日期/人数」——把「微小代价前置筛选」搬进 WS 首句，一轮游率下降后导游承接效率明显提升。时间线：第 1 月直接 C2W 无筛选，一轮游 60%、导游被无效对话淹没；第 2 月加分流 + 首句 3 问，一轮游降到 35%、有效对话 +40%；第 3 月按语言分流（西/英/法）各导游号独立 BM，连坐风险归零。某工业设备 B2B 对照：C2W 用于「已询盘未成交」RT（见 L4-06），技术销售在 WS 里发选型表，转化高于纯表单。</p>",
f:"<p>论坛高频证据：WS 垃圾询盘问题突出；四链路实测（WS 一轮游多 / 表单转电话美区拒接 90% 且易风控 / Messenger 质量不高 / 直接电话秒挂假量）结论是最优 = 表单 + 落地页 + Messenger 建信任的组合。WS 链路也有技术运维项（绑定号解绑报错需重绑）。老手的经验是：WS 不是零摩擦更优的默认解，意图稀释要靠首句筛选补；多客户必须用路由层 + 各自 BM 隔离，否则一个号出事全 portfolios 连坐。2026 年 WhatsApp Status Ads 与 Click-to-WhatsApp 增长快，是值得测试的新转化位置。</p>",
e:"<ul><li>把 WS 链路当「零摩擦 = 更优」默认解（忽略意图稀释，一轮游淹没销售）；</li><li>一条广告想绑多个号（原生做不到，需路由层）；</li><li>所有客服号塞同一 BM（连坐风险，一个号出事全 portfolios 受影响）；</li><li>没有首句筛选（把表单的 Qualifying 功能丢了，低意向者随意进）；</li><li>跨渠道对话回传不做 webhook（TikTok/Google 的 WS 转化归因缺失，数据失真）。</li></ul>",
q:{q:"C2W 广告想「同一条广告分给不同客户的 WhatsApp」。原生能做到吗？正确架构是什么？",a:"原生不能：一条 C2W 广告只能绑一个 WABA 号。正确架构 = 加路由层：① 分流链接工具（轮询/加权/按语言）或 ② Manychat 类路由机器人（首句问答后发 wa.me 转接）。回传：Meta 侧自带对话归因够用；TikTok/Google 需客户授权 WABA webhook 或自建路由 + 回传。多客户务必各自 WABA / BM 隔离，防 Portfolio 连坐。首句加 3 问做意图筛选，补回表单的 Qualifying 功能。"},
b:"画出你的 Messaging 链路图（广告→路由→承接→回传），标注每层的工具与风险点（连坐/意图稀释/运维）。"}
);

</script>
